function PantallaClave({ onEntrar, onVacio }) {
  const [clave, setClave] = useState("");
  const [error, setError] = useState(false);
  const [cargando, setCargando] = useState(false);
  const entrar = async () => {
    if (!clave || cargando) return;
    setCargando(true); setError(false);
    try { await onEntrar(clave); } catch (e) { setError(true); setCargando(false); }
  };
  return (
    <div className="bg-white rounded-2xl border p-6 w-full max-w-sm text-center shadow-lg aparecer" style={{ borderColor: C.line }}>
      <img src={LOGO} className="w-14 h-14 mx-auto object-contain" alt="Proyecton" />
      <p className="text-lg font-extrabold mt-2" style={{ color: C.ink }}>Central de Obras</p>
      <p className="text-sm mt-1" style={{ color: C.mut }}>Los datos de esta página están protegidos. Escribe la clave de la empresa.</p>
      <input type="password" autoFocus className={inputCls + " mt-4 text-center"} style={inputStyle} value={clave}
        onChange={(e) => setClave(e.target.value)} onKeyDown={(e) => e.key === "Enter" && entrar()} placeholder="Clave" />
      {error && <p className="text-xs mt-2 font-semibold" style={{ color: C.red }}>Clave incorrecta. Prueba otra vez.</p>}
      <BtnPrimary onClick={entrar} disabled={!clave || cargando} className="w-full justify-center mt-3">
        {cargando ? "Abriendo…" : "Entrar"}
      </BtnPrimary>
      <button onClick={onVacio} className="text-xs mt-3 hover:underline" style={{ color: C.mut }}>Empezar sin estos datos</button>
    </div>
  );
}

function ClaveModal({ cfg, onClose }) {
  const [clave, setClave] = useState("");
  const [error, setError] = useState(false);
  const [cargando, setCargando] = useState(false);
  const ok = async () => {
    if (cargando || (!cfg.permitirVacia && !clave)) return;
    setCargando(true); setError(false);
    try { await cfg.onOk(clave); onClose(); } catch (e) { setError(true); setCargando(false); }
  };
  return (
    <Modal title={cfg.titulo} onClose={onClose}>
      <p className="text-sm" style={{ color: C.txt }}>{cfg.texto}</p>
      <input type="password" autoFocus className={inputCls + " mt-3"} style={inputStyle} value={clave}
        onChange={(e) => setClave(e.target.value)} onKeyDown={(e) => e.key === "Enter" && ok()}
        placeholder={cfg.permitirVacia ? "Clave (opcional)" : "Clave"} />
      {error && <p className="text-xs mt-2 font-semibold" style={{ color: C.red }}>Clave incorrecta.</p>}
      <div className="flex justify-end gap-2 mt-4">
        <BtnGhost onClick={onClose}>Cancelar</BtnGhost>
        <BtnPrimary onClick={ok} disabled={cargando || (!cfg.permitirVacia && !clave)}>{cargando ? "Un momento…" : cfg.boton}</BtnPrimary>
      </div>
    </Modal>
  );
}

/* ============================ APP ============================ */
function App() {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("panel");
  const [obraModal, setObraModal] = useState(null);   // null | {} | obra
  const [detailId, setDetailId] = useState(null);
  const [perdidaId, setPerdidaId] = useState(null);
  const [perdidaMotivo, setPerdidaMotivo] = useState(MOTIVOS[0]);
  const [confirmCfg, setConfirmCfg] = useState(null);
  const [ajustesOpen, setAjustesOpen] = useState(false);
  const [avisosOpen, setAvisosOpen] = useState(false);
  const [loteOpen, setLoteOpen] = useState(false);
  const [pendienteCifrado, setPendienteCifrado] = useState(null);
  const [claveCfg, setClaveCfg] = useState(null);
  const [objetivoInput, setObjetivoInput] = useState("");
  const [nuevoMiembro, setNuevoMiembro] = useState("");
  const [nuevoTipico, setNuevoTipico] = useState("");
  const [busca, setBusca] = useState("");
  const [toastMsg, setToastMsg] = useState(null);
  const loadedRef = useRef(false);
  const dataRef = useRef(null);
  const dirtyRef = useRef(false);
  const toastTimer = useRef(null);

  const toast = (msg) => {
    setToastMsg(msg);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(null), 2600);
  };

  /* ---------- carga y guardado ---------- */
  useEffect(() => {
    (async () => {
      let loaded = null, migradas = 0, publicadoFecha = null;
      try {
        const r = await window.storage.get(KEY);
        if (r && r.value) loaded = normalizarData(JSON.parse(r.value));
      } catch (e) { /* primer uso */ }
      if (!loaded) {
        // datos incrustados en el propio HTML (versión publicada en GitHub)
        const inc = leerDatosIncrustados();
        if (inc && inc.cifrado) { setPendienteCifrado(inc); loadedRef.current = true; return; }
        if (inc && inc.datos) { loaded = normalizarData(inc.datos); publicadoFecha = inc.fecha || null; }
      }
      if (!loaded) {
        for (const k of CRM_KEYS) {
          try {
            const r = await window.storage.get(k);
            if (r && r.value) {
              const old = JSON.parse(r.value);
              if (old && Array.isArray(old.leads)) {
                loaded = normalizarData(convertirCRM(old));
                migradas = loaded.obras.length;
                break;
              }
            }
          } catch (e) { /* sin datos antiguos */ }
        }
      }
      let conEjemplos = false;
      if (!loaded) { loaded = normalizarData(seedEjemplo()); conEjemplos = true; }
      setData(loaded);
      setObjetivoInput(loaded.config.objetivoMensual || "");
      loadedRef.current = true;
      if (publicadoFecha) setTimeout(() => toast("Cargados los datos publicados el " + fmtFecha(publicadoFecha) + "."), 400);
      else if (migradas > 0) setTimeout(() => toast(`Importadas ${migradas} obras del CRM anterior. Todo tu trabajo está aquí.`), 400);
      else if (conEjemplos) setTimeout(() => toast("Hemos cargado obras de ejemplo para que explores la Central."), 400);
    })();
  }, []);

  useEffect(() => {
    dataRef.current = data;
    if (!loadedRef.current || !data) return;
    dirtyRef.current = true;
    const t = setTimeout(async () => {
      try { await window.storage.set(KEY, JSON.stringify(data)); dirtyRef.current = false; } catch (e) { console.error("No se pudo guardar", e); }
    }, 350);
    return () => clearTimeout(t);
  }, [data]);

  useEffect(() => {
    // si se cierra la pestaña antes de que el guardado diferido llegue a escribir
    const flush = () => {
      if (loadedRef.current && dataRef.current && dirtyRef.current) {
        try { localStorage.setItem(KEY, JSON.stringify(dataRef.current)); dirtyRef.current = false; } catch (e) {}
      }
    };
    window.addEventListener("pagehide", flush);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
    return () => window.removeEventListener("pagehide", flush);
  }, []);

  const avisos = useMemo(() => data ? calcularAvisos(data) : [], [data]);
  const agendaPendientes = useMemo(() => {
    if (!data) return 0;
    const hoy = hoyYMD();
    return calcularAgenda(data).filter((i) => i.fecha && i.fecha <= hoy).length;
  }, [data]);

  if (!data) {
    return (
      <div className="min-h-screen flex items-center justify-center p-4" style={{ background: C.bone }}>
        {pendienteCifrado ? (
          <PantallaClave
            onEntrar={async (clave) => {
              const fecha = pendienteCifrado.fecha;
              const datos = await descifrarJSON(pendienteCifrado, clave);
              const d = normalizarData(datos);
              setPendienteCifrado(null);
              setData(d);
              setObjetivoInput(d.config.objetivoMensual || "");
              toast(fecha ? "Cargados los datos publicados el " + fmtFecha(fecha) + "." : "Datos cargados.");
            }}
            onVacio={() => { setPendienteCifrado(null); setData(normalizarData(seedEjemplo())); }}
          />
        ) : (
          <p className="text-sm font-semibold uppercase tracking-widest" style={{ color: C.mut }}>Cargando la Central…</p>
        )}
      </div>
    );
  }

  /* ---------- mutaciones ---------- */
  const mutateObra = (id, fn) => setData((d) => ({ ...d, obras: d.obras.map((o) => o.id === id ? fn(o) : o) }));
  const updateObra = (id, patch) => mutateObra(id, (o) => ({ ...o, ...patch }));

  const setEstado = (id, estadoId, motivo) => mutateObra(id, (o) => {
    if (o.estado === estadoId) return o;
    const now = new Date().toISOString();
    return {
      ...o, estado: estadoId, estadoDesde: now,
      historial: [...o.historial, { estado: estadoId, fecha: now }],
      motivoPerdida: estadoId === "perdida" ? (motivo || o.motivoPerdida || "Otro") : null,
      avance: estadoId === "finalizada" ? 100 : o.avance,
    };
  });

  const reabrirObra = (id) => {
    const o = data.obras.find((x) => x.id === id);
    if (!o) return;
    const previo = [...o.historial].reverse().find((h) => h.estado !== "perdida");
    setEstado(id, previo ? previo.estado : "estudio");
    toast("Obra reabierta");
  };

  const saveObra = (f) => {
    if (obraModal && obraModal.id) {
      mutateObra(obraModal.id, (o) => {
        const cambiaEstado = f.estado !== o.estado;
        const now = new Date().toISOString();
        return {
          ...o, ...f,
          ejemplo: false, // al editarla pasa a ser una obra real
          estadoDesde: cambiaEstado ? now : o.estadoDesde,
          historial: cambiaEstado ? [...o.historial, { estado: f.estado, fecha: now }] : o.historial,
        };
      });
      toast("Obra actualizada");
    } else {
      const now = new Date().toISOString();
      const nueva = normalizarObra({ ...f, id: uid(), creado: now, estadoDesde: now, historial: [{ estado: f.estado || "estudio", fecha: now }] });
      setData((d) => ({ ...d, obras: [nueva, ...d.obras] }));
      toast("Obra creada. Añádele su primer punto con fecha.");
      setDetailId(nueva.id);
    }
    setObraModal(null);
  };

  const deleteObra = (id) => setData((d) => ({ ...d, obras: d.obras.filter((o) => o.id !== id) }));

  const addPunto = (id, { texto, fecha, responsable }) =>
    mutateObra(id, (o) => ({ ...o, puntos: [...o.puntos, { id: uid(), texto, fecha: fecha || "", responsable: responsable || "", hecho: false }] }));
  const togglePunto = (id, pid) => mutateObra(id, (o) => ({
    ...o, puntos: o.puntos.map((p) => p.id === pid ? { ...p, hecho: !p.hecho, fechaHecho: !p.hecho ? new Date().toISOString() : null } : p),
  }));
  const delPunto = (id, pid) => mutateObra(id, (o) => ({ ...o, puntos: o.puntos.filter((p) => p.id !== pid) }));

  const addReq = (id, { texto, fechaLimite }) =>
    mutateObra(id, (o) => o.requerimientos.some((r) => r.texto === texto) ? o
      : { ...o, requerimientos: [...o.requerimientos, { id: uid(), texto, fechaLimite: fechaLimite || "", hecho: false }] });
  const toggleReq = (id, rid) => mutateObra(id, (o) => ({
    ...o, requerimientos: o.requerimientos.map((r) => r.id === rid ? { ...r, hecho: !r.hecho, fechaHecho: !r.hecho ? new Date().toISOString() : null } : r),
  }));
  const delReq = (id, rid) => mutateObra(id, (o) => ({ ...o, requerimientos: o.requerimientos.filter((r) => r.id !== rid) }));

  const addApunte = (id, { tipo, autor, texto }) =>
    mutateObra(id, (o) => ({ ...o, apuntes: [{ id: uid(), tipo, autor: autor || "", texto, fecha: new Date().toISOString() }, ...o.apuntes] }));
  const delApunte = (id, aid) => mutateObra(id, (o) => ({ ...o, apuntes: o.apuntes.filter((a) => a.id !== aid) }));

  const togglePendiente = (obraId, clase, itemId) => {
    if (clase === "punto") togglePunto(obraId, itemId);
    else toggleReq(obraId, itemId);
    toast("Marcado como hecho");
  };

  const addMiembro = (name) => setData((d) => d.equipo.includes(name) ? d : { ...d, equipo: [...d.equipo, name] });
  const removeMiembro = (name) => setConfirmCfg({
    msg: `¿Quitar a ${name} del equipo? Las obras y puntos que tiene asignados se conservan con su nombre.`,
    onOk: () => setData((d) => ({ ...d, equipo: d.equipo.filter((c) => c !== name) })),
  });

  const addTipico = (t) => setData((d) => {
    const lista = d.config.puntosTipicos || [];
    return lista.includes(t) ? d : { ...d, config: { ...d.config, puntosTipicos: [...lista, t] } };
  });
  const removeTipico = (t) => setData((d) => ({
    ...d, config: { ...d.config, puntosTipicos: (d.config.puntosTipicos || []).filter((x) => x !== t) },
  }));

  const saveObjetivo = () => {
    setData((d) => ({ ...d, config: { ...d.config, objetivoMensual: Number(objetivoInput) || 0 } }));
    toast("Objetivo guardado");
  };

  const crearLote = (items, estado, responsable) => {
    const now = new Date().toISOString();
    const nuevas = items.map((it) => {
      const est = EST[it.estado] ? it.estado : estado;
      return normalizarObra({
        id: uid(), ...it, estado: est,
        responsable: it.responsable || responsable || '',
        creado: now, estadoDesde: now, historial: [{ estado: est, fecha: now }],
      });
    });
    setData((d) => ({ ...d, obras: [...nuevas, ...d.obras] }));
    setLoteOpen(false);
    setTab('obras');
    toast(`${nuevas.length} obras creadas`);
  };

  const borrarEjemplos = () => {
    const n = data.obras.filter((o) => o.ejemplo).length;
    setConfirmCfg({
      msg: `¿Borrar las ${n} obras de ejemplo? Las obras que hayas creado o editado tú se conservan.`,
      onOk: () => { setData((d) => ({ ...d, obras: d.obras.filter((o) => !o.ejemplo) })); toast("Ejemplos borrados. La Central es toda tuya."); },
    });
  };

  const resetAll = () => setConfirmCfg({
    msg: "Esto vacía TODA la Central (obras, diario, equipo y objetivo) y la deja como el primer día. ¿Seguro?",
    onOk: () => { setData(emptyData()); setObjetivoInput(""); },
  });

  // Descarga esta misma página con los datos incrustados, lista para subir a GitHub
  const descargarHTMLConDatos = () => {
    setClaveCfg({
      titulo: "Guardar los datos dentro del HTML",
      texto: "Se descarga una copia de esta página con todas las obras metidas dentro, lista para subirla a GitHub. Ponle una clave si va a estar en internet (quien abra la página tendrá que escribirla); déjala vacía solo para uso interno.",
      permitirVacia: true, boton: "Descargar HTML",
      onOk: async (clave) => {
        let fuente = null;
        try {
          const resp = await fetch(window.location.href);
          fuente = await resp.text();
        } catch (e) {
          toast("Abierto como archivo local el navegador no deja leerse a sí mismo: usa este botón desde la página ya publicada.");
          return;
        }
        const payload = clave
          ? { ...(await cifrarJSON(data, clave)), fecha: new Date().toISOString() }
          : { cifrado: false, fecha: new Date().toISOString(), datos: data };
        const json = JSON.stringify(payload).replace(/</g, "\\u003c");
        const ini = fuente.indexOf("/*DATOS-INICIO*/");
        const fin = fuente.indexOf("/*DATOS-FIN*/");
        if (ini < 0 || fin < 0 || fin < ini) { toast("No encuentro los marcadores de datos en el archivo."); return; }
        const nuevo = fuente.slice(0, ini + 16) + json + fuente.slice(fin);
        const blob = new Blob([nuevo], { type: "text/html;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "proyecton-central.html";
        a.click();
        URL.revokeObjectURL(a.href);
        toast(clave ? "HTML descargado con los datos cifrados. Súbelo a GitHub para actualizar a todos." : "HTML descargado con los datos SIN cifrar: no lo publiques en internet.");
      },
    });
  };

  const cargarDatosPublicados = () => {
    const inc = leerDatosIncrustados();
    if (!inc) { toast("Este archivo no lleva datos incrustados todavía."); return; }
    const aplicar = (datos) => setConfirmCfg({
      msg: `Los datos publicados${inc.fecha ? " el " + fmtFecha(inc.fecha) : ""} contienen ${(datos.obras || []).length} obras y sustituirán a los de este navegador. ¿Continuar?`,
      onOk: () => { const d = normalizarData(datos); setData(d); setObjetivoInput(d.config.objetivoMensual || ""); toast("Datos publicados cargados."); },
    });
    if (inc.cifrado) {
      setClaveCfg({
        titulo: "Clave de los datos publicados",
        texto: "Los datos de este archivo están cifrados. Escribe la clave de la empresa.",
        permitirVacia: false, boton: "Abrir",
        onOk: async (clave) => { const datos = await descifrarJSON(inc, clave); aplicar(datos); },
      });
    } else if (inc.datos) aplicar(inc.datos);
  };

  const exportBackup = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `proyecton-central-copia-${hoyYMD()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const importBackup = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const texto = String(reader.result);
        // algunos editores de Windows añaden un BOM (U+FEFF) al principio; JSON.parse no lo tolera
        const raw = JSON.parse(texto.charCodeAt(0) === 0xFEFF ? texto.slice(1) : texto);
        let d = null, origen = "";
        if (raw && Array.isArray(raw.obras)) { d = normalizarData(raw); origen = "de la Central"; }
        else if (raw && Array.isArray(raw.leads)) { d = normalizarData(convertirCRM(raw)); origen = "del CRM anterior (convertida)"; }
        if (!d) throw new Error("formato");
        setConfirmCfg({
          msg: `La copia ${origen} contiene ${d.obras.length} obras y ${d.equipo.length} personas. Sustituirá los datos actuales de este navegador. ¿Continuar?`,
          onOk: () => { setData(d); setObjetivoInput(d.config.objetivoMensual || ""); toast("Copia restaurada"); },
        });
      } catch (e) {
        setConfirmCfg({ msg: "Ese archivo no es una copia de seguridad válida.", onOk: () => {} });
      }
    };
    reader.readAsText(file);
  };

  const exportCSV = () => {
    const head = ["Obra", "Direccion", "Municipio", "Estado", "Tipos", "Prioridad", "Responsable", "Importe", "Cobrado", "SubvEstado", "SubvImporte", "SubvPrograma", "Contacto", "Telefono", "Email", "AdmFincas", "Origen", "Alta", "ProximoPaso", "PuntosPendientes", "ReqsPendientes", "UltimoMovimiento", "Notas"];
    const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const rows = data.obras.map((o) => {
      const paso = proximoPaso(o);
      return [
        o.nombre, o.direccion, o.municipio, (EST[o.estado] || {}).label, o.tipos.join(" / "), o.prioridad, o.responsable,
        o.importe, o.cobrado, (SUB[o.subEstado] || {}).label, o.subImporte, o.subTipo,
        o.contactoNombre, o.telefono, o.email, o.admFincas, o.origen, o.creado,
        paso ? `${paso.fecha || ""} ${paso.texto}` : "", puntosPend(o).length, reqsPend(o).length, ultimoMovimiento(o), o.notas,
      ].map(esc).join(";");
    });
    const csv = [head.join(";"), ...rows].join("\n");
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `proyecton-central-${hoyYMD()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  /* ---------- derivados ---------- */
  const detailObra = detailId ? data.obras.find((o) => o.id === detailId) : null;
  const rojos = avisos.filter((a) => a.nivel === "rojo").length;
  const hoyN = avisos.filter((a) => a.grupo === "Hoy").length;
  const nAvisosCampana = rojos + hoyN;

  const resultadosBusca = busca.trim().length >= 2
    ? data.obras.filter((o) => `${o.nombre} ${o.direccion} ${o.municipio} ${o.contactoNombre} ${o.admFincas} ${o.notas}`.toLowerCase().includes(busca.toLowerCase())).slice(0, 8)
    : [];

  const abrirObra = (id) => { setDetailId(id); setAvisosOpen(false); setBusca(""); };

  const TABS = [
    { id: "panel", label: "Panel", Icon: LayoutDashboard },
    { id: "tablero", label: "Tablero", Icon: Columns },
    { id: "obras", label: "Obras", Icon: Building2 },
    { id: "agenda", label: "Agenda", Icon: CalendarDays, badge: agendaPendientes },
    { id: "analisis", label: "Análisis", Icon: TrendingUp },
  ];

  return (
    <div className="min-h-screen" style={{ background: C.bone, fontFamily: "'Segoe UI', system-ui, -apple-system, sans-serif" }}>
      <div style={{ height: 4, background: C.red }} />

      {/* cabecera */}
      <header className="bg-white border-b" style={{ borderColor: C.line }}>
        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
          <div className="flex items-center gap-3 min-w-0">
            <img src={LOGO} alt="Proyecton" className="w-12 h-12 object-contain flex-shrink-0" />
            <div className="min-w-0">
              <p className="text-xs tracking-widest font-medium truncate" style={{ color: C.ink, letterSpacing: "0.3em" }}>REVESTIMIENTOS</p>
              <p className="text-xl font-extrabold leading-none -mt-0.5" style={{ color: C.red, letterSpacing: "0.02em" }}>
                PROYECTON
                <span className="block h-0.5 mt-1 rounded-full" style={{ background: C.red, maxWidth: "9rem" }} />
              </p>
              <p className="text-xs mt-0.5 hidden sm:block" style={{ color: C.mut, letterSpacing: "0.12em" }}>CENTRAL DE OBRAS · SEGUIMIENTO Y COORDINACIÓN</p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            {/* buscador */}
            <div className="relative hidden md:block">
              <Search size={15} className="absolute left-3 top-2.5" style={{ color: C.mut }} />
              <input className={inputCls + " pl-8 w-64"} style={inputStyle} placeholder="Buscar obra…"
                value={busca} onChange={(e) => setBusca(e.target.value)} />
              {resultadosBusca.length > 0 && (
                <div className="absolute top-full mt-1 left-0 right-0 bg-white rounded-xl border shadow-lg z-40 overflow-hidden aparecer" style={{ borderColor: C.line }}>
                  {resultadosBusca.map((o) => (
                    <button key={o.id} onClick={() => abrirObra(o.id)}
                      className="w-full flex items-center gap-2 px-3 py-2 hover:bg-neutral-50 text-left border-b last:border-b-0" style={{ borderColor: C.line }}>
                      <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ background: (EST[o.estado] || {}).color }} />
                      <span className="text-sm font-semibold truncate" style={{ color: C.ink }}>{o.nombre}</span>
                      <span className="text-xs truncate" style={{ color: C.mut }}>{o.direccion}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            {/* campana */}
            <button onClick={() => setAvisosOpen(true)} className="relative p-2 rounded-lg border hover:bg-neutral-50" style={{ borderColor: C.line }} aria-label="Avisos">
              <Bell size={17} style={{ color: C.ink }} />
              {nAvisosCampana > 0 && (
                <span className={`absolute -top-1.5 -right-1.5 min-w-5 h-5 px-1 rounded-full text-white text-xs font-bold flex items-center justify-center ${rojos > 0 ? "latido" : ""}`}
                  style={{ background: C.red }}>{nAvisosCampana}</span>
              )}
            </button>
            <BtnPrimary onClick={() => setObraModal({})}><Plus size={16} /><span className="hidden sm:inline">Nueva obra</span></BtnPrimary>
            <button onClick={() => setAjustesOpen(true)} className="p-2 rounded-lg border hover:bg-neutral-50" style={{ borderColor: C.line }} aria-label="Ajustes">
              <Settings size={17} style={{ color: C.ink }} />
            </button>
          </div>
        </div>
      </header>

      {/* pestañas */}
      <nav style={{ background: C.ink }}>
        <div className="max-w-7xl mx-auto px-2 flex overflow-x-auto">
          {TABS.map(({ id, label, Icon, badge }) => (
            <button key={id} onClick={() => setTab(id)}
              className="flex items-center gap-1.5 px-4 py-3 text-sm font-bold whitespace-nowrap transition-colors"
              style={{
                color: tab === id ? "#fff" : "#A9A9AE",
                boxShadow: tab === id ? `inset 0 -3px 0 ${C.red}` : "none",
              }}>
              <Icon size={15} /> {label}
              {badge > 0 && <span className="min-w-4 h-4 px-1 rounded-full text-white text-xs font-bold flex items-center justify-center" style={{ background: C.red, fontSize: 10 }}>{badge}</span>}
            </button>
          ))}
        </div>
      </nav>

      {data.obras.some((o) => o.ejemplo) && (
        <div className="max-w-7xl mx-auto px-3 sm:px-4 pt-4">
          <div className="rounded-xl border px-4 py-2.5 flex flex-wrap items-center gap-2" style={{ background: C.warnTint, borderColor: "#E8D9B4" }}>
            <AlertTriangle size={15} style={{ color: C.warn }} className="flex-shrink-0" />
            <p className="text-sm flex-1" style={{ color: "#6B4A12", minWidth: "14rem" }}>
              <b>Estás viendo obras de ejemplo</b> para explorar la Central. Si editas una, pasa a ser real; cuando quieras, bórralas todas de un clic.
            </p>
            <BtnGhost onClick={borrarEjemplos}><Trash2 size={14} /> Borrar ejemplos</BtnGhost>
          </div>
        </div>
      )}

      <main className="max-w-7xl mx-auto px-3 sm:px-4 py-5">
        {tab === "panel" && (
          <PanelView data={data} avisos={avisos} onOpen={abrirObra} onNueva={() => setObraModal({})}
            onOpenAjustes={() => setAjustesOpen(true)} onIrAgenda={() => setTab("agenda")} addApunte={addApunte} toast={toast} />
        )}
        {tab === "tablero" && (
          <TableroView data={data} onOpen={abrirObra} onNueva={() => setObraModal({})}
            setEstado={setEstado} onPerdida={(id) => { setPerdidaId(id); setPerdidaMotivo(MOTIVOS[0]); }} />
        )}
        {tab === "obras" && <ObrasView data={data} onOpen={abrirObra} onNueva={() => setObraModal({})} onExport={exportCSV} onImport={() => setLoteOpen(true)} />}
        {tab === "agenda" && <AgendaView data={data} onOpen={abrirObra} togglePendiente={togglePendiente} />}
        {tab === "analisis" && <AnalisisView data={data} />}
      </main>

      <footer className="max-w-7xl mx-auto px-4 pb-6">
        <p className="text-xs text-center" style={{ color: C.mut }}>
          Revestimientos Proyecton · 91 693 15 40 · info@proyecton.es · www.proyecton.es · Los datos se guardan en este navegador; haz copias desde Ajustes.
        </p>
      </footer>

      {/* modales */}
      {obraModal !== null && (
        <Modal title={obraModal.id ? "Editar obra" : "Nueva obra"} onClose={() => setObraModal(null)} wide>
          <ObraForm initial={obraModal.id ? obraModal : null} equipo={data.equipo} onSave={saveObra} onCancel={() => setObraModal(null)} />
        </Modal>
      )}

      {detailObra && obraModal === null && (
        <FichaObra obra={detailObra} data={data} avisos={avisos}
          onClose={() => setDetailId(null)}
          onEdit={() => setObraModal(detailObra)}
          setEstado={setEstado}
          onPerdida={(id) => { setPerdidaId(id); setPerdidaMotivo(MOTIVOS[0]); }}
          onReabrir={reabrirObra}
          onArchivar={(id) => { updateObra(id, { archivada: true }); setDetailId(null); toast("Obra archivada. La tienes en Obras → Archivadas."); }}
          onDelete={() => setConfirmCfg({
            msg: `¿Eliminar “${detailObra.nombre}” con todo su diario e historial? Esta acción no se puede deshacer.`,
            onOk: () => { deleteObra(detailObra.id); setDetailId(null); },
          })}
          addPunto={addPunto} togglePunto={togglePunto} delPunto={delPunto}
          addReq={addReq} toggleReq={toggleReq} delReq={delReq}
          addApunte={addApunte} delApunte={delApunte} updateObra={updateObra} />
      )}

      {perdidaId && (
        <Modal title="Marcar como perdida" onClose={() => setPerdidaId(null)}>
          <p className="text-sm mb-3" style={{ color: C.txt }}>
            Registrar el motivo ayuda a detectar patrones: precio, competencia, seguimiento…
          </p>
          <Field label="Motivo">
            <select className={inputCls} style={inputStyle} value={perdidaMotivo} onChange={(e) => setPerdidaMotivo(e.target.value)}>
              {MOTIVOS.map((m) => <option key={m}>{m}</option>)}
            </select>
          </Field>
          <div className="flex justify-end gap-2 mt-4">
            <BtnGhost onClick={() => setPerdidaId(null)}>Cancelar</BtnGhost>
            <BtnPrimary onClick={() => { setEstado(perdidaId, "perdida", perdidaMotivo); setPerdidaId(null); }}><Check size={15} /> Confirmar</BtnPrimary>
          </div>
        </Modal>
      )}

      {avisosOpen && (
        <Modal title={`Centro de avisos (${avisos.length})`} onClose={() => setAvisosOpen(false)} wide>
          <ListaAvisos avisos={avisos} onOpen={abrirObra} />
        </Modal>
      )}

      {loteOpen && <ImportarLoteModal data={data} onClose={() => setLoteOpen(false)} onCrear={crearLote} />}

      {claveCfg && <ClaveModal cfg={claveCfg} onClose={() => setClaveCfg(null)} />}

      {ajustesOpen && (
        <Modal title="Ajustes" onClose={() => setAjustesOpen(false)}>
          <div className="space-y-4">
            <Field label="Objetivo mensual de contratación (€)">
              <div className="flex gap-2">
                <input type="number" min="0" className={inputCls} style={inputStyle}
                  value={objetivoInput} onChange={(e) => setObjetivoInput(e.target.value)} placeholder="p. ej. 150000" />
                <BtnPrimary onClick={saveObjetivo}><Check size={15} /> Guardar</BtnPrimary>
              </div>
            </Field>

            <div className="pt-3 border-t" style={{ borderColor: C.line }}>
              <p className="text-xs font-semibold uppercase tracking-wider mb-2" style={{ color: C.mut }}>Equipo</p>
              <div className="flex gap-2 mb-2">
                <input className={inputCls} style={inputStyle} placeholder="Nombre y apellido"
                  value={nuevoMiembro} onChange={(e) => setNuevoMiembro(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter" && nuevoMiembro.trim()) { addMiembro(nuevoMiembro.trim()); setNuevoMiembro(""); } }} />
                <BtnPrimary onClick={() => { if (nuevoMiembro.trim()) { addMiembro(nuevoMiembro.trim()); setNuevoMiembro(""); } }}><Plus size={15} /></BtnPrimary>
              </div>
              <div className="space-y-1">
                {data.equipo.map((m) => (
                  <div key={m} className="flex items-center gap-2 px-1">
                    <Avatar nombre={m} />
                    <span className="text-sm font-semibold flex-1" style={{ color: C.ink }}>{m}</span>
                    <button onClick={() => removeMiembro(m)} className="p-1.5 rounded-lg hover:bg-neutral-100" title="Quitar">
                      <Trash2 size={14} style={{ color: C.mut }} />
                    </button>
                  </div>
                ))}
                {data.equipo.length === 0 && <p className="text-sm" style={{ color: C.mut }}>Añade a las personas de la empresa para asignarles obras y puntos.</p>}
              </div>
            </div>

            <div className="pt-3 border-t" style={{ borderColor: C.line }}>
              <p className="text-xs font-semibold uppercase tracking-wider mb-2" style={{ color: C.mut }}>Puntos típicos de seguimiento</p>
              <div className="flex gap-2 mb-2">
                <input className={inputCls} style={inputStyle} placeholder="Pendiente de…"
                  value={nuevoTipico} onChange={(e) => setNuevoTipico(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter" && nuevoTipico.trim()) { addTipico(nuevoTipico.trim()); setNuevoTipico(""); } }} />
                <BtnPrimary onClick={() => { if (nuevoTipico.trim()) { addTipico(nuevoTipico.trim()); setNuevoTipico(""); } }}><Plus size={15} /></BtnPrimary>
              </div>
              <div className="flex flex-wrap gap-1.5">
                {(data.config.puntosTipicos || []).map((t) => (
                  <span key={t} className="inline-flex items-center gap-1 pl-2.5 pr-1 py-1 rounded-full text-xs font-semibold border" style={{ borderColor: C.line, color: C.txt }}>
                    {t}
                    <button onClick={() => removeTipico(t)} className="p-0.5 rounded-full hover:bg-neutral-100" title="Quitar">
                      <X size={12} style={{ color: C.mut }} />
                    </button>
                  </span>
                ))}
                {(data.config.puntosTipicos || []).length === 0 && (
                  <p className="text-xs" style={{ color: C.mut }}>Sin puntos típicos. Añade los que usáis a diario ("Pendiente de llamar al presidente"…).</p>
                )}
              </div>
              <p className="text-xs mt-1.5" style={{ color: C.mut }}>Aparecen como botones de un clic al añadir un punto en la ficha de cada obra.</p>
            </div>

            <div className="pt-3 border-t space-y-2" style={{ borderColor: C.line }}>
              <BtnGhost onClick={() => { setAjustesOpen(false); setLoteOpen(true); }} className="w-full justify-center"><Upload size={15} /> Importar obras en lote (carpetas, CSV o lista)</BtnGhost>
              <BtnGhost onClick={descargarHTMLConDatos} className="w-full justify-center"><Download size={15} /> Guardar datos dentro del HTML (para GitHub)</BtnGhost>
              <BtnGhost onClick={cargarDatosPublicados} className="w-full justify-center"><RotateCcw size={15} /> Cargar los datos publicados en este archivo</BtnGhost>
              <BtnGhost onClick={exportCSV} className="w-full justify-center"><Download size={15} /> Exportar obras a CSV (Excel)</BtnGhost>
              <BtnGhost onClick={exportBackup} className="w-full justify-center"><Download size={15} /> Copia de seguridad completa (JSON)</BtnGhost>
              <label className="w-full inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-sm font-semibold border hover:bg-neutral-50 cursor-pointer"
                style={{ borderColor: C.line, color: C.ink }}>
                <RotateCcw size={15} /> Restaurar copia de seguridad
                <input type="file" accept=".json,application/json" className="hidden"
                  onChange={(e) => {
                    if (e.target.files && e.target.files[0]) { importBackup(e.target.files[0]); e.target.value = ""; setAjustesOpen(false); }
                  }} />
              </label>
              <p className="text-xs" style={{ color: C.mut }}>
                También acepta las copias del CRM comercial anterior: las convierte a obras automáticamente. Los datos viven en este navegador — haz una copia de vez en cuando.
              </p>
              <button onClick={() => { setAjustesOpen(false); resetAll(); }}
                className="w-full inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-sm font-semibold hover:bg-red-50"
                style={{ color: C.redDark }}>
                <RotateCcw size={15} /> Vaciar toda la Central
              </button>
            </div>
          </div>
        </Modal>
      )}

      {confirmCfg && (
        <Modal title="Confirmar" onClose={() => setConfirmCfg(null)}>
          <p className="text-sm" style={{ color: C.txt }}>{confirmCfg.msg}</p>
          <div className="flex justify-end gap-2 mt-4">
            <BtnGhost onClick={() => setConfirmCfg(null)}>Cancelar</BtnGhost>
            <BtnPrimary onClick={() => { confirmCfg.onOk(); setConfirmCfg(null); }}>Sí, continuar</BtnPrimary>
          </div>
        </Modal>
      )}

      {/* toast */}
      {toastMsg && (
        <div className="fixed bottom-4 right-4 z-50 aparecer">
          <div className="px-4 py-2.5 rounded-xl text-sm font-semibold text-white shadow-lg flex items-center gap-2" style={{ background: C.ink }}>
            <CircleCheck size={15} style={{ color: "#7BE0C8" }} /> {toastMsg}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>

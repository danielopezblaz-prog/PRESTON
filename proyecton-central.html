/* ---------- migración desde el CRM comercial anterior ---------- */
function convertirCRM(old) {
  const mapEtapa = { nuevo: "estudio", contactado: "estudio", visita: "estudio", presupuesto: "presupuesto", negociacion: "presupuesto" };
  const mapAct = { llamada: "llamada", email: "email", visita: "visita", reunion: "reunion", presupuesto: "documento", nota: "nota" };
  const acts = Array.isArray(old.actividades) ? old.actividades : [];
  const obras = (Array.isArray(old.leads) ? old.leads : []).map((l) => {
    const estado = l.estado === "ganado" ? "contratada" : l.estado === "perdido" ? "perdida" : (mapEtapa[l.etapa] || "estudio");
    const estadoDesde = l.estado === "activo" ? (l.etapaDesde || l.creado) : (l.cerrado || l.creado);
    const historial = [{ estado: "estudio", fecha: l.creado }];
    if (estado !== "estudio") historial.push({ estado, fecha: estadoDesde });
    return normalizarObra({
      id: l.id, nombre: l.entidad, direccion: l.direccion, contactoNombre: l.nombre,
      telefono: l.telefono, email: l.email, origen: l.origen,
      tipos: l.tipoObra ? [l.tipoObra] : [], responsable: l.comercial, importe: l.valor,
      estado, estadoDesde, historial, motivoPerdida: l.motivoPerdida, notas: l.notas, creado: l.creado,
      puntos: (l.proximaAccion && l.estado === "activo")
        ? [{ id: uid(), texto: l.proximaNota || "Seguimiento", fecha: l.proximaAccion, responsable: l.comercial || "", hecho: false }]
        : [],
      apuntes: acts.filter((a) => a.leadId === l.id).map((a) => ({
        id: a.id || uid(), tipo: mapAct[a.tipo] || "nota", autor: a.comercial || "", texto: a.notas || "", fecha: a.fecha,
      })),
    });
  });
  return {
    obras,
    equipo: Array.isArray(old.comerciales) ? old.comerciales : [],
    config: { objetivoMensual: Number(old.config && old.config.objetivoMensual) || 0 },
  };
}

/* ---------- datos incrustados en el propio HTML (para publicar en GitHub Pages) ---------- */
function leerDatosIncrustados() {
  const el = document.getElementById("datos-centrales");
  if (!el) return null;
  const raw = el.textContent || "";
  const i = raw.indexOf("/*DATOS-INICIO*/");
  const j = raw.indexOf("/*DATOS-FIN*/");
  if (i < 0 || j < 0) return null;
  const cuerpo = raw.slice(i + 16, j).trim();
  if (!cuerpo || cuerpo === "null") return null;
  try { return JSON.parse(cuerpo); } catch (e) { return null; }
}
function abToB64(buf) {
  const u = new Uint8Array(buf); let s = "";
  for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192));
  return btoa(s);
}
function b64ToAb(b64) {
  const s = atob(b64); const u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return u.buffer;
}
async function claveAES(clave, saltBuf) {
  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: saltBuf, iterations: 150000, hash: "SHA-256" }, material,
    { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function cifrarJSON(obj, clave) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await claveAES(clave, salt.buffer);
  const blob = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, new TextEncoder().encode(JSON.stringify(obj)));
  return { cifrado: true, salt: abToB64(salt.buffer), iv: abToB64(iv.buffer), blob: abToB64(blob) };
}
async function descifrarJSON(p, clave) {
  const k = await claveAES(clave, b64ToAb(p.salt));
  const plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(b64ToAb(p.iv)) }, k, b64ToAb(p.blob));
  return JSON.parse(new TextDecoder().decode(plano));
}
window.__central = { cifrarJSON, descifrarJSON }; // para soporte y pruebas

/* ---------- lógica derivada ---------- */
const enTablero = (o) => !o.archivada && o.estado !== "perdida";
const esActiva = (o) => !o.archivada && ACTIVOS.includes(o.estado);
const puntosPend = (o) => o.puntos.filter((p) => !p.hecho);
const reqsPend = (o) => o.requerimientos.filter((r) => !r.hecho);
const ultimoMovimiento = (o) => {
  let max = o.estadoDesde || o.creado;
  o.apuntes.forEach((a) => { if (a.fecha > max) max = a.fecha; });
  return max;
};
const proximoPaso = (o) => {
  const conFecha = puntosPend(o).filter((p) => p.fecha).sort((a, b) => a.fecha.localeCompare(b.fecha));
  return conFecha[0] || puntosPend(o)[0] || null;
};
const primeraFechaEstado = (o, estadoId) => {
  const h = (o.historial || []).find((x) => x.estado === estadoId);
  return h ? h.fecha : null;
};

// Centro de avisos: cada aviso lleva nivel (rojo > ambar > azul), texto y obra
function calcularAvisos(data) {
  const hoy = hoyYMD();
  const avisos = [];
  data.obras.filter((o) => !o.archivada && o.estado !== "perdida").forEach((o) => {
    puntosPend(o).forEach((p) => {
      if (p.fecha && p.fecha < hoy) avisos.push({ id: `pv_${o.id}_${p.id}`, nivel: "rojo", grupo: "Vencido", texto: p.texto, detalle: `desde ${fmtDia(p.fecha)}`, obraId: o.id, obra: o.nombre });
      else if (p.fecha === hoy) avisos.push({ id: `ph_${o.id}_${p.id}`, nivel: "ambar", grupo: "Hoy", texto: p.texto, detalle: "para hoy", obraId: o.id, obra: o.nombre });
    });
    reqsPend(o).forEach((r) => {
      if (r.fechaLimite && r.fechaLimite < hoy) avisos.push({ id: `rv_${o.id}_${r.id}`, nivel: "rojo", grupo: "Vencido", texto: `Requerimiento: ${r.texto}`, detalle: `desde ${fmtDia(r.fechaLimite)}`, obraId: o.id, obra: o.nombre });
      else if (r.fechaLimite === hoy) avisos.push({ id: `rh_${o.id}_${r.id}`, nivel: "ambar", grupo: "Hoy", texto: `Requerimiento: ${r.texto}`, detalle: "para hoy", obraId: o.id, obra: o.nombre });
    });
    if (esActiva(o)) {
      if (puntosPend(o).length === 0)
        avisos.push({ id: `sp_${o.id}`, nivel: "ambar", grupo: "Atención", texto: "Sin próximo paso definido", detalle: "añade un punto con fecha", obraId: o.id, obra: o.nombre });
      const dias = daysSince(ultimoMovimiento(o));
      if (dias > 14)
        avisos.push({ id: `sm_${o.id}`, nivel: "ambar", grupo: "Atención", texto: `Sin movimiento desde hace ${dias} días`, detalle: "apunta el último avance", obraId: o.id, obra: o.nombre });
      if (o.estado === "presupuesto" && daysSince(o.estadoDesde) > 21)
        avisos.push({ id: `pe_${o.id}`, nivel: "azul", grupo: "Seguimiento", texto: `Presupuesto sin respuesta (${daysSince(o.estadoDesde)} días)`, detalle: "llama al administrador", obraId: o.id, obra: o.nombre });
      if (o.subEstado === "solicitar" && ["contratada", "ejecucion"].includes(o.estado))
        avisos.push({ id: `su_${o.id}`, nivel: "azul", grupo: "Seguimiento", texto: "Subvención pendiente de solicitar", detalle: o.subImporte ? fmtEUR(o.subImporte) + " en juego" : "", obraId: o.id, obra: o.nombre });
    }
  });
  const orden = { rojo: 0, ambar: 1, azul: 2 };
  avisos.sort((a, b) => orden[a.nivel] - orden[b.nivel]);
  return avisos;
}

// Agenda global: puntos y requerimientos pendientes de todas las obras vivas
function calcularAgenda(data) {
  const items = [];
  data.obras.filter((o) => !o.archivada && o.estado !== "perdida").forEach((o) => {
    puntosPend(o).forEach((p) => items.push({ clase: "punto", obraId: o.id, obra: o.nombre, estado: o.estado, id: p.id, texto: p.texto, fecha: p.fecha || "", responsable: p.responsable || o.responsable || "" }));
    reqsPend(o).filter((r) => r.fechaLimite).forEach((r) => items.push({ clase: "req", obraId: o.id, obra: o.nombre, estado: o.estado, id: r.id, texto: r.texto, fecha: r.fechaLimite, responsable: o.responsable || "" }));
  });
  return items;
}

function ListaAvisos({ avisos, onOpen, compacta }) {
  const grupos = [

    { nivel: "ambar", titulo: "Atención", tone: "warn", Icon: Clock },

    return (
      <div className="flex items-center gap-2 py-3">

        <p className="text-sm font-semibold" style={{ color: C.ink }}>Todo al día. Ninguna obra necesita atención inmediata.</p>
      </div>

  }
  return (
    <div className="space-y-3">
      {grupos.map((g) => {

                  {a.detalle && <span className="text-xs hidden sm:block flex-shrink-0" style={{ color: C.mut }}>{a.detalle}</span>}

              ))}

                <p className="text-xs px-2" style={{ color: C.mut }}>… y {lista.length - 5} más</p>

/* ============================ PANEL (el corazón) ============================ */
function PanelView({ data, avisos, onOpen, onNueva, onOpenAjustes, onIrAgenda, addApunte, toast }) {
  const obras = data.obras.filter((o) => !o.archivada);
  const activas = obras.filter((o) => ACTIVOS.includes(o.estado));
  const now = new Date();

  if (data.obras.length === 0) {
    return (
      <EmptyHint icon={LayoutDashboard} title="La Central de Obras está lista"
        text="Aquí verás cada obra con su estado, sus apuntes, sus requerimientos y sus avisos, todo en un mismo sitio. Crea la primera obra o restaura una copia de seguridad desde Ajustes."
        action={<BtnPrimary onClick={onNueva}><Plus size={16} /> Crear la primera obra</BtnPrimary>} />
    );
  }

  const pipeline = obras.filter((o) => ["estudio", "presupuesto"].includes(o.estado));
  const cartera = obras.filter((o) => ["contratada", "ejecucion"].includes(o.estado));
  const enEjecucion = obras.filter((o) => o.estado === "ejecucion");
  const subEnJuego = obras.filter((o) => SUB_EN_JUEGO.includes(o.subEstado)).reduce((s, o) => s + o.subImporte, 0);
  const rojos = avisos.filter((a) => a.nivel === "rojo").length;
  const paraHoy = avisos.filter((a) => a.grupo === "Hoy").length;

  // objetivo del mes: contratado (primer paso a "contratada") dentro del mes actual
  const esEsteMes = (iso) => { const d = new Date(iso); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); };
  const contratadasMes = data.obras.filter((o) => { const f = primeraFechaEstado(o, "contratada"); return f && esEsteMes(f); });
  const valorMes = contratadasMes.reduce((s, o) => s + o.importe, 0);
  const objetivo = data.config.objetivoMensual || 0;

  // contratado por mes (últimos 6)
  const meses = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    meses.push({ key: `${d.getFullYear()}-${d.getMonth()}`, mes: d.toLocaleDateString("es-ES", { month: "short" }), valor: 0 });
  }
  data.obras.forEach((o) => {
    const f = primeraFechaEstado(o, "contratada");
    if (!f) return;
    const d = new Date(f);
    const m = meses.find((x) => x.key === `${d.getFullYear()}-${d.getMonth()}`);
    if (m) m.valor += o.importe;
  });

  // cartera por estado
  const porEstado = ESTADOS_TABLERO.map((e) => {
    const col = obras.filter((o) => o.estado === e.id);
    return { e, n: col.length, v: col.reduce((s, o) => s + o.importe, 0) };
  });
  const maxEstadoV = Math.max(1, ...porEstado.map((x) => x.v));

  // agenda de la semana
  const hoy = hoyYMD(), semana = ymdMas(7);
  const agenda = calcularAgenda(data).filter((i) => i.fecha && i.fecha <= semana).sort((a, b) => a.fecha.localeCompare(b.fecha)).slice(0, 8);

  // actividad reciente
  const recientes = obras.flatMap((o) => o.apuntes.map((a) => ({ ...a, obra: o.nombre, obraId: o.id })))
    .sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 6);

  // carga del equipo
  const carga = data.equipo.map((m) => {
    const mias = activas.filter((o) => o.responsable === m);
    const pts = activas.flatMap((o) => puntosPend(o).filter((p) => (p.responsable || o.responsable) === m));
    return { m, obras: mias.length, puntos: pts.length, vencidos: pts.filter((p) => p.fecha && p.fecha < hoy).length };
  }).filter((x) => x.obras > 0 || x.puntos > 0);

  return (
    <div className="space-y-5">
      {/* KPIs */}
      <div className="grid grid-cols-2 lg:grid-cols-5 gap-3">
        <KPI label="Obras activas" value={activas.length} sub={`${enEjecucion.length} en ejecución`} Icon={Building2} />
        <KPI label="Pipeline comercial" value={fmtEUR(pipeline.reduce((s, o) => s + o.importe, 0))} sub={`${pipeline.length} en estudio o presupuesto`} Icon={FileText} />
        <KPI label="Cartera contratada" value={fmtEUR(cartera.reduce((s, o) => s + o.importe, 0))} accent={C.red} sub={`${cartera.length} obras firmadas`} Icon={Hammer} />
        <KPI label="Subvención en juego" value={fmtEUR(subEnJuego)} sub="pendiente de cobrar" Icon={Euro} />
        <KPI label="Avisos" value={rojos + paraHoy} accent={rojos ? C.red : C.ok} sub={rojos ? `${rojos} vencidos · ${paraHoy} para hoy` : "nada urgente"} Icon={Bell} />
      </div>

      {/* Avisos + agenda */}
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <Card className="lg:col-span-2" style={rojos ? { borderLeftWidth: 3, borderLeftColor: C.red } : {}}>
          <SectionTitle>Centro de avisos</SectionTitle>
          <ListaAvisos avisos={avisos} onOpen={onOpen} compacta />
        </Card>
        <Card>
          <SectionTitle right={<BtnGhost onClick={onIrAgenda} className="!px-2 !py-1 text-xs">Ver agenda</BtnGhost>}>Próximos 7 días</SectionTitle>
          {agenda.length === 0 ? (
            <p className="text-sm py-2" style={{ color: C.mut }}>Sin puntos con fecha esta semana. Ponles fecha a los siguientes pasos para que aparezcan aquí.</p>
          ) : (
            <div className="space-y-0.5">
              {agenda.map((i) => (
                <button key={`${i.clase}_${i.obraId}_${i.id}`} onClick={() => onOpen(i.obraId)}
                  className="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-neutral-50 text-left">
                  <Badge tone={i.fecha < hoy ? "red" : i.fecha === hoy ? "warn" : "neutral"}>{i.fecha < hoy ? "vencido" : fmtDia(i.fecha)}</Badge>
                  <span className="text-sm truncate flex-1" style={{ color: C.ink }}>{i.texto}</span>
                </button>
              ))}
            </div>
          )}
        </Card>
      </div>

      {/* Objetivo + gráficas */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <Card>
          <SectionTitle>Cartera por estado</SectionTitle>
          <div className="space-y-2">
            {porEstado.map(({ e, n, v }) => (
              <HBar key={e.id} label={e.label} value={v} max={maxEstadoV} right={`${fmtEUR(v)} · ${n}`} fill={e.color} />
            ))}
          </div>
          <div className="mt-4 pt-3 border-t" style={{ borderColor: C.line }}>
            <div className="flex items-center justify-between gap-3 flex-wrap">
              <p className="text-xs font-bold uppercase tracking-wider inline-flex items-center gap-1.5" style={{ color: C.mut }}>
                <Target size={13} /> Objetivo del mes
              </p>
              {objetivo > 0 ? (
                <p className="text-sm font-bold" style={{ color: C.ink, fontVariantNumeric: "tabular-nums" }}>
                  {fmtEUR(valorMes)} / {fmtEUR(objetivo)}
                  <span className="ml-2" style={{ color: valorMes >= objetivo ? C.ok : C.mut }}>({pct(objetivo ? valorMes / objetivo : 0)})</span>
                </p>
              ) : (
                <BtnGhost onClick={onOpenAjustes} className="!px-2 !py-1 text-xs">Definir objetivo</BtnGhost>
              )}
            </div>
            {objetivo > 0 && <div className="mt-2"><BarraProgreso valor={(valorMes / objetivo) * 100} color={valorMes >= objetivo ? C.ok : C.red} /></div>}
          </div>
        </Card>
        <Card>
          <SectionTitle>Contratado por mes</SectionTitle>
          <GraficaMeses datos={meses} nombre="Contratado" />
        </Card>
      </div>

      {/* Obras en ejecución */}
      {enEjecucion.length > 0 && (
        <Card>
          <SectionTitle>Obras en ejecución</SectionTitle>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-3">
            {enEjecucion.sort((a, b) => b.importe - a.importe).map((o) => {
              const dias = daysSince(ultimoMovimiento(o));
              return (
                <button key={o.id} onClick={() => onOpen(o.id)} className="text-left px-2 py-1.5 -mx-2 rounded-lg hover:bg-neutral-50">
                  <div className="flex items-center justify-between gap-2 mb-1">
                    <span className="text-sm font-bold truncate" style={{ color: C.ink }}>{o.nombre}</span>
                    <span className="text-xs font-semibold flex-shrink-0" style={{ color: dias > 7 ? C.warn : C.mut }}>
                      {o.avance}% · últ. apunte hace {dias}d
                    </span>
                  </div>
                  <BarraProgreso valor={o.avance} color={C.red} />
                </button>
              );
            })}
          </div>
        </Card>
      )}

      {/* Actividad + equipo */}
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <Card className="lg:col-span-2">
          <SectionTitle>Última actividad</SectionTitle>
          <ApunteRapido data={data} addApunte={addApunte} toast={toast} />
          <div className="mt-3 space-y-2.5">
            {recientes.map((a) => {
              const { Icon, label } = apunteMeta(a.tipo);
              return (
                <button key={a.id} onClick={() => onOpen(a.obraId)} className="w-full flex gap-2.5 text-left px-1 py-0.5 rounded-lg hover:bg-neutral-50">
                  <div className="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5"
                    style={{ background: a.tipo === "incidencia" ? C.redTint : C.bone, color: a.tipo === "incidencia" ? C.red : C.ink }}>
                    <Icon size={13} />
                  </div>
                  <div className="min-w-0">
                    <p className="text-xs font-bold" style={{ color: C.ink }}>
                      {a.obra} <span className="font-medium" style={{ color: C.mut }}>· {label}{a.autor ? ` · ${a.autor}` : ""} · {fmtFecha(a.fecha)}</span>
                    </p>
                    <p className="text-sm truncate" style={{ color: C.txt }}>{a.texto}</p>
                  </div>
                </button>
              );
            })}
            {recientes.length === 0 && <p className="text-sm py-2" style={{ color: C.mut }}>Todavía no hay apuntes. Registra el primero arriba: cada avance queda en el diario de su obra.</p>}
          </div>
        </Card>
        <Card>
          <SectionTitle>Carga del equipo</SectionTitle>
          {carga.length === 0 ? (
            <p className="text-sm py-2" style={{ color: C.mut }}>Añade a tu equipo en Ajustes y asigna cada obra a un responsable para repartir el trabajo.</p>
          ) : (
            <div className="space-y-2">
              {carga.map((x) => (
                <div key={x.m} className="flex items-center gap-2.5">
                  <Avatar nombre={x.m} size={8} />
                  <div className="min-w-0 flex-1">
                    <p className="text-sm font-bold truncate" style={{ color: C.ink }}>{x.m}</p>
                    <p className="text-xs" style={{ color: C.mut }}>{x.obras} obras · {x.puntos} puntos</p>
                  </div>
                  {x.vencidos > 0 && <Badge tone="red">{x.vencidos} vencidos</Badge>}
                </div>
              ))}
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}

function ApunteRapido({ data, addApunte, toast }) {
  const vivas = data.obras.filter((o) => !o.archivada && o.estado !== "perdida");
  const [obraId, setObraId] = useState("");
  const [texto, setTexto] = useState("");
  const guardar = () => {
    if (!obraId || !texto.trim()) return;
    addApunte(obraId, { tipo: "nota", autor: "", texto: texto.trim() });
    setTexto("");
    toast("Apunte guardado en el diario de la obra");
  };
  if (vivas.length === 0) return null;
  return (
    <div className="rounded-xl border p-2.5 flex flex-col sm:flex-row gap-2" style={{ borderColor: C.line, background: C.bone }}>
      <select className={inputCls + " sm:w-56"} style={inputStyle} value={obraId} onChange={(e) => setObraId(e.target.value)}>
        <option value="">Apunte rápido en…</option>
        {vivas.map((o) => <option key={o.id} value={o.id}>{o.nombre}</option>)}
      </select>
      <input className={inputCls} style={inputStyle} placeholder="¿Qué ha pasado? Se guarda en el diario de la obra"
        value={texto} onChange={(e) => setTexto(e.target.value)} onKeyDown={(e) => e.key === "Enter" && guardar()} />
      <BtnPrimary onClick={guardar} disabled={!obraId || !texto.trim()}><Plus size={15} /> Anotar</BtnPrimary>
    </div>
  );
}

/* ============================ TABLERO (kanban) ============================ */
function TableroView({ data, onOpen, onNueva, setEstado, onPerdida }) {
  const [dragId, setDragId] = useState(null);
  const [overCol, setOverCol] = useState(null);
  const hoy = hoyYMD();
  const obras = data.obras.filter(enTablero);
  const perdidas = data.obras.filter((o) => !o.archivada && o.estado === "perdida");

  if (obras.length === 0 && perdidas.length === 0) {
    return (
      <EmptyHint icon={Columns} title="El tablero está vacío"
        text="Cada obra es una tarjeta que avanza por las columnas: Estudio → Presupuesto → Contratada → En ejecución → Finalizada. Arrástralas con el ratón o usa las flechas."
        action={<BtnPrimary onClick={onNueva}><Plus size={16} /> Nueva obra</BtnPrimary>} />
    );
  }

  const soltar = (estadoId) => {
    if (dragId) setEstado(dragId, estadoId);
    setDragId(null); setOverCol(null);
  };

  return (
    <div>
      <div className="overflow-x-auto pb-2 -mx-1 px-1">
        <div className="flex gap-3" style={{ minWidth: "68rem" }}>
          {ESTADOS_TABLERO.map((e, ei) => {
            const col = obras.filter((o) => o.estado === e.id)
              .sort((a, b) => (a.prioridad === "alta" ? -1 : 0) - (b.prioridad === "alta" ? -1 : 0) || b.importe - a.importe);
            const total = col.reduce((s, o) => s + o.importe, 0);
            const resaltada = overCol === e.id;
            return (
              <div key={e.id} className="flex-1 rounded-xl p-2 transition-colors" style={{ background: resaltada ? e.tint : "#ECEAE7", minWidth: "13rem", outline: resaltada ? `2px dashed ${e.color}` : "none" }}
                onDragOver={(ev) => { ev.preventDefault(); if (overCol !== e.id) setOverCol(e.id); }}
                onDragLeave={() => overCol === e.id && setOverCol(null)}
                onDrop={(ev) => { ev.preventDefault(); soltar(e.id); }}>
                <div className="px-1.5 pb-1 flex items-center justify-between">
                  <span className="text-xs font-extrabold uppercase tracking-wider inline-flex items-center gap-1.5" style={{ color: C.ink }} title={e.desc}>
                    <span className="w-2.5 h-2.5 rounded-full" style={{ background: e.color }} />{e.label}
                  </span>
                  <span className="text-xs font-bold px-1.5 py-0.5 rounded-md text-white" style={{ background: e.color }}>{col.length}</span>
                </div>
                <p className="px-1.5 pb-2 text-xs font-semibold" style={{ color: C.mut, fontVariantNumeric: "tabular-nums" }}>{fmtEUR(total)}</p>
                <div className="space-y-2 min-h-10">
                  {col.map((o) => {
                    const paso = proximoPaso(o);
                    const vencidos = puntosPend(o).filter((p) => p.fecha && p.fecha < hoy).length
                      + reqsPend(o).filter((r) => r.fechaLimite && r.fechaLimite < hoy).length;
                    const dias = daysSince(o.estadoDesde);
                    return (
                      <div key={o.id} draggable
                        onDragStart={(ev) => { ev.dataTransfer.setData("text/plain", o.id); ev.dataTransfer.effectAllowed = "move"; setDragId(o.id); }}
                        onDragEnd={() => { setDragId(null); setOverCol(null); }}
                        className={`bg-white rounded-lg border p-2.5 shadow-sm cursor-grab active:cursor-grabbing transition-shadow hover:shadow-md ${dragId === o.id ? "arrastrando" : ""}`}
                        style={{ borderColor: C.line, borderLeftWidth: 3, borderLeftColor: vencidos ? C.red : e.color }}>
                        <button className="text-left w-full" onClick={() => onOpen(o.id)}>
                          <div className="flex items-start justify-between gap-1">
                            <p className="text-sm font-bold leading-snug" style={{ color: C.ink }}>{o.nombre}</p>
                            <PrioFlag prioridad={o.prioridad} />
                          </div>
                          {(o.tipos.length > 0 || o.direccion) && (
                            <p className="text-xs mt-0.5 truncate" style={{ color: C.mut }}>
                              {o.tipos[0] || ""}{o.tipos.length > 1 ? ` +${o.tipos.length - 1}` : ""}{o.tipos.length && o.direccion ? " · " : ""}{o.direccion}

                          </div>

                          </div>
                          <div className="flex items-center justify-between mt-1.5">
                            <span className="text-xs truncate" style={{ color: C.mut }}>{o.responsable || "Sin responsable"}</span>

                            <button title="Estado anterior" disabled={ei === 0} onClick={() => setEstado(o.id, ESTADOS_TABLERO[ei - 1].id)}

                              <ChevronLeft size={14} />

                              <ChevronRight size={14} />

                </div>
              </div>

      {perdidas.length > 0 && (
        <p className="text-xs mt-2 px-1" style={{ color: C.mut }}>
          {perdidas.length} obra{perdidas.length === 1 ? "" : "s"} perdida{perdidas.length === 1 ? "" : "s"} — puedes verlas en la pestaña <b>Obras</b> filtrando por estado.
        </p>
      )}
    </div>
  );
}

                  No hay obras con estos filtros.
                </td></tr>
              )}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

  const grupos = [
    { id: "vencidos", titulo: "Vencidos", tone: "red", filtro: (i) => i.fecha && i.fecha < hoy },
    { id: "hoy", titulo: "Hoy", tone: "warn", filtro: (i) => i.fecha === hoy },
    { id: "manana", titulo: "Mañana", tone: "neutral", filtro: (i) => i.fecha === maniana },

    { id: "luego", titulo: "Más adelante", tone: "neutral", filtro: (i) => i.fecha > semana },

  return (
    <div className="space-y-4">
      <div className="flex items-center gap-2">
        <select className={inputCls + " w-auto"} style={inputStyle} value={fResp} onChange={(e) => setFResp(e.target.value)}>
          <option value="todos">Todo el equipo</option>

          <Card key={g.id}>

              {lista.map((i) => (
                <div key={`${i.clase}_${i.obraId}_${i.id}`} className="flex items-center gap-2.5 px-1 py-1.5 rounded-lg hover:bg-neutral-50 group">
                  <button onClick={() => togglePendiente(i.obraId, i.clase, i.id)} title="Marcar como hecho"

                  {i.fecha && <Badge tone={i.fecha < hoy ? "red" : i.fecha === hoy ? "warn" : "neutral"}>{fmtDia(i.fecha)}</Badge>}
                  <span className="text-sm flex-1 min-w-0 truncate" style={{ color: C.ink }}>

              ))}
            </div>
          </Card>
        );
      })}

  );
}

/* ============================ ANÁLISIS ============================ */
function AnalisisView({ data }) {
  const now = new Date();
  const obras = data.obras;
  if (obras.length === 0) {
    return (
      <EmptyHint icon={TrendingUp} title="Aún no hay datos que analizar"
        text="En cuanto haya obras avanzando por el tablero verás aquí la contratación por mes, el peso de cada tipo de obra, el recorrido de las subvenciones y los tiempos de cada fase." />
    );
  }
  const anio = now.getFullYear();
  const contratadas = obras.map((o) => ({ o, f: primeraFechaEstado(o, "contratada") })).filter((x) => x.f);
  const contratadoAnio = contratadas.filter((x) => new Date(x.f).getFullYear() === anio).reduce((s, x) => s + x.o.importe, 0);
  const perdidasN = obras.filter((o) => o.estado === "perdida").length;
  const exito = (contratadas.length + perdidasN) ? contratadas.length / (contratadas.length + perdidasN) : 0;
  const diasContratar = contratadas.length
    ? Math.round(contratadas.reduce((s, x) => s + (new Date(x.f) - new Date(x.o.creado)) / 86400000, 0) / contratadas.length) : null;
  const finalizadasAnio = obras.filter((o) => { const f = primeraFechaEstado(o, "finalizada"); return f && new Date(f).getFullYear() === anio; }).length;

  // contratado por mes, 12 meses
  const meses = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    meses.push({ key: `${d.getFullYear()}-${d.getMonth()}`, mes: d.toLocaleDateString("es-ES", { month: "short" }), valor: 0 });
  }
  contratadas.forEach(({ o, f }) => {
    const d = new Date(f);
    const m = meses.find((x) => x.key === `${d.getFullYear()}-${d.getMonth()}`);
    if (m) m.valor += o.importe;
  });

  // cartera por tipo (tipo principal, un solo tono: es una sola serie)
  const vivas = obras.filter((o) => !o.archivada && o.estado !== "perdida");
  const porTipo = TIPOS_OBRA.map((t) => {
    const col = vivas.filter((o) => (o.tipos[0] || "Otro") === t);
    return { t, n: col.length, v: col.reduce((s, o) => s + o.importe, 0) };
  }).filter((x) => x.n > 0).sort((a, b) => b.v - a.v);
  const maxTipo = Math.max(1, ...porTipo.map((x) => x.v));

  // subvenciones: recorrido (rampa ordinal de un tono)
  const subPasos = SUB_ESTADOS.filter((s) => s.id !== "no").map((s) => {
    const col = vivas.filter((o) => o.subEstado === s.id);
    return { s, n: col.length, v: col.reduce((sum, o) => sum + o.subImporte, 0) };
  });
  const maxSub = Math.max(1, ...subPasos.map((x) => x.v));
  const haySub = subPasos.some((x) => x.n > 0);

  // tiempo medio por estado (estancias cerradas del historial)
  const estancias = {};
  obras.forEach((o) => {
    const h = o.historial || [];
    for (let i = 0; i < h.length - 1; i++) {
      const dias = (new Date(h[i + 1].fecha) - new Date(h[i].fecha)) / 86400000;
      if (dias >= 0) (estancias[h[i].estado] = estancias[h[i].estado] || []).push(dias);
    }
  });
  const tiempos = ESTADOS_TABLERO.filter((e) => e.id !== "finalizada").map((e) => {
    const arr = estancias[e.id] || [];
    return { e, media: arr.length ? Math.round(arr.reduce((s, x) => s + x, 0) / arr.length) : null, n: arr.length };
  }).filter((x) => x.media !== null);
  const maxTiempo = Math.max(1, ...tiempos.map((x) => x.media));

  // motivos de pérdida
  const motivos = MOTIVOS.map((m) => ({ m, n: obras.filter((o) => o.estado === "perdida" && o.motivoPerdida === m).length })).filter((x) => x.n > 0).sort((a, b) => b.n - a.n);
  const maxMotivo = Math.max(1, ...motivos.map((x) => x.n));

  // actividad semanal (8 semanas)
  const semanas = Array.from({ length: 8 }, (_, i) => ({ sem: i === 7 ? "Esta" : `-${7 - i}`, n: 0 }));
  obras.forEach((o) => o.apuntes.forEach((a) => {
    const w = Math.floor(daysSince(a.fecha) / 7);
    if (w <= 7) semanas[7 - w].n += 1;
  }));

  return (
    <div className="space-y-5">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <KPI label={`Contratado en ${anio}`} value={fmtEUR(contratadoAnio)} accent={C.red} Icon={Hammer} />
        <KPI label="Tasa de éxito" value={pct(exito)} sub={`${contratadas.length} contratadas · ${perdidasN} perdidas`} Icon={Target} />
        <KPI label="Días hasta contratar" value={diasContratar ?? "—"} sub="media desde el alta" Icon={Clock} />
        <KPI label={`Finalizadas en ${anio}`} value={finalizadasAnio} Icon={CircleCheck} />
      </div>

      <Card>
        <SectionTitle>Contratado por mes · últimos 12 meses</SectionTitle>
        <GraficaMeses datos={meses} nombre="Contratado" />
      </Card>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <Card>
          <SectionTitle>Cartera viva por tipo de obra</SectionTitle>
          {porTipo.length === 0 ? <p className="text-sm" style={{ color: C.mut }}>Sin obras vivas.</p> : (
            <div className="space-y-2">
              {porTipo.map((x) => <HBar key={x.t} label={x.t} value={x.v} max={maxTipo} right={`${fmtEUR(x.v)} · ${x.n}`} fill={C.red} />)}
            </div>
          )}
        </Card>
        <Card>
          <SectionTitle>Recorrido de las subvenciones</SectionTitle>
          {!haySub ? (
            <p className="text-sm" style={{ color: C.mut }}>Ninguna obra viva tiene subvención registrada. Se apunta en la ficha de cada obra (importe y estado del expediente).</p>
          ) : (
            <div className="space-y-2">
              {subPasos.map((x) => <HBar key={x.s.id} label={x.s.label} value={x.v} max={maxSub} right={`${fmtEUR(x.v)} · ${x.n}`} fill={x.s.color} />)}
            </div>
          )}
          <p className="text-xs mt-3" style={{ color: C.mut }}>El tono se oscurece según avanza el expediente hacia el cobro.</p>
        </Card>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <Card>
          <SectionTitle>Ritmo de apuntes por semana</SectionTitle>
          <div style={{ height: 190 }}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={semanas} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
                <CartesianGrid strokeDasharray="3 3" stroke={C.grid} vertical={false} />
                <XAxis dataKey="sem" tick={axisTick} axisLine={false} tickLine={false} />
                <YAxis allowDecimals={false} tick={axisTick} axisLine={false} tickLine={false} width={28} />
                <Tooltip formatter={(v) => [v, "Apuntes"]} contentStyle={tooltipStyle} cursor={{ fill: "rgba(0,0,0,0.04)" }} />
                <Bar dataKey="n" radius={[4, 4, 0, 0]} maxBarSize={28}>
                  {semanas.map((_, i) => <Cell key={i} fill={i === 7 ? C.red : "#B9B4AE"} />)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
          <p className="text-xs mt-1" style={{ color: C.mut }}>Un diario constante es la señal de una empresa coordinada.</p>
        </Card>
        <Card>
          <SectionTitle>Días de media en cada fase</SectionTitle>
          {tiempos.length === 0 ? (
            <p className="text-sm" style={{ color: C.mut }}>Cuando las obras cambien de fase se calculará cuánto tarda cada una de media.</p>
          ) : (
            <div className="space-y-2">
              {tiempos.map((x) => <HBar key={x.e.id} label={x.e.label} value={x.media} max={maxTiempo} right={`${x.media} días`} fill={x.e.color} />)}
            </div>
          )}
          {motivos.length > 0 && (
            <div className="mt-4 pt-3 border-t" style={{ borderColor: C.line }}>
              <p className="text-xs font-bold uppercase tracking-wider mb-2" style={{ color: C.mut }}>Motivos de pérdida</p>
              <div className="space-y-1.5">
                {motivos.map((x) => <HBar key={x.m} label={x.m} value={x.n} max={maxMotivo} right={`${x.n}`} fill="#75757A" />)}
              </div>
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}

/* ============================ FICHA DE OBRA ============================ */
function Stepper({ obra, setEstado }) {
  const idx = ESTADOS_TABLERO.findIndex((e) => e.id === obra.estado);
  return (
    <div className="flex items-center gap-0 overflow-x-auto py-1">
      {ESTADOS_TABLERO.map((e, i) => {
        const alcanzado = idx >= 0 && i <= idx;
        const actual = e.id === obra.estado;
        return (
          <React.Fragment key={e.id}>
            {i > 0 && <div className="h-0.5 flex-1 min-w-3" style={{ background: alcanzado ? EST[obra.estado].color : C.line }} />}
            <button onClick={() => !actual && setEstado(obra.id, e.id)} title={e.desc}
              className="flex flex-col items-center gap-1 px-1.5 flex-shrink-0 group">
              <span className={`w-5 h-5 rounded-full border-2 flex items-center justify-center transition-all ${actual ? "scale-125" : "group-hover:scale-110"}`}
                style={{ borderColor: alcanzado || actual ? e.color : C.line, background: alcanzado ? e.color : "#fff" }}>
                {alcanzado && !actual && <Check size={11} style={{ color: "#fff" }} />}
                {actual && <span className="w-2 h-2 rounded-full" style={{ background: "#fff" }} />}
              </span>
              <span className="text-xs font-bold whitespace-nowrap" style={{ color: actual ? e.color : C.mut }}>{e.label}</span>
            </button>
          </React.Fragment>
        );
      })}
    </div>
  );
}

function FormPunto({ equipo, defecto, tipicos, onAdd }) {
  const [texto, setTexto] = useState("");
  const [fecha, setFecha] = useState("");
  const [resp, setResp] = useState(defecto || "");
  const lista = tipicos || [];
  const guardar = () => {
    if (!texto.trim()) return;
    onAdd({ texto: texto.trim(), fecha, responsable: resp });
    setTexto(""); setFecha("");
  };
  return (
    <div>
      {lista.length > 0 && (
        <div className="flex flex-wrap gap-1.5 mb-2">
          {lista.map((t) => (
            <button key={t} type="button" onClick={() => setTexto(texto === t ? "" : t)}
              className="px-2.5 py-1 rounded-full text-xs font-semibold border transition-colors"
              style={texto === t
                ? { background: C.ink, color: "#fff", borderColor: C.ink }
                : { background: "#fff", color: C.txt, borderColor: C.line }}>
              {t}
            </button>
          ))}
        </div>
      )}
      <div className="flex flex-col sm:flex-row gap-2">
        <input className={inputCls} style={inputStyle} placeholder="Elige un punto típico arriba o escribe el tuyo…"
          value={texto} onChange={(e) => setTexto(e.target.value)} onKeyDown={(e) => e.key === "Enter" && guardar()} />
        <input type="date" className={inputCls + " sm:w-40"} style={inputStyle} value={fecha} onChange={(e) => setFecha(e.target.value)} />
        <select className={inputCls + " sm:w-40"} style={inputStyle} value={resp} onChange={(e) => setResp(e.target.value)}>
          <option value="">Responsable…</option>
          {equipo.map((c) => <option key={c}>{c}</option>)}
        </select>
        <BtnPrimary onClick={guardar} disabled={!texto.trim()}><Plus size={15} /> Añadir</BtnPrimary>
      </div>
    </div>
  );
}

function FormApunte({ equipo, defecto, onSave }) {
  const [tipo, setTipo] = useState("nota");
  const [autor, setAutor] = useState(defecto || "");
  const [texto, setTexto] = useState("");
  const guardar = () => {
    if (!texto.trim()) return;
    onSave({ tipo, autor, texto: texto.trim() });
    setTexto("");
  };
  return (
    <div className="rounded-xl border p-3" style={{ borderColor: C.line, background: C.bone }}>
      <div className="flex flex-wrap gap-1.5 mb-2">
        {TIPOS_APUNTE.map(({ id, label, Icon }) => (
          <button key={id} onClick={() => setTipo(id)}
            className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition-colors"
            style={tipo === id
              ? { background: C.ink, color: "#fff", borderColor: C.ink }
              : { background: "#fff", color: C.ink, borderColor: C.line }}>
            <Icon size={13} /> {label}
          </button>
        ))}
      </div>
      <div className="flex flex-col sm:flex-row gap-2">
        <select className={inputCls + " sm:w-44"} style={inputStyle} value={autor} onChange={(e) => setAutor(e.target.value)}>
          <option value="">Quién lo apunta…</option>
          {equipo.map((c) => <option key={c}>{c}</option>)}
        </select>
        <input className={inputCls} style={inputStyle} placeholder="¿Qué ha pasado? Avance, acuerdo, incidencia, próximos pasos…"
          value={texto} onChange={(e) => setTexto(e.target.value)} onKeyDown={(e) => e.key === "Enter" && guardar()} />
        <BtnPrimary onClick={guardar} disabled={!texto.trim()}><Plus size={15} /> Anotar</BtnPrimary>
      </div>
    </div>
  );
}

function FichaObra({ obra, data, avisos, onClose, onEdit, setEstado, onPerdida, onReabrir, onDelete, onArchivar,
  addPunto, togglePunto, delPunto, addReq, toggleReq, delReq, addApunte, delApunte, updateObra }) {
  const hoy = hoyYMD();
  const [verHechos, setVerHechos] = useState(false);
  const misAvisos = avisos.filter((a) => a.obraId === obra.id);
  const apuntes = [...obra.apuntes].sort((a, b) => b.fecha.localeCompare(a.fecha));
  const sugeridos = (REQS_SUGERIDOS[obra.estado] || []).filter((s) => !obra.requerimientos.some((r) => r.texto === s));
  const [reqCustom, setReqCustom] = useState("");
  const pendientes = puntosPend(obra);
  const hechos = obra.puntos.filter((p) => p.hecho);
  const cerrada = obra.estado === "perdida";

  return (
    <Modal title="Ficha de obra" onClose={onClose} wide>
      {/* cabecera */}
      <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
        <div className="min-w-0">
          <p className="text-xl font-extrabold leading-tight" style={{ color: C.ink }}>{obra.nombre}</p>
          <p className="text-sm mt-0.5" style={{ color: C.mut }}>
            {[obra.direccion, obra.municipio].filter(Boolean).join(" · ") || "Sin dirección"}
          </p>
          <div className="flex flex-wrap gap-1.5 mt-2">
            <EstadoBadge estado={obra.estado} conDias desde={obra.estadoDesde} />
            {obra.prioridad === "alta" && <Badge tone="red"><Flag size={11} /> Prioridad alta</Badge>}
            {obra.tipos.map((t) => <Badge key={t}>{t}</Badge>)}
            {obra.responsable && <Badge tone="ink">{obra.responsable}</Badge>}
            {obra.origen && <Badge title="Origen">{obra.origen}</Badge>}
            {cerrada && obra.motivoPerdida && <Badge tone="warn">Motivo: {obra.motivoPerdida}</Badge>}
          </div>
        </div>
        <div className="text-right flex-shrink-0">
          <p className="text-2xl font-extrabold" style={{ color: C.red }}>{fmtEUR(obra.importe)}</p>
          {obra.cobrado > 0 && (
            <p className="text-xs font-semibold" style={{ color: C.mut }}>cobrado {fmtEUR(obra.cobrado)} ({pct(obra.importe ? obra.cobrado / obra.importe : 0)})</p>
          )}
          <p className="text-xs mt-0.5" style={{ color: C.mut }}>alta {fmtFecha(obra.creado)}</p>
        </div>
      </div>

      {/* recorrido de estados */}
      {!cerrada && (
        <div className="mt-4 rounded-xl border px-3 py-2" style={{ borderColor: C.line }}>
          <Stepper obra={obra} setEstado={setEstado} />
        </div>
      )}

      {/* avisos de esta obra */}
      {misAvisos.length > 0 && (
        <div className="mt-3 rounded-xl border p-2.5 space-y-1" style={{ borderColor: C.red, background: "#FDF7F6" }}>
          {misAvisos.map((a) => (
            <p key={a.id} className="text-sm inline-flex items-center gap-2 w-full" style={{ color: C.redDark }}>
              <AlertTriangle size={13} className="flex-shrink-0" style={{ color: a.nivel === "rojo" ? C.red : a.nivel === "ambar" ? C.warn : C.azul }} />
              <b>{a.texto}</b>{a.detalle ? <span style={{ color: C.mut }}>· {a.detalle}</span> : null}
            </p>
          ))}
        </div>
      )}

      {/* contacto + economía */}
      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4">
        <div className="rounded-xl border p-3 space-y-1.5" style={{ borderColor: C.line }}>
          <p className="text-xs font-bold uppercase tracking-wider mb-1" style={{ color: C.mut }}>Contacto</p>
          <p className="text-sm flex items-center gap-2" style={{ color: C.ink }}><Users size={13} style={{ color: C.mut }} /> {obra.contactoNombre || "—"}{obra.admFincas ? ` · ${obra.admFincas}` : ""}</p>
          <p className="text-sm flex items-center gap-2"><Phone size={13} style={{ color: C.mut }} /> {obra.telefono ? <a href={`tel:${obra.telefono}`} className="hover:underline" style={{ color: C.ink }}>{obra.telefono}</a> : <span style={{ color: C.mut }}>—</span>}</p>
          <p className="text-sm flex items-center gap-2 min-w-0"><Mail size={13} style={{ color: C.mut }} /> {obra.email ? <a href={`mailto:${obra.email}`} className="hover:underline truncate" style={{ color: C.ink }}>{obra.email}</a> : <span style={{ color: C.mut }}>—</span>}</p>
          {obra.notas && <p className="text-sm mt-1 rounded-lg px-2.5 py-1.5" style={{ background: C.bone, color: C.txt }}>{obra.notas}</p>}
        </div>
        <div className="rounded-xl border p-3" style={{ borderColor: C.line }}>
          <p className="text-xs font-bold uppercase tracking-wider mb-1.5" style={{ color: C.mut }}>Subvención</p>
          <div className="flex items-center gap-2 flex-wrap">
            <select className={inputCls + " w-auto"} style={inputStyle} value={obra.subEstado}
              onChange={(e) => updateObra(obra.id, { subEstado: e.target.value })}>
              {SUB_ESTADOS.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
            </select>
            {obra.subEstado !== "no" && (
              <span className="text-sm font-bold" style={{ color: "#1C5CAB", fontVariantNumeric: "tabular-nums" }}>
                {obra.subImporte ? fmtEUR(obra.subImporte) : "importe sin definir"}{obra.subTipo ? ` · ${obra.subTipo}` : ""}
              </span>
            )}
          </div>
          {(obra.estado === "ejecucion" || obra.estado === "finalizada") && (
            <div className="mt-3 pt-3 border-t" style={{ borderColor: C.line }}>
              <div className="flex items-center justify-between mb-1">
                <p className="text-xs font-bold uppercase tracking-wider" style={{ color: C.mut }}>Avance de obra</p>
                <span className="text-sm font-extrabold" style={{ color: C.red }}>{obra.avance}%</span>
              </div>
              <input type="range" min="0" max="100" step="5" className="w-full" value={obra.avance}
                onChange={(e) => updateObra(obra.id, { avance: Number(e.target.value) })} />
            </div>
          )}
        </div>
      </div>

      {/* puntos */}
      <div className="mt-5">
        <p className="text-xs font-bold uppercase tracking-wider mb-2 inline-flex items-center gap-1.5" style={{ color: C.ink }}>
          <ListChecks size={14} style={{ color: C.red }} /> Puntos a resolver
          {pendientes.length > 0 && <Badge tone="red">{pendientes.length}</Badge>}
        </p>
        <FormPunto equipo={data.equipo} defecto={obra.responsable} tipicos={data.config.puntosTipicos} onAdd={(p) => addPunto(obra.id, p)} />
        <div className="mt-2 space-y-1">
          {pendientes.sort((a, b) => (a.fecha || "9999").localeCompare(b.fecha || "9999")).map((p) => (
            <div key={p.id} className="flex items-center gap-2.5 px-1 py-1 rounded-lg hover:bg-neutral-50 group">
              <button onClick={() => togglePunto(obra.id, p.id)} title="Marcar como hecho"
                className="w-5 h-5 rounded-md border-2 flex-shrink-0 flex items-center justify-center transition-colors"
                style={{ borderColor: p.fecha && p.fecha < hoy ? C.red : C.mut }}>
                <Check size={13} className="opacity-0 group-hover:opacity-60" style={{ color: C.ok }} />
              </button>
              {p.fecha && <Badge tone={p.fecha < hoy ? "red" : p.fecha === hoy ? "warn" : "neutral"}>{fmtDia(p.fecha)}</Badge>}
              <span className="text-sm flex-1" style={{ color: C.ink }}>{p.texto}</span>
              {p.responsable && <Avatar nombre={p.responsable} />}
              <button onClick={() => delPunto(obra.id, p.id)} className="opacity-0 group-hover:opacity-100 p-1 rounded hover:bg-neutral-100" title="Eliminar">
                <Trash2 size={13} style={{ color: C.mut }} />
              </button>
            </div>
          ))}
          {pendientes.length === 0 && <p className="text-sm px-1 py-1" style={{ color: cerrada ? C.mut : C.warn }}>{cerrada ? "Sin puntos pendientes." : "Sin próximo paso. Toda obra viva debería tener al menos un punto con fecha."}</p>}
          {hechos.length > 0 && (
            <button onClick={() => setVerHechos(!verHechos)} className="text-xs font-semibold inline-flex items-center gap-1 px-1 py-1" style={{ color: C.mut }}>
              <ChevronDown size={13} style={{ transform: verHechos ? "rotate(180deg)" : "none", transition: "transform .15s" }} />
              {hechos.length} completado{hechos.length === 1 ? "" : "s"}
            </button>
          )}
          {verHechos && hechos.map((p) => (
            <div key={p.id} className="flex items-center gap-2.5 px-1 py-1 group">
              <button onClick={() => togglePunto(obra.id, p.id)} title="Recuperar"
                className="w-5 h-5 rounded-md flex-shrink-0 flex items-center justify-center" style={{ background: C.okTint }}>
                <Check size={13} style={{ color: C.ok }} />
              </button>
              <span className="text-sm flex-1 line-through" style={{ color: C.mut }}>{p.texto}</span>
              {p.fechaHecho && <span className="text-xs" style={{ color: C.mut }}>{fmtFecha(p.fechaHecho)}</span>}
            </div>
          ))}
        </div>
      </div>

      {/* requerimientos */}
      <div className="mt-5">
        <p className="text-xs font-bold uppercase tracking-wider mb-2 inline-flex items-center gap-1.5" style={{ color: C.ink }}>
          <FileText size={14} style={{ color: C.red }} /> Requerimientos
          {reqsPend(obra).length > 0 && <Badge tone="warn">{reqsPend(obra).length} pendientes</Badge>}
        </p>
        {sugeridos.length > 0 && (
          <div className="flex flex-wrap gap-1.5 mb-2">
            {sugeridos.map((s) => (
              <button key={s} onClick={() => addReq(obra.id, { texto: s })}
                className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold border border-dashed hover:bg-neutral-50 transition-colors"
                style={{ borderColor: C.mut, color: C.txt }}>
                <Plus size={11} /> {s}
              </button>
            ))}
          </div>
        )}
        <div className="flex gap-2">
          <input className={inputCls} style={inputStyle} placeholder="Otro requerimiento…" value={reqCustom}
            onChange={(e) => setReqCustom(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter" && reqCustom.trim()) { addReq(obra.id, { texto: reqCustom.trim() }); setReqCustom(""); } }} />
          <BtnGhost onClick={() => { if (reqCustom.trim()) { addReq(obra.id, { texto: reqCustom.trim() }); setReqCustom(""); } }}><Plus size={14} /></BtnGhost>
        </div>
        <div className="mt-2 space-y-1">
          {obra.requerimientos.map((r) => (

// --- lectura de CSV (el que exporta Excel con ";" o cualquier CSV normal) ---
const sinAcentos = (s) => String(s || "").normalize("NFD").split("")
  .filter((ch) => { const c = ch.charCodeAt(0); return c < 768 || c > 879; }) // fuera marcas diacríticas
  .join("").toLowerCase().trim();
function parseCSV(texto) {
  const primera = texto.split("\n")[0] || "";
  const cuenta = (ch) => primera.split(ch).length - 1;
  let sep = ";";
  if (cuenta("\t") > cuenta(";") && cuenta("\t") > cuenta(",")) sep = "\t";
  else if (cuenta(",") > cuenta(";")) sep = ",";
  const filas = []; let fila = [], campo = "", enComillas = false;
  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (enComillas) {
      if (ch === '"') { if (texto[i + 1] === '"') { campo += '"'; i++; } else enComillas = false; }
      else campo += ch;
    } else if (ch === '"') enComillas = true;
    else if (ch === sep) { fila.push(campo); campo = ""; }
    else if (ch === "\n") {
      if (campo.endsWith("\r")) campo = campo.slice(0, -1);
      fila.push(campo); filas.push(fila); fila = []; campo = "";
    } else if (ch !== "\r") campo += ch;
  }
  if (campo !== "" || fila.length) { fila.push(campo); filas.push(fila); }
  return filas.filter((f) => f.some((c) => String(c).trim() !== ""));
}
// sinónimos de cabecera que se reconocen automáticamente
const COLS_CSV = {
  nombre: ["obra", "nombre", "comunidad", "ubicacion"],
  codigo: ["codigo"],
  municipio: ["municipio", "localidad"],
  direccion: ["direccion"],
  estado: ["estado", "fase"],
  importe: ["importe", "presupuesto", "total"],
  subEstimada: ["subvencion_estimada", "subvencion estimada", "subvencion", "ayudas"],
  responsable: ["responsable", "comercial"],
  admFincas: ["admfincas", "administracion", "administrador"],
  contactoNombre: ["contacto"],
  telefono: ["telefono"],
  email: ["email", "correo"],
  notas: ["notas", "observaciones", "obs"],
  tipos: ["tipos", "tipo"],
  prioridad: ["prioridad"],
  cobrado: ["cobrado"],
  subvImporte: ["subvimporte"],
  subvEstado: ["subvestado"],
  subvPrograma: ["subvprograma", "programa"],
};
const numES = (v) => {
  let t = String(v || "").replace(/[€\s]/g, "");
  if (!t) return 0;
  if (t.includes(".") && t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
  else if (t.includes(",")) t = t.replace(",", ".");
  const n = parseFloat(t);
  return isNaN(n) ? 0 : Math.round(n);
};
const ESTADO_CSV = { estudio: "estudio", presupuesto: "presupuesto", contratada: "contratada", ejecucion: "ejecucion", "en ejecucion": "ejecucion", finalizada: "finalizada", perdida: "perdida" };
function interpretarCSV(texto) {
  const filas = parseCSV(texto);
  if (!filas.length) return { items: [], info: "archivo vacío" };
  const cab = filas[0].map(sinAcentos);
  const idx = {};
  Object.keys(COLS_CSV).forEach((campo) => {
    const i = cab.findIndex((c) => COLS_CSV[campo].includes(c));
    if (i >= 0) idx[campo] = i;
  });
  const conCabecera = idx.nombre !== undefined && Object.keys(idx).length >= 2;
  const cuerpo = conCabecera ? filas.slice(1) : filas;
  const col = (f, campo) => (idx[campo] !== undefined ? String(f[idx[campo]] || "").trim() : "");
  const items = [];
  cuerpo.forEach((f) => {
    const nombre = conCabecera ? col(f, "nombre") : String(f[0] || "").trim();
    if (!nombre) return;
    const it = { nombre };
    if (conCabecera) {
      const est = ESTADO_CSV[sinAcentos(col(f, "estado"))];
      if (est) it.estado = est;
      ["municipio", "direccion", "responsable", "admFincas", "contactoNombre", "telefono", "email", "subvPrograma"].forEach((campo) => {
        const v = col(f, campo);
        if (v) it[campo === "subvPrograma" ? "subTipo" : campo] = v;
      });
      const imp = numES(col(f, "importe")); if (imp) it.importe = imp;
      const cob = numES(col(f, "cobrado")); if (cob) it.cobrado = cob;
      const svi = numES(col(f, "subvImporte")); if (svi) it.subImporte = svi;
      const sve = SUB_ESTADOS.find((s) => sinAcentos(s.label) === sinAcentos(col(f, "subvEstado")));
      if (sve) it.subEstado = sve.id;
      const pri = sinAcentos(col(f, "prioridad"));
      if (["alta", "media", "baja"].includes(pri)) it.prioridad = pri;
      const tiposTxt = col(f, "tipos");
      if (tiposTxt) it.tipos = tiposTxt.split(/[\/,+|]/).map((x) => x.trim()).filter(Boolean);
      const notasPartes = [];
      const cod = col(f, "codigo"); if (cod) notasPartes.push("Presupuesto " + cod);
      const se = numES(col(f, "subEstimada"));
      if (se && !it.subImporte) notasPartes.push("Subvención estimada: " + fmtEUR(se));
      const nt = col(f, "notas"); if (nt) notasPartes.push(nt);
      if (notasPartes.length) it.notas = notasPartes.join(" · ");
    }
    items.push(it);
  });
  const detectadas = Object.keys(idx).length;
  return {
    items,
    info: conCabecera
      ? `${items.length} filas · ${detectadas} columnas reconocidas${idx.estado !== undefined ? " (el estado viene del archivo)" : ""}`
      : `${items.length} filas · sin cabecera reconocida: se usa la primera columna como nombre`,
  };
}
function leerArchivoTexto(file, cb) {
  const r1 = new FileReader();
  r1.onload = () => {
    let t = String(r1.result);
    if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
    if (t.includes("�")) {
      // no era UTF-8: probamos con la codificación clásica de Excel en Windows
      const r2 = new FileReader();
      r2.onload = () => { let t2 = String(r2.result); if (t2.charCodeAt(0) === 0xFEFF) t2 = t2.slice(1); cb(t2); };
      r2.readAsText(file, "windows-1252");
    } else cb(t);
  };
  r1.readAsText(file);
}

function ImportarLoteModal({ data, onClose, onCrear }) {
  const [texto, setTexto] = useState("");
  const [estadoSel, setEstadoSel] = useState("estudio");
  const [resp, setResp] = useState("");
  const [carpeta, setCarpeta] = useState(null);
  const [filasCSV, setFilasCSV] = useState({});
  const [csvInfo, setCsvInfo] = useState(null);

  const existentes = new Set(data.obras.map((o) => o.nombre.trim().toLowerCase()));
  const lineas = [...new Set(texto.split("\n").map((s) => s.trim()).filter(Boolean))];
  const nuevas = lineas.filter((n) => !existentes.has(n.toLowerCase()));
  const omitidas = lineas.length - nuevas.length;

  // De una carpeta elegida se extraen los nombres de sus subcarpetas de primer nivel
  const leerCarpeta = (files) => {
    const nombres = new Set();
    let raiz = null;
    for (const f of files) {
      const partes = (f.webkitRelativePath || "").split("/");
      if (partes.length >= 2 && !raiz) raiz = partes[0];
      if (partes.length >= 3) nombres.add(partes[1]);
    }
    const lista = [...nombres].sort((a, b) => a.localeCompare(b, "es"));
    setCarpeta(raiz ? `${raiz}: ${lista.length} carpetas detectadas` : null);
    setFilasCSV({}); setCsvInfo(null);
    setTexto(lista.join("\n"));
  };

  // De un CSV de Excel se reconocen las columnas y cada fila trae sus datos
  const leerCSV = (file) => {
    leerArchivoTexto(file, (contenido) => {
      const { items, info } = interpretarCSV(contenido);
      const mapa = {};
      items.forEach((it) => { mapa[it.nombre.toLowerCase()] = it; });
      setFilasCSV(mapa);
      setCarpeta(null);
      setCsvInfo(`${file.name}: ${info}`);
      setTexto(items.map((it) => it.nombre).join("\n"));
    });
  };

  return (
    <Modal title="Importar obras en lote" onClose={onClose} wide>
      <p className="text-sm" style={{ color: C.txt }}>
        Se crea <b>una obra por línea</b>. Puedes leer un <b>CSV de Excel</b> (reconoce solas las columnas: obra, importe,
        estado, municipio, código, subvención…), elegir una carpeta del ordenador y usar los nombres de sus subcarpetas,
        o pegar una lista directamente. Antes de crear, borra las líneas que no quieras — las que ya existan con el mismo nombre se omiten solas.
      </p>
      <div className="flex flex-wrap items-center gap-2 mt-3">
        <label className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-semibold border hover:bg-neutral-50 cursor-pointer"
          style={{ borderColor: C.line, color: C.ink }}>
          <Upload size={15} /> Elegir carpeta del ordenador
          <input type="file" webkitdirectory="" multiple className="hidden"
            onChange={(e) => { if (e.target.files && e.target.files.length) leerCarpeta(e.target.files); e.target.value = ""; }} />
        </label>
        <label className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-semibold border hover:bg-neutral-50 cursor-pointer"
          style={{ borderColor: C.line, color: C.ink }}>
          <FileText size={15} /> Leer archivo CSV (Excel)
          <input type="file" accept=".csv,text/csv,.txt" className="hidden"
            onChange={(e) => { if (e.target.files && e.target.files[0]) leerCSV(e.target.files[0]); e.target.value = ""; }} />
        </label>
        {carpeta && <Badge tone="azul">{carpeta}</Badge>}
        {csvInfo && <Badge tone="ok">{csvInfo}</Badge>}
      </div>
      <p className="text-xs mt-1.5" style={{ color: C.mut }}>
        Si el navegador pregunta si quieres “subir” los archivos, acepta tranquilo: no se sube nada a ningún sitio,
        solo se leen los nombres de las carpetas de tu ordenador. Las carpetas vacías no aparecen.
      </p>
      <textarea rows={10} className={inputCls + " mt-3"} style={{ ...inputStyle, fontSize: 13, fontFamily: "Consolas, monospace" }}
        placeholder={"C.P. Calle Ejemplo 12\nC.P. Avenida Muestra 34\n…"}
        value={texto} onChange={(e) => setTexto(e.target.value)} />
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">
        <Field label="Estado inicial para todas">
          <select className={inputCls} style={inputStyle} value={estadoSel} onChange={(e) => setEstadoSel(e.target.value)}>
            {ESTADOS_TABLERO.map((e) => <option key={e.id} value={e.id}>{e.label}</option>)}
          </select>
        </Field>
        <Field label="Responsable (opcional)">
          <select className={inputCls} style={inputStyle} value={resp} onChange={(e) => setResp(e.target.value)}>
            <option value="">Sin asignar</option>
            {data.equipo.map((c) => <option key={c}>{c}</option>)}
          </select>
        </Field>
      </div>
      <div className="flex items-center justify-between gap-2 mt-4 flex-wrap">
        <p className="text-xs font-semibold" style={{ color: nuevas.length ? C.ink : C.mut }}>
          {lineas.length === 0 ? "Sin obras que crear todavía."
            : `${nuevas.length} obra${nuevas.length === 1 ? "" : "s"} nueva${nuevas.length === 1 ? "" : "s"}`
              + (omitidas > 0 ? ` · ${omitidas} ya existe${omitidas === 1 ? "" : "n"} (se omite${omitidas === 1 ? "" : "n"})` : "")}
        </p>
        <div className="flex gap-2">
          <BtnGhost onClick={onClose}>Cancelar</BtnGhost>
          <BtnPrimary disabled={nuevas.length === 0}
            onClick={() => onCrear(nuevas.map((n) => ({ ...(filasCSV[n.toLowerCase()] || {}), nombre: n })), estadoSel, resp)}>
            <Check size={15} /> Crear {nuevas.length > 0 ? nuevas.length : ""} obras
          </BtnPrimary>
        </div>
      </div>
    </Modal>
  );
}

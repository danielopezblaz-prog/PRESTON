// Blindaje: guarda en este navegador las últimas 7 copias de los datos.
// Una al día automática y una antes de cada operación delicada (restaurar, vaciar, cargar publicados).
function guardarCopia(motivo, datos, forzar) {
  if (!datos) return;
  try {
    let lista = [];
    try { lista = JSON.parse(localStorage.getItem(KEY_COPIAS) || "[]"); } catch (e) { lista = []; }
    const hoy = new Date().toISOString().slice(0, 10);
    if (!forzar && lista.some((c) => String(c.fecha).slice(0, 10) === hoy && c.motivo === motivo)) return;
    lista.unshift({ fecha: new Date().toISOString(), motivo, n: (datos.obras || []).length, datos: JSON.stringify(datos) });
    localStorage.setItem(KEY_COPIAS, JSON.stringify(lista.slice(0, 7)));
  } catch (e) { /* sin espacio: la copia no debe romper el guardado normal */ }
}

/* ---------- guardado para todo el equipo: publicar en GitHub y mezclar por obra ---------- */
const GH_REPO = "danielopezblaz-prog/PRESTON";
const GH_RUTA = "proyecton-central.html";
const GH_RAMA = "main";

// la misma obra en dos navegadores no comparte id: se casan por código de presupuesto MÁS nombre
// (código y nombre juntos: hay notas que citan el código de otra obra y con el código solo se fundían dos en una)
function claveDeObraParaFusion(o) {
  return (codigoDeObra(o) || "") + "|" + (o.nombre || "").trim().toLowerCase();
}
// mezcla dos juegos de datos: obra a obra gana la tocada más recientemente; nadie pierde obras
function fusionarDatos(local, remoto) {
  const mapa = new Map();
  (remoto.obras || []).forEach((o) => mapa.set(claveDeObraParaFusion(o), o));
  const resumen = { localGana: 0, remotoGana: 0, soloLocal: 0, soloRemoto: mapa.size };
  (local.obras || []).forEach((o) => {
    const k = claveDeObraParaFusion(o);
    const r = mapa.get(k);
    if (!r) { mapa.set(k, o); resumen.soloLocal++; }
    else {
      resumen.soloRemoto--;
      if ((o.tocada || "") >= (r.tocada || "")) { mapa.set(k, o); resumen.localGana++; }
      else { resumen.remotoGana++; }
    }
  });
  return { datos: { ...local, obras: [...mapa.values()] }, resumen };
}

async function ghLeerArchivo(token) {
  const r = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_RUTA}?ref=${GH_RAMA}`, {
    headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" },
  });
  if (!r.ok) throw new Error("GitHub " + r.status + (r.status === 401 ? " (token mal o caducado)" : ""));
  const j = await r.json();
  const bin = atob((j.content || "").replace(/\n/g, ""));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return { sha: j.sha, texto: new TextDecoder().decode(bytes) };
}
async function ghSubirArchivo(token, texto, sha, mensaje) {
  const bytes = new TextEncoder().encode(texto);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  const r = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_RUTA}`, {
    method: "PUT",
    headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify({ message: mensaje, content: btoa(bin), sha, branch: GH_RAMA }),
  });
  if (!r.ok) throw new Error("GitHub " + r.status);
  return r.json();
}

// sube un archivo nuevo (texto ASCII) a cualquier ruta del repositorio con la misma llave del guardado

}
// cada foto se pide una sola vez por sesión; recién subida ya está en caché y sale al instante
const fotosCache = new Map();
function cargarFoto(ruta) {
  if (!fotosCache.has(ruta)) {
    const p = fetch("https://raw.githubusercontent.com/" + GH_REPO + "/" + GH_RAMA + "/" + ruta)
      .then((r) => { if (!r.ok) throw new Error("foto aún no disponible (" + r.status + ")"); return r.text(); })
      .then((t) => descifrarFoto(t, claveActual()));
    p.catch(() => fotosCache.delete(ruta));
    fotosCache.set(ruta, p);
  }
  return fotosCache.get(ruta);
}
// la foto del móvil se encoge antes de subirla: grande para ver, miniatura para las galerías
function cargarImagenDeArchivo(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => res({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("imagen ilegible")); };
    img.src = url;
  });
}
function reducirImagen(img, max, calidad) {
  const r = Math.min(1, max / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
  const w = Math.max(1, Math.round((img.naturalWidth || 1) * r));
  const h = Math.max(1, Math.round((img.naturalHeight || 1) * r));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(img, 0, 0, w, h);
  return c.toDataURL("image/jpeg", calidad);
}
async function encogerFoto(file) {
  const { img, url } = await cargarImagenDeArchivo(file);
  try { return { grande: reducirImagen(img, 1400, 0.7), mini: reducirImagen(img, 260, 0.6) }; }
  finally { URL.revokeObjectURL(url); }
}
async function subirFotoObra(token, clave, obra, file) {
  const { grande, mini } = await encogerFoto(file);
  const id = uid();
  const carpeta = "fotos-obra/" + String(codigoDeObra(obra) || obra.id).replace(/[^A-Za-z0-9_-]/g, "");
  const base = carpeta + "/" + id;
  await ghSubirFichero(token, base + ".foto", await cifrarFoto(grande, clave), "Foto de obra: " + obra.nombre);
  let miniRuta = "";
  try {
    await ghSubirFichero(token, base + ".mini", await cifrarFoto(mini, clave), "Miniatura: " + obra.nombre);
    miniRuta = base + ".mini";
  } catch (e) { /* sin miniatura se usa la grande */ }
  fotosCache.set(base + ".foto", Promise.resolve(grande));
  if (miniRuta) fotosCache.set(miniRuta, Promise.resolve(mini));
  return { id, ruta: base + ".foto", mini: miniRuta };
}

/* ---------- Catastro y geoportal de Madrid: consultas abiertas, siempre de solo lectura ---------- */
const CATASTRO_DNPLOC = "https://ovc.catastro.meh.es/OVCServWeb/OVCWcfCallejero/COVCCallejero.svc/json/Consulta_DNPLOC";
const CATASTRO_FOTO = "https://ovc.catastro.meh.es/OVCServWeb/OVCWcfLibres/OVCFotoFachada.svc/RecuperarFotoFachadaGet?ReferenciaCatastral=";
const GEOCODER_MADRID = "https://sigma.madrid.es/hosted/rest/services/GEOLOCATOR/GEOLOCALIZADOR_MADRID_VIAL_NDP/GeocodeServer/findAddressCandidates";

// "GinzoDeLimia51-53-55" → "Ginzo De Limia 51"; quita el municipio pegado al final ("-Alcalá de Henares")
function direccionDeObra(o) {
  let t = (o.direccion || o.nombre || "").trim();
  t = t.replace(/([a-záéíóúñ])([A-ZÁÉÍÓÚÑ])/g, "$1 $2");
  t = t.replace(/([A-Za-zÁÉÍÓÚáéíóúñÑ])(\d)/g, "$1 $2");
  t = t.replace(/[-–]\s*[A-Za-zÁÉÍÓÚáéíóúñÑ. ]+$/, "");
  t = t.replace(/\(.*?\)/g, " ").replace(/,/g, " ").replace(/\s+/g, " ").trim();
  return t;
}
function parseDireccionCentral(texto) {
  let dir = (texto || "").trim();
  const num = (dir.match(/(\d{1,4})/) || [])[1] || "";
  let sigla = "CL", rest = dir;
  const S = [[/^(calle|c\/|c\.)\s*/i, "CL"], [/^(avenida|avda\.?|avd\.?|av\.?)\s*/i, "AV"], [/^(plaza|pza\.?|pl\.?)\s*/i, "PZ"], [/^(paseo|pje\.?|p[ºo]\.?)\s*/i, "PS"], [/^(camino)\s*/i, "CM"], [/^(carretera|ctra\.?)\s*/i, "CR"], [/^(ronda)\s*/i, "RD"], [/^(glorieta|gta\.?)\s*/i, "GL"], [/^(traves[íi]a|trav\.?)\s*/i, "TR"]];
  for (const [re, s] of S) { if (re.test(rest)) { sigla = s; rest = rest.replace(re, "").trim(); break; } }
  const calle = rest.replace(/\d.*$/, "").replace(/,.*$/, "").trim().replace(/^(de la|de los|de las|del|de)\s+/i, "").trim();
  return { sigla, calle: calle.toUpperCase(), num };
}
function catastroExtraerCentral(obj, acc, ref) {
  if (!obj || typeof obj !== "object") return;
  if (obj.pc1 && obj.pc2 && !ref.rc) ref.rc = obj.pc1 + obj.pc2;
  if (obj.luso != null && (obj.sfc != null || obj.ant != null)) acc.push({ uso: obj.luso, sfc: +obj.sfc || 0, ant: obj.ant });
  for (const k in obj) { const v = obj[k]; if (Array.isArray(v)) v.forEach((x) => catastroExtraerCentral(x, acc, ref)); else if (v && typeof v === "object") catastroExtraerCentral(v, acc, ref); }
}
// Busca el edificio en la Sede del Catastro probando variantes de calle y sigla (validado en la calculadora)
async function catastroDeObra(obra) {
  const p = parseDireccionCentral(direccionDeObra(obra));
  if (!p.calle || !p.num) return null;
  const muni = sinAcentos((obra.municipio || "Madrid")).toUpperCase();
  const sinArt = p.calle.replace(/\b(DE\s+LAS|DE\s+LOS|DE\s+LA|DEL|DE|Y|E)\b/gi, " ").replace(/\s+/g, " ").trim();
  const calles = [...new Set([p.calle, sinArt].filter(Boolean))];
  const siglas = [...new Set([p.sigla, "CL", "AV", "PS", "PZ", "CR", "CM"])];
  const consulta = async (sigla, calle) => {
    const u = CATASTRO_DNPLOC + "?Provincia=MADRID&Municipio=" + encodeURIComponent(muni) + "&Sigla=" + sigla + "&Calle=" + encodeURIComponent(calle) + "&Numero=" + encodeURIComponent(p.num);
    const r = await fetch(u, { cache: "no-store" });
    const j = await r.json();
    const acc = [], ref = { rc: "" };
    catastroExtraerCentral(j, acc, ref);
    const root = j.consulta_dnplocResult || j;
    return { acc, rc: ref.rc, cudnp: (root.control && root.control.cudnp) || acc.length };
  };
  let hit = null;
  for (const calle of calles) { if (hit) break; const res = await consulta(p.sigla, calle); if (res.acc.length) hit = res; }
  if (!hit) { for (const sigla of siglas) { if (hit) break; for (const calle of calles) { if (hit) break; const res = await consulta(sigla, calle); if (res.acc.length) hit = res; } } }
  if (!hit) return null;
  const viv = hit.acc.filter((x) => /Residencial/i.test(x.uso));
  const loc = hit.acc.filter((x) => /Comercial|Oficina/i.test(x.uso));
  const anio = hit.acc.map((x) => Number(x.ant)).filter(Boolean).sort((a, b) => a - b)[0] || 0;
  return {
    fiable: hit.cudnp > 1 && viv.length > 0,
    viviendas: viv.length,
    locales: loc.length,
    m2Locales: Math.round(loc.reduce((a, x) => a + x.sfc, 0)),
    anio, rc: hit.rc, direccion: p,
  };
}
// El distrito de Madrid capital lo da el geocodificador del Ayuntamiento.
// Truco aprendido: hace falta el TIPO DE VÍA correcto (Calle/Avenida/Paseo) para que devuelva el distrito;
// se prueba con el primer número del portal y las tres vías más comunes hasta dar con score alto y distrito relleno.
async function distritoDeDireccion(texto) {
  const base = (() => { const m = (texto || "").match(/^(.*?\d{1,4})/); return (m ? m[1] : texto || "").trim(); })();
  if (!base) return "";
  const tieneVia = /^(calle|avenida|avda|av|paseo|plaza|pza|camino|carretera|ctra|ronda|glorieta|traves|pasaje|pje)\b/i.test(base);
  const variantes = tieneVia ? [base] : [base, "Calle " + base, "Avenida " + base, "Paseo " + base];
  for (const v of variantes) {
    try {
      const g = await fetch(GEOCODER_MADRID + "?SingleLine=" + encodeURIComponent(v) + "&outSR=4326&maxLocations=1&outFields=*&f=json", { cache: "no-store" });
      const gj = await g.json();
      const c = gj.candidates && gj.candidates[0];
      const dist = c && c.attributes && (c.attributes.DISTRITO_NOMBRE || c.attributes.DISTRITO) || "";
      if (c && (c.score || 0) >= 95 && dist) return dist;
    } catch (e) {}
  }
  return "";
}

let pdfjsCargando = null;
function cargarPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfjsCargando) return pdfjsCargando;
  pdfjsCargando = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => { try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; } catch (e) {} res(window.pdfjsLib); };
    s.onerror = () => rej(new Error("no se pudo cargar el lector de PDF"));
    document.head.appendChild(s);
  });
  return pdfjsCargando;
}
async function textoDePdf(buf) {
  const lib = await cargarPdfJs();
  const doc = await lib.getDocument({ data: buf }).promise;
  let out = "";
  for (let i = 1; i <= doc.numPages; i++) {
    const pg = await doc.getPage(i);
    const tc = await pg.getTextContent();
    const items = tc.items.map((it) => ({ s: it.str, x: it.transform[4], y: Math.round(it.transform[5]) }));
    const porY = {};
    items.forEach((it) => { (porY[it.y] = porY[it.y] || []).push(it); });
    Object.keys(porY).map(Number).sort((a, b) => b - a).forEach((y) => {
      out += porY[y].sort((a, b) => a.x - b.x).map((it) => it.s).join(" ") + "\n";
    });
  }
  return out;
}
// Saca del texto del presupuesto las cifras con nombre y apellidos (formato de la plantilla PGE)
function extraerDelPresupuesto(txt) {
  const num = (s) => { const m = s && s.match(/([0-9]{1,3}(?:\.[0-9]{3})*,[0-9]{2})/); return m ? Number(m[1].replace(/\./g, "").replace(",", ".")) : 0; };
  const linea = (re) => { const m = txt.match(re); return m ? m[0] : ""; };
  return {
    contrata: num(linea(/TOTAL\s+PRESUPUESTO\s+CONTRATA[^\n]*/i)),
    total: num(linea(/COSTE\s+TOTAL[^\n]*/i)),
    subvencionable: num(linea(/COSTE\s+DE\s+ACTUACI[ÓO]N(?:ES)?\s+SUBVENCIONABLE[^\n]*/i)),
    pem: num(linea(/TOTAL\s+EJECUCI[ÓO]N\s+MATERIAL[^\n]*/i)),
    viv: (() => { const m = txt.match(/CANTIDAD\s+DE\s+VECINOS\s+(\d{1,3})/i); return m ? Number(m[1]) : 0; })(),
  };
}

function convertirCRM(old) {
  const mapEtapa = { nuevo: "estudio", contactado: "estudio", visita: "estudio", presupuesto: "presupuesto", negociacion: "presupuesto" };
  const mapAct = { llamada: "llamada", email: "email", visita: "visita", reunion: "reunion", presupuesto: "documento", nota: "nota" };
  const acts = Array.isArray(old.actividades) ? old.actividades : [];
  const obras = (Array.isArray(old.leads) ? old.leads : []).map((l) => {
    const estado = l.estado === "ganado" ? "contratada" : l.estado === "perdido" ? "perdida" : (mapEtapa[l.etapa] || "estudio");
    const estadoDesde = l.estado === "activo" ? (l.etapaDesde || l.creado) : (l.cerrado || l.creado);
    const historial = [{ estado: "estudio", fecha: l.creado }];
    if (estado !== "estudio") historial.push({ estado, fecha: estadoDesde });
    return normalizarObra({
      id: l.id, nombre: l.entidad, direccion: l.direccion, contactoNombre: l.nombre,
      telefono: l.telefono, email: l.email, origen: l.origen,
      tipos: l.tipoObra ? [l.tipoObra] : [], responsable: l.comercial, importe: l.valor,
      estado, estadoDesde, historial, motivoPerdida: l.motivoPerdida, notas: l.notas, creado: l.creado,
      puntos: (l.proximaAccion && l.estado === "activo")
        ? [{ id: uid(), texto: l.proximaNota || "Seguimiento", fecha: l.proximaAccion, responsable: l.comercial || "", hecho: false }]
        : [],
      apuntes: acts.filter((a) => a.leadId === l.id).map((a) => ({
        id: a.id || uid(), tipo: mapAct[a.tipo] || "nota", autor: a.comercial || "", texto: a.notas || "", fecha: a.fecha,
      })),
    });
  });
  return {
    obras,
    equipo: Array.isArray(old.comerciales) ? old.comerciales : [],
    config: { objetivoMensual: Number(old.config && old.config.objetivoMensual) || 0 },
  };
}

/* ---------- semáforo de salud: verde / ámbar / rojo calculado solo ---------- */
function saludObra(o) {
  const hoy = hoyYMD();
  const motivos = [];
  let nivel = 0; // 0 verde · 1 ámbar · 2 rojo
  const marca = (n, m) => { if (n > nivel) nivel = n; motivos.push(m); };
  if (!o.archivada && o.estado !== "perdida") {
    const venc = puntosPend(o).filter((p) => p.fecha && p.fecha < hoy).length
      + reqsPend(o).filter((r) => r.fechaLimite && r.fechaLimite < hoy).length;
    if (venc > 0) marca(2, venc + (venc === 1 ? " punto vencido" : " puntos vencidos"));
    if (o.subEstado === "solicitar" && o.subLimite) {
      const d = diasHasta(o.subLimite);
      if (d < 0) marca(2, "plazo de subvención vencido hace " + (-d) + " días");
      else if (d <= 7) marca(2, "quedan " + d + " días para pedir la subvención");
      else if (d <= 30) marca(1, "subvención: " + d + " días de plazo");
    }
    const sinMov = daysSince(ultimoMovimiento(o));
    if (["contratada", "ejecucion"].includes(o.estado) && sinMov > 30) marca(2, "obra firmada parada " + sinMov + " días");
    else if (esActiva(o) && sinMov > 14) marca(1, "sin movimiento " + sinMov + " días");
    if (esActiva(o) && puntosPend(o).length === 0) marca(1, "sin próximo paso");
    if (o.estado === "presupuesto" && daysSince(o.estadoDesde) > 30) marca(1, "presupuesto " + daysSince(o.estadoDesde) + " días sin respuesta");
    if (["contratada", "ejecucion"].includes(o.estado) && !o.importe) marca(1, "sin importe apuntado");
    if (o.estado === "finalizada" && o.importe > 0 && (o.cobrado || 0) < o.importe) marca(1, "pendiente de cobro");
  }
  return { nivel: nivel === 2 ? "rojo" : nivel === 1 ? "ambar" : "verde", motivos };
}
function PuntoSalud({ obra, size = 10 }) {
  const s = saludObra(obra);

// cadencia de seguimiento del presupuesto: llamadas a 7, 21 y 45 días

// al entrar en un estado: se programa la cadencia (si pasa a presupuesto), se cierran
// los seguimientos automáticos al salir, y se añaden los requerimientos típicos de la fase
function aplicarAutomatismos(o, estadoNuevo) {
  let puntos = o.puntos;
  if (estadoNuevo === "presupuesto" && !puntos.some((p) => p.auto === "seg" && !p.hecho)) {
    puntos = [...puntos, ...puntosSeguimiento()];
  }
  if (estadoNuevo !== "presupuesto") {
    puntos = puntos.map((p) => p.auto === "seg" && !p.hecho ? { ...p, hecho: true, fechaHecho: new Date().toISOString() } : p);
  }
  // nota: la condición de arriba mira solo seguimientos PENDIENTES, así al reenviar
  // un presupuesto modificado se programa una cadencia nueva aunque hubiera una antigua cerrada
  // al entrar en ejecución arranca la rueda de certificaciones (al marcar una se programa sola la siguiente)
  if (estadoNuevo === "ejecucion" && !puntos.some((p) => p.auto === "cert" && !p.hecho)) {
    puntos = [...puntos, { id: uid(), texto: "Pasar la certificación nº 1", fecha: ymdMas(30), responsable: "", hecho: false, auto: "cert" }];
  }
  // al finalizar, cita a los 11 meses para cerrar la garantía antes de que venza el año
  if (estadoNuevo === "finalizada" && !puntos.some((p) => p.auto === "gar")) {
    puntos = [...puntos, { id: uid(), texto: "Revisión de fin de garantía y soltar la retención", fecha: ymdMas(330), responsable: "", hecho: false, auto: "gar" }];
  }
  // requerimientos de la fase, con fecha límite automática donde el plazo es conocido
  const PLAZOS_REQS = { "Licencia de obras": 30, "Plan de seguridad": 21, "Aviso a vecinos": 15, "Acta de inicio": 7 };
  const faltan = (REQS_SUGERIDOS[estadoNuevo] || []).filter((s) => !o.requerimientos.some((r) => r.texto === s));
  let requerimientos = faltan.length
    ? [...o.requerimientos, ...faltan.map((s) => ({ id: uid(), texto: s, fechaLimite: PLAZOS_REQS[s] ? ymdMas(PLAZOS_REQS[s]) : "", hecho: false, auto: true }))]
    : o.requerimientos;
  // CAE: sin convenio firmado ANTES de empezar no hay certificados (RD 36/2023) — que no se olvide al firmar
  const REQ_CAE = "Firmar el convenio CAE ANTES de empezar la obra";
  if (estadoNuevo === "contratada" && /CAE/i.test(o.subTipo || "") && !requerimientos.some((r) => r.texto === REQ_CAE)) {
    requerimientos = [...requerimientos, { id: uid(), texto: REQ_CAE, fechaLimite: ymdMas(21), hecho: false, auto: true }];
  }
  // al arrancar la ejecución queda apuntada la fecha de inicio (editable en el cuaderno de obra)
  const arranque = estadoNuevo === "ejecucion" && !o.fechaInicio ? { fechaInicio: hoyYMD() } : {};
  return { ...o, ...arranque, puntos, requerimientos };
}

// Centro de avisos: cada aviso lleva nivel (rojo > ambar > azul), texto, obra
// y "para" (la persona a la que le toca: responsable del punto o de la obra)
function calcularAvisos(data) {
  const hoy = hoyYMD();
  const avisos = [];
  data.obras.filter((o) => !o.archivada && o.estado !== "perdida").forEach((o) => {
    const resp = o.responsable || "";
    // a quién le salta lo de esta obra: responsable + quienes intervienen
    const cuadrilla = [resp].concat(o.colaboradores || []).filter(Boolean).filter((v, i, arr) => arr.indexOf(v) === i);
    puntosPend(o).forEach((p) => {
      const para = p.responsable ? [p.responsable] : cuadrilla;
      if (p.fecha && p.fecha < hoy) avisos.push({ id: `pv_${o.id}_${p.id}`, nivel: "rojo", grupo: "Vencido", texto: p.texto, detalle: `desde ${fmtDia(p.fecha)}`, obraId: o.id, obra: o.nombre, para });
      else if (p.fecha === hoy) avisos.push({ id: `ph_${o.id}_${p.id}`, nivel: "ambar", grupo: "Hoy", texto: p.texto, detalle: "para hoy", obraId: o.id, obra: o.nombre, para });
    });
    reqsPend(o).forEach((r) => {
      if (r.fechaLimite && r.fechaLimite < hoy) avisos.push({ id: `rv_${o.id}_${r.id}`, nivel: "rojo", grupo: "Vencido", texto: `Requerimiento: ${r.texto}`, detalle: `desde ${fmtDia(r.fechaLimite)}`, obraId: o.id, obra: o.nombre, para: cuadrilla });
      else if (r.fechaLimite === hoy) avisos.push({ id: `rh_${o.id}_${r.id}`, nivel: "ambar", grupo: "Hoy", texto: `Requerimiento: ${r.texto}`, detalle: "para hoy", obraId: o.id, obra: o.nombre, para: cuadrilla });
    });
    // plazo de la subvención: avisa con 30 días, aprieta con 7 y grita si venció
    if (o.subEstado === "solicitar" && o.subLimite) {
      const d = diasHasta(o.subLimite);
      const dinero = o.subImporte ? fmtEUR(o.subImporte) + " en juego" : "pon el importe en la ficha";
      if (d < 0) avisos.push({ id: `sl_${o.id}`, nivel: "rojo", grupo: "Vencido", texto: `Plazo de subvención VENCIDO hace ${-d} día${d === -1 ? "" : "s"}`, detalle: dinero, obraId: o.id, obra: o.nombre, para: cuadrilla });
      else if (d === 0) avisos.push({ id: `sl_${o.id}`, nivel: "rojo", grupo: "Hoy", texto: "El plazo de la subvención termina HOY", detalle: dinero, obraId: o.id, obra: o.nombre, para: cuadrilla });
      else if (d <= 7) avisos.push({ id: `sl_${o.id}`, nivel: "rojo", grupo: "Atención", texto: `Quedan ${d} día${d === 1 ? "" : "s"} para solicitar la subvención`, detalle: dinero, obraId: o.id, obra: o.nombre, para: cuadrilla });
      else if (d <= 30) avisos.push({ id: `sl_${o.id}`, nivel: "ambar", grupo: "Atención", texto: `Subvención: ${d} días de plazo para solicitarla`, detalle: dinero, obraId: o.id, obra: o.nombre, para: cuadrilla });
    }
    // presupuesto devuelto por María para modificar: que les salte a César, Dani y David
    if (o.estado === "estudio" && o.fase === "actualizacion")
      avisos.push({ id: `md_${o.id}`, nivel: "ambar", grupo: "Atención",
        texto: "Modificación del presupuesto pedida" + (o.modificacion && o.modificacion.texto ? ": " + String(o.modificacion.texto).slice(0, 70) : ""),
        detalle: "en Actualizaciones del tablero", obraId: o.id, obra: o.nombre, para: cuadrilla,
        marca: (o.modificacion && o.modificacion.fecha) || "" });
    // corrección entregada de vuelta: que le salte a María
    if (o.estado === "estudio" && o.fase === "enviado" && o.bandeja === "reenviado")
      avisos.push({ id: `mr_${o.id}`, nivel: "ambar", grupo: "Atención",
        texto: "Presupuesto corregido: listo para reenviar",
        detalle: "en Actualizaciones recibidas de tu tablero", obraId: o.id, obra: o.nombre, para: cuadrilla,
        marca: o.bandejaFecha || "" });
    // cuaderno de obra: incidencias abiertas, obra parada y plazo pasado, a la vista de todos
    if (["ejecucion", "finalizada"].includes(o.estado)) {
      (o.seguimiento || []).filter((s) => s.tipo === "incidencia" && !s.resuelta).forEach((s) => {
        avisos.push({ id: `in_${o.id}_${s.id}`, nivel: "rojo", grupo: "Atención",
          texto: "Incidencia abierta en obra: " + String(s.texto || "").slice(0, 70),
          detalle: (s.quien ? "de " + s.quien + " · " : "") + fmtFecha(s.fecha), obraId: o.id, obra: o.nombre, para: cuadrilla,
          marca: s.fecha || "" });
      });
    }
    if (o.estado === "ejecucion") {
      if (o.marcha === "parada")
        avisos.push({ id: `ob_${o.id}`, nivel: "rojo", grupo: "Atención", texto: "Obra PARADA" + (o.marchaNota ? ": " + String(o.marchaNota).slice(0, 70) : ""),
          detalle: "márcala En marcha cuando arranque", obraId: o.id, obra: o.nombre, para: cuadrilla, marca: o.marchaFecha || "" });
      const fin = finPrevistoDe(o);
      if (fin && fin < hoy && o.avance < 100)
        avisos.push({ id: `pl_${o.id}`, nivel: "ambar", grupo: "Atención", texto: `Plazo de obra pasado (fin previsto ${fmtDia(fin)})`,
          detalle: "ajusta el plazo en el cuaderno o cierra la obra", obraId: o.id, obra: o.nombre, para: cuadrilla });
    }
    // presupuesto recién entregado a María: pendiente de enviarlo a la comunidad
    if (o.estado === "estudio" && o.fase === "enviado" && !o.bandeja)
      avisos.push({ id: `en_${o.id}`, nivel: "ambar", grupo: "Atención",
        texto: "Presupuesto entregado: pendiente de enviar",
        detalle: "en Entrada · para enviar del tablero", obraId: o.id, obra: o.nombre, para: cuadrilla,
        marca: o.bandejaFecha || "" });
    if (esActiva(o)) {
      if (puntosPend(o).length === 0)
        avisos.push({ id: `sp_${o.id}`, nivel: "ambar", grupo: "Atención", texto: "Sin próximo paso definido", detalle: "añade un punto con fecha", obraId: o.id, obra: o.nombre, para: cuadrilla });
      const dias = daysSince(ultimoMovimiento(o));
      if (dias > 14)
        avisos.push({ id: `sm_${o.id}`, nivel: "ambar", grupo: "Atención", texto: `Sin movimiento desde hace ${dias} días`, detalle: "apunta el último avance", obraId: o.id, obra: o.nombre, para: cuadrilla });
      if (o.estado === "presupuesto" && daysSince(o.estadoDesde) > 21)
        avisos.push({ id: `pe_${o.id}`, nivel: "azul", grupo: "Seguimiento", texto: `Presupuesto sin respuesta (${daysSince(o.estadoDesde)} días)`, detalle: "llama al administrador", obraId: o.id, obra: o.nombre, para: cuadrilla });
      // regla de oro del Plan Estatal: empezar la obra antes de registrar la solicitud puede perder la ayuda
      if (o.subEstado === "solicitar" && o.estado === "contratada")
        avisos.push({ id: `su_${o.id}`, nivel: "ambar", grupo: "Atención", texto: "Registrar la solicitud de subvención ANTES de empezar la obra", detalle: (o.subImporte ? fmtEUR(o.subImporte) + " en juego · " : "") + "empezar antes puede perderla", obraId: o.id, obra: o.nombre, para: cuadrilla });
      if (o.subEstado === "solicitar" && o.estado === "ejecucion")
        avisos.push({ id: `su_${o.id}`, nivel: "rojo", grupo: "Atención", texto: "Obra en marcha con la subvención SIN solicitar", detalle: (o.subImporte ? fmtEUR(o.subImporte) + " en riesgo · " : "") + "registrarla ya o darla por imposible", obraId: o.id, obra: o.nombre, para: cuadrilla });
      if (o.subEstado === "no" && o.estado === "contratada" && !o.subImporte)
        avisos.push({ id: `sd_${o.id}`, nivel: "azul", grupo: "Seguimiento", texto: "Obra firmada sin subvención decidida", detalle: "¿se pide ayuda? — el tramo se elige en su ficha", obraId: o.id, obra: o.nombre, para: cuadrilla });
      if (["contratada", "ejecucion"].includes(o.estado) && !o.importe)
        avisos.push({ id: `si_${o.id}`, nivel: "ambar", grupo: "Atención", texto: "Obra firmada sin importe apuntado", detalle: "ponlo en Editar datos", obraId: o.id, obra: o.nombre, para: cuadrilla });
      if (SUB_EN_JUEGO.includes(o.subEstado) && !o.subImporte)
        avisos.push({ id: `sv_${o.id}`, nivel: "azul", grupo: "Seguimiento", texto: "Subvención sin importe definido", detalle: "apunta cuánto se pide", obraId: o.id, obra: o.nombre, para: cuadrilla });
    }
    if (o.estado === "finalizada" && o.importe > 0 && (o.cobrado || 0) < o.importe)
      avisos.push({ id: `co_${o.id}`, nivel: "azul", grupo: "Seguimiento", texto: `Pendiente de cobro: ${fmtEUR(o.importe - (o.cobrado || 0))}`, detalle: "obra terminada sin cobrar del todo", obraId: o.id, obra: o.nombre, para: cuadrilla });
  });
  // datos incompletos, agrupados en una sola línea para no inundar
  const activasTodas = data.obras.filter((o) => !o.archivada && ACTIVOS.includes(o.estado));
  const sinImporte = activasTodas.filter((o) => !o.importe && !["contratada", "ejecucion"].includes(o.estado));
  if (sinImporte.length)
    avisos.push({ id: "agg_imp", nivel: "azul", grupo: "Seguimiento", texto: `${sinImporte.length} obra${sinImporte.length === 1 ? "" : "s"} del pipeline sin importe`, detalle: "se completan desde su ficha", obraId: sinImporte.length === 1 ? sinImporte[0].id : null, obra: "Datos incompletos", para: [] });
  const sinContacto = activasTodas.filter((o) => !o.telefono && !o.email && !o.contactoNombre && !o.admFincas);
  if (sinContacto.length)
    avisos.push({ id: "agg_cto", nivel: "azul", grupo: "Seguimiento", texto: `${sinContacto.length} obra${sinContacto.length === 1 ? "" : "s"} activa${sinContacto.length === 1 ? "" : "s"} sin ningún contacto`, detalle: "sin teléfono no hay seguimiento posible", obraId: sinContacto.length === 1 ? sinContacto[0].id : null, obra: "Datos incompletos", para: [] });
  const orden = { rojo: 0, ambar: 1, azul: 2 };
  avisos.sort((a, b) => orden[a.nivel] - orden[b.nivel]);
  return avisos;
}

// Agenda global: puntos y requerimientos pendientes de todas las obras vivas
function calcularAgenda(data) {
  const items = [];
  data.obras.filter((o) => !o.archivada && o.estado !== "perdida").forEach((o) => {
    const cuadrilla = [o.responsable || ""].concat(o.colaboradores || []).filter(Boolean);
    puntosPend(o).forEach((p) => items.push({
      clase: "punto", obraId: o.id, obra: o.nombre, estado: o.estado, id: p.id, texto: p.texto, fecha: p.fecha || "",
      responsable: p.responsable || o.responsable || "",
      implicados: p.responsable ? [p.responsable] : cuadrilla,
    }));
    reqsPend(o).filter((r) => r.fechaLimite).forEach((r) => items.push({
      clase: "req", obraId: o.id, obra: o.nombre, estado: o.estado, id: r.id, texto: r.texto, fecha: r.fechaLimite,
      responsable: o.responsable || "", implicados: cuadrilla,
    }));
  });
  return items;
}

/* ============================ CENTRO DE AVISOS ============================ */
function ListaAvisos({ avisos, onOpen, compacta, quien }) {
  const [modo, setModo] = useState(quien ? "mios" : "todos");
  const mios = quien ? avisos.filter((a) => (a.para || []).includes(quien)) : [];
  const visibles = (modo === "mios" && quien) ? mios : avisos;
  const grupos = [
    { nivel: "rojo", titulo: "Vencido", tone: "red", Icon: AlertTriangle },
    { nivel: "ambar", titulo: "Atención", tone: "warn", Icon: Clock },
    { nivel: "azul", titulo: "Seguimiento", tone: "azul", Icon: Bell },
  ];
  const conmutador = quien ? (
    <div className="flex gap-1.5 mb-3">
      <button onClick={() => setModo("mios")}
        className="px-2.5 py-1 rounded-full text-xs font-bold border transition-colors"
        style={modo === "mios" ? { background: C.ink, color: "#fff", borderColor: C.ink } : { background: "#fff", color: C.ink, borderColor: C.line }}>
        Míos ({mios.length})
      </button>
      <button onClick={() => setModo("todos")}
        className="px-2.5 py-1 rounded-full text-xs font-bold border transition-colors"
        style={modo === "todos" ? { background: C.ink, color: "#fff", borderColor: C.ink } : { background: "#fff", color: C.ink, borderColor: C.line }}>
        Equipo ({avisos.length})
      </button>
    </div>
  ) : null;
  if (visibles.length === 0) {
    return (
      <div>
        {conmutador}
        <div className="flex items-center gap-2 py-3">
          <CircleCheck size={18} style={{ color: C.ok }} />
          <p className="text-sm font-semibold" style={{ color: C.ink }}>
            {modo === "mios" && quien ? `Todo al día, ${quien}: no tienes avisos pendientes.` : "Todo al día. Ninguna obra necesita atención inmediata."}
          </p>
        </div>
      </div>
    );
  }
  // una línea por obra: todos sus avisos juntos, colocada en el grupo de su aviso más grave
  // (antes la misma obra salía repetida una vez por cada problema)
  const RANGO_NIVEL = { rojo: 0, ambar: 1, azul: 2 };
  const porObra = [];
  const indice = {};
  visibles.forEach((a) => {
    if (!a.obraId) { porObra.push({ clave: a.id, obraId: null, obra: a.obra, nivel: a.nivel, avisos: [a], para: a.para || [] }); return; }
    let g = indice[a.obraId];
    if (!g) { g = indice[a.obraId] = { clave: "o_" + a.obraId, obraId: a.obraId, obra: a.obra, nivel: a.nivel, avisos: [], para: [] }; porObra.push(g); }
    g.avisos.push(a);
    if (RANGO_NIVEL[a.nivel] < RANGO_NIVEL[g.nivel]) g.nivel = a.nivel;
    (a.para || []).forEach((p) => { if (!g.para.includes(p)) g.para.push(p); });
  });
  porObra.forEach((g) => g.avisos.sort((x, y) => RANGO_NIVEL[x.nivel] - RANGO_NIVEL[y.nivel]));
  const colorNivel = (n) => n === "rojo" ? C.red : n === "ambar" ? C.warn : C.azul;
  const MAX_COMPACTA = 6;
  return (
    <div>
      {conmutador}
      <div className="space-y-3">
        {grupos.map((g) => {
          const lista = porObra.filter((x) => x.nivel === g.nivel).sort((a, b) => b.avisos.length - a.avisos.length);
          if (!lista.length) return null;
          const nAvisos = lista.reduce((s, x) => s + x.avisos.length, 0);
          const mostrar = compacta ? lista.slice(0, MAX_COMPACTA) : lista;
          return (
            <div key={g.nivel}>
              <p className="text-xs font-bold uppercase tracking-wider mb-1.5 inline-flex items-center gap-1.5" style={{ color: C.mut }}>
                <g.Icon size={13} /> {g.titulo} <Badge tone={g.tone}>{lista.length}</Badge>
                <span className="font-semibold normal-case tracking-normal">{lista.length === 1 ? "obra" : "obras"}{nAvisos > lista.length ? ` · ${nAvisos} avisos` : ""}</span>
              </p>
              <div className="space-y-0.5">
                {mostrar.map((x) => {
                  const Fila = x.obraId ? "button" : "div";
                  return (
                    <Fila key={x.clave} onClick={x.obraId ? () => onOpen(x.obraId) : undefined}
                      className={`w-full flex items-start gap-2 px-2 py-1.5 rounded-lg text-left ${x.obraId ? "hover:bg-neutral-50 cursor-pointer" : ""}`}>
                      <span className="w-1.5 h-1.5 rounded-full flex-shrink-0 mt-2" style={{ background: colorNivel(x.nivel) }} />
                      <span className="min-w-0 flex-1">
                        <span className="flex items-center gap-1.5 min-w-0">
                          <span className="text-sm font-semibold truncate" style={{ color: C.ink }}>{x.obra}</span>
                          {x.avisos.length > 1 && (
                            <span className="text-xs font-bold px-1.5 rounded-full flex-shrink-0" style={{ background: C.bone, color: C.mut }}
                              title={x.avisos.length + " avisos en esta obra"}>{x.avisos.length}</span>
                          )}
                        </span>
                        {compacta ? (
                          <span className="block text-xs truncate" style={{ color: C.txt }} title={x.avisos.map((a) => a.texto).join(" · ")}>
                            {x.avisos.map((a) => a.texto).join(" · ")}
                          </span>
                        ) : x.avisos.map((a) => (
                          <span key={a.id} className="flex items-center gap-1.5 text-xs" style={{ color: C.txt }}>
                            <span className="w-1 h-1 rounded-full flex-shrink-0" style={{ background: colorNivel(a.nivel) }} />
                            <span className="truncate">{a.texto}</span>
                            {a.detalle && <span className="hidden sm:inline flex-shrink-0" style={{ color: C.mut }}>· {a.detalle}</span>}
                          </span>
                        ))}
                      </span>
                      {modo === "todos" && x.para.length > 0 && (
                        <span className="inline-flex items-center gap-0.5 flex-shrink-0">
                          <Avatar nombre={x.para[0]} size={6} />
                          {x.para.length > 1 && <span className="text-xs font-bold" style={{ color: C.mut }}>+{x.para.length - 1}</span>}
                        </span>
                      )}
                    </Fila>
                  );
                })}
                {compacta && lista.length > MAX_COMPACTA && (
                  <p className="text-xs px-2" style={{ color: C.mut }}>… y {lista.length - MAX_COMPACTA} obras más (todas en la campana de arriba)</p>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================ PANEL (el corazón) ============================ */
function PanelView({ data, avisos, onOpen, onNueva, onOpenAjustes, onIrAgenda, onIrTablero, onRepaso, addApunte, toast, togglePendiente, quien, admin, onCambiarQuien }) {
  const obras = data.obras.filter((o) => !o.archivada);
  const activas = obras.filter((o) => ACTIVOS.includes(o.estado));
  const now = new Date();

  if (data.obras.length === 0) {
    return (
      <EmptyHint icon={LayoutDashboard} title="La Central de Obras está lista"
        text="Aquí verás cada obra con su estado, sus apuntes, sus requerimientos y sus avisos, todo en un mismo sitio. Crea la primera obra o restaura una copia de seguridad desde Ajustes."
        action={<BtnPrimary onClick={onNueva}><Plus size={16} /> Crear la primera obra</BtnPrimary>} />
    );
  }

  const pipeline = obras.filter((o) => ["estudio", "presupuesto"].includes(o.estado));
  // lo enviado hace más de 90 días sin respuesta cuenta aparte: es dinero dormido, no pipeline de verdad
  const pipeDormido = pipeline.filter((o) => o.estado === "presupuesto" && daysSince(o.estadoDesde) > 90);
  const pipeVivo = pipeline.filter((o) => !pipeDormido.includes(o));
  const cartera = obras.filter((o) => ["contratada", "ejecucion"].includes(o.estado));
  const enEjecucion = obras.filter((o) => o.estado === "ejecucion");
  const subEnJuego = obras.filter((o) => SUB_EN_JUEGO.includes(o.subEstado)).reduce((s, o) => s + o.subImporte, 0);
  const rojos = avisos.filter((a) => a.nivel === "rojo").length;
  const paraHoy = avisos.filter((a) => a.grupo === "Hoy").length;

  // los números personales de quien usa este navegador
  const hoyStr = hoyYMD();
  const misPuntos = quien ? activas.flatMap((o) => puntosPend(o).filter((p) =>
    p.responsable ? p.responsable === quien : (o.responsable === quien || (o.colaboradores || []).includes(quien)))) : [];
  const misHoy = misPuntos.filter((p) => p.fecha === hoyStr).length;
  const misVencidos = misPuntos.filter((p) => p.fecha && p.fecha < hoyStr).length;
  const misObras = quien ? activas.filter((o) => o.responsable === quien).length : 0;
  const misSinFecha = misPuntos.filter((p) => !p.fecha).length;

  // el día de la persona, con nombre y apellidos: lo vencido y lo de hoy, listo para tachar
  const miDia = quien ? calcularAgenda(data)
    .filter((i) => i.fecha && i.fecha <= hoyStr)
    .filter((i) => (i.implicados || []).includes(quien))
    .sort((a, b) => a.fecha.localeCompare(b.fecha))
    .slice(0, 6) : [];

  // la fábrica de presupuestos en una tira: cuántos hay en cada mesa
  const mesaN = (cond) => { const col = obras.filter(cond); return { n: col.length, v: col.reduce((s, o) => s + o.importe, 0) }; };
  const fabrica = [
    { id: "entrada", label: "Entrada", color: "#8B8B90", ...mesaN((o) => o.estado === "estudio" && !o.fase) },
    { id: "proceso", label: "En proceso", color: "#2A78D6", ...mesaN((o) => o.estado === "estudio" && o.fase === "proceso") },
    { id: "revision", label: "Revisión", color: "#C9A227", ...mesaN((o) => o.estado === "estudio" && o.fase === "revision") },
    { id: "correccion", label: "Corrigiendo", color: "#A32C24", ...mesaN((o) => o.estado === "estudio" && o.fase === "actualizacion") },
    { id: "maria", label: "Con María", color: "#4A3AA7", ...mesaN((o) => o.estado === "estudio" && o.fase === "enviado") },
    { id: "enviados", label: "Enviados", color: "#B7791F", ...mesaN((o) => o.estado === "presupuesto") },
  ];

  // objetivo del mes: contratado (primer paso a "contratada") dentro del mes actual
  const esEsteMes = (iso) => { const d = new Date(iso); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); };
  const contratadasMes = data.obras.filter((o) => { const f = primeraFechaEstado(o, "contratada"); return f && esEsteMes(f); });
  const valorMes = contratadasMes.reduce((s, o) => s + o.importe, 0);
  const objetivo = data.config.objetivoMensual || 0;

  // contratado por mes (últimos 6)
  const meses = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    meses.push({ key: `${d.getFullYear()}-${d.getMonth()}`, mes: d.toLocaleDateString("es-ES", { month: "short" }), valor: 0 });
  }
  data.obras.forEach((o) => {
    const f = primeraFechaEstado(o, "contratada");
    if (!f) return;
    const d = new Date(f);
    const m = meses.find((x) => x.key === `${d.getFullYear()}-${d.getMonth()}`);
    if (m) m.valor += o.importe;
  });

  // cartera por estado
  const porEstado = ESTADOS_TABLERO.map((e) => {
    const col = obras.filter((o) => o.estado === e.id);
    return { e, n: col.length, v: col.reduce((s, o) => s + o.importe, 0) };
  });
  const maxEstadoV = Math.max(1, ...porEstado.map((x) => x.v));

  // agenda de la semana
  const hoy = hoyYMD(), semana = ymdMas(7);
  const agenda = calcularAgenda(data).filter((i) => i.fecha && i.fecha <= semana).sort((a, b) => a.fecha.localeCompare(b.fecha)).slice(0, 8);

  // lo que nadie ve: los presupuestos que más tiempo llevan esperando respuesta
  const esperando = obras.filter((o) => o.estado === "presupuesto")
    .sort((a, b) => a.estadoDesde.localeCompare(b.estadoDesde)).slice(0, 3);

  // actividad reciente
  const recientes = obras.flatMap((o) => o.apuntes.map((a) => ({ ...a, obra: o.nombre, obraId: o.id })))
    .sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 6);

  // carga del equipo
  const carga = data.equipo.map((m) => {
    const mias = activas.filter((o) => o.responsable === m);
    const pts = activas.flatMap((o) => puntosPend(o).filter((p) => (p.responsable || o.responsable) === m));
    return { m, obras: mias.length, puntos: pts.length, vencidos: pts.filter((p) => p.fecha && p.fecha < hoy).length };
  }).filter((x) => x.obras > 0 || x.puntos > 0);

  const sinPasoN = avisos.filter((a) => String(a.id).indexOf("sp_") === 0).length;
  const sinMovN = avisos.filter((a) => String(a.id).indexOf("sm_") === 0).length;
  const porPersona = admin ? data.equipo.map((m) => ({
    m, n: avisos.filter((a) => (a.para || []).includes(m) && (a.nivel === "rojo" || a.grupo === "Hoy")).length,
  })) : [];

  return (
    <div className="space-y-5">
      {/* modo administrador: el pulso de todo el equipo */}
      {admin && (
        <Card style={{ borderLeftWidth: 3, borderLeftColor: C.ink }}>
          <div className="flex flex-wrap items-center gap-3">
            <div className="w-10 h-10 rounded-full flex items-center justify-center text-white flex-shrink-0" style={{ background: C.ink }}>
              <Bell size={18} />
            </div>
            <div className="flex-1" style={{ minWidth: "14rem" }}>
              <p className="text-lg font-extrabold" style={{ color: C.ink }}>Modo administrador</p>
              <p className="text-sm" style={{ color: C.txt }}>
                {rojos > 0 && <b style={{ color: C.redDark }}>{rojos} vencido{rojos === 1 ? "" : "s"} · </b>}
                {paraHoy} para hoy · {sinPasoN} sin próximo paso · {sinMovN} sin movimiento
              </p>
            </div>
            <div className="flex flex-wrap gap-1.5" title="Avisos urgentes de cada persona">
              {porPersona.map((x) => (
                <span key={x.m} className="inline-flex items-center gap-1.5 pl-1 pr-2 py-1 rounded-full border text-xs font-bold"
                  style={{ borderColor: C.line, color: x.n > 0 ? C.redDark : C.mut }}>
                  <Avatar nombre={x.m} /> {x.n}
                </span>
              ))}
            </div>
          </div>
        </Card>
      )}

      {/* tu día: lo tuyo de hoy, listo para tachar */}
      {quien && (
        <Card style={{ borderLeftWidth: 3, borderLeftColor: misVencidos > 0 ? C.red : C.ok }}>
          <div className="flex flex-wrap items-center gap-3">
            <Avatar nombre={quien} size={10} />
            <div className="flex-1" style={{ minWidth: "14rem" }}>
              <p className="text-lg font-extrabold" style={{ color: C.ink }}>Hola, {quien}</p>
              <p className="text-sm" style={{ color: C.txt }}>
                {misVencidos > 0 && <b style={{ color: C.redDark }}>{misVencidos} vencido{misVencidos === 1 ? "" : "s"} · </b>}
                {misHoy} para hoy · {misObras} obra{misObras === 1 ? "" : "s"} tuya{misObras === 1 ? "" : "s"} activa{misObras === 1 ? "" : "s"}
                {misSinFecha > 0 ? ` · ${misSinFecha} puntos sin fecha` : ""}
              </p>
            </div>
            <BtnPrimary onClick={onIrAgenda}><CalendarDays size={15} /> Mi agenda</BtnPrimary>
            <BtnGhost onClick={onCambiarQuien}>Cambiar</BtnGhost>
          </div>
          {miDia.length > 0 && (
            <div className="mt-3 pt-3 border-t space-y-0.5" style={{ borderColor: C.line }}>
              {miDia.map((i) => (
                <div key={`${i.clase}_${i.obraId}_${i.id}`} className="flex items-center gap-2.5 px-1 py-1 rounded-lg hover:bg-neutral-50 group">
                  <button onClick={() => togglePendiente && togglePendiente(i.obraId, i.clase, i.id)} title="Marcar como hecho"
                    className="w-5 h-5 rounded-md border-2 flex-shrink-0 flex items-center justify-center hover:border-current transition-colors"
                    style={{ borderColor: i.fecha < hoyStr ? C.red : C.warn, color: C.ok }}>
                    <Check size={13} className="opacity-0 group-hover:opacity-60" />
                  </button>
                  <Badge tone={i.fecha < hoyStr ? "red" : "warn"}>{i.fecha < hoyStr ? "vencido" : "hoy"}</Badge>
                  <button onClick={() => onOpen(i.obraId)} className="flex-1 min-w-0 text-left flex items-center gap-2">
                    <span className="text-sm truncate" style={{ color: C.ink }}>{i.texto}</span>
                    <span className="text-xs font-semibold truncate flex-shrink-0 max-w-36" style={{ color: C.mut }}>{i.obra}</span>
                  </button>
                </div>
              ))}
            </div>
          )}
          {miDia.length === 0 && (
            <p className="mt-3 pt-3 border-t text-sm" style={{ borderColor: C.line, color: C.mut }}>
              Nada vencido ni para hoy. Lo siguiente tuyo está en Mi agenda.
            </p>
          )}
        </Card>
      )}

      {/* aviso de datos viejos: si las obras vivas llevan mucho sin confirmarse, los números de abajo no valen */}
      {(() => {
        const sinRepasar = activas.filter((o) => !o.repasada || daysSince(o.repasada) > 30);
        if (sinRepasar.length < 5) return null;
        const paradas = sinRepasar.filter((o) => o.fechaDudosa || daysSince(ultimoMovimiento(o)) > 30).length;
        return (
          <Card style={{ borderColor: C.warn, background: C.warnTint }}>
            <div className="flex items-start justify-between gap-3 flex-wrap">
              <div className="min-w-0">
                <p className="text-sm font-extrabold inline-flex items-center gap-1.5" style={{ color: "#8A5A15" }}>
                  <AlertTriangle size={15} /> Hay {sinRepasar.length} obras vivas sin confirmar cómo van
                </p>
                <p className="text-xs mt-1" style={{ color: C.txt }}>
                  {paradas > 0
                    ? paradas + " de ellas llevan más de un mes sin moverse. Mientras no se repasen, el pipeline y la cartera de aquí abajo no dicen la verdad."
                    : "Repásalas de una sentada para que los números de abajo sean de fiar."}
                </p>
              </div>
              <BtnPrimary onClick={onRepaso}><ListChecks size={15} /> Ponerlas al día</BtnPrimary>
            </div>
          </Card>
        );
      })()}

      {/* KPIs: cuatro números que mandan */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <KPI label="Contratado este mes" value={fmtEUR(valorMes)} accent={objetivo > 0 && valorMes >= objetivo ? C.ok : undefined}
          sub={objetivo > 0 ? `${pct(valorMes / objetivo)} del objetivo (${fmtEUR(objetivo)})` : `${contratadasMes.length} firmada${contratadasMes.length === 1 ? "" : "s"} este mes`} Icon={Target} />
        <KPI label="Pipeline vivo" value={fmtEUR(pipeVivo.reduce((s, o) => s + o.importe, 0))}
          sub={pipeDormido.length
            ? `${pipeVivo.length} en juego · ${fmtEUR(pipeDormido.reduce((s, o) => s + o.importe, 0))} dormido (${pipeDormido.length})`
            : `${pipeVivo.length} pendientes o enviadas`} Icon={FileText} />
        <KPI label="Cartera contratada" value={fmtEUR(cartera.reduce((s, o) => s + o.importe, 0))} accent={C.red} sub={`${cartera.length} firmadas · ${enEjecucion.length} en obra`} Icon={Hammer} />
        <KPI label="Subvención en juego" value={fmtEUR(subEnJuego)} sub="estimada, en trámite o por cobrar" Icon={Euro} />
      </div>

      {/* la fábrica de presupuestos, de un vistazo: toca una mesa y vas al tablero */}
      <Card>
        <div className="flex items-center justify-between gap-2 flex-wrap mb-2">
          <SectionTitle>La fábrica, ahora mismo</SectionTitle>
          <span className="text-xs" style={{ color: C.mut }}>{activas.length} obras activas</span>
        </div>
        <div className="flex items-stretch gap-1.5 overflow-x-auto pb-1">
          {fabrica.map((f, fi) => (
            <React.Fragment key={f.id}>
              {fi > 0 && <span className="self-center flex-shrink-0" style={{ color: C.mut }}><ChevronRight size={14} /></span>}
              <button onClick={onIrTablero}
                className="flex-1 min-w-[7.5rem] rounded-xl border px-3 py-2 text-left hover:shadow-md transition-shadow"
                style={{ borderColor: C.line, borderTopWidth: 3, borderTopColor: f.color, opacity: f.n === 0 ? 0.55 : 1 }}>
                <p className="text-xs font-bold uppercase tracking-wider truncate" style={{ color: C.mut }}>{f.label}</p>
                <p className="text-xl font-extrabold" style={{ color: C.ink, fontVariantNumeric: "tabular-nums" }}>{f.n}</p>
                <p className="text-xs font-semibold truncate" style={{ color: f.n ? f.color : C.mut, fontVariantNumeric: "tabular-nums" }}>{f.n ? fmtEUR(f.v) : "—"}</p>
              </button>
            </React.Fragment>
          ))}
        </div>
      </Card>

      {/* Avisos + agenda */}
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <Card className="lg:col-span-2" style={rojos ? { borderLeftWidth: 3, borderLeftColor: C.red } : {}}>
          <SectionTitle>Centro de avisos</SectionTitle>
          <ListaAvisos avisos={avisos} onOpen={onOpen} compacta quien={quien} />
        </Card>
        <Card>
          <SectionTitle right={<BtnGhost onClick={onIrAgenda} className="!px-2 !py-1 text-xs">Ver agenda</BtnGhost>}>Próximos 7 días</SectionTitle>
          {agenda.length === 0 ? (
            <p className="text-sm py-2" style={{ color: C.mut }}>Sin puntos con fecha esta semana. Ponles fecha a los siguientes pasos para que aparezcan aquí.</p>
          ) : (
            <div className="space-y-0.5">
              {agenda.map((i) => (
                <button key={`${i.clase}_${i.obraId}_${i.id}`} onClick={() => onOpen(i.obraId)}
                  className="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-neutral-50 text-left">
                  <Badge tone={i.fecha < hoy ? "red" : i.fecha === hoy ? "warn" : "neutral"}>{i.fecha < hoy ? "vencido" : fmtDia(i.fecha)}</Badge>
                  <span className="text-sm truncate flex-1" style={{ color: C.ink }}>{i.texto}</span>
                </button>
              ))}
            </div>
          )}
          {esperando.length > 0 && (
            <div className="mt-4 pt-3 border-t" style={{ borderColor: C.line }}>
              <p className="text-xs font-bold uppercase tracking-wider mb-1.5" style={{ color: C.mut }}>Esperando respuesta desde hace más</p>
              <div className="space-y-0.5">
                {esperando.map((o) => (
                  <button key={o.id} onClick={() => onOpen(o.id)} className="w-full flex items-center gap-2 px-2 py-1 rounded-lg hover:bg-neutral-50 text-left">
                    <Badge tone="warn">{daysSince(o.estadoDesde)}d</Badge>
                    <span className="text-sm truncate flex-1" style={{ color: C.ink }}>{o.nombre}</span>
                    <span className="text-xs flex-shrink-0" style={{ color: C.mut, fontVariantNumeric: "tabular-nums" }}>{fmtEUR(o.importe)}</span>
                  </button>
                ))}
              </div>
            </div>
          )}
        </Card>
      </div>

      {/* Objetivo + gráficas */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <Card>
          <SectionTitle>Cartera por estado</SectionTitle>
          <div className="space-y-2">
            {porEstado.map(({ e, n, v }) => (
              <HBar key={e.id} label={e.label} value={v} max={maxEstadoV} right={`${fmtEUR(v)} · ${n}`} fill={e.color} />
            ))}
          </div>
          <div className="mt-4 pt-3 border-t" style={{ borderColor: C.line }}>
            <div className="flex items-center justify-between gap-3 flex-wrap">
              <p className="text-xs font-bold uppercase tracking-wider inline-flex items-center gap-1.5" style={{ color: C.mut }}>
                <Target size={13} /> Objetivo del mes
              </p>
              {objetivo > 0 ? (
                <p className="text-sm font-bold" style={{ color: C.ink, fontVariantNumeric: "tabular-nums" }}>
                  {fmtEUR(valorMes)} / {fmtEUR(objetivo)}
                  <span className="ml-2" style={{ color: valorMes >= objetivo ? C.ok : C.mut }}>({pct(objetivo ? valorMes / objetivo : 0)})</span>
                </p>
              ) : (
                <BtnGhost onClick={onOpenAjustes} className="!px-2 !py-1 text-xs">Definir objetivo</BtnGhost>
              )}
            </div>
            {objetivo > 0 && <div className="mt-2"><BarraProgreso valor={(valorMes / objetivo) * 100} color={valorMes >= objetivo ? C.ok : C.red} /></div>}
          </div>
        </Card>
        <Card>
          <SectionTitle>Contratado por mes</SectionTitle>
          <GraficaMeses datos={meses} nombre="Contratado" />
        </Card>
      </div>

      {/* Obras en ejecución */}
      {enEjecucion.length > 0 && (
        <Card>
          <SectionTitle>Obras en ejecución</SectionTitle>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-3">
            {enEjecucion.sort((a, b) => b.importe - a.importe).map((o) => {
              const dias = daysSince(ultimoMovimiento(o));
              return (
                <button key={o.id} onClick={() => onOpen(o.id)} className="text-left px-2 py-1.5 -mx-2 rounded-lg hover:bg-neutral-50">
                  <div className="flex items-center justify-between gap-2 mb-1">
                    <span className="text-sm font-bold truncate" style={{ color: C.ink }}>{o.nombre}</span>
                    <span className="text-xs font-semibold flex-shrink-0" style={{ color: dias > 7 ? C.warn : C.mut }}>
                      {o.avance}% · últ. apunte hace {dias}d
                    </span>
                  </div>
                  <BarraProgreso valor={o.avance} color={C.red} />
                </button>
              );
            })}
          </div>
        </Card>
      )}

      {/* Actividad + equipo */}
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <Card className="lg:col-span-2">
          <SectionTitle>Última actividad</SectionTitle>
          <ApunteRapido data={data} addApunte={addApunte} toast={toast} />
          <div className="mt-3 space-y-2.5">
            {recientes.map((a) => {
              const { Icon, label } = apunteMeta(a.tipo);
              return (
                <button key={a.id} onClick={() => onOpen(a.obraId)} className="w-full flex gap-2.5 text-left px-1 py-0.5 rounded-lg hover:bg-neutral-50">
                  <div className="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5"
                    style={{ background: a.tipo === "incidencia" ? C.redTint : C.bone, color: a.tipo === "incidencia" ? C.red : C.ink }}>
                    <Icon size={13} />
                  </div>

function ApunteRapido({ data, addApunte, toast }) {
  const vivas = data.obras.filter((o) => !o.archivada && o.estado !== "perdida");
  const [obraId, setObraId] = useState("");

    addApunte(obraId, { tipo: "nota", autor: "", texto: texto.trim() });

    toast("Apunte guardado en el diario de la obra");

  if (vivas.length === 0) return null;

    <div className="rounded-xl border p-2.5 flex flex-col sm:flex-row gap-2" style={{ borderColor: C.line, background: C.bone }}>
      <select className={inputCls + " sm:w-56"} style={inputStyle} value={obraId} onChange={(e) => setObraId(e.target.value)}>
        <option value="">Apunte rápido en…</option>
        {vivas.map((o) => <option key={o.id} value={o.id}>{o.nombre}</option>)}
      </select>
      <input className={inputCls} style={inputStyle} placeholder="¿Qué ha pasado? Se guarda en el diario de la obra"

    </div>
  );
}

/* ============================ TABLERO (kanban) ============================ */
/* orden de las columnas del tablero: por antigüedad (con separadores) o por importe */
const KEY_ORDEN_TABLERO = "proyecton-central-orden-tablero";
const TRAMOS_EDAD = [
  { max: 7, label: "Esta semana" },
  { max: 30, label: "Este mes" },
  { max: 90, label: "De 1 a 3 meses" },
  { max: Infinity, label: "Más de 3 meses" },
];
const tramoEdad = (o) => { const d = daysSince(o.estadoDesde); return TRAMOS_EDAD.findIndex((t) => d <= t.max); };
function ordenarCol(col, orden) {
  if (orden === "importe") return [...col].sort((a, b) => (a.prioridad === "alta" ? -1 : 0) - (b.prioridad === "alta" ? -1 : 0) || b.importe - a.importe);
  return [...col].sort((a, b) => String(b.estadoDesde || "").localeCompare(String(a.estadoDesde || "")));
}
// pinta las tarjetas y, si se ordena por antigüedad, mete un separador al empezar cada tramo
function conSeparadores(col, orden, pintar) {
  if (orden !== "reciente") return col.map(pintar);
  const out = [];
  let ultimo = -1;
  col.forEach((o) => {
    const t = tramoEdad(o);
    if (t !== ultimo) {
      const n = col.filter((x) => tramoEdad(x) === t).length;
      out.push(<div key={"sep" + t} className="separador-edad">{TRAMOS_EDAD[t].label} · {n}</div>);
      ultimo = t;
    }
    out.push(pintar(o));
  });
  return out;
}

/* cambio rápido de comercial: se pulsa el círculo (o el nombre) y sale el equipo para elegir.
   No es un <button>: en el tablero va DENTRO del botón que abre la ficha (botón dentro de botón
   rompe la página), y frena el clic para no abrir la ficha ni arrastrar la tarjeta. La lista se
   pinta en document.body con posición fija para que no la recorte la columna. */
// desplegable de toda la vida para cambiar de comercial donde no va dentro de otro botón
// (lista de Obras y ficha): se pulsa en cualquier parte de la casilla y sale la lista del sistema
function SelectComercial({ valor, equipo, onCambiar, ancho }) {
  return (
    <select value={valor || ""} title="Cambiar de comercial"
      onClick={(e) => e.stopPropagation()} onMouseDown={(e) => e.stopPropagation()}
      onChange={(e) => onCambiar(e.target.value)}
      className="text-xs font-bold rounded-lg border px-2 py-1.5 cursor-pointer hover:border-neutral-400 focus:outline-none"
      style={{ borderColor: C.line, color: valor ? C.ink : C.mut, background: "#fff", width: ancho || "100%", minWidth: "7.5rem" }}>
      <option value="">Sin comercial</option>
      {equipo.map((n) => <option key={n} value={n}>{n}</option>)}
      {valor && !equipo.includes(valor) && <option value={valor}>{valor}</option>}
    </select>
  );
}

function SelectorComercial({ valor, equipo, onCambiar, variante = "avatar", tam = 6 }) {
  const [pos, setPos] = useState(null);
  const ref = useRef(null);
  const ANCHO = 210;
  const abrir = (e) => {
    e.stopPropagation(); e.preventDefault();
    if (pos) { setPos(null); return; }
    const r = ref.current.getBoundingClientRect();
    const alto = (equipo.length + 1) * 38 + 44;
    const abajo = r.bottom + 6 + alto <= window.innerHeight;
    setPos({
      top: abajo ? r.bottom + 6 : Math.max(8, r.top - alto - 6),
      left: Math.max(8, Math.min(r.right - ANCHO, window.innerWidth - ANCHO - 8)),
    });
  };
  useEffect(() => {
    if (!pos) return;
    const cerrar = () => setPos(null);
    const tecla = (e) => { if (e.key === "Escape") setPos(null); };
    window.addEventListener("mousedown", cerrar);
    window.addEventListener("scroll", cerrar, true);
    window.addEventListener("resize", cerrar);
    window.addEventListener("keydown", tecla);
    return () => {
      window.removeEventListener("mousedown", cerrar);
      window.removeEventListener("scroll", cerrar, true);
      window.removeEventListener("resize", cerrar);
      window.removeEventListener("keydown", tecla);
    };
  }, [pos]);
  const elegir = (e, nombre) => { e.stopPropagation(); e.preventDefault(); setPos(null); if ((nombre || "") !== (valor || "")) onCambiar(nombre); };
  const frenar = (e) => e.stopPropagation();
  const disparador = variante === "badge"
    ? <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold whitespace-nowrap"
        style={valor ? { background: C.ink, color: "#fff" } : { background: "#fff", color: C.mut, border: `1px dashed ${C.mut}` }}>
        {valor || "Sin comercial"} <ChevronDown size={11} />
      </span>
    : variante === "texto"
      ? <span className="inline-flex items-center gap-1 text-xs font-semibold rounded-md px-1.5 py-1 -mx-1.5 hover:bg-neutral-100"
          style={{ color: valor ? C.ink : C.mut }}>
          {valor || "Sin comercial"} <ChevronDown size={11} style={{ color: C.mut }} />
        </span>
      // círculo + flechita dentro de una píldora con borde: se ve que es un desplegable y la zona de
      // pulsación es el doble que el círculo solo (fallar por poco abría la ficha)
      : <span className="inline-flex items-center gap-0.5 rounded-full border pl-0.5 pr-1 py-0.5 transition-colors hover:bg-neutral-100"
          style={{ borderColor: C.line, background: "#fff" }}>
          {valor
            ? <Avatar nombre={valor} size={tam} />
            : <span className="inline-flex items-center justify-center rounded-full" style={{ width: tam * 4, height: tam * 4, border: `1.5px dashed ${C.mut}`, color: C.mut }}><Plus size={11} /></span>}
          <ChevronDown size={11} style={{ color: C.mut }} />
        </span>;
  return (
    <span ref={ref} role="button" tabIndex={0} draggable={false}
      title={valor ? `Lo lleva ${valor} · pulsa para cambiar de comercial` : "Sin comercial · pulsa para asignarlo"}
      className="inline-flex cursor-pointer rounded-full focus:outline-none focus-visible:ring-2"
      onClick={abrir} onMouseDown={frenar} onDragStart={(e) => { e.preventDefault(); e.stopPropagation(); }}
      onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") abrir(e); }}>
      {disparador}
      {pos && ReactDOM.createPortal(
        <div className="aparecer bg-white rounded-xl border shadow-lg p-1.5" onMouseDown={frenar} onClick={frenar}
          style={{ position: "fixed", top: pos.top, left: pos.left, width: ANCHO, zIndex: 80, borderColor: C.line }}>
          <p className="text-xs font-bold uppercase tracking-wider px-2 pt-1 pb-1.5" style={{ color: C.mut }}>¿Quién la lleva?</p>
          {equipo.map((n) => (
            <div key={n} role="button" tabIndex={0} onClick={(e) => elegir(e, n)} onKeyDown={(e) => { if (e.key === "Enter") elegir(e, n); }}
              className="flex items-center gap-2 px-2 py-1.5 rounded-lg cursor-pointer hover:bg-neutral-50"
              style={n === valor ? { background: C.bone } : {}}>
              <Avatar nombre={n} size={6} />
              <span className="text-sm font-semibold flex-1" style={{ color: C.ink }}>{n}</span>
              {n === valor && <Check size={14} style={{ color: C.ok }} />}
            </div>
          ))}
          <div role="button" tabIndex={0} onClick={(e) => elegir(e, "")}
            className="flex items-center gap-2 px-2 py-1.5 rounded-lg cursor-pointer hover:bg-neutral-50 border-t mt-1 pt-2" style={{ borderColor: C.line }}>
            <span className="text-xs font-semibold" style={{ color: C.mut }}>Quitar comercial</span>
          </div>
        </div>,
        document.body
      )}
    </span>
  );
}

function TableroView({ data, onOpen, onNueva, setEstado, onPerdida, updateObra, quien, onComercial }) {
  const [dragId, setDragId] = useState(null);
  const [overCol, setOverCol] = useState(null);
  const [orden, setOrdenSt] = useState(() => { try { return localStorage.getItem(KEY_ORDEN_TABLERO) || "reciente"; } catch (e) { return "reciente"; } });
  const setOrden = (v) => { setOrdenSt(v); try { localStorage.setItem(KEY_ORDEN_TABLERO, v); } catch (e) {} };
  const hoy = hoyYMD();
  const obras = data.obras.filter(enTablero);
  const perdidas = data.obras.filter((o) => !o.archivada && o.estado === "perdida");
  // César, Dani y David fabrican los presupuestos; María los envía y hace el seguimiento; David lleva la obra desde la firma
  const [modo, setModo] = useState(quien === "María" ? "maria" : (quien === "César" || quien === "Dani") ? "presupuestos" : quien === "David" ? "david" : "obras");
  // en el tablero de presupuestos se puede ver solo lo de uno (lo que lleva o en lo que colabora:
  // al entregarlo a María, quien lo hizo queda de colaborador)
  const FABRICAN = ["César", "Dani", "David"];
  const [fPersona, setFPersona] = useState(FABRICAN.includes(quien) ? quien : "todos");
  const dePersona = (o) => fPersona === "todos" || o.responsable === fPersona || (o.colaboradores || []).includes(fPersona);
  const colMaria = (colId) => {
    if (colId === "enviado") return obras.filter((o) => o.estado === "presupuesto").sort((a, b) => a.estadoDesde.localeCompare(b.estadoDesde));
    return obras.filter((o) => o.estado === "estudio" && o.fase === "enviado" && (o.bandeja || "") === (colId === "entrada" ? "" : colId))
      .sort((a, b) => (a.prioridad === "alta" ? -1 : 0) - (b.prioridad === "alta" ? -1 : 0) || b.importe - a.importe);
  };
  // mover por la mesa de María; al soltarlo en Enviados se envía de verdad (salta la cadencia de seguimiento)
  const moverMaria = (id, colId) => {
    const o = data.obras.find((x) => x.id === id);
    if (!o) return;
    if (colId === "enviado") {
      updateObra(id, { fase: "", bandeja: "" });
      if (o.estado !== "presupuesto") setEstado(id, "presupuesto");
    } else {
      updateObra(id, { fase: "enviado", bandeja: colId === "entrada" ? "" : colId, bandejaFecha: new Date().toISOString() });
      if (o.estado !== "estudio") setEstado(id, "estudio");
    }
  };
  const colFase = (colId) => {
    if (colId === "enviado") return obras.filter((o) => dePersona(o) && (o.estado === "presupuesto" || (o.estado === "estudio" && o.fase === "enviado"))).sort((a, b) => a.estadoDesde.localeCompare(b.estadoDesde));
    return obras.filter((o) => dePersona(o) && o.estado === "estudio" && (o.fase || "") === (colId === "entrada" ? "" : colId))
      .sort((a, b) => (a.prioridad === "alta" ? -1 : 0) - (b.prioridad === "alta" ? -1 : 0) || b.importe - a.importe);
  };
  // mover por la línea de producción; al soltarlo en Enviado se entrega a María (la obra queda Pendiente)
  const moverFase = (id, colId) => {
    const o = data.obras.find((x) => x.id === id);
    if (!o) return;
    if (colId === "enviado") {
      if (o.estado === "presupuesto") return; // ya estaba enviado de verdad
      // si venía de una modificación, a María le entra por "Actualizaciones recibidas"
      const patch = { fase: "enviado", bandeja: o.modificacion ? "reenviado" : "", bandejaFecha: new Date().toISOString(), modificacion: null };
      // al reenviar, la petición de modificación queda cumplida
      patch.puntos = (o.puntos || []).map((p) =>
        !p.hecho && /^modificaci/i.test(p.texto) ? { ...p, hecho: true, fechaHecho: new Date().toISOString() } : p);
      if (o.responsable !== "María" && data.equipo.includes("María")) {
        patch.responsable = "María";
        patch.colaboradores = (o.colaboradores || []).concat(o.responsable).filter((c, i, a) => c && c !== "María" && a.indexOf(c) === i);
      }
      updateObra(id, patch);
      if (o.estado !== "estudio") setEstado(id, "estudio");
      enviarCorreoMovimiento(data, ["María"],
        (patch.bandeja === "reenviado" ? "Presupuesto corregido: " : "Presupuesto entregado: ") + o.nombre,
        patch.bandeja === "reenviado"
          ? "Han corregido el presupuesto de '" + o.nombre + "'. Lo tienes en Actualizaciones recibidas, listo para reenviar."
          : "Te han entregado el presupuesto de '" + o.nombre + "'. Lo tienes en Entrada · para enviar.",
        o.nombre);
    } else {
      if (o.estado !== "estudio") setEstado(id, "estudio");
      updateObra(id, { fase: colId === "entrada" ? "" : colId, bandeja: "" });
    }
  };

  if (obras.length === 0 && perdidas.length === 0) {
    return (
      <EmptyHint icon={Columns} title="El tablero está vacío"
        text="Cada obra es una tarjeta que avanza por las columnas: Pendiente → Enviado → Contratada → En ejecución → Finalizada. Arrástralas con el ratón o usa las flechas."
        action={<BtnPrimary onClick={onNueva}><Plus size={16} /> Nueva obra</BtnPrimary>} />
    );
  }

  const soltar = (colId) => {
    if (dragId) {
      if (modo === "presupuestos") moverFase(dragId, colId);
      else if (modo === "maria") moverMaria(dragId, colId);
      else setEstado(dragId, colId);
    }
    setDragId(null); setOverCol(null);
  };

  // la vista de David es el recorrido de obra a partir de la firma
  const colsObras = modo === "david" ? ESTADOS_TABLERO.filter((e) => ["contratada", "ejecucion", "finalizada"].includes(e.id)) : ESTADOS_TABLERO;

  return (
    <div>
      <div className="flex items-center gap-2 mb-3 flex-wrap">
        <button onClick={() => setModo("obras")}
          className="px-4 py-2 rounded-full text-sm font-bold border transition-colors"
          style={modo === "obras" ? { background: C.ink, color: "#fff", borderColor: C.ink } : { background: "#fff", color: C.ink, borderColor: C.line }}>
          Obras · recorrido completo
        </button>
        <button onClick={() => setModo("presupuestos")}
          className="px-4 py-2 rounded-full text-sm font-bold border transition-colors"
          style={modo === "presupuestos" ? { background: C.ink, color: "#fff", borderColor: C.ink } : { background: "#fff", color: C.ink, borderColor: C.line }}>
          Presupuestos · César, Dani y David
        </button>
        <button onClick={() => setModo("maria")}
          className="px-4 py-2 rounded-full text-sm font-bold border transition-colors"
          style={modo === "maria" ? { background: C.ink, color: "#fff", borderColor: C.ink } : { background: "#fff", color: C.ink, borderColor: C.line }}>
          Envíos · María
        </button>
        <button onClick={() => setModo("david")}
          className="px-4 py-2 rounded-full text-sm font-bold border transition-colors"
          style={modo === "david" ? { background: C.ink, color: "#fff", borderColor: C.ink } : { background: "#fff", color: C.ink, borderColor: C.line }}>
          Obras · David
        </button>
        {modo === "presupuestos" && (
          <span className="inline-flex items-center gap-1 flex-wrap"
            title="Entrada → En proceso → Para revisión → Enviado (ahí lo coge María) · Si María pide cambios, vuelve por Actualizaciones">
            <span className="text-xs font-semibold mr-0.5" style={{ color: C.mut }}>Ver:</span>
            {["todos", ...FABRICAN].map((p) => {
              const n = p === "todos" ? null : obras.filter((o) => (o.estado === "estudio" || o.estado === "presupuesto")
                && (o.responsable === p || (o.colaboradores || []).includes(p))).length;
              return (
                <button key={p} onClick={() => setFPersona(p)}
                  className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold border transition-colors"
                  style={fPersona === p ? { background: C.ink, color: "#fff", borderColor: C.ink } : { background: "#fff", color: C.ink, borderColor: C.line }}>
                  {p === "todos" ? "Todos" : p}
                  {n !== null && <span style={{ opacity: 0.65 }}>{n}</span>}
                </button>
              );
            })}
          </span>

        {modo === "maria" && (
          <span className="text-xs" style={{ color: C.mut }}>Le llegan de César, Dani y David a Entrada → Pendientes → Enviados · Lo que pidió corregir vuelve por Actualizaciones recibidas</span>

        {modo === "david" && (
          <span className="text-xs" style={{ color: C.mut }}>De la firma al final: Contratada → En ejecución → Finalizada · Licencias, subvención y certificaciones en cada ficha</span>

                            </button>
                            <button title="Fase siguiente" disabled={fi === FASES_PRESUPUESTO.length - 1} onClick={() => moverFase(o.id, FASES_PRESUPUESTO[fi + 1].id)}

      )}

      {modo === "maria" && (
        <div className="overflow-x-auto pb-2 -mx-1 px-1 snap-x snap-mandatory sm:snap-none">
          <div className="flex gap-3 min-w-[48rem]">
            {FASES_MARIA.map((f, fi) => {
              const col = colMaria(f.id);
              const total = col.reduce((s, o) => s + o.importe, 0);

              return (
                <div key={f.id} className="flex-1 rounded-xl p-2 transition-colors snap-center min-w-[80vw] sm:min-w-[13rem]"

                  onDragOver={(ev) => { ev.preventDefault(); if (overCol !== f.id) setOverCol(f.id); }}
                  onDragLeave={() => overCol === f.id && setOverCol(null)}

      {(modo === "obras" || modo === "david") && (
      <div className="overflow-x-auto pb-2 -mx-1 px-1 snap-x snap-mandatory sm:snap-none">
        <div className="flex gap-3" style={{ minWidth: modo === "david" ? "42rem" : "68rem" }}>
          {colsObras.map((e, ei) => {
            const col = obras.filter((o) => o.estado === e.id)
              .sort((a, b) => (a.prioridad === "alta" ? -1 : 0) - (b.prioridad === "alta" ? -1 : 0) || b.importe - a.importe);
            const total = col.reduce((s, o) => s + o.importe, 0);
            const resaltada = overCol === e.id;
            return (
              <div key={e.id} className="flex-1 rounded-xl p-2 transition-colors snap-center min-w-[80vw] sm:min-w-[13rem]" style={{ background: resaltada ? e.tint : "#ECEAE7", outline: resaltada ? `2px dashed ${e.color}` : "none" }}
                onDragOver={(ev) => { ev.preventDefault(); if (overCol !== e.id) setOverCol(e.id); }}
                onDragLeave={() => overCol === e.id && setOverCol(null)}
                onDrop={(ev) => { ev.preventDefault(); soltar(e.id); }}>
                <div className="px-1.5 pb-1 flex items-center justify-between">
                  <span className="text-xs font-extrabold uppercase tracking-wider inline-flex items-center gap-1.5" style={{ color: C.ink }} title={e.desc}>

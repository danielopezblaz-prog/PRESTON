    if (!texto.trim()) return;
    onSave({ tipo, autor, texto: texto.trim() });
    setTexto("");
  };
  return (
    <div className="rounded-xl border p-3" style={{ borderColor: C.line, background: C.bone }}>
      <div className="flex flex-wrap gap-1.5 mb-2">
        {TIPOS_APUNTE.map(({ id, label, Icon }) => (
          <button key={id} onClick={() => setTipo(id)}
            className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition-colors"
            style={tipo === id
              ? { background: C.ink, color: "#fff", borderColor: C.ink }
              : { background: "#fff", color: C.ink, borderColor: C.line }}>
            <Icon size={13} /> {label}
          </button>
        ))}
      </div>
      <div className="flex flex-col sm:flex-row gap-2">
        <select className={inputCls + " sm:w-44"} style={inputStyle} value={autor} onChange={(e) => setAutor(e.target.value)}>
          <option value="">Quién lo apunta…</option>
          {equipo.map((c) => <option key={c}>{c}</option>)}
        </select>
        <input className={inputCls} style={inputStyle} placeholder="¿Qué ha pasado? Avance, acuerdo, incidencia, próximos pasos…"
          value={texto} onChange={(e) => setTexto(e.target.value)} onKeyDown={(e) => e.key === "Enter" && guardar()} />
        <BtnPrimary onClick={guardar} disabled={!texto.trim()}><Plus size={15} /> Anotar</BtnPrimary>
      </div>
    </div>
  );
}

/* ---------- cuaderno de obra: miniaturas, visor y formulario de partes ---------- */
// miniatura de una foto cifrada: se baja, se descifra y se enseña; mientras tanto, hueso
function FotoMini({ foto, size = 84, onClick }) {
  const ruta = foto.mini || foto.ruta;
  const [url, setUrl] = useState("");
  const [error, setError] = useState(false);
  useEffect(() => {
    let vivo = true;
    setUrl(""); setError(false);
    cargarFoto(ruta).then((u) => { if (vivo) setUrl(u); }).catch(() => { if (vivo) setError(true); });
    return () => { vivo = false; };
  }, [ruta]);
  return (
    <button onClick={onClick} title={error ? "Foto aún no disponible: prueba en un rato" : "Ver la foto en grande"}
      className="rounded-lg overflow-hidden border flex-shrink-0 flex items-center justify-center"
      style={{ borderColor: C.line, width: size, height: size, background: C.bone }}>
      {url
        ? <img src={url} alt="Foto de obra" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
        : <Camera size={18} style={{ color: error ? C.red : C.mut, opacity: 0.6 }} />}
    </button>
  );
}
// visor a pantalla completa con flechas y Escape
function VisorFotos({ lista, idx, onIdx, onClose }) {
  const f = lista[idx] || {};
  const [url, setUrl] = useState("");
  useEffect(() => {
    let vivo = true;
    setUrl("");
    if (f.ruta) cargarFoto(f.ruta).then((u) => { if (vivo) setUrl(u); }).catch(() => {});
    return () => { vivo = false; };
  }, [f.ruta]);
  useEffect(() => {
    const k = (e) => {
      if (e.key === "Escape") onClose();
      if (e.key === "ArrowLeft" && idx > 0) onIdx(idx - 1);
      if (e.key === "ArrowRight" && idx < lista.length - 1) onIdx(idx + 1);
    };
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  });
  const meta = parteMeta(f.tipo);
  return (
    <div className="fixed inset-0 z-[70] flex flex-col items-center justify-center p-4" style={{ background: "rgba(10,10,12,.92)" }} onClick={onClose}>
      <div className="flex-1 flex items-center justify-center min-h-0 w-full" onClick={(e) => e.stopPropagation()}>
        {url
          ? <img src={url} alt="Foto de obra" className="rounded-lg" style={{ maxWidth: "94vw", maxHeight: "78vh", objectFit: "contain" }} />
          : <p className="text-sm" style={{ color: "#C9C9CE" }}>Abriendo la foto…</p>}
      </div>
      <div className="w-full max-w-2xl flex items-center justify-between gap-3 mt-3" onClick={(e) => e.stopPropagation()}>
        <button onClick={() => onIdx(idx - 1)} disabled={idx <= 0} className="p-2 rounded-lg" style={{ color: "#fff", opacity: idx <= 0 ? 0.25 : 1, background: "rgba(255,255,255,.12)" }} title="Anterior">
          <ChevronLeft size={20} />
        </button>
        <div className="text-center min-w-0">
          <p className="text-sm font-bold truncate" style={{ color: "#fff" }}>
            {meta.label}{f.quien ? " · " + f.quien : ""} · {fmtFecha(f.fecha)}
          </p>
          {f.texto && <p className="text-xs truncate" style={{ color: "#C9C9CE" }}>{f.texto}</p>}
          <p className="text-xs mt-0.5" style={{ color: "#8B8B90" }}>{idx + 1} de {lista.length}</p>
        </div>
        <button onClick={() => onIdx(idx + 1)} disabled={idx >= lista.length - 1} className="p-2 rounded-lg" style={{ color: "#fff", opacity: idx >= lista.length - 1 ? 0.25 : 1, background: "rgba(255,255,255,.12)" }} title="Siguiente">
          <ChevronRight size={20} />
        </button>
      </div>
      <button onClick={onClose} className="absolute top-3 right-3 p-2 rounded-lg" style={{ color: "#fff", background: "rgba(255,255,255,.12)" }} title="Cerrar (Esc)">
        <X size={18} />
      </button>
    </div>
  );
}
// parte de obra: qué se ha hecho, quién, de qué tipo y sus fotos (se encogen y suben cifradas)
function FormParte({ obra, equipo, defecto, onGuardar, toast }) {
  const [tipo, setTipo] = useState("visita");
  const [autor, setAutor] = useState(defecto || "");
  const [texto, setTexto] = useState("");
  const [files, setFiles] = useState([]);
  const [subiendo, setSubiendo] = useState("");
  const inputRef = useRef(null);
  const previews = useMemo(() => files.map((f) => URL.createObjectURL(f)), [files]);
  useEffect(() => () => previews.forEach((u) => URL.revokeObjectURL(u)), [previews]);
  const elegir = (e) => {
    const fs = [...(e.target.files || [])].filter((f) => /^image\//.test(f.type));
    if (fs.length) setFiles((prev) => [...prev, ...fs].slice(0, 12));
    e.target.value = "";
  };
  const guardar = async () => {
    if (subiendo) return;
    if (!texto.trim() && !files.length) return;
    const fotos = [];
    if (files.length) {
      let token = "";
      try { token = (localStorage.getItem(KEY_TOKEN_GH) || "").trim(); } catch (e) {}
      const clave = claveActual();
      if (!token) { toast("Para subir fotos hace falta la llave de guardado de GitHub: pégala en Ajustes."); return; }
      if (!clave) { toast("Pon la clave de la Central en el recuadro de arriba para poder cifrar las fotos."); return; }
      try {
        for (let i = 0; i < files.length; i++) {
          setSubiendo("Subiendo foto " + (i + 1) + " de " + files.length + "…");
          fotos.push(await subirFotoObra(token, clave, obra, files[i]));
        }
      } catch (e) {
        setSubiendo("");
        toast("No se pudo subir la foto " + (fotos.length + 1) + " (" + (e.message || "error") + ")." + (fotos.length ? " Las " + fotos.length + " primeras sí están." : ""));
        if (!fotos.length && !texto.trim()) return;
      }
      setSubiendo("");
    }
    onGuardar({ tipo, autor, texto: texto.trim(), fotos });
    setTexto(""); setFiles([]); setTipo("visita");
  };
  return (
    <div className="rounded-xl border p-3" style={{ borderColor: C.line, background: C.bone }}>
      <div className="flex flex-wrap gap-1.5 mb-2">
        {TIPOS_PARTE.map(({ id, label, Icon }) => (
          <button key={id} onClick={() => setTipo(id)}
            className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition-colors"
            style={tipo === id
              ? (id === "incidencia" ? { background: C.red, color: "#fff", borderColor: C.red } : { background: C.ink, color: "#fff", borderColor: C.ink })
              : { background: "#fff", color: C.ink, borderColor: C.line }}>
            <Icon size={13} /> {label}
          </button>
        ))}
      </div>
      <textarea rows={2} className={inputCls} style={inputStyle}
        placeholder={tipo === "incidencia" ? "¿Qué ha pasado? Se avisa al responsable de la obra…" : "¿Qué se ha hecho hoy? Tajos, gremios en obra, materiales, acuerdos…"}
        value={texto} onChange={(e) => setTexto(e.target.value)} />
      {files.length > 0 && (
        <div className="flex flex-wrap gap-1.5 mt-2">
          {previews.map((u, i) => (
            <div key={i} className="relative">
              <img src={u} alt="" className="rounded-lg border object-cover" style={{ width: 56, height: 56, borderColor: C.line }} />
              <button onClick={() => setFiles(files.filter((_, j) => j !== i))}
                className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full flex items-center justify-center"
                style={{ background: C.ink, color: "#fff" }} title="Quitar esta foto"><X size={11} /></button>
            </div>
          ))}
        </div>
      )}
      <div className="flex flex-col sm:flex-row gap-2 mt-2">
        <select className={inputCls + " sm:w-40"} style={inputStyle} value={autor} onChange={(e) => setAutor(e.target.value)}>
          <option value="">Quién lo apunta…</option>
          {equipo.map((c) => <option key={c}>{c}</option>)}
        </select>
        <input ref={inputRef} type="file" accept="image/*" multiple className="hidden" onChange={elegir} />
        <BtnGhost onClick={() => inputRef.current && inputRef.current.click()} title="En el móvil abre la cámara o la galería; se suben cifradas">
          <Camera size={14} /> {files.length ? "Más fotos (" + files.length + ")" : "Añadir fotos"}
        </BtnGhost>
        <div className="flex-1" />
        <BtnPrimary onClick={guardar} disabled={(!texto.trim() && !files.length) || !!subiendo}>
          {subiendo ? <><Clock size={14} /> {subiendo}</> : <><Plus size={15} /> Guardar parte</>}
        </BtnPrimary>
      </div>
    </div>
  );
}

/* ============================ PUESTA AL DÍA ============================ */
// Repaso de una sentada de todas las obras vivas: la más parada primero, cuatro botones y a la siguiente.
// Sirve para que la Central deje de ser una foto vieja sin tener que abrir ficha por ficha.
function PuestaAlDia({ data, onCerrar, setEstado, updateObra, addApunte, quien, onPublicar }) {
  // la lista se congela al abrir (si no, cada cambio la reordenaría bajo los pies)
  const [ids] = useState(() => data.obras
    .filter((o) => !o.archivada && ACTIVOS.includes(o.estado))
    .sort((a, b) => ultimoMovimiento(a).localeCompare(ultimoMovimiento(b)))
    .map((o) => o.id));
  const [i, setI] = useState(0);
  const [hechas, setHechas] = useState([]);
  const [sub, setSub] = useState(null);          // null | "obra" | "perdida"
  const [desde, setDesde] = useState(hoyYMD());
  const [motivo, setMotivo] = useState("No responde");

  const obra = data.obras.find((o) => o.id === ids[i]);
  const total = ids.length;
  const fin = i >= total;

  const anotar = (id, texto) => addApunte(id, { tipo: "nota", autor: quien || "", texto });
  const avanzar = (accion) => {
    setHechas((h) => [...h, { id: obra.id, nombre: obra.nombre, accion }]);
    setSub(null); setDesde(hoyYMD()); setMotivo("No responde");
    setI((n) => n + 1);
  };
  const marcarRepasada = (id) => updateObra(id, { repasada: new Date().toISOString(), fechaDudosa: false });

  const sigueIgual = () => {
    marcarRepasada(obra.id);
    anotar(obra.id, "Repaso al día: sigue igual, sin novedad.");
    avanzar("igual");
  };
  const yaEnObra = () => {
    setEstado(obra.id, "ejecucion");
    updateObra(obra.id, { repasada: new Date().toISOString(), fechaDudosa: false, fechaInicio: desde });
    anotar(obra.id, "Repaso al día: la obra ya está en marcha desde el " + fmtDia(desde) + ".");
    avanzar("obra");
  };
  const terminada = () => {
    setEstado(obra.id, "finalizada");
    marcarRepasada(obra.id);
    anotar(obra.id, "Repaso al día: obra terminada.");
    avanzar("fin");
  };
  const perdida = () => {
    setEstado(obra.id, "perdida", motivo);
    marcarRepasada(obra.id);
    anotar(obra.id, "Repaso al día: se da por perdida (" + motivo + ").");
    avanzar("perdida");
  };

  if (fin) {
    const cuenta = (a) => hechas.filter((h) => h.accion === a).length;
    return (
      <Modal title="Puesta al día" onClose={onCerrar} wide>
        <div className="text-center py-4">
          <div className="w-14 h-14 rounded-2xl mx-auto flex items-center justify-center" style={{ background: C.okTint }}>
            <CircleCheck size={28} style={{ color: C.ok }} />
          </div>
          <p className="text-xl font-extrabold mt-3" style={{ color: C.ink }}>Repaso terminado</p>
          <p className="text-sm mt-1" style={{ color: C.mut }}>
            {hechas.length} obra{hechas.length === 1 ? "" : "s"} revisada{hechas.length === 1 ? "" : "s"} de {total}.
          </p>
        </div>
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-2">
          {[["Siguen igual", cuenta("igual"), C.mut], ["Ya en obra", cuenta("obra"), C.red],
            ["Terminadas", cuenta("fin"), C.ok], ["Perdidas", cuenta("perdida"), C.warn]].map(([t, n, col]) => (
            <div key={t} className="rounded-xl border p-3 text-center" style={{ borderColor: C.line }}>
              <p className="text-2xl font-extrabold" style={{ color: col }}>{n}</p>
              <p className="text-xs font-semibold mt-0.5" style={{ color: C.mut }}>{t}</p>
            </div>
          ))}
        </div>
        <p className="text-xs mt-3 rounded-lg px-3 py-2" style={{ background: C.bone, color: C.txt }}>
          Los cambios ya están guardados en este navegador. Para que los vea el resto del equipo hay que publicarlos.
        </p>
        <div className="flex flex-wrap gap-2 mt-4 pt-4 border-t" style={{ borderColor: C.line }}>
          <BtnPrimary onClick={() => { if (onPublicar) onPublicar(); onCerrar(); }}>
            <Upload size={14} /> Publicar para el equipo
          </BtnPrimary>
          <BtnGhost onClick={onCerrar}>Cerrar sin publicar</BtnGhost>
        </div>
      </Modal>
    );
  }

  if (!obra) return <Modal title="Puesta al día" onClose={onCerrar}><p className="text-sm" style={{ color: C.mut }}>No hay obras vivas que repasar.</p></Modal>;

  const parada = obra.fechaDudosa ? null : daysSince(ultimoMovimiento(obra));
  const ultimo = [...(obra.apuntes || [])].sort((a, b) => b.fecha.localeCompare(a.fecha))[0];
  const siguiente = proximoPaso(obra);

  return (
    <Modal title="Puesta al día" onClose={onCerrar} wide>
      {/* avance del repaso */}
      <div className="flex items-center gap-3 mb-3">
        <span className="text-xs font-bold uppercase tracking-wider whitespace-nowrap" style={{ color: C.mut }}>{i + 1} de {total}</span>
        <div className="flex-1"><BarraProgreso valor={(i / total) * 100} color={C.red} alto={6} /></div>
      </div>

      {/* la obra */}
      <div className="rounded-xl border p-4" style={{ borderColor: C.line, background: C.bone }}>
        <div className="flex items-start justify-between gap-3 flex-wrap">
          <div className="min-w-0">
            <p className="text-lg font-extrabold leading-tight" style={{ color: C.ink }}>{obra.nombre}</p>
            <p className="text-xs mt-0.5" style={{ color: C.mut }}>
              {[obra.direccion, obra.municipio].filter(Boolean).join(" · ") || "Sin dirección"}
            </p>
          </div>
          <p className="text-xl font-extrabold whitespace-nowrap" style={{ color: C.red }}>{fmtEUR(obra.importe)}</p>
        </div>
        <div className="flex flex-wrap gap-1.5 mt-2">
          <EstadoBadge estado={obra.estado} />
          {parada === null
            ? <Badge tone="warn" title="El volcado antiguo no trajo fecha: no sabemos de cuándo es">Sin fecha fiable</Badge>
            : <Badge tone={parada > 90 ? "red" : parada > 30 ? "warn" : "neutral"}>{parada} días sin moverse</Badge>}
          {obra.tipos.map((t) => <Badge key={t}>{t}</Badge>)}
        </div>
        {/* quién la lleva: se arregla aquí mismo, sin abrir la ficha */}
        <div className="flex items-center gap-2 mt-3 flex-wrap">
          <span className="text-xs font-semibold uppercase tracking-wider" style={{ color: C.mut }}>La lleva</span>
          <select className="text-sm rounded-lg border px-2 py-1" style={{ borderColor: C.line, color: C.ink }}
            value={obra.responsable || ""} onChange={(e) => updateObra(obra.id, { responsable: e.target.value })}>
            <option value="">Sin asignar</option>
            {data.equipo.map((m) => <option key={m}>{m}</option>)}
          </select>
        </div>
        {siguiente && (
          <p className="text-xs mt-2" style={{ color: C.txt }}>
            <b>Siguiente paso apuntado:</b> {siguiente.texto}{siguiente.fecha ? " · " + fmtDia(siguiente.fecha) : ""}
          </p>
        )}
        {ultimo && (
          <p className="text-xs mt-1" style={{ color: C.mut }}>
            <b>Último apunte</b> ({fmtFecha(ultimo.fecha)}): {String(ultimo.texto || "").slice(0, 150)}
          </p>
        )}
      </div>

      {/* decisión */}
      {sub === null && (
        <div className="grid grid-cols-1 sm:grid-cols-4 gap-2 mt-3">
          <button onClick={sigueIgual} className="rounded-xl border-2 p-3 text-center hover:bg-neutral-50 transition-colors" style={{ borderColor: C.line }}>
            <Check size={18} className="mx-auto" style={{ color: C.mut }} />
            <p className="text-sm font-bold mt-1" style={{ color: C.ink }}>Sigue igual</p>
          </button>
          {obra.estado !== "ejecucion" && (
            <button onClick={() => setSub("obra")} className="rounded-xl border-2 p-3 text-center hover:bg-red-50 transition-colors" style={{ borderColor: C.redTint }}>
              <HardHat size={18} className="mx-auto" style={{ color: C.red }} />
              <p className="text-sm font-bold mt-1" style={{ color: C.red }}>Ya está en obra</p>
            </button>
          )}
          <button onClick={terminada} className="rounded-xl border-2 p-3 text-center hover:bg-neutral-50 transition-colors" style={{ borderColor: C.okTint }}>
            <CircleCheck size={18} className="mx-auto" style={{ color: C.ok }} />
            <p className="text-sm font-bold mt-1" style={{ color: C.ok }}>Terminada</p>
          </button>
          <button onClick={() => setSub("perdida")} className="rounded-xl border-2 p-3 text-center hover:bg-neutral-50 transition-colors" style={{ borderColor: C.warnTint }}>
            <X size={18} className="mx-auto" style={{ color: C.warn }} />
            <p className="text-sm font-bold mt-1" style={{ color: C.warn }}>Perdida</p>
          </button>
        </div>
      )}

      {sub === "obra" && (
        <div className="mt-3 rounded-xl border p-3" style={{ borderColor: C.red, background: "#FDF7F6" }}>
          <p className="text-sm font-bold" style={{ color: C.redDark }}>¿Desde cuándo está en marcha?</p>
          <p className="text-xs mt-0.5" style={{ color: C.mut }}>Con esa fecha se calculan el plazo y las certificaciones.</p>
          <div className="flex items-center gap-2 mt-2 flex-wrap">
            <input type="date" className="text-sm rounded-lg border px-2 py-1" style={{ borderColor: C.line, color: C.txt }}
              value={desde} onChange={(e) => setDesde(e.target.value)} />
            <BtnPrimary onClick={yaEnObra}><HardHat size={14} /> Pasarla a ejecución</BtnPrimary>
            <BtnGhost onClick={() => setSub(null)}>Atrás</BtnGhost>
          </div>
        </div>
      )}

      {sub === "perdida" && (
        <div className="mt-3 rounded-xl border p-3" style={{ borderColor: C.warn, background: C.warnTint }}>
          <p className="text-sm font-bold" style={{ color: "#8A5A15" }}>¿Por qué se pierde?</p>
          <div className="flex items-center gap-2 mt-2 flex-wrap">
            <select className="text-sm rounded-lg border px-2 py-1" style={{ borderColor: C.line, color: C.ink }}
              value={motivo} onChange={(e) => setMotivo(e.target.value)}>
              {MOTIVOS.map((m) => <option key={m}>{m}</option>)}
            </select>
            <BtnPrimary onClick={perdida}><X size={14} /> Darla por perdida</BtnPrimary>
            <BtnGhost onClick={() => setSub(null)}>Atrás</BtnGhost>
          </div>
        </div>
      )}

      {/* navegación */}
      <div className="flex items-center justify-between gap-2 mt-4 pt-3 border-t flex-wrap" style={{ borderColor: C.line }}>
        <BtnGhost onClick={() => { setSub(null); setI((n) => Math.max(0, n - 1)); }} className={i === 0 ? "opacity-40" : ""}>
          <ChevronLeft size={14} /> Anterior
        </BtnGhost>
        <div className="flex items-center gap-2">
          <button onClick={() => { setSub(null); setI((n) => n + 1); }} className="text-xs font-semibold px-2 py-1 hover:underline" style={{ color: C.mut }}>
            Dejarla para luego
          </button>
          <BtnGhost onClick={onCerrar}>Salir del repaso</BtnGhost>
        </div>
      </div>
    </Modal>
  );
}

function FichaObra({ obra, data, avisos, onClose, onEdit, setEstado, onPerdida, onReabrir, onDelete, onArchivar,
  addPunto, togglePunto, delPunto, addReq, toggleReq, delReq, addApunte, delApunte, updateObra, quien, toast, onComercial }) {
  const hoy = hoyYMD();
  const [verHechos, setVerHechos] = useState(false);
  // secciones plegadas para que la ficha respire: contacto y diario cerrados; requerimientos se abren solos si hay vencidos
  const reqsVencidos = (obra.requerimientos || []).filter((r) => !r.hecho && r.fechaLimite && r.fechaLimite < hoy).length;
  const [verContacto, setVerContacto] = useState(false);
  const [verReqs, setVerReqs] = useState(() => (obra.requerimientos || []).some((r) => !r.hecho && r.fechaLimite && r.fechaLimite < hoyYMD()));
  const [verDiario, setVerDiario] = useState(false);

  // ——— cuaderno de obra: la ficha cambia de piel cuando la obra está en marcha ———
  const enObra = obra.estado === "ejecucion" || obra.estado === "finalizada";
  const [visor, setVisor] = useState(null); // { idx } sobre todasFotos
  const [verPartes, setVerPartes] = useState(false);
  const [verGaleria, setVerGaleria] = useState(false);
  const [certFecha, setCertFecha] = useState(hoyYMD());
  const [certImp, setCertImp] = useState("");
  const seguimiento = obra.seguimiento || [];
  const todasFotos = seguimiento.flatMap((s) => (s.fotos || []).map((f) => ({ ...f, fecha: s.fecha, quien: s.quien, texto: s.texto, tipo: s.tipo })));
  const abrirFoto = (fotoId) => {
    const i = todasFotos.findIndex((f) => f.id === fotoId);
    if (i >= 0) setVisor({ idx: i });
  };
  const guardarParte = ({ tipo, autor, texto, fotos }) => {
    const entrada = { id: uid(), fecha: new Date().toISOString(), tipo, quien: autor || quien || "", texto, fotos: fotos || [], resuelta: false };
    updateObra(obra.id, { seguimiento: [entrada, ...seguimiento] });
    if (tipo === "incidencia") {
      const destinos = [obra.responsable].concat(obra.colaboradores || []).filter(Boolean).filter((v, i, a) => a.indexOf(v) === i);
      enviarCorreoMovimiento(data, destinos, "Incidencia en " + obra.nombre,
        (autor || quien || "Alguien") + " apunta una incidencia en '" + obra.nombre + "': " + texto, obra.nombre);
    }
    toast(tipo === "incidencia" ? "Incidencia apuntada: le salta el aviso al responsable."
      : "Parte guardado" + (fotos && fotos.length ? " con " + fotos.length + " foto" + (fotos.length === 1 ? "" : "s") : "") + ".");
  };
  const delParte = (sid) => updateObra(obra.id, { seguimiento: seguimiento.filter((s) => s.id !== sid) });
  // las fotos van cifradas: si la pestaña entró sin clave (datos ya locales), se pide aquí una vez
  const [claveInput, setClaveInput] = useState("");
  const [reintentoFotos, setReintentoFotos] = useState(0);
  const [validandoClave, setValidandoClave] = useState(false);
  const sinClaveFotos = enObra && !claveActual();
  const guardarClaveFotos = async () => {
    const v = (claveInput || "").trim();
    if (!v || validandoClave) return;
    setValidandoClave(true);
    try {
      const p = leerDatosIncrustados();
      if (p && p.cifrado) await descifrarJSON(p, v);
      else if (todasFotos.length) await descifrarFoto(await (await fetch("https://raw.githubusercontent.com/" + GH_REPO + "/" + GH_RAMA + "/" + todasFotos[0].ruta)).text(), v);
    } catch (e) { setValidandoClave(false); toast("Esa clave no es la de la Central."); return; }
    setValidandoClave(false);
    try { sessionStorage.setItem(KEY_CLAVE_SES, v); } catch (e) {}
    setClaveInput("");
    setReintentoFotos(reintentoFotos + 1);
    toast("Clave guardada mientras dure la pestaña: fotos a la vista.");
  };
  const resolverIncidencia = (s) => {
    updateObra(obra.id, { seguimiento: seguimiento.map((x) => x.id === s.id ? { ...x, resuelta: !x.resuelta, resueltaFecha: !x.resuelta ? new Date().toISOString() : "" } : x) });
    if (!s.resuelta) toast("Incidencia resuelta. Queda en el historial del cuaderno.");
  };
  // certificaciones: al añadir una se cierra su punto y se programa la del mes que viene;
  // al marcarla cobrada, el cobrado de la obra sube solo (y baja si se desmarca)
  const certs = [...(obra.certs || [])].sort((a, b) => (a.n || 0) - (b.n || 0));
  const certificado = certs.reduce((s, c) => s + (Number(c.importe) || 0), 0);
  const sigCert = certs.reduce((m, c) => Math.max(m, Number(c.n) || 0), 0) + 1;
  const addCert = () => {
    const imp = Math.max(0, Math.round(Number(certImp) || 0));
    if (!imp) return;
    const nueva = { id: uid(), n: sigCert, fecha: certFecha || hoyYMD(), importe: imp, estado: "preparada" };
    let puntos = (obra.puntos || []).map((p) => p.auto === "cert" && !p.hecho ? { ...p, hecho: true, fechaHecho: new Date().toISOString() } : p);
    if (obra.estado === "ejecucion") puntos = [...puntos, { id: uid(), texto: "Pasar la certificación nº " + (sigCert + 1), fecha: ymdMas(30), responsable: obra.responsable || "", hecho: false, auto: "cert" }];
    updateObra(obra.id, { certs: [...(obra.certs || []), nueva], puntos });
    addApunte(obra.id, { tipo: "documento", autor: quien || "", texto: "Certificación nº " + sigCert + " preparada: " + fmtEUR(imp) + "." });
    setCertImp(""); setCertFecha(hoyYMD());
    if (obra.estado === "ejecucion") toast("Certificación nº " + sigCert + " apuntada. La siguiente queda programada a 30 días.");
  };
  const setCertEstado = (c, estado) => {
    if (c.estado === estado) return;
    let cobrado = obra.cobrado || 0;
    if (estado === "cobrada" && c.estado !== "cobrada") cobrado += Number(c.importe) || 0;
    if (c.estado === "cobrada" && estado !== "cobrada") cobrado = Math.max(0, cobrado - (Number(c.importe) || 0));
    updateObra(obra.id, { certs: (obra.certs || []).map((x) => x.id === c.id ? { ...x, estado } : x), cobrado });
    if (estado === "cobrada") addApunte(obra.id, { tipo: "cobro", autor: quien || "", texto: "Certificación nº " + c.n + " cobrada: " + fmtEUR(c.importe) + ". Cobrado total: " + fmtEUR(cobrado) + "." });
  };
  const delCert = (c) => {
    let cobrado = obra.cobrado || 0;
    if (c.estado === "cobrada") cobrado = Math.max(0, cobrado - (Number(c.importe) || 0));
    updateObra(obra.id, { certs: (obra.certs || []).filter((x) => x.id !== c.id), cobrado });
  };
  const ponerMarcha = (m) => {
    if (m === obra.marcha) return;
    updateObra(obra.id, { marcha: m, marchaFecha: new Date().toISOString(), marchaNota: m === "bien" ? "" : obra.marchaNota });
    if (m !== "bien") addApunte(obra.id, { tipo: "incidencia", autor: quien || "", texto: m === "parada" ? "Obra marcada como PARADA." : "Obra marcada con problemas." });
    else addApunte(obra.id, { tipo: "avance", autor: quien || "", texto: "La obra vuelve a estar en marcha con normalidad." });
  };
  // la próxima visita vive también como punto con fecha: sale en Tu día y en la Agenda
  const ponerProximaVisita = (v) => {
    let puntos = obra.puntos || [];
    const pend = puntos.some((p) => p.auto === "visita" && !p.hecho);
    if (v && pend) puntos = puntos.map((p) => p.auto === "visita" && !p.hecho ? { ...p, fecha: v } : p);
    if (v && !pend) puntos = [...puntos, { id: uid(), texto: "Visita de obra", fecha: v, responsable: obra.responsable || "", hecho: false, auto: "visita" }];
    if (!v) puntos = puntos.map((p) => p.auto === "visita" && !p.hecho ? { ...p, hecho: true, fechaHecho: new Date().toISOString() } : p);
    updateObra(obra.id, { proximaVisita: v, puntos });
  };
  // corrección directa de cantidades (por si un importe vino mal): clic → editar → Enter
  const [editImporte, setEditImporte] = useState(false);
  const [impTxt, setImpTxt] = useState("");
  const [editSubImp, setEditSubImp] = useState(false);
  const [subImpTxt, setSubImpTxt] = useState("");
  const guardarImporte = () => {
    const v = Math.max(0, Math.round(Number(impTxt) || 0));
    setEditImporte(false);
    if (v === obra.importe) return;
    updateObra(obra.id, { importe: v });
    addApunte(obra.id, { tipo: "nota", autor: quien || "", texto: "Importe corregido a mano: de " + fmtEUR(obra.importe) + " a " + fmtEUR(v) + "." });
  };
  const guardarSubImp = () => {
    const v = Math.max(0, Math.round(Number(subImpTxt) || 0));
    setEditSubImp(false);
    if (v === obra.subImporte) return;
    updateObra(obra.id, { subImporte: v });
    addApunte(obra.id, { tipo: "nota", autor: quien || "", texto: "Subvención corregida a mano: de " + fmtEUR(obra.subImporte) + " a " + fmtEUR(v) + "." });
  };
  // María pide una modificación del presupuesto → vuelve a César, Dani y David (columna Actualizaciones)
  const [modOpen, setModOpen] = useState(false);
  const [modTxt, setModTxt] = useState("");
  const pedirModificacion = () => {
    const t = modTxt.trim();
    if (!t) return;
    setEstado(obra.id, "estudio");
    updateObra(obra.id, { fase: "actualizacion", modificacion: { texto: t, de: quien || "María", fecha: new Date().toISOString() } });
    addPunto(obra.id, { texto: "Modificación pedida: " + t, fecha: "", responsable: "" });
    addApunte(obra.id, { tipo: "nota", autor: quien || "", texto: "Pide modificación del presupuesto: " + t });
    enviarCorreoMovimiento(data, ["César", "Dani", "David"], "Modificación pedida: " + obra.nombre,
      (quien || "María") + " pide modificar el presupuesto de '" + obra.nombre + "': " + t, obra.nombre);
    setModOpen(false); setModTxt("");
  };

  // piloto automático de la subvención: cada paso del recorrido deja preparado el siguiente
  const cambiarSubEstado = (nuevo) => {
    const antes = obra.subEstado;
    updateObra(obra.id, { subEstado: nuevo });
    if (nuevo === antes) return;
    const yaPunto = (t) => (obra.puntos || []).some((p) => !p.hecho && p.texto === t);
    const yaReq = (t) => (obra.requerimientos || []).some((r) => r.texto === t);
    if (nuevo === "solicitada") {
      const t = "Esperar la resolución de la subvención (suele tardar unos 6 meses)";
      if (!yaPunto(t)) addPunto(obra.id, { texto: t, fecha: ymdMas(180), responsable: obra.responsable || "" });
      addApunte(obra.id, { tipo: "documento", autor: quien || "", texto: "Subvención registrada como solicitada. Recuerda: la obra no debe haberse iniciado antes de esta solicitud." });
    }
    if (nuevo === "concedida") {
      const r = "Justificar la subvención en el plazo de la resolución";
      if (!yaReq(r)) addReq(obra.id, { texto: r, fechaLimite: "" });
      const t = "Leer la resolución: cuantía definitiva, plazos y condiciones";
      if (!yaPunto(t)) addPunto(obra.id, { texto: t, fecha: ymdMas(7), responsable: obra.responsable || "" });
      addApunte(obra.id, { tipo: "documento", autor: quien || "", texto: "Subvención concedida. La obra debe estar terminada como máximo 36 meses después de la concesión (art. 103 RD 326/2026; si la licencia municipal tarda más de 3 meses, el plazo crece hasta 6 meses más)." });
    }
    if (nuevo === "justificada") {
      const t = "Perseguir el cobro de la subvención";
      if (!yaPunto(t)) addPunto(obra.id, { texto: t, fecha: ymdMas(60), responsable: obra.responsable || "" });
      addApunte(obra.id, { tipo: "documento", autor: quien || "", texto: "Subvención justificada: queda perseguir el cobro." });
    }
    if (nuevo === "cobrada") addApunte(obra.id, { tipo: "cobro", autor: quien || "", texto: "Subvención cobrada." + (obra.subImporte ? " Importe previsto: " + fmtEUR(obra.subImporte) + "." : "") });
  };

  // trae del Catastro (solo lectura) viviendas, locales, año y referencia; el año decide la elegibilidad del PGE
  const [catBusy, setCatBusy] = useState(false);
  const traerCatastro = async () => {
    if (catBusy) return;
    setCatBusy(true);
    toast("Consultando la Sede del Catastro…");
    try {
      const res = await catastroDeObra(obra);
      if (!res) { toast("El Catastro no encuentra esa dirección. Revisa calle y número en Editar datos."); return; }
      const patch = { refCatastral: res.rc || obra.refCatastral };
      if (res.anio) patch.anioConstruccion = res.anio;
      if (res.fiable) {
        patch.viviendas = res.viviendas;
        if (res.m2Locales) patch.m2Locales = res.m2Locales;
      }
      let distrito = "";
      if (sinAcentos(obra.municipio || "").toUpperCase() === "MADRID") {
        try { distrito = await distritoDeDireccion(direccionDeObra(obra)); } catch (e) {}
        if (distrito) patch.distrito = distrito;
      }
      updateObra(obra.id, patch);
      const partes = [];
      if (res.fiable) partes.push(res.viviendas + " viviendas" + (res.locales ? " y " + res.locales + " locales (" + res.m2Locales + " m²)" : ", sin locales"));
      else partes.push("el Catastro no detalla las unidades (pon las viviendas a mano)");
      if (res.anio) partes.push("año " + res.anio);
      if (distrito) partes.push("distrito " + distrito);
      addApunte(obra.id, { tipo: "documento", autor: quien || "", texto: "Datos de la Sede del Catastro: " + partes.join(" · ") + ". Referencia " + (res.rc || "—") + "." });
      toast(res.anio && res.anio >= 2006
        ? "Ojo: edificio de " + res.anio + " — el Plan Estatal exige anterior a 2006."
        : "Catastro: " + partes[0] + (res.anio ? " · año " + res.anio : "") + ".");
    } catch (e) {
      toast("No se pudo consultar el Catastro (" + (e.message || "sin conexión") + ").");
    } finally { setCatBusy(false); }
  };

  // lee el PDF del presupuesto directamente del Dropbox (acceso de SOLO lectura: no puede tocar nada)
  const [dbxBusy, setDbxBusy] = useState(false);
  const leerPresupuestoDropbox = async () => {
    if (dbxBusy) return;
    let token = "";
    try { token = (localStorage.getItem(KEY_TOKEN_DBX) || "").trim(); } catch (e) {}
    if (!token) { toast("Falta el acceso de solo lectura a Dropbox: pégalo en Ajustes."); return; }
    const codigo = codigoDeObra(obra);
    if (!codigo) { toast("Esta obra no tiene código de presupuesto (MA/MO-…) en las notas."); return; }
    setDbxBusy(true);
    try {
      toast("Buscando " + codigo + " en el Dropbox…");
      const res = await dbxBuscar(token, codigo);
      const pdfs = (res.matches || []).map((m) => m.metadata && m.metadata.metadata).filter(Boolean)
        .filter((md) => md[".tag"] === "file" && /\.pdf$/i.test(md.name || "") && !/anterior/i.test(md.path_display || ""));
      if (!pdfs.length) { toast("No hay ningún PDF con el código " + codigo + " en el Dropbox."); return; }
      pdfs.sort((a, b) => String(b.server_modified || "").localeCompare(String(a.server_modified || "")));
      const elegido = pdfs[0];
      toast("Leyendo «" + elegido.name + "»…");
      const buf = await dbxDescargar(token, elegido.path_lower || elegido.path_display);
      const txt = await textoDePdf(buf);
      const d = extraerDelPresupuesto(txt);
      const partes = [];
      if (d.contrata) partes.push("contrata " + fmtEUR(d.contrata));
      if (d.total) partes.push("coste total comunidad " + fmtEUR(d.total));
      if (d.subvencionable) partes.push("subvencionable " + fmtEUR(d.subvencionable));
      if (d.pem) partes.push("PEM " + fmtEUR(d.pem));
      if (d.viv) partes.push(d.viv + " viviendas");
      if (!partes.length) {
        addApunte(obra.id, { tipo: "documento", autor: quien || "", texto: "Leído del Dropbox «" + elegido.name + "» pero sus números no son legibles (PDF impreso desde Presto con letras codificadas)." });
        toast("El PDF «" + elegido.name + "» no se puede leer (impreso de Presto).");
        return;
      }
      const patch = {};
      if (d.contrata && !obra.importe) patch.importe = Math.round(d.contrata);
      if (d.viv && !obra.viviendas) patch.viviendas = d.viv;
      if (Object.keys(patch).length) updateObra(obra.id, patch);
      const choque = d.contrata && obra.importe && Math.round(d.contrata) !== obra.importe
        ? " OJO: el PDF dice " + fmtEUR(d.contrata) + " y la ficha tiene " + fmtEUR(obra.importe) + "."
        : "";
      addApunte(obra.id, { tipo: "documento", autor: quien || "", texto: "Leído del Dropbox (solo lectura) «" + elegido.name + "»: " + partes.join(" · ") + "." + choque });
      toast(patch.importe ? "Importe puesto del PDF: " + fmtEUR(patch.importe) + "." : "PDF leído: los datos quedan en el diario." + choque);
    } catch (e) {
      toast("No se pudo leer del Dropbox (" + (e.message || "error") + ").");
    } finally { setDbxBusy(false); }
  };

  // hoja imprimible con todo lo de la obra (para juntas, administradores o archivo)
  const imprimirInforme = () => {
    const est = EST[obra.estado] || {};
    const w = window.open("", "_blank");
    if (!w) return;
    const fila = (k, v) => v ? `<tr><td style="padding:4px 12px 4px 0;color:#75757A;white-space:nowrap;vertical-align:top">${k}</td><td style="padding:4px 0;font-weight:600">${v}</td></tr>` : "";
    const reqs = (obra.requerimientos || []).map((r) => `<li>${r.hecho ? "&#10003;" : "&#9675;"} ${r.texto}${r.fechaLimite && !r.hecho ? " · límite " + fmtDia(r.fechaLimite) : ""}</li>`).join("");
    const aps = [...(obra.apuntes || [])].sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 8)
      .map((a) => `<li><b>${fmtFecha(a.fecha)}</b>${a.autor ? " · " + a.autor : ""}: ${a.texto}</li>`).join("");
    const hist = (obra.historial || []).map((h) => `${(EST[h.estado] || {}).label || h.estado} (${fmtFecha(h.fecha)})`).join(" &rarr; ");
    const certsInf = [...(obra.certs || [])].sort((a, b) => (a.n || 0) - (b.n || 0))
      .map((c) => `<li>Certificación nº ${c.n} · ${fmtDia(c.fecha)} · ${fmtEUR(c.importe)} · ${((CERT_ESTADOS.find((x) => x.id === c.estado) || {}).label || c.estado).toLowerCase()}</li>`).join("");
    const partesInf = (obra.seguimiento || []).slice(0, 8)
      .map((s) => `<li><b>${fmtFecha(s.fecha)}</b> · ${parteMeta(s.tipo).label}${s.quien ? " · " + s.quien : ""}: ${s.texto || ""}${(s.fotos || []).length ? ` (${s.fotos.length} foto${s.fotos.length === 1 ? "" : "s"})` : ""}${s.tipo === "incidencia" ? (s.resuelta ? " — resuelta" : " — <b>ABIERTA</b>") : ""}</li>`).join("");
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Informe · ${obra.nombre}</title>
      <style>body{font-family:'Segoe UI',system-ui,sans-serif;color:#17181A;margin:32px auto;max-width:780px;padding:0 16px}h1{font-size:22px;margin:2px 0 0}h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#A32C24;border-bottom:2px solid #A32C24;padding-bottom:4px;margin:22px 0 8px}ul{margin:6px 0;padding-left:18px}li{margin:3px 0;font-size:14px}table{font-size:14px;border-collapse:collapse}@media print{body{margin:10mm auto}}</style>
      </head><body>
      <p style="font-weight:800;color:#A32C24;letter-spacing:.14em;font-size:12px;margin:0">REVESTIMIENTOS PROYECTON · CENTRAL DE OBRAS</p>
      <h1>${obra.nombre}</h1>
      <p style="color:#75757A;font-size:13px;margin:4px 0 0">${[obra.direccion, obra.municipio].filter(Boolean).join(" · ")}${obra.direccion || obra.municipio ? " · " : ""}Informe del ${fmtFecha(new Date().toISOString())}</p>
      <h2>Datos</h2><table>
      ${fila("Estado", (est.label || obra.estado) + " · desde " + fmtFecha(obra.estadoDesde))}
      ${fila("Importe de la obra", obra.importe ? fmtEUR(obra.importe) : "")}
      ${fila("Cobrado", obra.cobrado ? fmtEUR(obra.cobrado) : "")}
      ${fila("Avance", obra.estado === "ejecucion" ? obra.avance + " %" : "")}
      ${fila("Marcha", obra.estado === "ejecucion" ? marchaMeta(obra.marcha).label + (obra.marchaNota ? " — " + obra.marchaNota : "") : "")}
      ${fila("Plazos", obra.fechaInicio ? "empezó " + fmtDia(obra.fechaInicio) + (finPrevistoDe(obra) ? " · fin previsto " + fmtDia(finPrevistoDe(obra)) : "") : "")}
      ${fila("Certificado", (obra.certs || []).length ? fmtEUR((obra.certs || []).reduce((s, c) => s + (Number(c.importe) || 0), 0)) : "")}
      ${fila("Responsable", [obra.responsable].concat(obra.colaboradores || []).filter(Boolean).join(", "))}
      ${fila("Administración", obra.admFincas)}
      ${fila("Contacto", [obra.contactoNombre, obra.telefono, obra.email].filter(Boolean).join(" · "))}
      ${fila("Tipos de obra", (obra.tipos || []).join(", "))}
      </table>
      ${obra.subEstado !== "no" || obra.subImporte ? `<h2>Subvención</h2><table>
      ${fila("Situación", (SUB[obra.subEstado] || {}).label || "")}
      ${fila("Programa", obra.subTipo)}
      ${fila("Importe estimado", obra.subImporte ? fmtEUR(obra.subImporte) : "")}
      ${fila("Edificio", [obra.viviendas ? obra.viviendas + " viviendas" : "", obra.m2Locales ? obra.m2Locales + " m² de local" : ""].filter(Boolean).join(" · "))}
      ${fila("Plazo de solicitud", obra.subLimite ? fmtDia(obra.subLimite) : "")}
      </table>` : ""}
      <h2>Recorrido</h2><p style="font-size:14px">${hist}</p>
      ${certsInf ? `<h2>Certificaciones</h2><ul>${certsInf}</ul>` : ""}
      ${partesInf ? `<h2>Partes de obra recientes</h2><ul>${partesInf}</ul>` : ""}
      ${reqs ? `<h2>Requerimientos</h2><ul>${reqs}</ul>` : ""}
      ${aps ? `<h2>Últimos apuntes</h2><ul>${aps}</ul>` : ""}
      <p style="margin-top:26px;color:#75757A;font-size:11px">Generado por la Central de Obras · Revestimientos Proyecton S.L.U.</p>
      <script>window.print()<\/script></body></html>`);
    w.document.close();
  };

  // calcula la ayuda con las cifras del BOE: el menor entre el % del importe y el tope por viviendas (+ locales)
  const calcularSubvencion = () => {
    const t = TRAMOS_PGE.find((x) => x.v === obra.subTipo);
    if (!t || !t.pct) return;
    if (!obra.importe) { addApunte(obra.id, { tipo: "nota", autor: quien || "", texto: "No se pudo calcular la subvención: la obra no tiene importe." }); return; }
    const viv = Number(obra.viviendas) || 0;
    if (t.topeViv && !viv) return;
    const porPct = Math.round(obra.importe * t.pct / 100);
    const m2 = Number(obra.m2Locales) || 0;
    const tope = t.topeViv ? viv * t.topeViv + (t.euroM2 ? m2 * t.euroM2 : 0) : Infinity;
    const sub = Math.min(porPct, tope);
    updateObra(obra.id, { subImporte: sub });
    addApunte(obra.id, {
      tipo: "nota", autor: quien || "",
      texto: `Subvención calculada (${t.v}): ${t.pct}% de ${fmtEUR(obra.importe)} = ${fmtEUR(porPct)}` +
        (tope !== Infinity ? `; tope ${viv} viv × ${fmtEUR(t.topeViv)}${m2 && t.euroM2 ? ` + ${m2} m² × ${t.euroM2} €` : ""} = ${fmtEUR(tope)}` : "") +
        ` → ${fmtEUR(sub)} (RD 326/2026).`,
    });
  };
  const misAvisos = avisos.filter((a) => a.obraId === obra.id);
  const apuntes = [...obra.apuntes].sort((a, b) => b.fecha.localeCompare(a.fecha));
  const sugeridos = (REQS_SUGERIDOS[obra.estado] || []).filter((s) => !obra.requerimientos.some((r) => r.texto === s));
  const [reqCustom, setReqCustom] = useState("");
  const pendientes = puntosPend(obra);
  const hechos = obra.puntos.filter((p) => p.hecho);
  const cerrada = obra.estado === "perdida";

  return (
    <Modal title="Ficha de obra" onClose={onClose} wide>
      {/* cabecera */}
      <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
        <div className="min-w-0">
          <p className="text-xl font-extrabold leading-tight flex items-start gap-2" style={{ color: C.ink }}>
            <span className="flex-shrink-0" style={{ marginTop: 7 }}><PuntoSalud obra={obra} size={12} /></span>
            <span>{obra.nombre}</span>
          </p>
          <p className="text-sm mt-0.5" style={{ color: C.mut }}>
            {[obra.direccion, obra.municipio].filter(Boolean).join(" · ") || "Sin dirección"}
          </p>
          <div className="flex flex-wrap gap-1.5 mt-2">
            <EstadoBadge estado={obra.estado} conDias desde={obra.estadoDesde} />
            {obra.prioridad === "alta" && <Badge tone="red"><Flag size={11} /> Prioridad alta</Badge>}
            {obra.tipos.map((t) => <Badge key={t}>{t}</Badge>)}
            <span className="inline-flex items-center gap-1.5 rounded-full pl-2 pr-0.5 py-0.5" style={{ background: C.bone }}>
              <span className="text-xs font-semibold" style={{ color: C.mut }}>Comercial</span>
              <SelectComercial valor={obra.responsable} equipo={data.equipo} onCambiar={(n) => onComercial(obra.id, n)} ancho="auto" />
            </span>
            {(obra.colaboradores || []).map((c) => <Badge key={c} title="Interviene en la obra">+ {c}</Badge>)}
            {obra.origen && <Badge title="Origen">{obra.origen}</Badge>}
            {obra.distrito && <Badge title="Distrito (del geoportal de Madrid)">{obra.distrito}</Badge>}
            {obra.anioConstruccion > 0 && (obra.anioConstruccion >= 2006
              ? <Badge tone="warn" title="El Plan Estatal exige edificio anterior a 2006">Año {obra.anioConstruccion} · fuera del PGE</Badge>
              : <Badge title="Año de construcción (Catastro)">Año {obra.anioConstruccion}</Badge>)}
            {cerrada && obra.motivoPerdida && <Badge tone="warn">Motivo: {obra.motivoPerdida}</Badge>}
          </div>
          {(() => {
            const tel = telefonoDeObra(obra);
            const cuerpo = encodeURIComponent(mensajeSeguimiento(obra));
            const asunto = encodeURIComponent(("Presupuesto " + (codigoDeObra(obra) || "")).trim() + " · " + obra.nombre);
            return (
              <div className="flex flex-wrap gap-1.5 mt-2">
                {tel && (
                  <a href={"tel:+34" + tel} className={btnContacto} style={{ borderColor: C.line, color: C.ink }} title="En el móvil marca directamente">
                    <Phone size={13} /> Llamar
                  </a>
                )}
                {tel && esMovil(tel) && (
                  <a href={"https://wa.me/34" + tel + "?text=" + cuerpo} target="_blank" rel="noopener noreferrer"
                    className={btnContacto} style={{ borderColor: C.ok, color: C.ok }} title="Abre WhatsApp con el mensaje de seguimiento ya escrito">
                    <MessageCircle size={13} /> WhatsApp
                  </a>
                )}
                {obra.email && (
                  <a href={"mailto:" + obra.email + "?subject=" + asunto + "&body=" + cuerpo}
                    className={btnContacto} style={{ borderColor: C.line, color: C.ink }} title="Abre el correo con el mensaje de seguimiento ya escrito">
                    <Mail size={13} /> Email de seguimiento
                  </a>
                )}
                <a href={"https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(direccionDeObra(obra) + ", " + (obra.municipio || "Madrid"))}
                  target="_blank" rel="noopener noreferrer" className={btnContacto} style={{ borderColor: C.line, color: C.ink }}
                  title="Ver la calle en el mapa antes de la visita">
                  <MapPin size={13} /> Mapa
                </a>
                <button onClick={traerCatastro} disabled={catBusy} className={btnContacto}
                  style={{ borderColor: "#1C5CAB", color: "#1C5CAB", opacity: catBusy ? 0.5 : 1 }}
                  title="Trae del Catastro las viviendas, los locales, el año y la foto (solo lectura)">
                  <Building2 size={13} /> {catBusy ? "Consultando…" : "Catastro"}
                </button>
              </div>
            );
          })()}
        </div>
        <div className="text-right flex-shrink-0">
          {editImporte ? (
            <input type="number" min="0" autoFocus
              className="text-xl font-extrabold text-right rounded-lg border-2 px-2 py-0.5 w-44"
              style={{ color: C.red, borderColor: C.red }}
              value={impTxt} onChange={(e) => setImpTxt(e.target.value)}
              onBlur={guardarImporte}
              onKeyDown={(e) => { if (e.key === "Enter") guardarImporte(); if (e.key === "Escape") setEditImporte(false); }} />
          ) : (
            <button onClick={() => { setImpTxt(obra.importe || ""); setEditImporte(true); }}
              className="group inline-flex items-center gap-1.5 rounded-lg px-1.5 -mx-1.5 hover:bg-red-50"
              title="Pulsa para corregir el importe (queda apuntado en el diario)">
              <span className="text-2xl font-extrabold" style={{ color: C.red }}>{fmtEUR(obra.importe)}</span>
              <Pencil size={13} className="opacity-30 group-hover:opacity-100 flex-shrink-0" style={{ color: C.red }} />
            </button>
          )}
          {obra.cobrado > 0 && (
            <p className="text-xs font-semibold" style={{ color: C.mut }}>cobrado {fmtEUR(obra.cobrado)} ({pct(obra.importe ? obra.cobrado / obra.importe : 0)})</p>
          )}
          {obra.subEstado !== "no" && (
            <p className="text-xs font-semibold mt-0.5 inline-flex items-center gap-1 justify-end" style={{ color: "#1C5CAB" }}>
              <Euro size={11} /> {obra.subImporte ? fmtEUR(obra.subImporte) : "subvención"} · {(SUB[obra.subEstado] || {}).label || ""}
            </p>
          )}
          <p className="text-xs mt-0.5" style={{ color: C.mut }}>alta {fmtFecha(obra.creado)}</p>
          {obra.refCatastral && (
            <button onClick={() => { try { window.open(CATASTRO_FOTO + obra.refCatastral, "_blank"); } catch (e) {} }}
              className="mt-2 rounded-lg overflow-hidden border block ml-auto" style={{ borderColor: C.line, width: 132 }}
              title={"Fachada según el Catastro · ref. " + obra.refCatastral + " · toca para ampliar"}>
              <img src={CATASTRO_FOTO + obra.refCatastral} alt="Fachada (Catastro)" loading="lazy"
                style={{ width: "100%", display: "block" }}
                onError={(e) => { e.target.parentElement.style.display = "none"; }} />
            </button>
          )}
        </div>
      </div>

      {/* recorrido de estados */}
      {!cerrada && (
        <div className="mt-4 rounded-xl border px-3 py-2" style={{ borderColor: C.line }}>
          <Stepper obra={obra} setEstado={setEstado} />
        </div>
      )}
      {obra.historial.length > 1 && (
        <p className="text-xs mt-1.5" style={{ color: C.mut }}>
          {obra.historial.map((h, i) => `${(EST[h.estado] || {}).label || h.estado} ${fmtDia(h.fecha.slice(0, 10))}`).join("  →  ")}
        </p>
      )}
      {obra.estado === "estudio" && obra.fase && obra.fase !== "actualizacion" && (
        <p className="text-xs mt-1.5" style={{ color: C.mut }}>
          {obra.fase === "enviado"
            ? <>Con María: <b>{(FASES_MARIA.find((f) => f.id === (obra.bandeja || "entrada")) || {}).label || "Entrada"}</b></>
            : <>En el tablero de César, Dani y David: <b>{(FASES_PRESUPUESTO.find((f) => f.id === obra.fase) || {}).label || obra.fase}</b></>}
        </p>
      )}
      {/* requisitos al completo: la ficha propone el siguiente paso sola */}
      {!cerrada && (() => {
        const cadena = ["estudio", "presupuesto", "contratada", "ejecucion", "finalizada"];
        const i = cadena.indexOf(obra.estado);
        if (i < 0 || i >= cadena.length - 1) return null;
        const reqs = obra.requerimientos || [];
        if (reqs.length === 0 || reqs.some((r) => !r.hecho)) return null;
        const sig = cadena[i + 1];
        return (
          <div className="mt-3 rounded-xl border p-2.5 flex items-center justify-between gap-2 flex-wrap" style={{ borderColor: "#BFE3D9", background: "#E9F6F1" }}>
            <p className="text-sm" style={{ color: "#0F6B57" }}>
              <b>Todos los requerimientos están completos.</b> ¿Pasamos la obra a {EST[sig].label}?
            </p>
            <BtnPrimary onClick={() => setEstado(obra.id, sig)}><ChevronRight size={14} /> Pasar a {EST[sig].label}</BtnPrimary>
          </div>
        );
      })()}

      {/* modificaciones: María lo devuelve a César, Dani y David con la especificación */}
      {(obra.estado === "presupuesto" || (obra.estado === "estudio" && obra.fase === "enviado")) && (
        <div className="mt-3 rounded-xl border p-2.5" style={{ borderColor: C.line, background: C.bone }}>
          {modOpen ? (
            <div>
              <p className="text-xs font-bold uppercase tracking-wider mb-1.5" style={{ color: C.ink }}>
                ¿Qué hay que modificar? Se lo pasa a César, Dani y David (columna Actualizaciones)
              </p>
              <textarea rows={2} className={inputCls} style={inputStyle} autoFocus
                placeholder="Ej.: la administración pide quitar los patios y añadir canalones; la instaladora sube el precio de la aerotermia…"
                value={modTxt} onChange={(e) => setModTxt(e.target.value)} />
              <div className="flex justify-end gap-2 mt-2">
                <BtnGhost onClick={() => { setModOpen(false); setModTxt(""); }}>Cancelar</BtnGhost>
                <BtnPrimary disabled={!modTxt.trim()} onClick={pedirModificacion}>
                  <RotateCcw size={14} /> Pasar a Actualizaciones
                </BtnPrimary>
              </div>
            </div>
          ) : (
            <div className="flex items-center justify-between gap-2 flex-wrap">
              <p className="text-sm" style={{ color: C.txt }}>
                ¿La administración o la instaladora piden cambios en el presupuesto?
              </p>
              <BtnGhost onClick={() => setModOpen(true)}><RotateCcw size={14} /> Pedir modificación</BtnGhost>
            </div>
          )}
        </div>
      )}
      {obra.estado === "estudio" && obra.fase === "actualizacion" && obra.modificacion && (
        <div className="mt-3 rounded-xl border p-2.5" style={{ borderColor: C.red, background: "#FDF7F6" }}>
          <p className="text-sm" style={{ color: C.redDark }}>
            <b>En Actualizaciones — {obra.modificacion.de || "María"} pidió el {fmtFecha(obra.modificacion.fecha)}:</b> {obra.modificacion.texto}
          </p>
          <p className="text-xs mt-1" style={{ color: C.mut }}>Cuando esté corregido, César o Dani lo arrastran otra vez a "Enviado" en su tablero y vuelve al seguimiento de María.</p>
        </div>
      )}

      {/* avisos de esta obra */}
      {misAvisos.length > 0 && (
        <div className="mt-3 rounded-xl border p-2.5 space-y-1" style={{ borderColor: C.red, background: "#FDF7F6" }}>
          {misAvisos.map((a) => (
            <p key={a.id} className="text-sm inline-flex items-center gap-2 w-full" style={{ color: C.redDark }}>
              <AlertTriangle size={13} className="flex-shrink-0" style={{ color: a.nivel === "rojo" ? C.red : a.nivel === "ambar" ? C.warn : C.azul }} />
              <b>{a.texto}</b>{a.detalle ? <span style={{ color: C.mut }}>· {a.detalle}</span> : null}
            </p>
          ))}
        </div>
      )}

      {/* cuaderno de obra · la obra hoy: semáforo, avance, plazos y próxima visita */}
      {enObra && (() => {
        const fin = finPrevistoDe(obra);
        const dFin = fin ? diasHasta(fin) : null;
        return (
          <div className="mt-4 rounded-xl border p-3" style={{ borderColor: obra.marcha === "parada" && obra.estado === "ejecucion" ? C.red : C.line, background: obra.marcha === "parada" && obra.estado === "ejecucion" ? "#FDF7F6" : "#fff" }}>
            <div className="flex items-center justify-between gap-2 flex-wrap mb-2">
              <p className="text-xs font-bold uppercase tracking-wider inline-flex items-center gap-1.5" style={{ color: C.ink }}>
                <HardHat size={14} style={{ color: C.red }} /> La obra, hoy
              </p>
              {obra.estado === "ejecucion" && (
                <div className="flex gap-1.5 flex-wrap">
                  {MARCHAS.map((m) => (
                    <button key={m.id} onClick={() => ponerMarcha(m.id)}
                      className="px-2.5 py-1 rounded-full text-xs font-bold border transition-colors"
                      style={obra.marcha === m.id
                        ? { background: m.color, color: "#fff", borderColor: m.color }
                        : { background: "#fff", color: m.color, borderColor: m.tint }}>
                      {m.label}
                    </button>
                  ))}
                </div>
              )}
            </div>
            {obra.estado === "ejecucion" && obra.marcha !== "bien" && (
              <input className={inputCls + " mb-2.5"} style={{ ...inputStyle, borderColor: marchaMeta(obra.marcha).color }}
                placeholder={obra.marcha === "parada" ? "¿Por qué está parada? Licencia, vecinos, material, lluvia…" : "¿Qué problema hay?"}
                value={obra.marchaNota || ""} onChange={(e) => updateObra(obra.id, { marchaNota: e.target.value })} />
            )}
            <div className="flex items-center justify-between mb-1">
              <span className="text-xs font-semibold" style={{ color: C.mut }}>Avance de obra</span>
              <span className="text-sm font-extrabold" style={{ color: C.red }}>{obra.avance}%</span>
            </div>
            {obra.estado === "ejecucion"
              ? <input type="range" min="0" max="100" step="5" className="w-full" value={obra.avance}
                  onChange={(e) => updateObra(obra.id, { avance: Number(e.target.value) })} />
              : <BarraProgreso valor={obra.avance} color={C.ok} />}
            {obra.estado === "ejecucion" && obra.importe > 0 && obra.cobrado > 0 && (() => {
              const pctCobrado = Math.min(100, Math.round((obra.cobrado / obra.importe) * 100));
              if (Math.abs(pctCobrado - obra.avance) <= 5) return null;
              return (
                <p className="text-xs mt-1 flex items-center gap-2 flex-wrap" style={{ color: C.mut }}>
                  Según lo cobrado ({fmtEUR(obra.cobrado)} de {fmtEUR(obra.importe)}) el avance sería un <b>{pctCobrado}%</b>.
                  <button className="underline font-semibold" style={{ color: C.ink }}
                    onClick={() => updateObra(obra.id, { avance: pctCobrado })}>Usar ese dato</button>
                </p>
              );
            })()}
            <div className="flex items-center gap-x-4 gap-y-2 flex-wrap mt-3">
              <label className="inline-flex items-center gap-1.5 text-xs font-semibold" style={{ color: C.mut }}>
                Empezó
                <input type="date" className="text-xs rounded-md border px-1.5 py-1" style={{ borderColor: C.line, color: C.txt }}
                  value={obra.fechaInicio || ""} onChange={(e) => updateObra(obra.id, { fechaInicio: e.target.value })} />
              </label>
              <label className="inline-flex items-center gap-1.5 text-xs font-semibold" style={{ color: C.mut }}>
                Plazo
                <input type="number" min="0" max="60" className="text-xs rounded-md border px-1.5 py-1 w-14" style={{ borderColor: C.line, color: C.txt }}
                  value={obra.plazoMeses || ""} placeholder="—" onChange={(e) => updateObra(obra.id, { plazoMeses: Number(e.target.value) || 0 })} />
                meses
              </label>
              {fin && (
                <span className="inline-flex items-center gap-1.5 text-xs font-semibold" style={{ color: C.mut }}>
                  Fin previsto <b style={{ color: C.ink }}>{fmtDia(fin)}</b>
                  {obra.estado === "ejecucion" && (
                    <Badge tone={dFin < 0 ? "red" : dFin <= 21 ? "warn" : "neutral"}>
                      {dFin < 0 ? "pasado " + (-dFin) + " día" + (dFin === -1 ? "" : "s")
                        : dFin === 0 ? "termina HOY"
                        : dFin < 15 ? "quedan " + dFin + " días"
                        : "quedan " + Math.round(dFin / 7) + " semanas"}
                    </Badge>
                  )}
                </span>
              )}
            </div>
            {obra.estado === "ejecucion" && (
              <div className="flex items-center gap-2 flex-wrap mt-2">
                <span className="text-xs font-semibold" style={{ color: C.mut }}>Próxima visita</span>
                <input type="date" className="text-xs rounded-md border px-1.5 py-1" style={{ borderColor: C.line, color: C.txt }}
                  value={obra.proximaVisita || ""} onChange={(e) => ponerProximaVisita(e.target.value)} />
                {obra.proximaVisita && (() => {
                  const d = diasHasta(obra.proximaVisita);
                  return <Badge tone={d < 0 ? "red" : d <= 1 ? "warn" : "neutral"}>{d < 0 ? "pasada" : d === 0 ? "HOY" : d === 1 ? "mañana" : "en " + d + " días"}</Badge>;
                })()}
                <span className="text-xs" style={{ color: C.mut }}>· sale en Tu día y en la Agenda</span>
              </div>
            )}
          </div>
        );
      })()}

      {/* qué toca ahora: el siguiente paso de la obra, en grande y para tachar */}
      <div className="mt-4">
        <p className="text-xs font-bold uppercase tracking-wider mb-2 inline-flex items-center gap-1.5" style={{ color: C.ink }}>
          <ListChecks size={14} style={{ color: C.red }} /> Qué toca ahora
          {pendientes.length > 0 && <Badge tone="red">{pendientes.length}</Badge>}
        </p>
        {(() => {
          const ordenados = [...pendientes].sort((a, b) => (a.fecha || "9999").localeCompare(b.fecha || "9999"));
          if (!ordenados.length) {
            return <p className="text-sm px-1 py-1" style={{ color: cerrada ? C.mut : C.warn }}>{cerrada ? "Sin puntos pendientes." : "Sin próximo paso. Toda obra viva debería tener al menos un punto con fecha."}</p>;
          }
          const filaPunto = (p, grande) => (
            <div key={p.id} className={`flex items-center gap-2.5 rounded-xl hover:bg-neutral-50 group ${grande ? "py-2 px-2.5" : "py-1 px-1"}`}
              style={grande ? { background: C.bone } : {}}>
              <button onClick={() => togglePunto(obra.id, p.id)} title="Marcar como hecho"
                className={`${grande ? "w-6 h-6" : "w-5 h-5"} rounded-md border-2 flex-shrink-0 flex items-center justify-center transition-colors`}
                style={{ borderColor: p.fecha && p.fecha < hoy ? C.red : C.mut }}>
                <Check size={grande ? 15 : 13} className="opacity-0 group-hover:opacity-60" style={{ color: C.ok }} />
              </button>
              {p.fecha && <Badge tone={p.fecha < hoy ? "red" : p.fecha === hoy ? "warn" : "neutral"}>{fmtDia(p.fecha)}</Badge>}
              <span className={`${grande ? "text-base font-bold" : "text-sm"} flex-1`} style={{ color: C.ink }}>{p.texto}</span>
              {p.responsable && <Avatar nombre={p.responsable} />}
              <button onClick={() => delPunto(obra.id, p.id)} className="opacity-0 group-hover:opacity-100 p-1 rounded hover:bg-neutral-100" title="Eliminar">
                <Trash2 size={13} style={{ color: C.mut }} />
              </button>
            </div>
          );
          return (
            <div className="space-y-1">
              {filaPunto(ordenados[0], true)}
              {ordenados.slice(1).map((p) => filaPunto(p, false))}
            </div>
          );
        })()}
        {hechos.length > 0 && (
          <button onClick={() => setVerHechos(!verHechos)} className="text-xs font-semibold inline-flex items-center gap-1 px-1 py-1" style={{ color: C.mut }}>
            <ChevronDown size={13} style={{ transform: verHechos ? "rotate(180deg)" : "none", transition: "transform .15s" }} />
            {hechos.length} completado{hechos.length === 1 ? "" : "s"}
          </button>
        )}
        {verHechos && hechos.map((p) => (
          <div key={p.id} className="flex items-center gap-2.5 px-1 py-1 group">
            <button onClick={() => togglePunto(obra.id, p.id)} title="Recuperar"
              className="w-5 h-5 rounded-md flex-shrink-0 flex items-center justify-center" style={{ background: C.okTint }}>
              <Check size={13} style={{ color: C.ok }} />
            </button>
            <span className="text-sm flex-1 line-through" style={{ color: C.mut }}>{p.texto}</span>
            {p.fechaHecho && <span className="text-xs" style={{ color: C.mut }}>{fmtFecha(p.fechaHecho)}</span>}
          </div>
        ))}
        <div className="mt-2">
          <FormPunto equipo={data.equipo} defecto={obra.responsable} tipicos={data.config.puntosTipicos} onAdd={(p) => addPunto(obra.id, p)} />
        </div>
        {obra.estado === "presupuesto" && !obra.puntos.some((p) => p.auto === "seg") && (
          <div className="mt-2">
            <BtnGhost onClick={() => updateObra(obra.id, { puntos: [...obra.puntos, ...puntosSeguimiento()] })}>
              <Clock size={14} /> Programar seguimiento (llamadas a 7, 21 y 45 días)
            </BtnGhost>
          </div>
        )}
      </div>

      {/* cuaderno de obra · certificaciones: lo contratado, lo certificado y lo cobrado */}
      {enObra && (
        <div className="mt-4 rounded-xl border p-3" style={{ borderColor: C.line }}>
          <p className="text-xs font-bold uppercase tracking-wider inline-flex items-center gap-1.5 mb-2" style={{ color: C.ink }}>
            <Receipt size={14} style={{ color: C.red }} /> Certificaciones y dinero
          </p>
          {obra.importe > 0 ? (
            <div className="mb-2.5">
              <div className="grid grid-cols-3 gap-2 mb-2">
                <div>
                  <p className="text-xs font-semibold" style={{ color: C.mut }}>Contratado</p>
                  <p className="text-sm sm:text-base font-extrabold" style={{ color: C.ink, fontVariantNumeric: "tabular-nums" }}>{fmtEUR(obra.importe)}</p>
                </div>
                <div>
                  <p className="text-xs font-semibold" style={{ color: C.mut }}>Certificado</p>
                  <p className="text-sm sm:text-base font-extrabold" style={{ color: C.azul, fontVariantNumeric: "tabular-nums" }}>{fmtEUR(certificado)} <span className="text-xs font-semibold">({pct(certificado / obra.importe)})</span></p>
                </div>
                <div>
                  <p className="text-xs font-semibold" style={{ color: C.mut }}>Cobrado</p>
                  <p className="text-sm sm:text-base font-extrabold" style={{ color: C.ok, fontVariantNumeric: "tabular-nums" }}>{fmtEUR(obra.cobrado || 0)} <span className="text-xs font-semibold">({pct((obra.cobrado || 0) / obra.importe)})</span></p>
                </div>
              </div>
              <BarraProgreso valor={Math.min(100, (certificado / obra.importe) * 100)} color={C.azul} alto={6} />
              <div className="mt-1"><BarraProgreso valor={Math.min(100, ((obra.cobrado || 0) / obra.importe) * 100)} color={C.ok} alto={6} /></div>
            </div>
          ) : (
            <p className="text-xs mb-2 rounded-lg px-2 py-1.5" style={{ background: C.warnTint, color: "#8A5A15" }}>
              La obra no tiene importe apuntado: ponlo en Editar datos para ver los porcentajes.
            </p>
          )}
          <div className="space-y-1">
            {certs.map((c) => (
              <div key={c.id} className="flex items-center gap-2 flex-wrap px-1 py-1 rounded-lg hover:bg-neutral-50 group">
                <span className="text-sm font-bold" style={{ color: C.ink }}>nº {c.n}</span>
                <span className="text-xs" style={{ color: C.mut }}>{fmtDia(c.fecha)}</span>
                <span className="text-sm font-bold" style={{ color: C.ink, fontVariantNumeric: "tabular-nums" }}>{fmtEUR(c.importe)}</span>
                <div className="flex gap-1 ml-auto">
                  {CERT_ESTADOS.map((e) => (
                    <button key={e.id} onClick={() => setCertEstado(c, e.id)} title={e.id === "cobrada" ? "Al marcarla, el cobrado de la obra sube solo" : ""}
                      className="px-2 py-0.5 rounded-full text-xs font-bold border transition-colors"
                      style={c.estado === e.id
                        ? (e.id === "cobrada" ? { background: C.ok, color: "#fff", borderColor: C.ok } : { background: C.ink, color: "#fff", borderColor: C.ink })
                        : { background: "#fff", color: C.mut, borderColor: C.line }}>
                      {e.label}
                    </button>
                  ))}
                </div>
                <button onClick={() => delCert(c)} className="opacity-0 group-hover:opacity-100 p-1 rounded hover:bg-neutral-100" title="Eliminar certificación">
                  <Trash2 size={13} style={{ color: C.mut }} />
                </button>
              </div>
            ))}
            {certs.length === 0 && (
              <p className="text-sm px-1" style={{ color: C.mut }}>Sin certificaciones todavía. Apunta la primera cuando la pases: cada una lleva su importe y su estado hasta el cobro.</p>
            )}

        </div>

              {incidenciasAbiertas.length > 0 && <Badge tone="red">{incidenciasAbiertas.length} incidencia{incidenciasAbiertas.length === 1 ? "" : "s"} abierta{incidenciasAbiertas.length === 1 ? "" : "s"}</Badge>}
            </p>
            {sinClaveFotos && (
              <div className="rounded-xl border p-2.5 mb-2 flex items-center gap-2 flex-wrap" style={{ borderColor: C.warn, background: C.warnTint }}>

                </p>
                <input type="password" className="text-xs rounded-md border px-2 py-1 w-28" style={{ borderColor: C.warn }}
                  value={claveInput} onChange={(e) => setClaveInput(e.target.value)}

                <button onClick={guardarClaveFotos} className="text-xs font-bold px-2.5 py-1 rounded-lg border"
                  style={{ color: "#8A5A15", borderColor: C.warn, background: "#fff", opacity: validandoClave ? 0.5 : 1 }}>
                  {validandoClave ? "Comprobando…" : "Vale"}

              </div>

                      <div className="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5"

                        <p className="text-xs font-bold" style={{ color: C.ink }}>

                      <div className="flex flex-col items-end gap-1 flex-shrink-0">

                            {abierta ? "Marcar resuelta" : "Reabrir"}

                        </button>
                      </div>
                    </div>
                  </div>

                <button onClick={() => setVerPartes(!verPartes)} className="text-xs font-semibold inline-flex items-center gap-1 px-1 py-1" style={{ color: C.mut }}>

                </button>

            </div>
          </div>

      })()}

      {/* cuaderno de obra · galería: todas las fotos por meses */}

        <div className="rounded-xl border mt-4" style={{ borderColor: C.line }}>
          <button onClick={() => setVerGaleria(!verGaleria)} className="w-full flex items-center justify-between gap-2 px-3 py-2 text-left">

              <span className="font-medium normal-case tracking-normal" style={{ color: C.mut }}>({todasFotos.length})</span>
            </span>

          </button>
          {verGaleria && (
            <div className="px-3 pb-3">
              {(() => {

                todasFotos.forEach((f) => {
                  const mes = new Date(f.fecha).toLocaleDateString("es-ES", { month: "long", year: "numeric" });
                  const g = grupos.find((x) => x.mes === mes);
                  if (g) g.fotos.push(f); else grupos.push({ mes, fotos: [f] });
                });
                return grupos.map((g) => (
                  <div key={g.mes} className="mb-2">

                    </div>
                  </div>
                ));
              })()}
            </div>
          )}
        </div>
      )}

              <button onClick={leerPresupuestoDropbox} disabled={dbxBusy} className={btnContacto}
                style={{ borderColor: C.line, color: C.ink, opacity: dbxBusy ? 0.5 : 1 }}

                <FileText size={13} /> {dbxBusy ? "Leyendo…" : "Leer presupuesto del Dropbox"}
              </button>
            )}
          </div>
          {obra.anioConstruccion >= 2006 && obra.subEstado !== "no" && (
            <p className="text-xs mb-2 rounded-lg px-2 py-1.5" style={{ background: "#FDF7F6", color: C.redDark }}>
              Ojo: el edificio es de {obra.anioConstruccion} y el Plan Estatal exige anterior a 2006 — revisa si esta ayuda aplica.
            </p>
          )}
          {obra.estado === "contratada" && obra.importe > 0 && (
            <div className="mb-2.5">
              <div className="flex items-center justify-between mb-1">
                <span className="text-xs font-semibold" style={{ color: C.mut }}>Cobrado</span>
                <span className="text-xs font-bold" style={{ color: C.ink, fontVariantNumeric: "tabular-nums" }}>
                  {fmtEUR(obra.cobrado || 0)} de {fmtEUR(obra.importe)} ({pct((obra.cobrado || 0) / obra.importe)})
                </span>
              </div>
              <BarraProgreso valor={Math.min(100, ((obra.cobrado || 0) / obra.importe) * 100)} color={C.ok} />
            </div>
          )}

              {SUB_ESTADOS.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
            </select>
            {obra.subEstado !== "no" && (
              <select className={inputCls + " w-auto"} style={inputStyle} value={obra.subTipo || ""} title="Tramo del Plan Estatal al que opta"

                <option value="">Tramo…</option>
                {TRAMOS_PGE.map((t) => <option key={t.v} value={t.v}>{t.v}</option>)}
                {obra.subTipo && !TRAMOS_PGE.some((t) => t.v === obra.subTipo) && <option value={obra.subTipo}>{obra.subTipo}</option>}
              </select>
            )}
            {obra.subEstado !== "no" && (editSubImp ? (
              <input type="number" min="0" autoFocus

                value={subImpTxt} onChange={(e) => setSubImpTxt(e.target.value)}
                onBlur={guardarSubImp}
                onKeyDown={(e) => { if (e.key === "Enter") guardarSubImp(); if (e.key === "Escape") setEditSubImp(false); }} />
            ) : (
              <button onClick={() => { setSubImpTxt(obra.subImporte || ""); setEditSubImp(true); }}

                title="Pulsa para corregir el importe de la subvención">
                <span className="text-sm font-bold" style={{ color: "#1C5CAB", fontVariantNumeric: "tabular-nums" }}>
                  {obra.subImporte ? fmtEUR(obra.subImporte) : "importe sin definir"}
                </span>
                <Pencil size={11} className="opacity-30 group-hover:opacity-100 flex-shrink-0" style={{ color: "#1C5CAB" }} />
              </button>
            ))}
          </div>
          {obra.subEstado !== "no" && tramoHint(obra.subTipo) && (
            <p className="text-xs mt-1.5" style={{ color: "#1C5CAB" }}>{tramoHint(obra.subTipo)}</p>
          )}
          {obra.subEstado !== "no" && (() => {
            const t = TRAMOS_PGE.find((x) => x.v === obra.subTipo);
            if (!t || !t.pct) return null;
            return (
              <div className="flex items-center gap-2 mt-2 flex-wrap">

                    onChange={(e) => updateObra(obra.id, { viviendas: Number(e.target.value) || 0 })} /> viviendas
                </label>

                  <label className="inline-flex items-center gap-1 text-xs" style={{ color: C.txt }}>
                    <input type="number" min="0" className="text-xs rounded-md border px-1.5 py-1 w-16" style={{ borderColor: C.line }}

                      onChange={(e) => updateObra(obra.id, { m2Locales: Number(e.target.value) || 0 })} /> m² de local
                  </label>
                )}
                <BtnGhost onClick={calcularSubvencion} className="!px-2 !py-1 text-xs"><Euro size={13} /> Calcular subvención</BtnGhost>
              </div>

          })()}

                return (
                  <Badge tone={d <= 7 ? "red" : d <= 30 ? "warn" : "neutral"}>

                );
              })()}
            </div>
          )}
        </div>
      </div>

          <span className="inline-flex items-center gap-2 min-w-0">

                <YAxis allowDecimals={false} tick={axisTick} axisLine={false} tickLine={false} width={28} />
                <Tooltip formatter={(v) => [v, "Apuntes"]} contentStyle={tooltipStyle} cursor={{ fill: "rgba(0,0,0,0.04)" }} />
                <Bar dataKey="n" radius={[4, 4, 0, 0]} maxBarSize={28}>
                  {semanas.map((_, i) => <Cell key={i} fill={i === 7 ? C.red : "#B9B4AE"} />)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
          <p className="text-xs mt-1" style={{ color: C.mut }}>Un diario constante es la señal de una empresa coordinada.</p>
        </Card>
        <Card>
          <SectionTitle>Días de media en cada fase</SectionTitle>
          {tiempos.length === 0 ? (
            <p className="text-sm" style={{ color: C.mut }}>Cuando las obras cambien de fase se calculará cuánto tarda cada una de media.</p>
          ) : (
            <div className="space-y-2">
              {tiempos.map((x) => <HBar key={x.e.id} label={x.e.label} value={x.media} max={maxTiempo} right={`${x.media} días`} fill={x.e.color} />)}
            </div>
          )}
          {motivos.length > 0 && (
            <div className="mt-4 pt-3 border-t" style={{ borderColor: C.line }}>
              <p className="text-xs font-bold uppercase tracking-wider mb-2" style={{ color: C.mut }}>Motivos de pérdida</p>
              <div className="space-y-1.5">
                {motivos.map((x) => <HBar key={x.m} label={x.m} value={x.n} max={maxMotivo} right={`${x.n}`} fill="#75757A" />)}
              </div>
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}

/* ============================ FICHA DE OBRA ============================ */
function Stepper({ obra, setEstado }) {
  const idx = ESTADOS_TABLERO.findIndex((e) => e.id === obra.estado);
  return (
    <div className="flex items-center gap-0 overflow-x-auto py-1">
      {ESTADOS_TABLERO.map((e, i) => {
        const alcanzado = idx >= 0 && i <= idx;
        const actual = e.id === obra.estado;
        return (
          <React.Fragment key={e.id}>
            {i > 0 && <div className="h-0.5 flex-1 min-w-3" style={{ background: alcanzado ? EST[obra.estado].color : C.line }} />}
            <button onClick={() => !actual && setEstado(obra.id, e.id)} title={e.desc}
              className="flex flex-col items-center gap-1 px-1.5 flex-shrink-0 group">
              <span className={`w-5 h-5 rounded-full border-2 flex items-center justify-center transition-all ${actual ? "scale-125" : "group-hover:scale-110"}`}
                style={{ borderColor: alcanzado || actual ? e.color : C.line, background: alcanzado ? e.color : "#fff" }}>
                {alcanzado && !actual && <Check size={11} style={{ color: "#fff" }} />}
                {actual && <span className="w-2 h-2 rounded-full" style={{ background: "#fff" }} />}
              </span>
              <span className="text-xs font-bold whitespace-nowrap" style={{ color: actual ? e.color : C.mut }}>{e.label}</span>
            </button>
          </React.Fragment>
        );
      })}
    </div>
  );
}

function FormPunto({ equipo, defecto, tipicos, onAdd }) {
  const [texto, setTexto] = useState("");
  const [fecha, setFecha] = useState("");
  const [resp, setResp] = useState(defecto || "");
  const lista = tipicos || [];
  const guardar = () => {
    if (!texto.trim()) return;
    onAdd({ texto: texto.trim(), fecha, responsable: resp });
    setTexto(""); setFecha("");
  };
  return (
    <div>
      {lista.length > 0 && (
        <div className="flex flex-wrap gap-1.5 mb-2">
          {lista.map((t) => (
            <button key={t} type="button" onClick={() => setTexto(texto === t ? "" : t)}
              className="px-2.5 py-1 rounded-full text-xs font-semibold border transition-colors"
              style={texto === t
                ? { background: C.ink, color: "#fff", borderColor: C.ink }
                : { background: "#fff", color: C.txt, borderColor: C.line }}>
              {t}
            </button>
          ))}
        </div>
      )}
      <div className="flex flex-col sm:flex-row gap-2">
        <input className={inputCls} style={inputStyle} placeholder="Elige un punto típico arriba o escribe el tuyo…"
          value={texto} onChange={(e) => setTexto(e.target.value)} onKeyDown={(e) => e.key === "Enter" && guardar()} />
        <input type="date" className={inputCls + " sm:w-40"} style={inputStyle} value={fecha} onChange={(e) => setFecha(e.target.value)} />
        <select className={inputCls + " sm:w-40"} style={inputStyle} value={resp} onChange={(e) => setResp(e.target.value)}>
          <option value="">Responsable…</option>
          {equipo.map((c) => <option key={c}>{c}</option>)}
        </select>
        <BtnPrimary onClick={guardar} disabled={!texto.trim()}><Plus size={15} /> Añadir</BtnPrimary>
      </div>
    </div>
  );
}

function FormApunte({ equipo, defecto, onSave }) {
  const [tipo, setTipo] = useState("nota");
  const [autor, setAutor] = useState(defecto || "");
  const [texto, setTexto] = useState("");
  const guardar = () => {
    if (!texto.trim()) return;
    onSave({ tipo, autor, texto: texto.trim() });
    setTexto("");
  };
  return (
    <div className="rounded-xl border p-3" style={{ borderColor: C.line, background: C.bone }}>
      <div className="flex flex-wrap gap-1.5 mb-2">
        {TIPOS_APUNTE.map(({ id, label, Icon }) => (
          <button key={id} onClick={() => setTipo(id)}
            className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition-colors"
            style={tipo === id
              ? { background: C.ink, color: "#fff", borderColor: C.ink }
              : { background: "#fff", color: C.ink, borderColor: C.line }}>
            <Icon size={13} /> {label}
          </button>
        ))}
      </div>
      <div className="flex flex-col sm:flex-row gap-2">
        <select className={inputCls + " sm:w-44"} style={inputStyle} value={autor} onChange={(e) => setAutor(e.target.value)}>
          <option value="">Quién lo apunta…</option>
          {equipo.map((c) => <option key={c}>{c}</option>)}
        </select>
        <input className={inputCls} style={inputStyle} placeholder="¿Qué ha pasado? Avance, acuerdo, incidencia, próximos pasos…"
          value={texto} onChange={(e) => setTexto(e.target.value)} onKeyDown={(e) => e.key === "Enter" && guardar()} />
        <BtnPrimary onClick={guardar} disabled={!texto.trim()}><Plus size={15} /> Anotar</BtnPrimary>
      </div>
    </div>
  );
}

function FichaObra({ obra, data, avisos, onClose, onEdit, setEstado, onPerdida, onReabrir, onDelete, onArchivar,
  addPunto, togglePunto, delPunto, addReq, toggleReq, delReq, addApunte, delApunte, updateObra }) {
  const hoy = hoyYMD();
  const [verHechos, setVerHechos] = useState(false);
  const misAvisos = avisos.filter((a) => a.obraId === obra.id);
  const apuntes = [...obra.apuntes].sort((a, b) => b.fecha.localeCompare(a.fecha));
  const sugeridos = (REQS_SUGERIDOS[obra.estado] || []).filter((s) => !obra.requerimientos.some((r) => r.texto === s));
  const [reqCustom, setReqCustom] = useState("");
  const pendientes = puntosPend(obra);
  const hechos = obra.puntos.filter((p) => p.hecho);
  const cerrada = obra.estado === "perdida";

  return (
    <Modal title="Ficha de obra" onClose={onClose} wide>
      {/* cabecera */}
      <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
        <div className="min-w-0">
          <p className="text-xl font-extrabold leading-tight flex items-start gap-2" style={{ color: C.ink }}>
            <span className="flex-shrink-0" style={{ marginTop: 7 }}><PuntoSalud obra={obra} size={12} /></span>
            <span>{obra.nombre}</span>
          </p>
          <p className="text-sm mt-0.5" style={{ color: C.mut }}>
            {[obra.direccion, obra.municipio].filter(Boolean).join(" · ") || "Sin dirección"}
          </p>
          <div className="flex flex-wrap gap-1.5 mt-2">
            <EstadoBadge estado={obra.estado} conDias desde={obra.estadoDesde} />
            {obra.prioridad === "alta" && <Badge tone="red"><Flag size={11} /> Prioridad alta</Badge>}
            {obra.tipos.map((t) => <Badge key={t}>{t}</Badge>)}
            {obra.responsable && <Badge tone="ink">{obra.responsable}</Badge>}
            {(obra.colaboradores || []).map((c) => <Badge key={c} title="Interviene en la obra">+ {c}</Badge>)}
            {obra.origen && <Badge title="Origen">{obra.origen}</Badge>}
            {cerrada && obra.motivoPerdida && <Badge tone="warn">Motivo: {obra.motivoPerdida}</Badge>}
          </div>
        </div>
        <div className="text-right flex-shrink-0">
          <p className="text-2xl font-extrabold" style={{ color: C.red }}>{fmtEUR(obra.importe)}</p>
          {obra.cobrado > 0 && (
            <p className="text-xs font-semibold" style={{ color: C.mut }}>cobrado {fmtEUR(obra.cobrado)} ({pct(obra.importe ? obra.cobrado / obra.importe : 0)})</p>
          )}
          <p className="text-xs mt-0.5" style={{ color: C.mut }}>alta {fmtFecha(obra.creado)}</p>
        </div>
      </div>

      {/* recorrido de estados */}
      {!cerrada && (
        <div className="mt-4 rounded-xl border px-3 py-2" style={{ borderColor: C.line }}>
          <Stepper obra={obra} setEstado={setEstado} />
        </div>
      )}

      {/* avisos de esta obra */}
      {misAvisos.length > 0 && (
        <div className="mt-3 rounded-xl border p-2.5 space-y-1" style={{ borderColor: C.red, background: "#FDF7F6" }}>
          {misAvisos.map((a) => (
            <p key={a.id} className="text-sm inline-flex items-center gap-2 w-full" style={{ color: C.redDark }}>
              <AlertTriangle size={13} className="flex-shrink-0" style={{ color: a.nivel === "rojo" ? C.red : a.nivel === "ambar" ? C.warn : C.azul }} />
              <b>{a.texto}</b>{a.detalle ? <span style={{ color: C.mut }}>· {a.detalle}</span> : null}
            </p>
          ))}
        </div>
      )}

      {/* contacto + economía */}
      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4">
        <div className="rounded-xl border p-3 space-y-1.5" style={{ borderColor: C.line }}>
          <p className="text-xs font-bold uppercase tracking-wider mb-1" style={{ color: C.mut }}>Contacto</p>
          <p className="text-sm flex items-center gap-2" style={{ color: C.ink }}><Users size={13} style={{ color: C.mut }} /> {obra.contactoNombre || "—"}{obra.admFincas ? ` · ${obra.admFincas}` : ""}</p>
          <p className="text-sm flex items-center gap-2"><Phone size={13} style={{ color: C.mut }} /> {obra.telefono ? <a href={`tel:${obra.telefono}`} className="hover:underline" style={{ color: C.ink }}>{obra.telefono}</a> : <span style={{ color: C.mut }}>—</span>}</p>
          <p className="text-sm flex items-center gap-2 min-w-0"><Mail size={13} style={{ color: C.mut }} /> {obra.email ? <a href={`mailto:${obra.email}`} className="hover:underline truncate" style={{ color: C.ink }}>{obra.email}</a> : <span style={{ color: C.mut }}>—</span>}</p>
          {(() => {
            const tel = telefonoDeObra(obra);
            if (!tel && !obra.email) return null;
            const cuerpo = encodeURIComponent(mensajeSeguimiento(obra));
            const asunto = encodeURIComponent(("Presupuesto " + (codigoDeObra(obra) || "")).trim() + " · " + obra.nombre);
            return (
              <div className="flex flex-wrap gap-1.5 pt-1.5">
                {tel && (
                  <a href={"tel:+34" + tel} className={btnContacto} style={{ borderColor: C.line, color: C.ink }} title="En el móvil marca directamente">
                    <Phone size={13} /> Llamar
                  </a>
                )}
                {tel && esMovil(tel) && (
                  <a href={"https://wa.me/34" + tel + "?text=" + cuerpo} target="_blank" rel="noopener noreferrer"
                    className={btnContacto} style={{ borderColor: C.ok, color: C.ok }} title="Abre WhatsApp con el mensaje de seguimiento ya escrito">
                    <MessageCircle size={13} /> WhatsApp
                  </a>
                )}
                {obra.email && (
                  <a href={"mailto:" + obra.email + "?subject=" + asunto + "&body=" + cuerpo}
                    className={btnContacto} style={{ borderColor: C.line, color: C.ink }} title="Abre el correo con el mensaje de seguimiento ya escrito">
                    <Mail size={13} /> Email de seguimiento
                  </a>
                )}
              </div>
            );
          })()}
          {obra.notas && <p className="text-sm mt-1 rounded-lg px-2.5 py-1.5" style={{ background: C.bone, color: C.txt }}>{obra.notas}</p>}
        </div>
        <div className="rounded-xl border p-3" style={{ borderColor: C.line }}>
          <p className="text-xs font-bold uppercase tracking-wider mb-1.5" style={{ color: C.mut }}>Subvención</p>
          <div className="flex items-center gap-2 flex-wrap">
            <select className={inputCls + " w-auto"} style={inputStyle} value={obra.subEstado}
              onChange={(e) => updateObra(obra.id, { subEstado: e.target.value })}>
              {SUB_ESTADOS.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
            </select>
            {obra.subEstado !== "no" && (
              <select className={inputCls + " w-auto"} style={inputStyle} value={obra.subTipo || ""} title="Tramo del Plan Estatal al que opta"
                onChange={(e) => updateObra(obra.id, { subTipo: e.target.value })}>
                <option value="">Tramo…</option>
                {TRAMOS_PGE.map((t) => <option key={t.v} value={t.v}>{t.v}</option>)}
                {obra.subTipo && !TRAMOS_PGE.some((t) => t.v === obra.subTipo) && <option value={obra.subTipo}>{obra.subTipo}</option>}
              </select>
            )}
            {obra.subEstado !== "no" && (
              <span className="text-sm font-bold" style={{ color: "#1C5CAB", fontVariantNumeric: "tabular-nums" }}>
                {obra.subImporte ? fmtEUR(obra.subImporte) : "importe sin definir"}
              </span>
            )}
          </div>
          {obra.subEstado !== "no" && tramoHint(obra.subTipo) && (
            <p className="text-xs mt-1.5" style={{ color: "#1C5CAB" }}>{tramoHint(obra.subTipo)}</p>
          )}
          {obra.subEstado === "solicitar" && (
            <div className="flex items-center gap-2 mt-2 flex-wrap">
              <span className="text-xs font-semibold uppercase tracking-wider" style={{ color: C.mut }}>Plazo para solicitarla</span>
              <input type="date" className="text-xs rounded-md border px-1.5 py-1" style={{ borderColor: C.line, color: C.txt }}
                value={obra.subLimite || ""} onChange={(e) => updateObra(obra.id, { subLimite: e.target.value })} />
              {obra.subLimite && (() => {
                const d = diasHasta(obra.subLimite);
                return (
                  <Badge tone={d <= 7 ? "red" : d <= 30 ? "warn" : "neutral"}>
                    {d < 0 ? "vencido hace " + (-d) + "d" : d === 0 ? "termina HOY" : "quedan " + d + "d"}
                  </Badge>
                );
              })()}
            </div>
          )}
          {(obra.estado === "ejecucion" || obra.estado === "finalizada") && (
            <div className="mt-3 pt-3 border-t" style={{ borderColor: C.line }}>
              <div className="flex items-center justify-between mb-1">
                <p className="text-xs font-bold uppercase tracking-wider" style={{ color: C.mut }}>Avance de obra</p>
                <span className="text-sm font-extrabold" style={{ color: C.red }}>{obra.avance}%</span>
              </div>
              <input type="range" min="0" max="100" step="5" className="w-full" value={obra.avance}
                onChange={(e) => updateObra(obra.id, { avance: Number(e.target.value) })} />
            </div>
          )}
        </div>
      </div>

      {/* puntos */}
      <div className="mt-5">
        <p className="text-xs font-bold uppercase tracking-wider mb-2 inline-flex items-center gap-1.5" style={{ color: C.ink }}>
          <ListChecks size={14} style={{ color: C.red }} /> Puntos a resolver
          {pendientes.length > 0 && <Badge tone="red">{pendientes.length}</Badge>}
        </p>
        {obra.estado === "presupuesto" && !obra.puntos.some((p) => p.auto === "seg") && (
          <div className="mb-2">
            <BtnGhost onClick={() => updateObra(obra.id, { puntos: [...obra.puntos, ...puntosSeguimiento()] })}>
              <Clock size={14} /> Programar seguimiento (llamadas a 7, 21 y 45 días)
            </BtnGhost>
          </div>
        )}
        <FormPunto equipo={data.equipo} defecto={obra.responsable} tipicos={data.config.puntosTipicos} onAdd={(p) => addPunto(obra.id, p)} />
        <div className="mt-2 space-y-1">
          {pendientes.sort((a, b) => (a.fecha || "9999").localeCompare(b.fecha || "9999")).map((p) => (
            <div key={p.id} className="flex items-center gap-2.5 px-1 py-1 rounded-lg hover:bg-neutral-50 group">
              <button onClick={() => togglePunto(obra.id, p.id)} title="Marcar como hecho"
                className="w-5 h-5 rounded-md border-2 flex-shrink-0 flex items-center justify-center transition-colors"
                style={{ borderColor: p.fecha && p.fecha < hoy ? C.red : C.mut }}>
                <Check size={13} className="opacity-0 group-hover:opacity-60" style={{ color: C.ok }} />
              </button>
              {p.fecha && <Badge tone={p.fecha < hoy ? "red" : p.fecha === hoy ? "warn" : "neutral"}>{fmtDia(p.fecha)}</Badge>}
              <span className="text-sm flex-1" style={{ color: C.ink }}>{p.texto}</span>
              {p.responsable && <Avatar nombre={p.responsable} />}
              <button onClick={() => delPunto(obra.id, p.id)} className="opacity-0 group-hover:opacity-100 p-1 rounded hover:bg-neutral-100" title="Eliminar">
                <Trash2 size={13} style={{ color: C.mut }} />
              </button>
            </div>
          ))}
          {pendientes.length === 0 && <p className="text-sm px-1 py-1" style={{ color: cerrada ? C.mut : C.warn }}>{cerrada ? "Sin puntos pendientes." : "Sin próximo paso. Toda obra viva debería tener al menos un punto con fecha."}</p>}
          {hechos.length > 0 && (
            <button onClick={() => setVerHechos(!verHechos)} className="text-xs font-semibold inline-flex items-center gap-1 px-1 py-1" style={{ color: C.mut }}>
              <ChevronDown size={13} style={{ transform: verHechos ? "rotate(180deg)" : "none", transition: "transform .15s" }} />
              {hechos.length} completado{hechos.length === 1 ? "" : "s"}
            </button>
          )}
          {verHechos && hechos.map((p) => (
            <div key={p.id} className="flex items-center gap-2.5 px-1 py-1 group">
              <button onClick={() => togglePunto(obra.id, p.id)} title="Recuperar"
                className="w-5 h-5 rounded-md flex-shrink-0 flex items-center justify-center" style={{ background: C.okTint }}>
                <Check size={13} style={{ color: C.ok }} />
              </button>
              <span className="text-sm flex-1 line-through" style={{ color: C.mut }}>{p.texto}</span>
              {p.fechaHecho && <span className="text-xs" style={{ color: C.mut }}>{fmtFecha(p.fechaHecho)}</span>}
            </div>
          ))}
        </div>
      </div>

      {/* requerimientos */}
      <div className="mt-5">
        <p className="text-xs font-bold uppercase tracking-wider mb-2 inline-flex items-center gap-1.5" style={{ color: C.ink }}>
          <FileText size={14} style={{ color: C.red }} /> Requerimientos
          {reqsPend(obra).length > 0 && <Badge tone="warn">{reqsPend(obra).length} pendientes</Badge>}
        </p>
        {sugeridos.length > 0 && (
          <div className="flex flex-wrap gap-1.5 mb-2">
            {sugeridos.map((s) => (
              <button key={s} onClick={() => addReq(obra.id, { texto: s })}
                className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold border border-dashed hover:bg-neutral-50 transition-colors"
                style={{ borderColor: C.mut, color: C.txt }}>
                <Plus size={11} /> {s}
              </button>
            ))}
          </div>
        )}
        <div className="flex gap-2">
          <input className={inputCls} style={inputStyle} placeholder="Otro requerimiento…" value={reqCustom}
            onChange={(e) => setReqCustom(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter" && reqCustom.trim()) { addReq(obra.id, { texto: reqCustom.trim() }); setReqCustom(""); } }} />
          <BtnGhost onClick={() => { if (reqCustom.trim()) { addReq(obra.id, { texto: reqCustom.trim() }); setReqCustom(""); } }}><Plus size={14} /></BtnGhost>
        </div>
        <div className="mt-2 space-y-1">
          {obra.requerimientos.map((r) => (
            <div key={r.id} className="flex items-center gap-2.5 px-1 py-1 rounded-lg hover:bg-neutral-50 group">
              <button onClick={() => toggleReq(obra.id, r.id)} title={r.hecho ? "Desmarcar" : "Marcar como cumplido"}
                className="w-5 h-5 rounded-md border-2 flex-shrink-0 flex items-center justify-center transition-colors"
                style={r.hecho ? { background: C.okTint, borderColor: C.okTint } : { borderColor: r.fechaLimite && r.fechaLimite < hoy && !r.hecho ? C.red : C.mut }}>
                {r.hecho && <Check size={13} style={{ color: C.ok }} />}
              </button>
              <span className={`text-sm flex-1 ${r.hecho ? "line-through" : ""}`} style={{ color: r.hecho ? C.mut : C.ink }}>{r.texto}</span>
              {!r.hecho && (
                <input type="date" className="text-xs rounded-md border px-1.5 py-0.5" style={{ borderColor: r.fechaLimite && r.fechaLimite < hoy ? C.red : C.line, color: r.fechaLimite && r.fechaLimite < hoy ? C.redDark : C.txt }}
                  value={r.fechaLimite || ""} onChange={(e) => updateReqFecha(obra, r, e.target.value, updateObra)} title="Fecha límite" />
              )}
              <button onClick={() => delReq(obra.id, r.id)} className="opacity-0 group-hover:opacity-100 p-1 rounded hover:bg-neutral-100" title="Eliminar">
                <Trash2 size={13} style={{ color: C.mut }} />
              </button>
            </div>
          ))}
          {obra.requerimientos.length === 0 && <p className="text-sm px-1 py-1" style={{ color: C.mut }}>Añade lo que esta obra necesita (licencia, contrato, andamio…). Las sugerencias cambian según la fase.</p>}
        </div>
      </div>

      {/* diario */}
      <div className="mt-5">
        <p className="text-xs font-bold uppercase tracking-wider mb-2 inline-flex items-center gap-1.5" style={{ color: C.ink }}>
          <MessageSquare size={14} style={{ color: C.red }} /> Diario de la obra <span className="font-medium normal-case tracking-normal" style={{ color: C.mut }}>({apuntes.length})</span>
        </p>
        <FormApunte equipo={data.equipo} defecto={obra.responsable} onSave={(a) => addApunte(obra.id, a)} />
        <div className="mt-3 space-y-2.5">
          {apuntes.map((a) => {
            const { Icon, label } = apunteMeta(a.tipo);
            return (
              <div key={a.id} className="flex gap-2.5 group">
                <div className="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5"
                  style={{ background: a.tipo === "incidencia" ? C.redTint : C.bone, color: a.tipo === "incidencia" ? C.red : C.ink }}>
                  <Icon size={13} />
                </div>
                <div className="min-w-0 flex-1">
                  <p className="text-xs font-bold" style={{ color: C.ink }}>
                    {label}{a.autor ? ` · ${a.autor}` : ""} <span className="font-medium" style={{ color: C.mut }}>· {fmtFecha(a.fecha)} · hace {daysSince(a.fecha)}d</span>
                  </p>
                  <p className="text-sm" style={{ color: C.txt }}>{a.texto}</p>
                </div>
                <button onClick={() => delApunte(obra.id, a.id)} className="opacity-0 group-hover:opacity-100 p-1 rounded hover:bg-neutral-100 self-start" title="Eliminar apunte">
                  <Trash2 size={13} style={{ color: C.mut }} />
                </button>
              </div>
            );
          })}
          {apuntes.length === 0 && <p className="text-sm" style={{ color: C.mut }}>Sin apuntes todavía. Este diario es la memoria de la obra: cada llamada, avance o incidencia queda aquí con fecha y autor.</p>}
        </div>
      </div>

      {/* historial de estados */}
      {obra.historial.length > 1 && (
        <p className="text-xs mt-5 pt-3 border-t" style={{ color: C.mut, borderColor: C.line }}>
          Recorrido: {obra.historial.map((h, i) => `${(EST[h.estado] || {}).label || h.estado} ${fmtFecha(h.fecha)}`).join("  →  ")}
        </p>
      )}

      {/* acciones */}
      <div className="flex flex-wrap gap-2 mt-4 pt-4 border-t" style={{ borderColor: C.line }}>
        <BtnGhost onClick={onEdit}><Pencil size={14} /> Editar datos</BtnGhost>
        {cerrada ? (
          <BtnGhost onClick={() => onReabrir(obra.id)}><RotateCcw size={14} /> Reabrir</BtnGhost>
        ) : (
          <BtnGhost onClick={() => onPerdida(obra.id)}><X size={14} /> Marcar perdida</BtnGhost>
        )}
        {(obra.estado === "finalizada" || obra.estado === "perdida") && !obra.archivada && (
          <BtnGhost onClick={() => onArchivar(obra.id)}><Archive size={14} /> Archivar</BtnGhost>
        )}
        {obra.archivada && <BtnGhost onClick={() => updateObra(obra.id, { archivada: false })}><RotateCcw size={14} /> Desarchivar</BtnGhost>}
        <button onClick={onDelete} className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-semibold hover:bg-red-50 ml-auto" style={{ color: C.redDark }}>
          <Trash2 size={14} /> Eliminar
        </button>
      </div>
    </Modal>
  );
}
function updateReqFecha(obra, req, fecha, updateObra) {
  updateObra(obra.id, { requerimientos: obra.requerimientos.map((r) => r.id === req.id ? { ...r, fechaLimite: fecha } : r) });
}

/* ============================ FORMULARIO DE OBRA ============================ */
function ObraForm({ initial, equipo, onSave, onCancel }) {
  const [f, setF] = useState({ ...obraVacia(), ...(initial || {}) });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const toggleTipo = (t) => setF({ ...f, tipos: f.tipos.includes(t) ? f.tipos.filter((x) => x !== t) : [...f.tipos, t] });
  const toggleColab = (m) => setF({ ...f, colaboradores: (f.colaboradores || []).includes(m) ? f.colaboradores.filter((x) => x !== m) : [...(f.colaboradores || []), m] });
  const ok = f.nombre.trim().length > 0;
  return (
    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div className="sm:col-span-2">
        <Field label="Comunidad / Obra *">
          <input className={inputCls} style={inputStyle} value={f.nombre} onChange={set("nombre")} placeholder="C.P. Calle Ejemplo 12" autoFocus />
        </Field>
      </div>
      <Field label="Dirección">
        <input className={inputCls} style={inputStyle} value={f.direccion} onChange={set("direccion")} />
      </Field>
      <Field label="Municipio">
        <input className={inputCls} style={inputStyle} value={f.municipio} onChange={set("municipio")} placeholder="Madrid" />
      </Field>
      <div className="sm:col-span-2">
        <Field label="Tipo de obra (elige los que apliquen)">
          <div className="flex flex-wrap gap-1.5">
            {TIPOS_OBRA.map((t) => (
              <button key={t} type="button" onClick={() => toggleTipo(t)}
                className="px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition-colors"
                style={f.tipos.includes(t)
                  ? { background: C.red, color: "#fff", borderColor: C.red }
                  : { background: "#fff", color: C.ink, borderColor: C.line }}>
                {t}
              </button>
            ))}
          </div>

// --- lectura de CSV (el que exporta Excel con ";" o cualquier CSV normal) ---
const sinAcentos = (s) => String(s || "").normalize("NFD").split("")
  .filter((ch) => { const c = ch.charCodeAt(0); return c < 768 || c > 879; }) // fuera marcas diacríticas
  .join("").toLowerCase().trim();
function parseCSV(texto) {
  const primera = texto.split("\n")[0] || "";
  const cuenta = (ch) => primera.split(ch).length - 1;
  let sep = ";";
  if (cuenta("\t") > cuenta(";") && cuenta("\t") > cuenta(",")) sep = "\t";
  else if (cuenta(",") > cuenta(";")) sep = ",";
  const filas = []; let fila = [], campo = "", enComillas = false;
  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (enComillas) {
      if (ch === '"') { if (texto[i + 1] === '"') { campo += '"'; i++; } else enComillas = false; }
      else campo += ch;
    } else if (ch === '"') enComillas = true;
    else if (ch === sep) { fila.push(campo); campo = ""; }
    else if (ch === "\n") {
      if (campo.endsWith("\r")) campo = campo.slice(0, -1);
      fila.push(campo); filas.push(fila); fila = []; campo = "";
    } else if (ch !== "\r") campo += ch;
  }
  if (campo !== "" || fila.length) { fila.push(campo); filas.push(fila); }
  return filas.filter((f) => f.some((c) => String(c).trim() !== ""));
}
// sinónimos de cabecera que se reconocen automáticamente
const COLS_CSV = {
  nombre: ["obra", "nombre", "comunidad", "ubicacion"],
  codigo: ["codigo"],
  municipio: ["municipio", "localidad"],
  direccion: ["direccion"],
  estado: ["estado", "fase"],
  importe: ["importe", "presupuesto", "total"],
  subEstimada: ["subvencion_estimada", "subvencion estimada", "subvencion", "ayudas"],
  responsable: ["responsable", "comercial"],
  admFincas: ["admfincas", "administracion", "administrador"],
  contactoNombre: ["contacto"],
  telefono: ["telefono"],
  email: ["email", "correo"],
  notas: ["notas", "observaciones", "obs"],
  tipos: ["tipos", "tipo"],
  prioridad: ["prioridad"],
  cobrado: ["cobrado"],
  subvImporte: ["subvimporte"],
  subvEstado: ["subvestado"],
  subvPrograma: ["subvprograma", "programa"],
};
const numES = (v) => {
  let t = String(v || "").replace(/[€\s]/g, "");
  if (!t) return 0;
  if (t.includes(".") && t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
  else if (t.includes(",")) t = t.replace(",", ".");
  const n = parseFloat(t);
  return isNaN(n) ? 0 : Math.round(n);
};
const ESTADO_CSV = { estudio: "estudio", presupuesto: "presupuesto", contratada: "contratada", ejecucion: "ejecucion", "en ejecucion": "ejecucion", finalizada: "finalizada", perdida: "perdida" };
function interpretarCSV(texto) {
  const filas = parseCSV(texto);
  if (!filas.length) return { items: [], info: "archivo vacío" };
  const cab = filas[0].map(sinAcentos);
  const idx = {};
  Object.keys(COLS_CSV).forEach((campo) => {
    const i = cab.findIndex((c) => COLS_CSV[campo].includes(c));
    if (i >= 0) idx[campo] = i;
  });
  const conCabecera = idx.nombre !== undefined && Object.keys(idx).length >= 2;
  const cuerpo = conCabecera ? filas.slice(1) : filas;
  const col = (f, campo) => (idx[campo] !== undefined ? String(f[idx[campo]] || "").trim() : "");
  const items = [];
  cuerpo.forEach((f) => {
    const nombre = conCabecera ? col(f, "nombre") : String(f[0] || "").trim();
    if (!nombre) return;
    const it = { nombre };
    if (conCabecera) {
      const est = ESTADO_CSV[sinAcentos(col(f, "estado"))];
      if (est) it.estado = est;
      ["municipio", "direccion", "responsable", "admFincas", "contactoNombre", "telefono", "email", "subvPrograma"].forEach((campo) => {
        const v = col(f, campo);
        if (v) it[campo === "subvPrograma" ? "subTipo" : campo] = v;
      });
      const imp = numES(col(f, "importe")); if (imp) it.importe = imp;
      const cob = numES(col(f, "cobrado")); if (cob) it.cobrado = cob;
      const svi = numES(col(f, "subvImporte")); if (svi) it.subImporte = svi;
      const sve = SUB_ESTADOS.find((s) => sinAcentos(s.label) === sinAcentos(col(f, "subvEstado")));
      if (sve) it.subEstado = sve.id;
      const pri = sinAcentos(col(f, "prioridad"));
      if (["alta", "media", "baja"].includes(pri)) it.prioridad = pri;
      const tiposTxt = col(f, "tipos");
      if (tiposTxt) it.tipos = tiposTxt.split(/[\/,+|]/).map((x) => x.trim()).filter(Boolean);
      const notasPartes = [];
      const cod = col(f, "codigo"); if (cod) notasPartes.push("Presupuesto " + cod);
      const se = numES(col(f, "subEstimada"));
      if (se && !it.subImporte) notasPartes.push("Subvención estimada: " + fmtEUR(se));
      const nt = col(f, "notas"); if (nt) notasPartes.push(nt);
      if (notasPartes.length) it.notas = notasPartes.join(" · ");
    }
    items.push(it);
  });
  const detectadas = Object.keys(idx).length;
  return {
    items,
    info: conCabecera
      ? `${items.length} filas · ${detectadas} columnas reconocidas${idx.estado !== undefined ? " (el estado viene del archivo)" : ""}`
      : `${items.length} filas · sin cabecera reconocida: se usa la primera columna como nombre`,
  };
}
function leerArchivoTexto(file, cb) {
  const r1 = new FileReader();
  r1.onload = () => {
    let t = String(r1.result);
    if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
    if (t.includes("�")) {
      // no era UTF-8: probamos con la codificación clásica de Excel en Windows
      const r2 = new FileReader();
      r2.onload = () => { let t2 = String(r2.result); if (t2.charCodeAt(0) === 0xFEFF) t2 = t2.slice(1); cb(t2); };
      r2.readAsText(file, "windows-1252");
    } else cb(t);
  };
  r1.readAsText(file);
}

function ImportarLoteModal({ data, onClose, onCrear }) {
  const [texto, setTexto] = useState("");
  const [estadoSel, setEstadoSel] = useState("estudio");
  const [resp, setResp] = useState("");
  const [carpeta, setCarpeta] = useState(null);
  const [filasCSV, setFilasCSV] = useState({});
  const [csvInfo, setCsvInfo] = useState(null);

  const existentes = new Set(data.obras.map((o) => o.nombre.trim().toLowerCase()));
  const lineas = [...new Set(texto.split("\n").map((s) => s.trim()).filter(Boolean))];
  const nuevas = lineas.filter((n) => !existentes.has(n.toLowerCase()));
  const omitidas = lineas.length - nuevas.length;

  // De una carpeta elegida se extraen los nombres de sus subcarpetas de primer nivel
  const leerCarpeta = (files) => {
    const nombres = new Set();
    let raiz = null;
    for (const f of files) {
      const partes = (f.webkitRelativePath || "").split("/");
      if (partes.length >= 2 && !raiz) raiz = partes[0];
      if (partes.length >= 3) nombres.add(partes[1]);
    }
    const lista = [...nombres].sort((a, b) => a.localeCompare(b, "es"));
    setCarpeta(raiz ? `${raiz}: ${lista.length} carpetas detectadas` : null);
    setFilasCSV({}); setCsvInfo(null);
    setTexto(lista.join("\n"));
  };

  // De un CSV de Excel se reconocen las columnas y cada fila trae sus datos
  const leerCSV = (file) => {
    leerArchivoTexto(file, (contenido) => {
      const { items, info } = interpretarCSV(contenido);
      const mapa = {};
      items.forEach((it) => { mapa[it.nombre.toLowerCase()] = it; });
      setFilasCSV(mapa);
      setCarpeta(null);
      setCsvInfo(`${file.name}: ${info}`);
      setTexto(items.map((it) => it.nombre).join("\n"));
    });
  };

  return (
    <Modal title="Importar obras en lote" onClose={onClose} wide>
      <p className="text-sm" style={{ color: C.txt }}>
        Se crea <b>una obra por línea</b>. Puedes leer un <b>CSV de Excel</b> (reconoce solas las columnas: obra, importe,
        estado, municipio, código, subvención…), elegir una carpeta del ordenador y usar los nombres de sus subcarpetas,
        o pegar una lista directamente. Antes de crear, borra las líneas que no quieras — las que ya existan con el mismo nombre se omiten solas.
      </p>
      <div className="flex flex-wrap items-center gap-2 mt-3">
        <label className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-semibold border hover:bg-neutral-50 cursor-pointer"
          style={{ borderColor: C.line, color: C.ink }}>
          <Upload size={15} /> Elegir carpeta del ordenador
          <input type="file" webkitdirectory="" multiple className="hidden"
            onChange={(e) => { if (e.target.files && e.target.files.length) leerCarpeta(e.target.files); e.target.value = ""; }} />
        </label>
        <label className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-semibold border hover:bg-neutral-50 cursor-pointer"
          style={{ borderColor: C.line, color: C.ink }}>
          <FileText size={15} /> Leer archivo CSV (Excel)
          <input type="file" accept=".csv,text/csv,.txt" className="hidden"
            onChange={(e) => { if (e.target.files && e.target.files[0]) leerCSV(e.target.files[0]); e.target.value = ""; }} />
        </label>
        {carpeta && <Badge tone="azul">{carpeta}</Badge>}
        {csvInfo && <Badge tone="ok">{csvInfo}</Badge>}
      </div>
      <p className="text-xs mt-1.5" style={{ color: C.mut }}>
        Si el navegador pregunta si quieres “subir” los archivos, acepta tranquilo: no se sube nada a ningún sitio,
        solo se leen los nombres de las carpetas de tu ordenador. Las carpetas vacías no aparecen.
      </p>
      <textarea rows={10} className={inputCls + " mt-3"} style={{ ...inputStyle, fontSize: 13, fontFamily: "Consolas, monospace" }}
        placeholder={"C.P. Calle Ejemplo 12\nC.P. Avenida Muestra 34\n…"}
        value={texto} onChange={(e) => setTexto(e.target.value)} />
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">
        <Field label="Estado inicial para todas">
          <select className={inputCls} style={inputStyle} value={estadoSel} onChange={(e) => setEstadoSel(e.target.value)}>
            {ESTADOS_TABLERO.map((e) => <option key={e.id} value={e.id}>{e.label}</option>)}
          </select>
        </Field>
        <Field label="Responsable (opcional)">
          <select className={inputCls} style={inputStyle} value={resp} onChange={(e) => setResp(e.target.value)}>
            <option value="">Sin asignar</option>
            {data.equipo.map((c) => <option key={c}>{c}</option>)}
          </select>
        </Field>
      </div>
      <div className="flex items-center justify-between gap-2 mt-4 flex-wrap">
        <p className="text-xs font-semibold" style={{ color: nuevas.length ? C.ink : C.mut }}>
          {lineas.length === 0 ? "Sin obras que crear todavía."
            : `${nuevas.length} obra${nuevas.length === 1 ? "" : "s"} nueva${nuevas.length === 1 ? "" : "s"}`
              + (omitidas > 0 ? ` · ${omitidas} ya existe${omitidas === 1 ? "" : "n"} (se omite${omitidas === 1 ? "" : "n"})` : "")}
        </p>
        <div className="flex gap-2">
          <BtnGhost onClick={onClose}>Cancelar</BtnGhost>
          <BtnPrimary disabled={nuevas.length === 0}
            onClick={() => onCrear(nuevas.map((n) => ({ ...(filasCSV[n.toLowerCase()] || {}), nombre: n })), estadoSel, resp)}>
            <Check size={15} /> Crear {nuevas.length > 0 ? nuevas.length : ""} obras
          </BtnPrimary>
        </div>
      </div>
    </Modal>
  );
}

function PantallaClave({ onEntrar, onVacio, textoVacio }) {
  const [clave, setClave] = useState("");
  const [error, setError] = useState(false);
  const [cargando, setCargando] = useState(false);
  const entrar = async () => {
    if (!clave || cargando) return;
    setCargando(true); setError(false);
    try { await onEntrar(clave); } catch (e) { setError(true); setCargando(false); }
  };
  return (
    <div className="bg-white rounded-2xl border p-6 w-full max-w-sm text-center shadow-lg aparecer" style={{ borderColor: C.line }}>
      <img src={LOGO} className="w-14 h-14 mx-auto object-contain" alt="Proyecton" />

      <p className="text-sm mt-1" style={{ color: C.mut }}>Los datos de esta página están protegidos. Escribe la clave de la empresa.</p>
      <input type="password" autoFocus className={inputCls + " mt-4 text-center"} style={inputStyle} value={clave}
        onChange={(e) => setClave(e.target.value)} onKeyDown={(e) => e.key === "Enter" && entrar()} placeholder="Clave" />
      {error && <p className="text-xs mt-2 font-semibold" style={{ color: C.red }}>Clave incorrecta. Prueba otra vez.</p>}
      <BtnPrimary onClick={entrar} disabled={!clave || cargando} className="w-full justify-center mt-3">
        {cargando ? "Abriendo…" : "Entrar"}
      </BtnPrimary>
      <button onClick={onVacio} className="text-xs mt-3 hover:underline" style={{ color: C.mut }}>{textoVacio || "Empezar sin estos datos"}</button>
    </div>
  );
}

      if (!loaded) {
        if (inc && inc.cifrado) { pendienteLocalRef.current = null; setPendienteCifrado(inc); loadedRef.current = true; return; }
        if (inc && inc.datos) {
          loaded = normalizarData(inc.datos); publicadoFecha = inc.fecha || null;
          try { localStorage.setItem(KEY_FECHA_PUB, inc.fecha || ""); localStorage.setItem(KEY_EDITADO, "0"); } catch (e) {}
        }
      } else if (inc && inc.fecha) {
        // ya hay datos en este navegador, pero este archivo trae una versión publicada más nueva
        const aplicada = localStorage.getItem(KEY_FECHA_PUB) || "";
        if (inc.fecha > aplicada) {
          const editado = (localStorage.getItem(KEY_EDITADO) || "") === "1";
          if (!editado && inc.cifrado) {
            // sin cambios propios pendientes: pedimos la clave y actualizamos
            pendienteLocalRef.current = loaded;
            setPendienteCifrado(inc);
            loadedRef.current = true;
            return;
          }
          if (!editado && inc.datos) {
            loaded = normalizarData(inc.datos); publicadoFecha = inc.fecha;
            try { localStorage.setItem(KEY_FECHA_PUB, inc.fecha); localStorage.setItem(KEY_EDITADO, "0"); } catch (e) {}
          }
          if (editado) setTimeout(() => setNuevaVersion(inc), 600);
        }
      }
      if (!loaded) {
        for (const k of CRM_KEYS) {
          try {
            const r = await window.storage.get(k);
            if (r && r.value) {
              const old = JSON.parse(r.value);
              if (old && Array.isArray(old.leads)) {
                loaded = normalizarData(convertirCRM(old));
                migradas = loaded.obras.length;
                break;
              }
            }
          } catch (e) { /* sin datos antiguos */ }
        }
      }
      let conEjemplos = false;
      if (!loaded) { loaded = normalizarData(seedEjemplo()); conEjemplos = true; }
      aplicandoPubRef.current = true; // la carga inicial no cuenta como edición de la sesión
      setData(loaded);
      setObjetivoInput(loaded.config.objetivoMensual || "");
      loadedRef.current = true;
      if (publicadoFecha) setTimeout(() => toast("Cargados los datos publicados el " + fmtFecha(publicadoFecha) + "."), 400);
      else if (migradas > 0) setTimeout(() => toast(`Importadas ${migradas} obras del CRM anterior. Todo tu trabajo está aquí.`), 400);
      else if (conEjemplos) setTimeout(() => toast("Hemos cargado obras de ejemplo para que explores la Central."), 400);
    })();
  }, []);

  useEffect(() => {
    dataRef.current = data;
    if (!loadedRef.current || !data) return;
    if (aplicandoPubRef.current) { aplicandoPubRef.current = false; }
    else {
      sesionEditadaRef.current = true;
      try { localStorage.setItem(KEY_EDITADO, "1"); } catch (e) {}
    }
    dirtyRef.current = true;
    const t = setTimeout(async () => {
      try {
        await window.storage.set(KEY, JSON.stringify(data));
        dirtyRef.current = false;
        guardarCopia("copia automática del día", data, false);
      } catch (e) {
        console.error("No se pudo guardar", e);
        toast("OJO: el último cambio NO se pudo guardar. Haz una copia desde Ajustes por si acaso.");
      }
    }, 350);
    return () => clearTimeout(t);
  }, [data]);

  useEffect(() => {
    // si se cierra la pestaña antes de que el guardado diferido llegue a escribir
    const flush = () => {
      if (loadedRef.current && dataRef.current && dirtyRef.current) {
        try { localStorage.setItem(KEY, JSON.stringify(dataRef.current)); dirtyRef.current = false; } catch (e) {}
      }
    };
    window.addEventListener("pagehide", flush);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
    return () => window.removeEventListener("pagehide", flush);
  }, []);

  // ---- sincronización con la versión publicada (solo cuando la página se abre por su enlace) ----
  const aplicarVersionPublicada = (payload, datos) => {
    if (dataRef.current) guardarCopia("antes de cargar la versión publicada", dataRef.current, true);
    aplicandoPubRef.current = true;
    const d = normalizarData(datos);
    setData(d);
    setObjetivoInput(d.config.objetivoMensual || "");
    try { localStorage.setItem(KEY_FECHA_PUB, payload.fecha || ""); localStorage.setItem(KEY_EDITADO, "0"); } catch (e) {}
    setNuevaVersion(null);
    sesionEditadaRef.current = false;
    toast("Actualizado a la versión publicada del " + fmtFecha(payload.fecha) + ".");
  };

  const comprobarPublicados = async () => {
    if (window.location.protocol !== "http:" && window.location.protocol !== "https:") return;
    try {
      const resp = await fetch(window.location.href, { cache: "no-store" });
      const texto = await resp.text();
      const i = texto.indexOf("/*DATOS-INICIO*/");
      const j = texto.indexOf("/*DATOS-FIN*/");
      if (i < 0 || j < 0) return;
      const cuerpo = texto.slice(i + 16, j).trim();
      if (!cuerpo || cuerpo === "null") return;
      const payload = JSON.parse(cuerpo);
      if (!payload || !payload.fecha) return;
      const aplicada = localStorage.getItem(KEY_FECHA_PUB) || "";
      if (payload.fecha <= aplicada) return;
      // hay una versión publicada más nueva que la que tiene este navegador
      if (!sesionEditadaRef.current) {
        if (payload.cifrado && claveRef.current) {
          try { aplicarVersionPublicada(payload, await descifrarJSON(payload, claveRef.current)); return; } catch (e) { /* clave distinta */ }
        } else if (!payload.cifrado && payload.datos) {
          aplicarVersionPublicada(payload, payload.datos); return;
        }
      }
      setNuevaVersion(payload); // hay cambios locales o falta la clave: se avisa sin machacar nada
    } catch (e) { /* sin conexión: se reintenta en el siguiente ciclo */ }
  };
  const comprobarRef = useRef(null);
  comprobarRef.current = comprobarPublicados;

  useEffect(() => {
    if (window.location.protocol !== "http:" && window.location.protocol !== "https:") return;
    const t = setInterval(() => { if (comprobarRef.current) comprobarRef.current(); }, 90000);
    const alVolver = () => { if (document.visibilityState === "visible" && comprobarRef.current) comprobarRef.current(); };
    document.addEventListener("visibilitychange", alVolver);
    if (window.__central) window.__central.comprobarPublicados = () => comprobarRef.current && comprobarRef.current();
    return () => { clearInterval(t); document.removeEventListener("visibilitychange", alVolver); };
  }, []);

  const avisos = useMemo(() => data ? calcularAvisos(data) : [], [data]);
  const persona = (data && data.equipo && data.equipo.includes(quien)) ? quien : "";
  const admin = quien === "(admin)";

  // notificación del navegador al abrir, si hay cosas urgentes (las tuyas, o todas si eres admin)
  const notificadoRef = useRef(false);
  useEffect(() => {
    if (notificadoRef.current || !data || (!persona && !admin)) return;
    notificadoRef.current = true;
    const urgentes = avisos.filter((a) =>
      (admin || (a.para || []).includes(persona)) && (a.nivel === "rojo" || a.grupo === "Hoy"));
    if (!urgentes.length) return;
    try {
      if (window.Notification && Notification.permission === "granted") {
        new Notification("Central de Obras", {
          body: admin
            ? "Equipo: " + urgentes.length + " avisos vencidos o para hoy."
            : persona + ": tienes " + urgentes.length + " avisos vencidos o para hoy.",
        });
      }
    } catch (e) {}
  }, [data, avisos, persona, admin]);

  const agendaPendientes = useMemo(() => {
    if (!data) return 0;
    const hoy = hoyYMD();
    return calcularAgenda(data).filter((i) => i.fecha && i.fecha <= hoy).length;
  }, [data]);

  // el título de la pestaña enseña cuántos avisos urgentes tienes: "(3) Central de Obras…"
  useEffect(() => {
    const mis = persona ? avisos.filter((a) => (a.para || []).includes(persona)) : avisos;
    const n = mis.filter((a) => a.nivel === "rojo" || a.grupo === "Hoy").length;
    document.title = (n > 0 ? "(" + n + ") " : "") + "Central de Obras · Proyecton";
  }, [avisos, persona]);

  // Ctrl+K (o Cmd+K) abre el buscador desde cualquier pantalla
  useEffect(() => {
    const atajo = (e) => {
      if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === "k") {
        e.preventDefault();
        if (buscaRef.current && buscaRef.current.offsetParent) buscaRef.current.focus();
        else setBuscaOpen(true);
      }
    };
    window.addEventListener("keydown", atajo);
    return () => window.removeEventListener("keydown", atajo);
  }, []);

  if (!data) {
    return (
      <div className="min-h-screen flex items-center justify-center p-4" style={{ background: C.bone }}>
        {pendienteCifrado ? (
          <PantallaClave
            onEntrar={async (clave) => {
              const fecha = pendienteCifrado.fecha;
              const datos = await descifrarJSON(pendienteCifrado, clave);
              const d = normalizarData(datos);
              claveRef.current = clave;
              try { localStorage.setItem(KEY_FECHA_PUB, fecha || ""); localStorage.setItem(KEY_EDITADO, "0"); } catch (e) {}
              setPendienteCifrado(null);
              pendienteLocalRef.current = null;
              aplicandoPubRef.current = true;
              setData(d);
              setObjetivoInput(d.config.objetivoMensual || "");
              toast(fecha ? "Cargados los datos publicados el " + fmtFecha(fecha) + "." : "Datos cargados.");
            }}
            textoVacio={pendienteLocalRef.current ? "Seguir con los datos que ya tenía este navegador" : "Empezar sin estos datos"}
            onVacio={() => {
              const previos = pendienteLocalRef.current;
              pendienteLocalRef.current = null;
              setPendienteCifrado(null);
              if (previos) {
                aplicandoPubRef.current = true;
                setData(previos);
                setObjetivoInput(previos.config.objetivoMensual || "");
              } else {
                setData(normalizarData(seedEjemplo()));
              }
            }}
          />
        ) : (
          <p className="text-sm font-semibold uppercase tracking-widest" style={{ color: C.mut }}>Cargando la Central…</p>
        )}
      </div>
    );
  }

  /* ---------- mutaciones ---------- */
  const mutateObra = (id, fn) => setData((d) => ({ ...d, obras: d.obras.map((o) => o.id === id ? fn(o) : o) }));
  const updateObra = (id, patch) => mutateObra(id, (o) => ({ ...o, ...patch }));

  const setEstado = (id, estadoId, motivo) => {
    const antes = data.obras.find((x) => x.id === id);
    const programa = antes && antes.estado !== estadoId && estadoId === "presupuesto" && !antes.puntos.some((p) => p.auto === "seg");
    mutateObra(id, (o) => {
      if (o.estado === estadoId) return o;
      const now = new Date().toISOString();
      return aplicarAutomatismos({
        ...o, estado: estadoId, estadoDesde: now,
        historial: [...o.historial, { estado: estadoId, fecha: now }],
        motivoPerdida: estadoId === "perdida" ? (motivo || o.motivoPerdida || "Otro") : null,
        avance: estadoId === "finalizada" ? 100 : o.avance,
      }, estadoId);
    });
    if (programa) toast("Seguimiento programado solo: llamadas a 7, 21 y 45 días. Está en la Agenda.");
  };

  const reabrirObra = (id) => {
    const o = data.obras.find((x) => x.id === id);
    if (!o) return;
    const previo = [...o.historial].reverse().find((h) => h.estado !== "perdida");
    setEstado(id, previo ? previo.estado : "estudio");
    toast("Obra reabierta");
  };

  const saveObra = (f) => {
    if (obraModal && obraModal.id) {
      mutateObra(obraModal.id, (o) => {
        const cambiaEstado = f.estado !== o.estado;
        const now = new Date().toISOString();
        const base = {
          ...o, ...f,
          ejemplo: false, // al editarla pasa a ser una obra real
          estadoDesde: cambiaEstado ? now : o.estadoDesde,
          historial: cambiaEstado ? [...o.historial, { estado: f.estado, fecha: now }] : o.historial,
        };
        return cambiaEstado ? aplicarAutomatismos(base, f.estado) : base;
      });
      toast("Obra actualizada");
    } else {
      const now = new Date().toISOString();
      const nueva = normalizarObra({ ...f, id: uid(), creado: now, estadoDesde: now, historial: [{ estado: f.estado || "estudio", fecha: now }] });
      const conAuto = aplicarAutomatismos(nueva, nueva.estado);
      setData((d) => ({ ...d, obras: [conAuto, ...d.obras] }));
      toast("Obra creada. Añádele su primer punto con fecha.");
      setDetailId(nueva.id);
    }
    setObraModal(null);
  };

  const deleteObra = (id) => setData((d) => ({ ...d, obras: d.obras.filter((o) => o.id !== id) }));

  const addPunto = (id, { texto, fecha, responsable }) =>
    mutateObra(id, (o) => ({ ...o, puntos: [...o.puntos, { id: uid(), texto, fecha: fecha || "", responsable: responsable || "", hecho: false }] }));
  const togglePunto = (id, pid) => {
    // al marcar hecha una VISITA en una obra en estudio, se apunta solo el siguiente paso
    const obraAntes = data.obras.find((x) => x.id === id);
    const pAntes = obraAntes && obraAntes.puntos.find((x) => x.id === pid);
    const visitaHecha = pAntes && !pAntes.hecho && /visita/i.test(pAntes.texto) && obraAntes.estado === "estudio";
    mutateObra(id, (o) => {
      let puntos = o.puntos.map((p) => p.id === pid ? { ...p, hecho: !p.hecho, fechaHecho: !p.hecho ? new Date().toISOString() : null } : p);
      if (visitaHecha && !puntos.some((x) => !x.hecho && /presupuesto|medici/i.test(x.texto))) {
        puntos = [...puntos, { id: uid(), texto: "Hacer y enviar el presupuesto", fecha: "", responsable: o.responsable || "", hecho: false, auto: "postvisita" }];
      }
      return { ...o, puntos };
    });
    if (visitaHecha) toast("Visita hecha. Siguiente paso apuntado: hacer el presupuesto.");
    return visitaHecha;
  };
  const delPunto = (id, pid) => mutateObra(id, (o) => ({ ...o, puntos: o.puntos.filter((p) => p.id !== pid) }));

  const addReq = (id, { texto, fechaLimite }) =>
    mutateObra(id, (o) => o.requerimientos.some((r) => r.texto === texto) ? o
      : { ...o, requerimientos: [...o.requerimientos, { id: uid(), texto, fechaLimite: fechaLimite || "", hecho: false }] });
  const toggleReq = (id, rid) => mutateObra(id, (o) => ({
    ...o, requerimientos: o.requerimientos.map((r) => r.id === rid ? { ...r, hecho: !r.hecho, fechaHecho: !r.hecho ? new Date().toISOString() : null } : r),
  }));
  const delReq = (id, rid) => mutateObra(id, (o) => ({ ...o, requerimientos: o.requerimientos.filter((r) => r.id !== rid) }));

  const addApunte = (id, { tipo, autor, texto }) =>
    mutateObra(id, (o) => ({ ...o, apuntes: [{ id: uid(), tipo, autor: autor || "", texto, fecha: new Date().toISOString() }, ...o.apuntes] }));
  const delApunte = (id, aid) => mutateObra(id, (o) => ({ ...o, apuntes: o.apuntes.filter((a) => a.id !== aid) }));

  const togglePendiente = (obraId, clase, itemId) => {
    if (clase === "punto") {
      const especial = togglePunto(obraId, itemId); // si era una visita, ya avisa él
      if (!especial) toast("Marcado como hecho");
    } else {
      toggleReq(obraId, itemId);
      toast("Marcado como hecho");
    }
  };

  // agendar (o cambiar el día) de un punto o requerimiento desde la Agenda
  const setFechaItem = (obraId, clase, itemId, fecha) => {
    mutateObra(obraId, (o) => clase === "punto"
      ? { ...o, puntos: o.puntos.map((p) => p.id === itemId ? { ...p, fecha } : p) }
      : { ...o, requerimientos: o.requerimientos.map((r) => r.id === itemId ? { ...r, fechaLimite: fecha } : r) });
    if (fecha) toast("Agendado para el " + fmtDia(fecha) + ".");
  };

  // alta rápida de los comerciales: obra nueva con su visita ya agendada
  const crearObraVisita = ({ nombre, municipio, telefono, responsable, fecha, texto }) => {
    const now = new Date().toISOString();
    const base = normalizarObra({
      id: uid(), nombre, municipio: municipio || "", telefono: telefono || "",
      responsable: responsable || "", origen: "Llamada entrante",
      estado: "estudio", creado: now, estadoDesde: now,
      historial: [{ estado: "estudio", fecha: now }],
      puntos: [{ id: uid(), texto: texto || "Visita a la obra", fecha: fecha || "", responsable: responsable || "", hecho: false }],
    });
    const nueva = aplicarAutomatismos(base, "estudio");
    setData((d) => ({ ...d, obras: [nueva, ...d.obras] }));
    toast(fecha ? "Obra creada con su visita el " + fmtDia(fecha) + "." : "Obra creada con su visita.");
  };

  const addMiembro = (name) => setData((d) => d.equipo.includes(name) ? d : { ...d, equipo: [...d.equipo, name] });
  const removeMiembro = (name) => setConfirmCfg({
    msg: `¿Quitar a ${name} del equipo? Las obras y puntos que tiene asignados se conservan con su nombre.`,
    onOk: () => setData((d) => ({ ...d, equipo: d.equipo.filter((c) => c !== name) })),
  });

  const addTipico = (t) => setData((d) => {
    const lista = d.config.puntosTipicos || [];
    return lista.includes(t) ? d : { ...d, config: { ...d.config, puntosTipicos: [...lista, t] } };
  });
  const removeTipico = (t) => setData((d) => ({
    ...d, config: { ...d.config, puntosTipicos: (d.config.puntosTipicos || []).filter((x) => x !== t) },
  }));

  const saveObjetivo = () => {
    setData((d) => ({ ...d, config: { ...d.config, objetivoMensual: Number(objetivoInput) || 0 } }));
    toast("Objetivo guardado");
  };

  const crearLote = (items, estado, responsable) => {
    const now = new Date().toISOString();
    const nuevas = items.map((it) => {
      const est = EST[it.estado] ? it.estado : estado;
      return normalizarObra({
        id: uid(), ...it, estado: est,
        responsable: it.responsable || responsable || '',
        creado: now, estadoDesde: now, historial: [{ estado: est, fecha: now }],
      });
    });
    setData((d) => ({ ...d, obras: [...nuevas, ...d.obras] }));
    setLoteOpen(false);
    setTab('obras');
    toast(`${nuevas.length} obras creadas`);
  };

  const borrarEjemplos = () => {
    const n = data.obras.filter((o) => o.ejemplo).length;
    setConfirmCfg({
      msg: `¿Borrar las ${n} obras de ejemplo? Las obras que hayas creado o editado tú se conservan.`,
      onOk: () => { setData((d) => ({ ...d, obras: d.obras.filter((o) => !o.ejemplo) })); toast("Ejemplos borrados. La Central es toda tuya."); },
    });
  };

  const activarNotificaciones = () => {
    if (!window.Notification) { toast("Este navegador no permite notificaciones."); return; }
    if (Notification.permission === "granted") { toast("Ya estaban activadas: al abrir la Central te avisa si tienes pendientes."); return; }
    Notification.requestPermission().then((p) => {
      toast(p === "granted"
        ? "Notificaciones activadas: al abrir la Central te avisará si tienes cosas vencidas o para hoy."
        : "El navegador no dio permiso para notificar.");
    });
  };

  // vaciar TODO exige escribirlo: un clic de más no puede borrar la empresa
  const resetAll = () => setVaciarTxt("");

  // Descarga esta misma página con los datos incrustados, lista para subir a GitHub
  const descargarHTMLConDatos = () => {
    setClaveCfg({
      titulo: "Guardar los datos dentro del HTML",
      texto: "Se descarga una copia de esta página con todas las obras metidas dentro, lista para subirla a GitHub. Ponle una clave si va a estar en internet (quien abra la página tendrá que escribirla); déjala vacía solo para uso interno. Consejo: una frase larga blinda mucho más que un número corto.",
      permitirVacia: true, boton: "Descargar HTML",
      onOk: async (clave) => {
        let fuente = null;
        try {
          const resp = await fetch(window.location.href);
          fuente = await resp.text();
        } catch (e) {
          toast("Abierto como archivo local el navegador no deja leerse a sí mismo: usa este botón desde la página ya publicada.");
          return;
        }
        const payload = clave
          ? { ...(await cifrarJSON(data, clave)), fecha: new Date().toISOString() }
          : { cifrado: false, fecha: new Date().toISOString(), datos: data };
        const json = JSON.stringify(payload).replace(/</g, "\\u003c");
        const ini = fuente.indexOf("/*DATOS-INICIO*/");
        const fin = fuente.indexOf("/*DATOS-FIN*/");
        if (ini < 0 || fin < 0 || fin < ini) { toast("No encuentro los marcadores de datos en el archivo."); return; }
        const nuevo = fuente.slice(0, ini + 16) + json + fuente.slice(fin);
        const blob = new Blob([nuevo], { type: "text/html;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "proyecton-central.html";
        a.click();
        URL.revokeObjectURL(a.href);
        if (clave) claveRef.current = clave;
        // lo que acabas de guardar ES la versión publicada: tu sesión queda al día
        try { localStorage.setItem(KEY_FECHA_PUB, payload.fecha || ""); localStorage.setItem(KEY_EDITADO, "0"); } catch (e) {}
        sesionEditadaRef.current = false;
        setNuevaVersion(null);
        toast(clave ? "HTML descargado con los datos cifrados. Súbelo a GitHub para actualizar a todos." : "HTML descargado con los datos SIN cifrar: no lo publiques en internet.");
      },
    });
  };

  const cargarDatosPublicados = () => {
    const inc = leerDatosIncrustados();
    if (!inc) { toast("Este archivo no lleva datos incrustados todavía."); return; }
    const aplicar = (datos) => setConfirmCfg({
      msg: `Los datos publicados${inc.fecha ? " el " + fmtFecha(inc.fecha) : ""} contienen ${(datos.obras || []).length} obras y sustituirán a los de este navegador. ¿Continuar?`,
      onOk: () => aplicarVersionPublicada(inc, datos),
    });
    if (inc.cifrado) {
      setClaveCfg({
        titulo: "Clave de los datos publicados",
        texto: "Los datos de este archivo están cifrados. Escribe la clave de la empresa.",
        permitirVacia: false, boton: "Abrir",
        onOk: async (clave) => { const datos = await descifrarJSON(inc, clave); claveRef.current = clave; aplicar(datos); },
      });
    } else if (inc.datos) aplicar(inc.datos);
  };

  // desde el aviso de "hay versión publicada más reciente"
  const cargarNuevaVersion = () => {
    const p = nuevaVersion;
    if (!p) return;
    if (p.cifrado) {
      if (claveRef.current) {
        descifrarJSON(p, claveRef.current)
          .then((datos) => aplicarVersionPublicada(p, datos))
          .catch(() => claveParaNueva(p));
      } else claveParaNueva(p);
    } else if (p.datos) aplicarVersionPublicada(p, p.datos);
  };
  const claveParaNueva = (p) => setClaveCfg({
    titulo: "Clave de los datos publicados",
    texto: "La versión nueva está cifrada. Escribe la clave de la empresa.",
    permitirVacia: false, boton: "Cargar",
    onOk: async (clave) => { const datos = await descifrarJSON(p, clave); claveRef.current = clave; aplicarVersionPublicada(p, datos); },
  });

  const exportBackup = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `proyecton-central-copia-${hoyYMD()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const importBackup = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const texto = String(reader.result);
        // algunos editores de Windows añaden un BOM (U+FEFF) al principio; JSON.parse no lo tolera
        const raw = JSON.parse(texto.charCodeAt(0) === 0xFEFF ? texto.slice(1) : texto);
        let d = null, origen = "";
        if (raw && Array.isArray(raw.obras)) { d = normalizarData(raw); origen = "de la Central"; }
        else if (raw && Array.isArray(raw.leads)) { d = normalizarData(convertirCRM(raw)); origen = "del CRM anterior (convertida)"; }
        if (!d) throw new Error("formato");
        setConfirmCfg({
          msg: `La copia ${origen} contiene ${d.obras.length} obras y ${d.equipo.length} personas. Sustituirá los datos actuales de este navegador. ¿Continuar?`,
          onOk: () => { guardarCopia("antes de restaurar una copia", dataRef.current, true); setData(d); setObjetivoInput(d.config.objetivoMensual || ""); toast("Copia restaurada"); },
        });
      } catch (e) {
        setConfirmCfg({ msg: "Ese archivo no es una copia de seguridad válida.", onOk: () => {} });
      }
    };
    reader.readAsText(file);
  };

  const exportCSV = () => {
    const head = ["Obra", "Direccion", "Municipio", "Estado", "Tipos", "Prioridad", "Responsable", "Colaboradores", "Importe", "Cobrado", "SubvEstado", "SubvImporte", "SubvPrograma", "Contacto", "Telefono", "Email", "AdmFincas", "Origen", "Alta", "ProximoPaso", "PuntosPendientes", "ReqsPendientes", "UltimoMovimiento", "Notas"];
    const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const rows = data.obras.map((o) => {
      const paso = proximoPaso(o);
      return [
        o.nombre, o.direccion, o.municipio, (EST[o.estado] || {}).label, o.tipos.join(" / "), o.prioridad, o.responsable,
        (o.colaboradores || []).join(" / "),
        o.importe, o.cobrado, (SUB[o.subEstado] || {}).label, o.subImporte, o.subTipo,
        o.contactoNombre, o.telefono, o.email, o.admFincas, o.origen, o.creado,
        paso ? `${paso.fecha || ""} ${paso.texto}` : "", puntosPend(o).length, reqsPend(o).length, ultimoMovimiento(o), o.notas,
      ].map(esc).join(";");
    });
    const csv = [head.join(";"), ...rows].join("\n");
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `proyecton-central-${hoyYMD()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  /* ---------- derivados ---------- */
  const detailObra = detailId ? data.obras.find((o) => o.id === detailId) : null;
  const rojos = avisos.filter((a) => a.nivel === "rojo").length;
  const hoyN = avisos.filter((a) => a.grupo === "Hoy").length;
  // con persona elegida, la campana cuenta SOLO lo suyo (el admin lo ve todo)
  const misAvisos = persona ? avisos.filter((a) => (a.para || []).includes(persona)) : avisos;
  const rojosCampana = misAvisos.filter((a) => a.nivel === "rojo").length;
  const nAvisosCampana = rojosCampana + misAvisos.filter((a) => a.grupo === "Hoy").length;

  const nq = sinAcentos(busca);
  const resultadosBusca = busca.trim().length >= 2
    ? data.obras.filter((o) => sinAcentos(`${o.nombre} ${o.direccion} ${o.municipio} ${o.contactoNombre} ${o.admFincas} ${o.telefono} ${o.notas}`).includes(nq)).slice(0, 8)
    : [];

  const abrirObra = (id) => { setDetailId(id); setAvisosOpen(false); setBusca(""); setBuscaOpen(false); };

  const TABS = [
    { id: "panel", label: "Panel", Icon: LayoutDashboard },
    { id: "tablero", label: "Tablero", Icon: Columns },
    { id: "obras", label: "Obras", Icon: Building2 },
    { id: "agenda", label: "Agenda", Icon: CalendarDays, badge: agendaPendientes },
    { id: "analisis", label: "Análisis", Icon: TrendingUp },
  ];

  return (
    <div className="min-h-screen" style={{ background: C.bone, fontFamily: "'Segoe UI', system-ui, -apple-system, sans-serif" }}>
      <div style={{ height: 4, background: C.red }} />

      {/* cabecera */}
      <header className="bg-white border-b" style={{ borderColor: C.line }}>
        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
          <div className="flex items-center gap-3 min-w-0">
            <img src={LOGO} alt="Proyecton" className="w-12 h-12 object-contain flex-shrink-0" />
            <div className="min-w-0 hidden sm:block">
              <p className="text-xs tracking-widest font-medium truncate" style={{ color: C.ink, letterSpacing: "0.3em" }}>REVESTIMIENTOS</p>
              <p className="text-xl font-extrabold leading-none -mt-0.5" style={{ color: C.red, letterSpacing: "0.02em" }}>
                PROYECTON
                <span className="block h-0.5 mt-1 rounded-full" style={{ background: C.red, maxWidth: "9rem" }} />
              </p>
              <p className="text-xs mt-0.5 hidden sm:block" style={{ color: C.mut, letterSpacing: "0.12em" }}>CENTRAL DE OBRAS · SEGUIMIENTO Y COORDINACIÓN</p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            {/* buscador */}
            <div className="relative hidden md:block min-w-[10rem]">
              <Search size={15} className="absolute left-3 top-2.5" style={{ color: C.mut }} />
              <input ref={buscaRef} className={inputCls + " pl-8 w-44 lg:w-64"} style={inputStyle} placeholder="Buscar obra…  (Ctrl+K)"
                title="Atajo: Ctrl+K desde cualquier pantalla"
                value={busca} onChange={(e) => setBusca(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === "Enter" && resultadosBusca.length > 0) abrirObra(resultadosBusca[0].id);
                  if (e.key === "Escape") { setBusca(""); e.currentTarget.blur(); }
                }} />
              {resultadosBusca.length > 0 && (
                <div className="absolute top-full mt-1 left-0 right-0 bg-white rounded-xl border shadow-lg z-40 overflow-hidden aparecer" style={{ borderColor: C.line }}>
                  {resultadosBusca.map((o) => (
                    <button key={o.id} onClick={() => abrirObra(o.id)}
                      className="w-full flex items-center gap-2 px-3 py-2 hover:bg-neutral-50 text-left border-b last:border-b-0" style={{ borderColor: C.line }}>
                      <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ background: (EST[o.estado] || {}).color }} />
                      <span className="text-sm font-semibold truncate" style={{ color: C.ink }}>{o.nombre}</span>
                      <span className="text-xs truncate" style={{ color: C.mut }}>{o.direccion}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            {/* buscador en móvil */}
            <button onClick={() => setBuscaOpen(true)} className="p-2 rounded-lg border hover:bg-neutral-50 md:hidden" style={{ borderColor: C.line }} aria-label="Buscar obra">
              <Search size={17} style={{ color: C.ink }} />
            </button>
            {/* quién soy */}
            <button onClick={() => elegirQuien("")} title="Cambiar de persona"
              className="inline-flex items-center gap-1.5 pl-1.5 pr-2.5 py-1.5 rounded-lg border hover:bg-neutral-50"

              {persona ? <Avatar nombre={persona} /> : <Users size={15} style={{ color: admin ? "#fff" : C.mut }} />}
              <span className="text-sm font-semibold hidden sm:inline" style={{ color: admin ? "#fff" : C.ink }}>{persona || (admin ? "Admin" : "Equipo")}</span>
            </button>
            {/* campana */}
            <button onClick={() => setAvisosOpen(true)} className="relative p-2 rounded-lg border hover:bg-neutral-50" style={{ borderColor: C.line }}
              aria-label="Avisos" title={persona ? "Tus avisos" : "Avisos del equipo"}>
              <Bell size={17} style={{ color: C.ink }} />
              {nAvisosCampana > 0 && (
                <span className={`absolute -top-1.5 -right-1.5 min-w-5 h-5 px-1 rounded-full text-white text-xs font-bold flex items-center justify-center ${rojosCampana > 0 ? "latido" : ""}`}
                  style={{ background: C.red }}>{nAvisosCampana}</span>
              )}
            </button>
            <BtnPrimary onClick={() => setObraModal({})}><Plus size={16} /><span className="hidden lg:inline">Nueva obra</span></BtnPrimary>
            <button onClick={() => setAjustesOpen(true)} className="p-2 rounded-lg border hover:bg-neutral-50" style={{ borderColor: C.line }} aria-label="Ajustes">
              <Settings size={17} style={{ color: C.ink }} />
            </button>
          </div>
        </div>
      </header>

      {/* pestañas */}
      <nav style={{ background: C.ink }}>
        <div className="max-w-7xl mx-auto px-2 flex overflow-x-auto">

            <button key={id} onClick={() => setTab(id)}

            <p className="text-sm flex-1" style={{ color: "#1C5CAB", minWidth: "14rem" }}>
              <b>Hay una versión publicada más reciente</b>{nuevaVersion.fecha ? " (del " + fmtFecha(nuevaVersion.fecha) + ")" : ""}.
              {" "}Al cargarla, los cambios de este navegador que no estén publicados se sustituyen.

            <BtnGhost onClick={cargarNuevaVersion}>Cargar ahora</BtnGhost>
            <button onClick={() => setNuevaVersion(null)} className="p-1 rounded-lg hover:bg-white" title="Seguir con mis datos por ahora">
              <X size={14} style={{ color: C.mut }} />

          </div>
        </div>

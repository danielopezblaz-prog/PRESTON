// Blindaje: guarda en este navegador las últimas 7 copias de los datos.
// Una al día automática y una antes de cada operación delicada (restaurar, vaciar, cargar publicados).
function guardarCopia(motivo, datos, forzar) {
  if (!datos) return;
  try {
    let lista = [];
    try { lista = JSON.parse(localStorage.getItem(KEY_COPIAS) || "[]"); } catch (e) { lista = []; }
    const hoy = new Date().toISOString().slice(0, 10);
    if (!forzar && lista.some((c) => String(c.fecha).slice(0, 10) === hoy && c.motivo === motivo)) return;
    lista.unshift({ fecha: new Date().toISOString(), motivo, n: (datos.obras || []).length, datos: JSON.stringify(datos) });
    localStorage.setItem(KEY_COPIAS, JSON.stringify(lista.slice(0, 7)));
  } catch (e) { /* sin espacio: la copia no debe romper el guardado normal */ }
}

/* ---------- migración desde el CRM comercial anterior ---------- */
function convertirCRM(old) {
  const mapEtapa = { nuevo: "estudio", contactado: "estudio", visita: "estudio", presupuesto: "presupuesto", negociacion: "presupuesto" };
  const mapAct = { llamada: "llamada", email: "email", visita: "visita", reunion: "reunion", presupuesto: "documento", nota: "nota" };
  const acts = Array.isArray(old.actividades) ? old.actividades : [];
  const obras = (Array.isArray(old.leads) ? old.leads : []).map((l) => {
    const estado = l.estado === "ganado" ? "contratada" : l.estado === "perdido" ? "perdida" : (mapEtapa[l.etapa] || "estudio");
    const estadoDesde = l.estado === "activo" ? (l.etapaDesde || l.creado) : (l.cerrado || l.creado);
    const historial = [{ estado: "estudio", fecha: l.creado }];
    if (estado !== "estudio") historial.push({ estado, fecha: estadoDesde });
    return normalizarObra({
      id: l.id, nombre: l.entidad, direccion: l.direccion, contactoNombre: l.nombre,
      telefono: l.telefono, email: l.email, origen: l.origen,
      tipos: l.tipoObra ? [l.tipoObra] : [], responsable: l.comercial, importe: l.valor,
      estado, estadoDesde, historial, motivoPerdida: l.motivoPerdida, notas: l.notas, creado: l.creado,
      puntos: (l.proximaAccion && l.estado === "activo")
        ? [{ id: uid(), texto: l.proximaNota || "Seguimiento", fecha: l.proximaAccion, responsable: l.comercial || "", hecho: false }]
        : [],
      apuntes: acts.filter((a) => a.leadId === l.id).map((a) => ({
        id: a.id || uid(), tipo: mapAct[a.tipo] || "nota", autor: a.comercial || "", texto: a.notas || "", fecha: a.fecha,
      })),
    });
  });
  return {
    obras,
    equipo: Array.isArray(old.comerciales) ? old.comerciales : [],
    config: { objetivoMensual: Number(old.config && old.config.objetivoMensual) || 0 },
  };
}

function leerDatosIncrustados() {
  const el = document.getElementById("datos-centrales");
  if (!el) return null;
  const raw = el.textContent || "";
  const i = raw.indexOf("/*DATOS-INICIO*/");
  const j = raw.indexOf("/*DATOS-FIN*/");
  if (i < 0 || j < 0) return null;
  const cuerpo = raw.slice(i + 16, j).trim();
  if (!cuerpo || cuerpo === "null") return null;
  try { return JSON.parse(cuerpo); } catch (e) { return null; }
}
function abToB64(buf) {
  const u = new Uint8Array(buf); let s = "";
  for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192));
  return btoa(s);
}
function b64ToAb(b64) {
  const s = atob(b64); const u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return u.buffer;
}
// El nº de iteraciones viaja en el propio paquete: los archivos antiguos (150k) siguen abriéndose
// y los nuevos salen endurecidos a 600k, que encarece 4 veces cualquier intento de reventar la clave.
const ITERACIONES_CIFRADO = 600000;
async function claveAES(clave, saltBuf, iteraciones) {
  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: saltBuf, iterations: iteraciones || 150000, hash: "SHA-256" }, material,
    { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function cifrarJSON(obj, clave) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await claveAES(clave, salt.buffer, ITERACIONES_CIFRADO);
  const blob = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, new TextEncoder().encode(JSON.stringify(obj)));
  return { cifrado: true, it: ITERACIONES_CIFRADO, salt: abToB64(salt.buffer), iv: abToB64(iv.buffer), blob: abToB64(blob) };
}
async function descifrarJSON(p, clave) {
  const k = await claveAES(clave, b64ToAb(p.salt), p.it || 150000);
  const plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(b64ToAb(p.iv)) }, k, b64ToAb(p.blob));
  return JSON.parse(new TextDecoder().decode(plano));
}
window.__central = { cifrarJSON, descifrarJSON }; // para soporte y pruebas

      estado: "perdida", estadoDesde: hace(30), creado: hace(80), motivoPerdida: "Precio",

  return { obras, equipo: ["Carlos Medina", "Laura Gil", "Javier Ruiz"], config: { objetivoMensual: 500000 } };
}

/* ---------- lógica derivada ---------- */
const enTablero = (o) => !o.archivada && o.estado !== "perdida";
const esActiva = (o) => !o.archivada && ACTIVOS.includes(o.estado);
const puntosPend = (o) => o.puntos.filter((p) => !p.hecho);
const reqsPend = (o) => o.requerimientos.filter((r) => !r.hecho);
const ultimoMovimiento = (o) => {
  let max = o.estadoDesde || o.creado;
  o.apuntes.forEach((a) => { if (a.fecha > max) max = a.fecha; });
  return max;
};
const proximoPaso = (o) => {
  const conFecha = puntosPend(o).filter((p) => p.fecha).sort((a, b) => a.fecha.localeCompare(b.fecha));
  return conFecha[0] || puntosPend(o)[0] || null;
};
const primeraFechaEstado = (o, estadoId) => {
  const h = (o.historial || []).find((x) => x.estado === estadoId);
  return h ? h.fecha : null;
};
// días que faltan (positivo) o que han pasado (negativo) hasta una fecha YMD
const diasHasta = (ymd) => Math.round((new Date(ymd + "T12:00:00") - new Date(hoyYMD() + "T12:00:00")) / 86400000);

/* ---------- contacto directo: llamar, WhatsApp y email de un clic ---------- */
const soloDigitos = (s) => String(s || "").split("").filter((c) => c >= "0" && c <= "9").join("");
// saca un número español de 9 cifras del campo teléfono (o del contacto, si lo lleva pegado)
const telefonoDeObra = (o) => {
  for (const campo of [o.telefono, o.contactoNombre, o.admFincas]) {
    const d = soloDigitos(campo);
    if (d.length === 9) return d;
    if (d.length === 11 && d.slice(0, 2) === "34") return d.slice(2);
  }
  return "";
};
const esMovil = (tel) => tel && (tel[0] === "6" || tel[0] === "7");
const codigoDeObra = (o) => {
  const m = String(o.notas || "").match(/M[AO]-[0-9]{2}-[0-9]{1,3}/);
  return m ? m[0] : "";
};
const mensajeSeguimiento = (o) => {
  const cod = codigoDeObra(o);
  const envio = o.estado === "presupuesto" ? fmtFecha(o.estadoDesde) : "";
  return "Buenos días. Le escribo de Revestimientos Proyecton por el presupuesto" +
    (cod ? " " + cod : "") + " de " + o.nombre +
    (envio ? ", enviado el " + envio : "") +
    ". ¿Han podido revisarlo? Quedo pendiente de sus comentarios. Un saludo.";
};

/* ---------- semáforo de salud: verde / ámbar / rojo calculado solo ---------- */
function saludObra(o) {
  const hoy = hoyYMD();
  const motivos = [];
  let nivel = 0; // 0 verde · 1 ámbar · 2 rojo
  const marca = (n, m) => { if (n > nivel) nivel = n; motivos.push(m); };
  if (!o.archivada && o.estado !== "perdida") {
    const venc = puntosPend(o).filter((p) => p.fecha && p.fecha < hoy).length
      + reqsPend(o).filter((r) => r.fechaLimite && r.fechaLimite < hoy).length;
    if (venc > 0) marca(2, venc + (venc === 1 ? " punto vencido" : " puntos vencidos"));
    if (o.subEstado === "solicitar" && o.subLimite) {
      const d = diasHasta(o.subLimite);
      if (d < 0) marca(2, "plazo de subvención vencido hace " + (-d) + " días");
      else if (d <= 7) marca(2, "quedan " + d + " días para pedir la subvención");
      else if (d <= 30) marca(1, "subvención: " + d + " días de plazo");
    }
    const sinMov = daysSince(ultimoMovimiento(o));
    if (["contratada", "ejecucion"].includes(o.estado) && sinMov > 30) marca(2, "obra firmada parada " + sinMov + " días");
    else if (esActiva(o) && sinMov > 14) marca(1, "sin movimiento " + sinMov + " días");
    if (esActiva(o) && puntosPend(o).length === 0) marca(1, "sin próximo paso");
    if (o.estado === "presupuesto" && daysSince(o.estadoDesde) > 30) marca(1, "presupuesto " + daysSince(o.estadoDesde) + " días sin respuesta");
    if (["contratada", "ejecucion"].includes(o.estado) && !o.importe) marca(1, "sin importe apuntado");
    if (o.estado === "finalizada" && o.importe > 0 && (o.cobrado || 0) < o.importe) marca(1, "pendiente de cobro");
  }
  return { nivel: nivel === 2 ? "rojo" : nivel === 1 ? "ambar" : "verde", motivos };
}
function PuntoSalud({ obra, size = 10 }) {
  const s = saludObra(obra);
  const color = s.nivel === "rojo" ? C.red : s.nivel === "ambar" ? C.warn : C.ok;
  return (
    <span title={s.motivos.length ? s.motivos.join(" · ") : "Al día"}
      className="inline-block rounded-full flex-shrink-0"
      style={{ width: size, height: size, background: color }} />
  );
}
const RANGO_SALUD = { rojo: 0, ambar: 1, verde: 2 };

/* ---------- automatismos al cambiar de estado ---------- */
// cadencia de seguimiento del presupuesto: llamadas a 7, 21 y 45 días
const puntosSeguimiento = () => ([
  { id: uid(), texto: "Llamar para preguntar por el presupuesto (1er seguimiento)", fecha: ymdMas(7), responsable: "", hecho: false, auto: "seg" },
  { id: uid(), texto: "Insistir con llamada o WhatsApp (2º seguimiento)", fecha: ymdMas(21), responsable: "", hecho: false, auto: "seg" },
  { id: uid(), texto: "Último intento antes de darlo por perdido (3er seguimiento)", fecha: ymdMas(45), responsable: "", hecho: false, auto: "seg" },
]);
// al entrar en un estado: se programa la cadencia (si pasa a presupuesto), se cierran
// los seguimientos automáticos al salir, y se añaden los requerimientos típicos de la fase
function aplicarAutomatismos(o, estadoNuevo) {
  let puntos = o.puntos;
  if (estadoNuevo === "presupuesto" && !puntos.some((p) => p.auto === "seg")) {
    puntos = [...puntos, ...puntosSeguimiento()];
  }
  if (estadoNuevo !== "presupuesto") {
    puntos = puntos.map((p) => p.auto === "seg" && !p.hecho ? { ...p, hecho: true, fechaHecho: new Date().toISOString() } : p);
  }
  const faltan = (REQS_SUGERIDOS[estadoNuevo] || []).filter((s) => !o.requerimientos.some((r) => r.texto === s));
  const requerimientos = faltan.length
    ? [...o.requerimientos, ...faltan.map((s) => ({ id: uid(), texto: s, fechaLimite: "", hecho: false, auto: true }))]
    : o.requerimientos;
  return { ...o, puntos, requerimientos };
}

// Centro de avisos: cada aviso lleva nivel (rojo > ambar > azul), texto, obra
// y "para" (la persona a la que le toca: responsable del punto o de la obra)
function calcularAvisos(data) {
  const hoy = hoyYMD();
  const avisos = [];
  data.obras.filter((o) => !o.archivada && o.estado !== "perdida").forEach((o) => {
    const resp = o.responsable || "";
    // a quién le salta lo de esta obra: responsable + quienes intervienen
    const cuadrilla = [resp].concat(o.colaboradores || []).filter(Boolean).filter((v, i, arr) => arr.indexOf(v) === i);
    puntosPend(o).forEach((p) => {
      const para = p.responsable ? [p.responsable] : cuadrilla;
      if (p.fecha && p.fecha < hoy) avisos.push({ id: `pv_${o.id}_${p.id}`, nivel: "rojo", grupo: "Vencido", texto: p.texto, detalle: `desde ${fmtDia(p.fecha)}`, obraId: o.id, obra: o.nombre, para });
      else if (p.fecha === hoy) avisos.push({ id: `ph_${o.id}_${p.id}`, nivel: "ambar", grupo: "Hoy", texto: p.texto, detalle: "para hoy", obraId: o.id, obra: o.nombre, para });
    });
    reqsPend(o).forEach((r) => {
      if (r.fechaLimite && r.fechaLimite < hoy) avisos.push({ id: `rv_${o.id}_${r.id}`, nivel: "rojo", grupo: "Vencido", texto: `Requerimiento: ${r.texto}`, detalle: `desde ${fmtDia(r.fechaLimite)}`, obraId: o.id, obra: o.nombre, para: cuadrilla });
      else if (r.fechaLimite === hoy) avisos.push({ id: `rh_${o.id}_${r.id}`, nivel: "ambar", grupo: "Hoy", texto: `Requerimiento: ${r.texto}`, detalle: "para hoy", obraId: o.id, obra: o.nombre, para: cuadrilla });
    });
    // plazo de la subvención: avisa con 30 días, aprieta con 7 y grita si venció
    if (o.subEstado === "solicitar" && o.subLimite) {
      const d = diasHasta(o.subLimite);
      const dinero = o.subImporte ? fmtEUR(o.subImporte) + " en juego" : "pon el importe en la ficha";
      if (d < 0) avisos.push({ id: `sl_${o.id}`, nivel: "rojo", grupo: "Vencido", texto: `Plazo de subvención VENCIDO hace ${-d} día${d === -1 ? "" : "s"}`, detalle: dinero, obraId: o.id, obra: o.nombre, para: cuadrilla });
      else if (d === 0) avisos.push({ id: `sl_${o.id}`, nivel: "rojo", grupo: "Hoy", texto: "El plazo de la subvención termina HOY", detalle: dinero, obraId: o.id, obra: o.nombre, para: cuadrilla });
      else if (d <= 7) avisos.push({ id: `sl_${o.id}`, nivel: "rojo", grupo: "Atención", texto: `Quedan ${d} día${d === 1 ? "" : "s"} para solicitar la subvención`, detalle: dinero, obraId: o.id, obra: o.nombre, para: cuadrilla });
      else if (d <= 30) avisos.push({ id: `sl_${o.id}`, nivel: "ambar", grupo: "Atención", texto: `Subvención: ${d} días de plazo para solicitarla`, detalle: dinero, obraId: o.id, obra: o.nombre, para: cuadrilla });
    }
    if (esActiva(o)) {
      if (puntosPend(o).length === 0)
        avisos.push({ id: `sp_${o.id}`, nivel: "ambar", grupo: "Atención", texto: "Sin próximo paso definido", detalle: "añade un punto con fecha", obraId: o.id, obra: o.nombre, para: cuadrilla });
      const dias = daysSince(ultimoMovimiento(o));
      if (dias > 14)
        avisos.push({ id: `sm_${o.id}`, nivel: "ambar", grupo: "Atención", texto: `Sin movimiento desde hace ${dias} días`, detalle: "apunta el último avance", obraId: o.id, obra: o.nombre, para: cuadrilla });
      if (o.estado === "presupuesto" && daysSince(o.estadoDesde) > 21)
        avisos.push({ id: `pe_${o.id}`, nivel: "azul", grupo: "Seguimiento", texto: `Presupuesto sin respuesta (${daysSince(o.estadoDesde)} días)`, detalle: "llama al administrador", obraId: o.id, obra: o.nombre, para: cuadrilla });
      if (o.subEstado === "solicitar" && ["contratada", "ejecucion"].includes(o.estado))
        avisos.push({ id: `su_${o.id}`, nivel: "azul", grupo: "Seguimiento", texto: "Subvención pendiente de solicitar", detalle: o.subImporte ? fmtEUR(o.subImporte) + " en juego" : "", obraId: o.id, obra: o.nombre, para: cuadrilla });
      if (["contratada", "ejecucion"].includes(o.estado) && !o.importe)
        avisos.push({ id: `si_${o.id}`, nivel: "ambar", grupo: "Atención", texto: "Obra firmada sin importe apuntado", detalle: "ponlo en Editar datos", obraId: o.id, obra: o.nombre, para: cuadrilla });
      if (SUB_EN_JUEGO.includes(o.subEstado) && !o.subImporte)
        avisos.push({ id: `sv_${o.id}`, nivel: "azul", grupo: "Seguimiento", texto: "Subvención sin importe definido", detalle: "apunta cuánto se pide", obraId: o.id, obra: o.nombre, para: cuadrilla });
    }
    if (o.estado === "finalizada" && o.importe > 0 && (o.cobrado || 0) < o.importe)
      avisos.push({ id: `co_${o.id}`, nivel: "azul", grupo: "Seguimiento", texto: `Pendiente de cobro: ${fmtEUR(o.importe - (o.cobrado || 0))}`, detalle: "obra terminada sin cobrar del todo", obraId: o.id, obra: o.nombre, para: cuadrilla });
  });
  // datos incompletos, agrupados en una sola línea para no inundar
  const activasTodas = data.obras.filter((o) => !o.archivada && ACTIVOS.includes(o.estado));
  const sinImporte = activasTodas.filter((o) => !o.importe && !["contratada", "ejecucion"].includes(o.estado));
  if (sinImporte.length)
    avisos.push({ id: "agg_imp", nivel: "azul", grupo: "Seguimiento", texto: `${sinImporte.length} obra${sinImporte.length === 1 ? "" : "s"} en estudio o presupuesto sin importe`, detalle: "se completan desde su ficha", obraId: sinImporte.length === 1 ? sinImporte[0].id : null, obra: "Datos incompletos", para: [] });
  const sinContacto = activasTodas.filter((o) => !o.telefono && !o.email && !o.contactoNombre && !o.admFincas);
  if (sinContacto.length)
    avisos.push({ id: "agg_cto", nivel: "azul", grupo: "Seguimiento", texto: `${sinContacto.length} obra${sinContacto.length === 1 ? "" : "s"} activa${sinContacto.length === 1 ? "" : "s"} sin ningún contacto`, detalle: "sin teléfono no hay seguimiento posible", obraId: sinContacto.length === 1 ? sinContacto[0].id : null, obra: "Datos incompletos", para: [] });
  const orden = { rojo: 0, ambar: 1, azul: 2 };
  avisos.sort((a, b) => orden[a.nivel] - orden[b.nivel]);
  return avisos;
}

// Agenda global: puntos y requerimientos pendientes de todas las obras vivas
function calcularAgenda(data) {
  const items = [];
  data.obras.filter((o) => !o.archivada && o.estado !== "perdida").forEach((o) => {
    const cuadrilla = [o.responsable || ""].concat(o.colaboradores || []).filter(Boolean);
    puntosPend(o).forEach((p) => items.push({
      clase: "punto", obraId: o.id, obra: o.nombre, estado: o.estado, id: p.id, texto: p.texto, fecha: p.fecha || "",
      responsable: p.responsable || o.responsable || "",
      implicados: p.responsable ? [p.responsable] : cuadrilla,
    }));
    reqsPend(o).filter((r) => r.fechaLimite).forEach((r) => items.push({
      clase: "req", obraId: o.id, obra: o.nombre, estado: o.estado, id: r.id, texto: r.texto, fecha: r.fechaLimite,
      responsable: o.responsable || "", implicados: cuadrilla,
    }));
  });
  return items;
}

      <span className="w-32 sm:w-36 truncate font-semibold text-left flex-shrink-0" style={{ color: C.ink }}>{label}</span>
      <div className="flex-1 h-3 rounded-full" style={{ background: "#EFEEEC" }}>
        <div className="h-3 rounded-full transition-all" style={{ width: `${max ? Math.max(3, (value / max) * 100) : 3}%`, background: fill }} />
      </div>
      <span className="w-28 text-right font-bold flex-shrink-0" style={{ color: C.ink, fontVariantNumeric: "tabular-nums" }}>{right}</span>
    </Tag>
  );
}
const tooltipStyle = { borderRadius: 10, borderColor: C.line, fontSize: 12 };
const axisTick = { fontSize: 11, fill: C.mut };

function GraficaMeses({ datos, nombre }) {
  return (
    <div style={{ height: 210 }}>
      <ResponsiveContainer width="100%" height="100%">
        <BarChart data={datos} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
          <CartesianGrid strokeDasharray="3 3" stroke={C.grid} vertical={false} />
          <XAxis dataKey="mes" tick={axisTick} axisLine={false} tickLine={false} />
          <YAxis tick={axisTick} axisLine={false} tickLine={false} tickFormatter={fmtK} width={38} />
          <Tooltip formatter={(v) => [fmtEUR(v), nombre]} contentStyle={tooltipStyle} cursor={{ fill: "rgba(0,0,0,0.04)" }} />
          <Bar dataKey="valor" radius={[4, 4, 0, 0]} maxBarSize={28}>
            {datos.map((m, i) => <Cell key={i} fill={i === datos.length - 1 ? C.red : "#D3A29E"} />)}
          </Bar>
        </BarChart>
      </ResponsiveContainer>
    </div>
  );
}

/* ============================ CENTRO DE AVISOS ============================ */
function ListaAvisos({ avisos, onOpen, compacta, quien }) {
  const [modo, setModo] = useState(quien ? "mios" : "todos");
  const mios = quien ? avisos.filter((a) => (a.para || []).includes(quien)) : [];
  const visibles = (modo === "mios" && quien) ? mios : avisos;
  const grupos = [
    { nivel: "rojo", titulo: "Vencido", tone: "red", Icon: AlertTriangle },
    { nivel: "ambar", titulo: "Atención", tone: "warn", Icon: Clock },
    { nivel: "azul", titulo: "Seguimiento", tone: "azul", Icon: Bell },
  ];
  const conmutador = quien ? (
    <div className="flex gap-1.5 mb-3">
      <button onClick={() => setModo("mios")}
        className="px-2.5 py-1 rounded-full text-xs font-bold border transition-colors"
        style={modo === "mios" ? { background: C.ink, color: "#fff", borderColor: C.ink } : { background: "#fff", color: C.ink, borderColor: C.line }}>
        Míos ({mios.length})
      </button>
      <button onClick={() => setModo("todos")}
        className="px-2.5 py-1 rounded-full text-xs font-bold border transition-colors"
        style={modo === "todos" ? { background: C.ink, color: "#fff", borderColor: C.ink } : { background: "#fff", color: C.ink, borderColor: C.line }}>
        Equipo ({avisos.length})
      </button>
    </div>
  ) : null;
  if (visibles.length === 0) {
    return (
      <div>
        {conmutador}
        <div className="flex items-center gap-2 py-3">
          <CircleCheck size={18} style={{ color: C.ok }} />
          <p className="text-sm font-semibold" style={{ color: C.ink }}>
            {modo === "mios" && quien ? `Todo al día, ${quien}: no tienes avisos pendientes.` : "Todo al día. Ninguna obra necesita atención inmediata."}
          </p>
        </div>
      </div>
    );
  }
  return (
    <div>
      {conmutador}
      <div className="space-y-3">
        {grupos.map((g) => {
          const lista = visibles.filter((a) => a.nivel === g.nivel);
          if (!lista.length) return null;
          const mostrar = compacta ? lista.slice(0, 5) : lista;
          return (
            <div key={g.nivel}>
              <p className="text-xs font-bold uppercase tracking-wider mb-1.5 inline-flex items-center gap-1.5" style={{ color: C.mut }}>
                <g.Icon size={13} /> {g.titulo} <Badge tone={g.tone}>{lista.length}</Badge>
              </p>
              <div className="space-y-0.5">
                {mostrar.map((a) => {
                  const Fila = a.obraId ? "button" : "div";
                  return (
                    <Fila key={a.id} onClick={a.obraId ? () => onOpen(a.obraId) : undefined}
                      className={`w-full flex items-center gap-2 px-2 py-1.5 rounded-lg text-left ${a.obraId ? "hover:bg-neutral-50 cursor-pointer" : ""}`}>
                      <span className="w-1.5 h-1.5 rounded-full flex-shrink-0"
                        style={{ background: g.nivel === "rojo" ? C.red : g.nivel === "ambar" ? C.warn : C.azul }} />
                      <span className="text-sm font-semibold truncate" style={{ color: C.ink }}>{a.obra}</span>
                      <span className="text-sm truncate flex-1" style={{ color: C.txt }}>· {a.texto}</span>
                      {modo === "todos" && a.para && a.para.length > 0 && (
                        <span className="inline-flex items-center gap-0.5 flex-shrink-0">
                          <Avatar nombre={a.para[0]} />
                          {a.para.length > 1 && <span className="text-xs font-bold" style={{ color: C.mut }}>+{a.para.length - 1}</span>}
                        </span>
                      )}
                      {a.detalle && <span className="text-xs hidden sm:block flex-shrink-0" style={{ color: C.mut }}>{a.detalle}</span>}
                    </Fila>
                  );
                })}
                {compacta && lista.length > 5 && (
                  <p className="text-xs px-2" style={{ color: C.mut }}>… y {lista.length - 5} más</p>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================ PANEL (el corazón) ============================ */
function PanelView({ data, avisos, onOpen, onNueva, onOpenAjustes, onIrAgenda, addApunte, toast, quien, admin, onCambiarQuien }) {
  const obras = data.obras.filter((o) => !o.archivada);
  const activas = obras.filter((o) => ACTIVOS.includes(o.estado));
  const now = new Date();

  if (data.obras.length === 0) {
    return (
      <EmptyHint icon={LayoutDashboard} title="La Central de Obras está lista"
        text="Aquí verás cada obra con su estado, sus apuntes, sus requerimientos y sus avisos, todo en un mismo sitio. Crea la primera obra o restaura una copia de seguridad desde Ajustes."
        action={<BtnPrimary onClick={onNueva}><Plus size={16} /> Crear la primera obra</BtnPrimary>} />
    );
  }

  const pipeline = obras.filter((o) => ["estudio", "presupuesto"].includes(o.estado));
  const cartera = obras.filter((o) => ["contratada", "ejecucion"].includes(o.estado));
  const enEjecucion = obras.filter((o) => o.estado === "ejecucion");
  const subEnJuego = obras.filter((o) => SUB_EN_JUEGO.includes(o.subEstado)).reduce((s, o) => s + o.subImporte, 0);
  const rojos = avisos.filter((a) => a.nivel === "rojo").length;
  const paraHoy = avisos.filter((a) => a.grupo === "Hoy").length;

  // los números personales de quien usa este navegador
  const hoyStr = hoyYMD();
  const misPuntos = quien ? activas.flatMap((o) => puntosPend(o).filter((p) =>
    p.responsable ? p.responsable === quien : (o.responsable === quien || (o.colaboradores || []).includes(quien)))) : [];
  const misHoy = misPuntos.filter((p) => p.fecha === hoyStr).length;
  const misVencidos = misPuntos.filter((p) => p.fecha && p.fecha < hoyStr).length;
  const misObras = quien ? activas.filter((o) => o.responsable === quien).length : 0;
  const misSinFecha = misPuntos.filter((p) => !p.fecha).length;

  // objetivo del mes: contratado (primer paso a "contratada") dentro del mes actual
  const esEsteMes = (iso) => { const d = new Date(iso); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); };
  const contratadasMes = data.obras.filter((o) => { const f = primeraFechaEstado(o, "contratada"); return f && esEsteMes(f); });
  const valorMes = contratadasMes.reduce((s, o) => s + o.importe, 0);
  const objetivo = data.config.objetivoMensual || 0;

  // contratado por mes (últimos 6)
  const meses = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    meses.push({ key: `${d.getFullYear()}-${d.getMonth()}`, mes: d.toLocaleDateString("es-ES", { month: "short" }), valor: 0 });
  }
  data.obras.forEach((o) => {
    const f = primeraFechaEstado(o, "contratada");
    if (!f) return;
    const d = new Date(f);
    const m = meses.find((x) => x.key === `${d.getFullYear()}-${d.getMonth()}`);
    if (m) m.valor += o.importe;
  });

  // cartera por estado
  const porEstado = ESTADOS_TABLERO.map((e) => {
    const col = obras.filter((o) => o.estado === e.id);
    return { e, n: col.length, v: col.reduce((s, o) => s + o.importe, 0) };
  });
  const maxEstadoV = Math.max(1, ...porEstado.map((x) => x.v));

  // agenda de la semana
  const hoy = hoyYMD(), semana = ymdMas(7);
  const agenda = calcularAgenda(data).filter((i) => i.fecha && i.fecha <= semana).sort((a, b) => a.fecha.localeCompare(b.fecha)).slice(0, 8);

  // lo que nadie ve: los presupuestos que más tiempo llevan esperando respuesta
  const esperando = obras.filter((o) => o.estado === "presupuesto")
    .sort((a, b) => a.estadoDesde.localeCompare(b.estadoDesde)).slice(0, 3);

  // actividad reciente
  const recientes = obras.flatMap((o) => o.apuntes.map((a) => ({ ...a, obra: o.nombre, obraId: o.id })))
    .sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 6);

  // carga del equipo
  const carga = data.equipo.map((m) => {
    const mias = activas.filter((o) => o.responsable === m);
    const pts = activas.flatMap((o) => puntosPend(o).filter((p) => (p.responsable || o.responsable) === m));
    return { m, obras: mias.length, puntos: pts.length, vencidos: pts.filter((p) => p.fecha && p.fecha < hoy).length };
  }).filter((x) => x.obras > 0 || x.puntos > 0);

  const sinPasoN = avisos.filter((a) => String(a.id).indexOf("sp_") === 0).length;
  const sinMovN = avisos.filter((a) => String(a.id).indexOf("sm_") === 0).length;
  const porPersona = admin ? data.equipo.map((m) => ({
    m, n: avisos.filter((a) => (a.para || []).includes(m) && (a.nivel === "rojo" || a.grupo === "Hoy")).length,
  })) : [];

  return (
    <div className="space-y-5">
      {/* modo administrador: el pulso de todo el equipo */}
      {admin && (
        <Card style={{ borderLeftWidth: 3, borderLeftColor: C.ink }}>
          <div className="flex flex-wrap items-center gap-3">
            <div className="w-10 h-10 rounded-full flex items-center justify-center text-white flex-shrink-0" style={{ background: C.ink }}>
              <Bell size={18} />
            </div>
            <div className="flex-1" style={{ minWidth: "14rem" }}>
              <p className="text-lg font-extrabold" style={{ color: C.ink }}>Modo administrador</p>
              <p className="text-sm" style={{ color: C.txt }}>
                {rojos > 0 && <b style={{ color: C.redDark }}>{rojos} vencido{rojos === 1 ? "" : "s"} · </b>}
                {paraHoy} para hoy · {sinPasoN} sin próximo paso · {sinMovN} sin movimiento
              </p>
            </div>
            <div className="flex flex-wrap gap-1.5" title="Avisos urgentes de cada persona">
              {porPersona.map((x) => (
                <span key={x.m} className="inline-flex items-center gap-1.5 pl-1 pr-2 py-1 rounded-full border text-xs font-bold"
                  style={{ borderColor: C.line, color: x.n > 0 ? C.redDark : C.mut }}>
                  <Avatar nombre={x.m} /> {x.n}
                </span>
              ))}
            </div>
          </div>
        </Card>
      )}

      {/* mi día */}
      {quien && (
        <Card style={{ borderLeftWidth: 3, borderLeftColor: misVencidos > 0 ? C.red : C.ok }}>
          <div className="flex flex-wrap items-center gap-3">
            <Avatar nombre={quien} size={10} />
            <div className="flex-1" style={{ minWidth: "14rem" }}>
              <p className="text-lg font-extrabold" style={{ color: C.ink }}>Hola, {quien}</p>
              <p className="text-sm" style={{ color: C.txt }}>
                {misVencidos > 0 && <b style={{ color: C.redDark }}>{misVencidos} vencido{misVencidos === 1 ? "" : "s"} · </b>}
                {misHoy} para hoy · {misObras} obra{misObras === 1 ? "" : "s"} tuya{misObras === 1 ? "" : "s"} activa{misObras === 1 ? "" : "s"}
                {misSinFecha > 0 ? ` · ${misSinFecha} puntos sin fecha` : ""}
              </p>
            </div>
            <BtnPrimary onClick={onIrAgenda}><CalendarDays size={15} /> Mi agenda</BtnPrimary>
            <BtnGhost onClick={onCambiarQuien}>Cambiar</BtnGhost>
          </div>
        </Card>
      )}

      {/* KPIs */}
      <div className="grid grid-cols-2 lg:grid-cols-5 gap-3">
        <KPI label="Obras activas" value={activas.length} sub={`${enEjecucion.length} en ejecución`} Icon={Building2} />
        <KPI label="Pipeline comercial" value={fmtEUR(pipeline.reduce((s, o) => s + o.importe, 0))} sub={`${pipeline.length} en estudio o presupuesto`} Icon={FileText} />
        <KPI label="Cartera contratada" value={fmtEUR(cartera.reduce((s, o) => s + o.importe, 0))} accent={C.red} sub={`${cartera.length} obras firmadas`} Icon={Hammer} />
        <KPI label="Subvención en juego" value={fmtEUR(subEnJuego)} sub="pendiente de cobrar" Icon={Euro} />
        <KPI label="Avisos" value={rojos + paraHoy} accent={rojos ? C.red : C.ok} sub={rojos ? `${rojos} vencidos · ${paraHoy} para hoy` : "nada urgente"} Icon={Bell} />
      </div>

      {/* Avisos + agenda */}
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <Card className="lg:col-span-2" style={rojos ? { borderLeftWidth: 3, borderLeftColor: C.red } : {}}>
          <SectionTitle>Centro de avisos</SectionTitle>
          <ListaAvisos avisos={avisos} onOpen={onOpen} compacta quien={quien} />
        </Card>
        <Card>
          <SectionTitle right={<BtnGhost onClick={onIrAgenda} className="!px-2 !py-1 text-xs">Ver agenda</BtnGhost>}>Próximos 7 días</SectionTitle>
          {agenda.length === 0 ? (
            <p className="text-sm py-2" style={{ color: C.mut }}>Sin puntos con fecha esta semana. Ponles fecha a los siguientes pasos para que aparezcan aquí.</p>
          ) : (
            <div className="space-y-0.5">
              {agenda.map((i) => (
                <button key={`${i.clase}_${i.obraId}_${i.id}`} onClick={() => onOpen(i.obraId)}
                  className="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-neutral-50 text-left">
                  <Badge tone={i.fecha < hoy ? "red" : i.fecha === hoy ? "warn" : "neutral"}>{i.fecha < hoy ? "vencido" : fmtDia(i.fecha)}</Badge>
                  <span className="text-sm truncate flex-1" style={{ color: C.ink }}>{i.texto}</span>
                </button>
              ))}
            </div>
          )}
          {esperando.length > 0 && (
            <div className="mt-4 pt-3 border-t" style={{ borderColor: C.line }}>
              <p className="text-xs font-bold uppercase tracking-wider mb-1.5" style={{ color: C.mut }}>Esperando respuesta desde hace más</p>
              <div className="space-y-0.5">
                {esperando.map((o) => (
                  <button key={o.id} onClick={() => onOpen(o.id)} className="w-full flex items-center gap-2 px-2 py-1 rounded-lg hover:bg-neutral-50 text-left">
                    <Badge tone="warn">{daysSince(o.estadoDesde)}d</Badge>
                    <span className="text-sm truncate flex-1" style={{ color: C.ink }}>{o.nombre}</span>
                    <span className="text-xs flex-shrink-0" style={{ color: C.mut, fontVariantNumeric: "tabular-nums" }}>{fmtEUR(o.importe)}</span>
                  </button>
                ))}
              </div>
            </div>
          )}
        </Card>
      </div>

      {/* Objetivo + gráficas */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <Card>
          <SectionTitle>Cartera por estado</SectionTitle>
          <div className="space-y-2">
            {porEstado.map(({ e, n, v }) => (
              <HBar key={e.id} label={e.label} value={v} max={maxEstadoV} right={`${fmtEUR(v)} · ${n}`} fill={e.color} />
            ))}
          </div>
          <div className="mt-4 pt-3 border-t" style={{ borderColor: C.line }}>
            <div className="flex items-center justify-between gap-3 flex-wrap">
              <p className="text-xs font-bold uppercase tracking-wider inline-flex items-center gap-1.5" style={{ color: C.mut }}>
                <Target size={13} /> Objetivo del mes
              </p>
              {objetivo > 0 ? (
                <p className="text-sm font-bold" style={{ color: C.ink, fontVariantNumeric: "tabular-nums" }}>
                  {fmtEUR(valorMes)} / {fmtEUR(objetivo)}
                  <span className="ml-2" style={{ color: valorMes >= objetivo ? C.ok : C.mut }}>({pct(objetivo ? valorMes / objetivo : 0)})</span>
                </p>
              ) : (
                <BtnGhost onClick={onOpenAjustes} className="!px-2 !py-1 text-xs">Definir objetivo</BtnGhost>
              )}
            </div>
            {objetivo > 0 && <div className="mt-2"><BarraProgreso valor={(valorMes / objetivo) * 100} color={valorMes >= objetivo ? C.ok : C.red} /></div>}
          </div>
        </Card>
        <Card>
          <SectionTitle>Contratado por mes</SectionTitle>
          <GraficaMeses datos={meses} nombre="Contratado" />
        </Card>
      </div>

      {/* Obras en ejecución */}
      {enEjecucion.length > 0 && (
        <Card>
          <SectionTitle>Obras en ejecución</SectionTitle>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-3">
            {enEjecucion.sort((a, b) => b.importe - a.importe).map((o) => {
              const dias = daysSince(ultimoMovimiento(o));
              return (
                <button key={o.id} onClick={() => onOpen(o.id)} className="text-left px-2 py-1.5 -mx-2 rounded-lg hover:bg-neutral-50">
                  <div className="flex items-center justify-between gap-2 mb-1">
                    <span className="text-sm font-bold truncate" style={{ color: C.ink }}>{o.nombre}</span>
                    <span className="text-xs font-semibold flex-shrink-0" style={{ color: dias > 7 ? C.warn : C.mut }}>
                      {o.avance}% · últ. apunte hace {dias}d
                    </span>
                  </div>
                  <BarraProgreso valor={o.avance} color={C.red} />
                </button>
              );
            })}
          </div>
        </Card>
      )}

      {/* Actividad + equipo */}
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <Card className="lg:col-span-2">
          <SectionTitle>Última actividad</SectionTitle>
          <ApunteRapido data={data} addApunte={addApunte} toast={toast} />
          <div className="mt-3 space-y-2.5">
            {recientes.map((a) => {
              const { Icon, label } = apunteMeta(a.tipo);
              return (
                <button key={a.id} onClick={() => onOpen(a.obraId)} className="w-full flex gap-2.5 text-left px-1 py-0.5 rounded-lg hover:bg-neutral-50">
                  <div className="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5"
                    style={{ background: a.tipo === "incidencia" ? C.redTint : C.bone, color: a.tipo === "incidencia" ? C.red : C.ink }}>
                    <Icon size={13} />
                  </div>
                  <div className="min-w-0">
                    <p className="text-xs font-bold" style={{ color: C.ink }}>
                      {a.obra} <span className="font-medium" style={{ color: C.mut }}>· {label}{a.autor ? ` · ${a.autor}` : ""} · {fmtFecha(a.fecha)}</span>
                    </p>
                    <p className="text-sm truncate" style={{ color: C.txt }}>{a.texto}</p>
                  </div>
                </button>
              );
            })}
            {recientes.length === 0 && <p className="text-sm py-2" style={{ color: C.mut }}>Todavía no hay apuntes. Registra el primero arriba: cada avance queda en el diario de su obra.</p>}
          </div>
        </Card>
        <Card>
          <SectionTitle>Carga del equipo</SectionTitle>
          {carga.length === 0 ? (
            <p className="text-sm py-2" style={{ color: C.mut }}>Añade a tu equipo en Ajustes y asigna cada obra a un responsable para repartir el trabajo.</p>
          ) : (
            <div className="space-y-2">
              {carga.map((x) => (
                <div key={x.m} className="flex items-center gap-2.5">
                  <Avatar nombre={x.m} size={8} />
                  <div className="min-w-0 flex-1">
                    <p className="text-sm font-bold truncate" style={{ color: C.ink }}>{x.m}</p>
                    <p className="text-xs" style={{ color: C.mut }}>{x.obras} obras · {x.puntos} puntos</p>
                  </div>
                  {x.vencidos > 0 && <Badge tone="red">{x.vencidos} vencidos</Badge>}
                </div>
              ))}
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}

function ApunteRapido({ data, addApunte, toast }) {
  const vivas = data.obras.filter((o) => !o.archivada && o.estado !== "perdida");
  const [obraId, setObraId] = useState("");
  const [texto, setTexto] = useState("");
  const guardar = () => {
    if (!obraId || !texto.trim()) return;
    addApunte(obraId, { tipo: "nota", autor: "", texto: texto.trim() });
    setTexto("");
    toast("Apunte guardado en el diario de la obra");
  };
  if (vivas.length === 0) return null;
  return (
    <div className="rounded-xl border p-2.5 flex flex-col sm:flex-row gap-2" style={{ borderColor: C.line, background: C.bone }}>
      <select className={inputCls + " sm:w-56"} style={inputStyle} value={obraId} onChange={(e) => setObraId(e.target.value)}>
        <option value="">Apunte rápido en…</option>
        {vivas.map((o) => <option key={o.id} value={o.id}>{o.nombre}</option>)}
      </select>
      <input className={inputCls} style={inputStyle} placeholder="¿Qué ha pasado? Se guarda en el diario de la obra"
        value={texto} onChange={(e) => setTexto(e.target.value)} onKeyDown={(e) => e.key === "Enter" && guardar()} />
      <BtnPrimary onClick={guardar} disabled={!obraId || !texto.trim()}><Plus size={15} /> Anotar</BtnPrimary>
    </div>
  );
}

/* ============================ TABLERO (kanban) ============================ */
function TableroView({ data, onOpen, onNueva, setEstado, onPerdida }) {
  const [dragId, setDragId] = useState(null);
  const [overCol, setOverCol] = useState(null);
  const hoy = hoyYMD();
  const obras = data.obras.filter(enTablero);
  const perdidas = data.obras.filter((o) => !o.archivada && o.estado === "perdida");

  if (obras.length === 0 && perdidas.length === 0) {
    return (
      <EmptyHint icon={Columns} title="El tablero está vacío"
        text="Cada obra es una tarjeta que avanza por las columnas: Estudio → Presupuesto → Contratada → En ejecución → Finalizada. Arrástralas con el ratón o usa las flechas."
        action={<BtnPrimary onClick={onNueva}><Plus size={16} /> Nueva obra</BtnPrimary>} />
    );
  }

  const soltar = (estadoId) => {
    if (dragId) setEstado(dragId, estadoId);
    setDragId(null); setOverCol(null);
  };

  return (
    <div>
      <div className="overflow-x-auto pb-2 -mx-1 px-1 snap-x snap-mandatory sm:snap-none">
        <div className="flex gap-3 min-w-[68rem]">
          {ESTADOS_TABLERO.map((e, ei) => {
            const col = obras.filter((o) => o.estado === e.id)
              .sort((a, b) => (a.prioridad === "alta" ? -1 : 0) - (b.prioridad === "alta" ? -1 : 0) || b.importe - a.importe);
            const total = col.reduce((s, o) => s + o.importe, 0);
            const resaltada = overCol === e.id;
            return (
              <div key={e.id} className="flex-1 rounded-xl p-2 transition-colors snap-center min-w-[80vw] sm:min-w-[13rem]" style={{ background: resaltada ? e.tint : "#ECEAE7", outline: resaltada ? `2px dashed ${e.color}` : "none" }}
                onDragOver={(ev) => { ev.preventDefault(); if (overCol !== e.id) setOverCol(e.id); }}
                onDragLeave={() => overCol === e.id && setOverCol(null)}
                onDrop={(ev) => { ev.preventDefault(); soltar(e.id); }}>
                <div className="px-1.5 pb-1 flex items-center justify-between">
                  <span className="text-xs font-extrabold uppercase tracking-wider inline-flex items-center gap-1.5" style={{ color: C.ink }} title={e.desc}>
                    <span className="w-2.5 h-2.5 rounded-full" style={{ background: e.color }} />{e.label}
                  </span>
                  <span className="text-xs font-bold px-1.5 py-0.5 rounded-md text-white" style={{ background: e.color }}>{col.length}</span>
                </div>
                <p className="px-1.5 pb-2 text-xs font-semibold" style={{ color: C.mut, fontVariantNumeric: "tabular-nums" }}>{fmtEUR(total)}</p>
                <div className="space-y-2 min-h-10">
                  {col.map((o) => {
                    const paso = proximoPaso(o);
                    const vencidos = puntosPend(o).filter((p) => p.fecha && p.fecha < hoy).length
                      + reqsPend(o).filter((r) => r.fechaLimite && r.fechaLimite < hoy).length;
                    const dias = daysSince(o.estadoDesde);
                    return (
                      <div key={o.id} draggable
                        onDragStart={(ev) => { ev.dataTransfer.setData("text/plain", o.id); ev.dataTransfer.effectAllowed = "move"; setDragId(o.id); }}
                        onDragEnd={() => { setDragId(null); setOverCol(null); }}
                        className={`bg-white rounded-lg border p-2.5 shadow-sm cursor-grab active:cursor-grabbing transition-shadow hover:shadow-md ${dragId === o.id ? "arrastrando" : ""}`}
                        style={{ borderColor: C.line, borderLeftWidth: 3, borderLeftColor: vencidos ? C.red : e.color }}>
                        <button className="text-left w-full" onClick={() => onOpen(o.id)}>
                          <div className="flex items-start justify-between gap-1">
                            <p className="text-sm font-bold leading-snug" style={{ color: C.ink }}>{o.nombre}</p>
                            <span className="flex items-center gap-1 flex-shrink-0 mt-0.5"><PuntoSalud obra={o} size={9} /><PrioFlag prioridad={o.prioridad} /></span>
                          </div>
                          {(o.tipos.length > 0 || o.direccion) && (
                            <p className="text-xs mt-0.5 truncate" style={{ color: C.mut }}>
                              {o.tipos[0] || ""}{o.tipos.length > 1 ? ` +${o.tipos.length - 1}` : ""}{o.tipos.length && o.direccion ? " · " : ""}{o.direccion}
                            </p>
                          )}
                          <div className="flex items-center justify-between mt-1.5 gap-1">
                            <span className="text-sm font-extrabold" style={{ color: C.red, fontVariantNumeric: "tabular-nums" }}>{fmtEUR(o.importe)}</span>
                            <span className="text-xs font-semibold inline-flex items-center gap-1" style={{ color: dias > 30 ? C.warn : C.mut }} title="Días en este estado">
                              <Clock size={11} /> {dias}d
                            </span>
                          </div>
                          {o.estado === "ejecucion" && <div className="mt-1.5"><BarraProgreso valor={o.avance} alto={5} /></div>}
                          <div className="flex items-center gap-1.5 mt-1.5 flex-wrap">
                            {vencidos > 0 && <Badge tone="red" title="Puntos o requerimientos vencidos"><AlertTriangle size={11} /> {vencidos}</Badge>}
                            {paso && paso.fecha && (
                              <Badge tone={paso.fecha < hoy ? "red" : "neutral"} title={paso.texto}><CalendarDays size={11} /> {fmtDia(paso.fecha)}</Badge>
                            )}
                            <SubBadge obra={o} />
                          </div>
                          <div className="flex items-center justify-between mt-1.5">
                            <span className="text-xs truncate" style={{ color: C.mut }}>{o.responsable || "Sin responsable"}</span>
                            {o.responsable && <Avatar nombre={o.responsable} />}
                          </div>
                        </button>
                        <div className="flex items-center justify-between mt-2 pt-2 border-t" style={{ borderColor: C.line }}>
                          <div className="flex gap-1">
                            <button title="Estado anterior" disabled={ei === 0} onClick={() => setEstado(o.id, ESTADOS_TABLERO[ei - 1].id)}
                              className={`p-1 rounded-md border ${ei === 0 ? "opacity-30" : "hover:bg-neutral-100"}`} style={{ borderColor: C.line }}>
                              <ChevronLeft size={14} />
                            </button>
                            <button title="Estado siguiente" disabled={ei === ESTADOS_TABLERO.length - 1} onClick={() => setEstado(o.id, ESTADOS_TABLERO[ei + 1].id)}
                              className={`p-1 rounded-md border ${ei === ESTADOS_TABLERO.length - 1 ? "opacity-30" : "hover:bg-neutral-100"}`} style={{ borderColor: C.line }}>
                              <ChevronRight size={14} />
                            </button>
                          </div>
                          <button title="Marcar como perdida" onClick={() => onPerdida(o.id)}
                            className="p-1 rounded-md border hover:bg-neutral-100" style={{ borderColor: C.line, color: C.mut }}>
                            <X size={14} />
                          </button>
                        </div>
                      </div>
                    );
                  })}
                  {col.length === 0 && <p className="text-xs text-center py-4" style={{ color: C.mut }}>{resaltada ? "Suelta aquí" : "Sin obras"}</p>}
                </div>
              </div>
            );
          })}
        </div>
      </div>
      {perdidas.length > 0 && (
        <p className="text-xs mt-2 px-1" style={{ color: C.mut }}>
          {perdidas.length} obra{perdidas.length === 1 ? "" : "s"} perdida{perdidas.length === 1 ? "" : "s"} — puedes verlas en la pestaña <b>Obras</b> filtrando por estado.
        </p>
      )}
    </div>
  );
}

/* ============================ OBRAS (lista) ============================ */
function ObrasView({ data, onOpen, onNueva, onExport, onImport }) {
  const [q, setQ] = useState("");
  const [fEst, setFEst] = useState("vivas");
  const [fResp, setFResp] = useState("todos");
  const [fTipo, setFTipo] = useState("todos");
  const [orden, setOrden] = useState("urgentes");
  const hoy = hoyYMD();

  const lista = data.obras
    .filter((o) => {
      if (fEst === "vivas") return !o.archivada && o.estado !== "perdida";
      if (fEst === "archivadas") return o.archivada;
      return !o.archivada && o.estado === fEst;
    })
    .filter((o) => fResp === "todos" || o.responsable === fResp)
    .filter((o) => fTipo === "todos" || o.tipos.includes(fTipo))
    .filter((o) => {
      if (!q.trim()) return true;
      const s = `${o.nombre} ${o.direccion} ${o.municipio} ${o.contactoNombre} ${o.admFincas} ${o.telefono} ${o.notas}`.toLowerCase();
      return s.includes(q.toLowerCase());
    })
    .sort(orden === "urgentes"
      ? (a, b) => RANGO_SALUD[saludObra(a).nivel] - RANGO_SALUD[saludObra(b).nivel] || b.importe - a.importe
      : orden === "importe"
        ? (a, b) => b.importe - a.importe
        : (a, b) => b.creado.localeCompare(a.creado));

  return (
    <div className="space-y-3">
      <div className="flex flex-col lg:flex-row gap-2 lg:items-center">
        <div className="relative flex-1">
          <Search size={16} className="absolute left-3 top-2.5" style={{ color: C.mut }} />
          <input className={inputCls + " pl-9"} style={inputStyle} placeholder="Buscar por comunidad, dirección, contacto…"
            value={q} onChange={(e) => setQ(e.target.value)} />
        </div>
        <div className="flex gap-2 flex-wrap">
          <select className={inputCls + " w-auto"} style={inputStyle} value={fEst} onChange={(e) => setFEst(e.target.value)}>
            <option value="vivas">Todas las vivas</option>
            {ESTADOS.map((e) => <option key={e.id} value={e.id}>{e.label}</option>)}
            <option value="archivadas">Archivadas</option>
          </select>
          <select className={inputCls + " w-auto"} style={inputStyle} value={fResp} onChange={(e) => setFResp(e.target.value)}>
            <option value="todos">Todo el equipo</option>
            {data.equipo.map((c) => <option key={c}>{c}</option>)}
          </select>
          <select className={inputCls + " w-auto"} style={inputStyle} value={fTipo} onChange={(e) => setFTipo(e.target.value)}>
            <option value="todos">Todos los tipos</option>
            {TIPOS_OBRA.map((t) => <option key={t}>{t}</option>)}
          </select>
          <select className={inputCls + " w-auto"} style={inputStyle} value={orden} onChange={(e) => setOrden(e.target.value)} title="Orden de la lista">
            <option value="urgentes">Urgentes primero</option>
            <option value="recientes">Más recientes</option>
            <option value="importe">Mayor importe</option>
          </select>
          <BtnGhost onClick={onImport} title="Importar obras en lote desde carpetas o una lista"><Upload size={15} /> Importar</BtnGhost>
          <BtnGhost onClick={onExport}><Download size={15} /> CSV</BtnGhost>
          <BtnPrimary onClick={onNueva}><Plus size={16} /> Nueva obra</BtnPrimary>
        </div>
      </div>

      <Card className="p-0 overflow-hidden hidden lg:block">
        <div className="overflow-x-auto">
          <table className="w-full text-sm" style={{ minWidth: "64rem" }}>
            <thead>
              <tr className="text-left text-xs uppercase tracking-wider" style={{ color: C.mut, background: C.bone }}>
                <th className="py-2.5 px-3">Obra</th>
                <th className="py-2.5 px-3">Estado</th>
                <th className="py-2.5 px-3 text-right">Importe</th>
                <th className="py-2.5 px-3">Subvención</th>
                <th className="py-2.5 px-3">Responsable</th>
                <th className="py-2.5 px-3">Próximo paso</th>
                <th className="py-2.5 px-3">Últ. movimiento</th>
                <th className="py-2.5 px-3 text-right">Pendientes</th>
              </tr>
            </thead>
            <tbody>
              {lista.map((o) => {
                const paso = proximoPaso(o);
                const npend = puntosPend(o).length + reqsPend(o).length;
                const venc = puntosPend(o).filter((p) => p.fecha && p.fecha < hoy).length + reqsPend(o).filter((r) => r.fechaLimite && r.fechaLimite < hoy).length;
                return (
                  <tr key={o.id} className="border-t cursor-pointer hover:bg-neutral-50" style={{ borderColor: C.line }} onClick={() => onOpen(o.id)}>
                    <td className="py-2.5 px-3">
                      <p className="font-bold inline-flex items-center gap-1.5" style={{ color: C.ink }}><PuntoSalud obra={o} /> {o.nombre} <PrioFlag prioridad={o.prioridad} /></p>
                      <p className="text-xs" style={{ color: C.mut }}>{[o.tipos[0], o.direccion || o.municipio].filter(Boolean).join(" · ") || "—"}</p>
                    </td>
                    <td className="py-2.5 px-3"><EstadoBadge estado={o.estado} conDias desde={o.estadoDesde} /></td>
                    <td className="py-2.5 px-3 text-right font-bold" style={{ fontVariantNumeric: "tabular-nums" }}>{fmtEUR(o.importe)}</td>
                    <td className="py-2.5 px-3"><SubBadge obra={o} /></td>
                    <td className="py-2.5 px-3 text-xs font-semibold">{o.responsable || "—"}</td>
                    <td className="py-2.5 px-3 text-xs">
                      {paso ? (
                        <span style={{ color: paso.fecha && paso.fecha < hoy ? C.redDark : C.ink, fontWeight: 700 }}>
                          {paso.fecha ? fmtDia(paso.fecha) + " · " : ""}{paso.texto.slice(0, 32)}{paso.texto.length > 32 ? "…" : ""}
                        </span>
                      ) : <span style={{ color: o.estado === "finalizada" || o.estado === "perdida" ? C.mut : C.warn, fontWeight: 600 }}>{o.estado === "finalizada" || o.estado === "perdida" ? "—" : "Sin definir"}</span>}
                    </td>
                    <td className="py-2.5 px-3 text-xs" style={{ color: C.mut }}>hace {daysSince(ultimoMovimiento(o))}d</td>
                    <td className="py-2.5 px-3 text-right">
                      {venc > 0 ? <Badge tone="red">{venc} vencidos</Badge> : npend > 0 ? <Badge>{npend}</Badge> : <Badge tone="ok"><Check size={11} /> al día</Badge>}
                    </td>
                  </tr>
                );
              })}
              {lista.length === 0 && (
                <tr><td colSpan={8} className="py-8 text-center text-sm" style={{ color: C.mut }}>
                  No hay obras con estos filtros.
                </td></tr>
              )}
            </tbody>
          </table>
        </div>
      </Card>

      {/* en móvil y tablet la tabla se convierte en tarjetas tocables */}
      <div className="lg:hidden space-y-2">
        {lista.map((o) => {
          const paso = proximoPaso(o);
          const venc = puntosPend(o).filter((p) => p.fecha && p.fecha < hoy).length + reqsPend(o).filter((r) => r.fechaLimite && r.fechaLimite < hoy).length;
          return (
            <button key={o.id} onClick={() => onOpen(o.id)} className="w-full text-left bg-white rounded-xl border p-3 active:bg-neutral-50" style={{ borderColor: C.line }}>
              <div className="flex items-start justify-between gap-2">
                <p className="font-bold flex items-center gap-1.5 min-w-0" style={{ color: C.ink }}>
                  <PuntoSalud obra={o} /> <span className="truncate">{o.nombre}</span> <PrioFlag prioridad={o.prioridad} />
                </p>
                <span className="font-extrabold flex-shrink-0 text-sm" style={{ color: C.red, fontVariantNumeric: "tabular-nums" }}>{fmtEUR(o.importe)}</span>
              </div>
              <div className="flex items-center gap-1.5 mt-1.5 flex-wrap">
                <EstadoBadge estado={o.estado} conDias desde={o.estadoDesde} />
                <SubBadge obra={o} />
                {venc > 0 && <Badge tone="red">{venc} vencido{venc === 1 ? "" : "s"}</Badge>}
              </div>
              <div className="flex items-center justify-between gap-2 mt-1.5">
                <p className="text-xs truncate flex-1" style={{ color: paso && paso.fecha && paso.fecha < hoy ? C.redDark : C.mut }}>
                  {paso ? (paso.fecha ? fmtDia(paso.fecha) + " · " : "") + paso.texto : "Sin próximo paso"}
                </p>
                {o.responsable && <Avatar nombre={o.responsable} />}
              </div>
            </button>
          );
        })}
        {lista.length === 0 && (
          <Card><p className="text-sm text-center py-4" style={{ color: C.mut }}>No hay obras con estos filtros.</p></Card>
        )}
      </div>
    </div>
  );
}

/* ============================ AGENDA ============================ */
function AgendaView({ data, onOpen, togglePendiente, quien, addPunto, setFechaItem, crearObraVisita }) {
  const [fResp, setFResp] = useState(quien || "todos");
  const [verSinFecha, setVerSinFecha] = useState(false);
  const [formOpen, setFormOpen] = useState(false);
  const [modo, setModo] = useState("existente"); // existente | nueva
  const [obraId, setObraId] = useState("");
  const [nombre, setNombre] = useState("");
  const [municipio, setMunicipio] = useState("");
  const [telefono, setTelefono] = useState("");
  const [texto, setTexto] = useState("Visita a la obra");
  const [fecha, setFecha] = useState(ymdMas(1));
  const [hora, setHora] = useState("");
  const [resp, setResp] = useState(quien || "");
  const hoy = hoyYMD(), maniana = ymdMas(1), semana = ymdMas(7);
  const itemsTodos = calcularAgenda(data);
  const items = itemsTodos.filter((i) => fResp === "todos" || (i.implicados || [i.responsable]).includes(fResp));
  const vivas = data.obras.filter((o) => !o.archivada && o.estado !== "perdida");
  const TIPICOS_AGENDA = ["Visita a la obra", "Llamar al administrador", "Medición", "Junta de vecinos", "Enviar el presupuesto"];

  const guardar = () => {
    const txt = (texto.trim() || "Visita a la obra") + (hora ? " · " + hora : "");
    if (modo === "existente") {
      if (!obraId) return;
      addPunto(obraId, { texto: txt, fecha, responsable: resp });
    } else {
      if (!nombre.trim()) return;
      crearObraVisita({ nombre: nombre.trim(), municipio: municipio.trim(), telefono: telefono.trim(), responsable: resp, fecha, texto: txt });
      setNombre(""); setMunicipio(""); setTelefono("");
    }
    setHora("");
    setFormOpen(false);
  };
  const chip = (activo) => activo
    ? { background: C.ink, color: "#fff", borderColor: C.ink }
    : { background: "#fff", color: C.ink, borderColor: C.line };

  const grupos = [
    { id: "vencidos", titulo: "Vencidos", tone: "red", filtro: (i) => i.fecha && i.fecha < hoy },
    { id: "hoy", titulo: "Hoy", tone: "warn", filtro: (i) => i.fecha === hoy },
    { id: "manana", titulo: "Mañana", tone: "neutral", filtro: (i) => i.fecha === maniana },
    { id: "semana", titulo: "Esta semana", tone: "neutral", filtro: (i) => i.fecha > maniana && i.fecha <= semana },
    { id: "luego", titulo: "Más adelante", tone: "neutral", filtro: (i) => i.fecha > semana },
    { id: "sinFecha", titulo: "Sin fecha", tone: "neutral", filtro: (i) => !i.fecha },
  ];

  return (
    <div className="space-y-4">
      <div className="flex items-center gap-2 flex-wrap">
        <BtnPrimary onClick={() => setFormOpen(!formOpen)}><Plus size={15} /> Agendar</BtnPrimary>
        <select className={inputCls + " w-auto"} style={inputStyle} value={fResp} onChange={(e) => setFResp(e.target.value)}>
          <option value="todos">Todo el equipo</option>
          {data.equipo.map((c) => <option key={c}>{c}</option>)}
        </select>
        <p className="text-xs" style={{ color: C.mut }}>{items.length} pendientes en total</p>
      </div>

      {formOpen && (
        <Card style={{ borderLeftWidth: 3, borderLeftColor: C.azul }}>
          <div className="flex gap-1.5 mb-3 flex-wrap">
            <button type="button" onClick={() => setModo("existente")} className="px-2.5 py-1 rounded-full text-xs font-bold border transition-colors" style={chip(modo === "existente")}>
              En una obra de la lista
            </button>
            <button type="button" onClick={() => setModo("nueva")} className="px-2.5 py-1 rounded-full text-xs font-bold border transition-colors" style={chip(modo === "nueva")}>
              Obra nueva · primera visita
            </button>
          </div>
          {modo === "existente" ? (
            <select className={inputCls} style={inputStyle} value={obraId} onChange={(e) => setObraId(e.target.value)}>
              <option value="">Elige la obra…</option>
              {vivas.map((o) => <option key={o.id} value={o.id}>{o.nombre}</option>)}
            </select>
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <input className={inputCls} style={inputStyle} placeholder="Comunidad / dirección *" value={nombre} onChange={(e) => setNombre(e.target.value)} />
              <input className={inputCls} style={inputStyle} placeholder="Municipio" value={municipio} onChange={(e) => setMunicipio(e.target.value)} />
              <input className={inputCls} style={inputStyle} placeholder="Teléfono de contacto" value={telefono} onChange={(e) => setTelefono(e.target.value)} />
            </div>
          )}
          <div className="flex flex-wrap gap-1.5 my-2.5">
            {TIPICOS_AGENDA.map((t) => (
              <button key={t} type="button" onClick={() => setTexto(t)}
                className="px-2.5 py-1 rounded-full text-xs font-semibold border transition-colors" style={chip(texto === t)}>
                {t}
              </button>
            ))}
          </div>
          <div className="flex flex-col sm:flex-row gap-2">
            <input className={inputCls} style={inputStyle} placeholder="¿Qué hay que hacer?" value={texto} onChange={(e) => setTexto(e.target.value)} />
            <input type="date" className={inputCls + " sm:w-40"} style={inputStyle} value={fecha} onChange={(e) => setFecha(e.target.value)} />
            <input type="time" className={inputCls + " sm:w-28"} style={inputStyle} value={hora} onChange={(e) => setHora(e.target.value)} title="Hora (opcional)" />
            <select className={inputCls + " sm:w-40"} style={inputStyle} value={resp} onChange={(e) => setResp(e.target.value)}>
              <option value="">Responsable…</option>
              {data.equipo.map((c) => <option key={c}>{c}</option>)}
            </select>
            <BtnPrimary onClick={guardar} disabled={modo === "existente" ? !obraId : !nombre.trim()}><Check size={15} /> Agendar</BtnPrimary>
          </div>
          {modo === "nueva" && (
            <p className="text-xs mt-2" style={{ color: C.mut }}>
              Se crea la obra en Estudio con su checklist y la visita ya en el calendario. El resto de datos se completan cuando quieras desde su ficha.
            </p>
          )}
        </Card>
      )}

      {items.length === 0 && itemsTodos.length > 0 && fResp !== "todos" && (
        <EmptyHint icon={CalendarDays} title={`Nada asignado a ${fResp}`}
          text={`El equipo tiene ${itemsTodos.length} pendientes, pero ninguno está asignado a ${fResp}. Puedes verlos todos o asignar puntos desde la ficha de cada obra.`}
          action={<BtnPrimary onClick={() => setFResp("todos")}>Ver todo el equipo ({itemsTodos.length})</BtnPrimary>} />
      )}
      {items.length === 0 && !(itemsTodos.length > 0 && fResp !== "todos") && (
        <EmptyHint icon={CalendarDays} title="La agenda está despejada"
          text="Agenda visitas, llamadas o juntas con el botón de arriba: quedan en el calendario de su obra y le saltan a quien le toque." />
      )}

      {grupos.map((g) => {
        const lista = g.filtro ? items.filter(g.filtro).sort((a, b) => (a.fecha || "9999").localeCompare(b.fecha || "9999")) : [];
        if (!lista.length) return null;
        // el fondo de armario (puntos sin fecha) se pliega para que mande lo que tiene fecha
        if (g.id === "sinFecha" && !verSinFecha) {
          return (
            <Card key={g.id}>
              <div className="flex items-center justify-between gap-2 flex-wrap">
                <p className="text-xs font-bold uppercase tracking-wider inline-flex items-center gap-2" style={{ color: C.mut }}>
                  Sin fecha <Badge>{lista.length}</Badge>
                </p>
                <div className="flex items-center gap-3">
                  <p className="text-xs" style={{ color: C.mut }}>Pendientes sin día asignado: ábrelos y ponles fecha aquí mismo.</p>
                  <BtnGhost onClick={() => setVerSinFecha(true)} className="!px-2.5 !py-1 text-xs">Ver los {lista.length}</BtnGhost>
                </div>
              </div>
            </Card>
          );
        }
        return (
          <Card key={g.id}>
            <p className="text-xs font-bold uppercase tracking-wider mb-2 inline-flex items-center gap-2" style={{ color: C.mut }}>
              {g.titulo} <Badge tone={g.tone}>{lista.length}</Badge>
            </p>
            <div className="space-y-0.5">
              {lista.map((i) => (
                <div key={`${i.clase}_${i.obraId}_${i.id}`} className="flex items-center gap-2.5 px-1 py-1.5 rounded-lg hover:bg-neutral-50 group">
                  <button onClick={() => togglePendiente(i.obraId, i.clase, i.id)} title="Marcar como hecho"
                    className="w-5 h-5 rounded-md border-2 flex-shrink-0 flex items-center justify-center hover:border-current transition-colors"
                    style={{ borderColor: g.id === "vencidos" ? C.red : C.mut, color: C.ok }}>
                    <Check size={13} className="opacity-0 group-hover:opacity-60" />
                  </button>
                  {i.fecha ? (
                    <Badge tone={i.fecha < hoy ? "red" : i.fecha === hoy ? "warn" : "neutral"}>{fmtDia(i.fecha)}</Badge>
                  ) : (
                    <input type="date" className="text-xs rounded-md border px-1 py-0.5 flex-shrink-0" style={{ borderColor: C.warn, color: C.txt }}
                      value="" onChange={(e) => e.target.value && setFechaItem(i.obraId, i.clase, i.id, e.target.value)} title="Ponerle día (se agenda al elegirlo)" />
                  )}
                  {/visita/i.test(i.texto) && <MapPin size={13} className="flex-shrink-0" style={{ color: C.azul }} />}
                  <span className="text-sm flex-1 min-w-0 truncate" style={{ color: C.ink }}>
                    {i.clase === "req" && <span className="text-xs font-bold uppercase mr-1" style={{ color: C.mut }}>req</span>}
                    {i.texto}
                  </span>
                  <button onClick={() => onOpen(i.obraId)} className="text-xs font-semibold truncate max-w-40 hover:underline flex-shrink-0" style={{ color: EST[i.estado].color }}>
                    {i.obra}
                  </button>
                  {i.responsable && <Avatar nombre={i.responsable} />}
                </div>
              ))}
            </div>
          </Card>
        );
      })}
    </div>
  );
}

/* ============================ ANÁLISIS ============================ */
function AnalisisView({ data }) {
  const now = new Date();
  const obras = data.obras;
  if (obras.length === 0) {
    return (
      <EmptyHint icon={TrendingUp} title="Aún no hay datos que analizar"
        text="En cuanto haya obras avanzando por el tablero verás aquí la contratación por mes, el peso de cada tipo de obra, el recorrido de las subvenciones y los tiempos de cada fase." />
    );
  }
  const anio = now.getFullYear();
  const contratadas = obras.map((o) => ({ o, f: primeraFechaEstado(o, "contratada") })).filter((x) => x.f);
  const contratadoAnio = contratadas.filter((x) => new Date(x.f).getFullYear() === anio).reduce((s, x) => s + x.o.importe, 0);
  const perdidasN = obras.filter((o) => o.estado === "perdida").length;
  const exito = (contratadas.length + perdidasN) ? contratadas.length / (contratadas.length + perdidasN) : 0;
  const diasContratar = contratadas.length
    ? Math.round(contratadas.reduce((s, x) => s + (new Date(x.f) - new Date(x.o.creado)) / 86400000, 0) / contratadas.length) : null;
  const finalizadasAnio = obras.filter((o) => { const f = primeraFechaEstado(o, "finalizada"); return f && new Date(f).getFullYear() === anio; }).length;

  // contratado por mes, 12 meses
  const meses = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    meses.push({ key: `${d.getFullYear()}-${d.getMonth()}`, mes: d.toLocaleDateString("es-ES", { month: "short" }), valor: 0 });
  }
  contratadas.forEach(({ o, f }) => {
    const d = new Date(f);
    const m = meses.find((x) => x.key === `${d.getFullYear()}-${d.getMonth()}`);
    if (m) m.valor += o.importe;
  });

  // cartera por tipo (tipo principal, un solo tono: es una sola serie)
  const vivas = obras.filter((o) => !o.archivada && o.estado !== "perdida");
  const porTipo = TIPOS_OBRA.map((t) => {
    const col = vivas.filter((o) => (o.tipos[0] || "Otro") === t);
    return { t, n: col.length, v: col.reduce((s, o) => s + o.importe, 0) };
  }).filter((x) => x.n > 0).sort((a, b) => b.v - a.v);
  const maxTipo = Math.max(1, ...porTipo.map((x) => x.v));

  // subvenciones: recorrido (rampa ordinal de un tono)
  const subPasos = SUB_ESTADOS.filter((s) => s.id !== "no").map((s) => {
    const col = vivas.filter((o) => o.subEstado === s.id);
    return { s, n: col.length, v: col.reduce((sum, o) => sum + o.subImporte, 0) };
  });
  const maxSub = Math.max(1, ...subPasos.map((x) => x.v));
  const haySub = subPasos.some((x) => x.n > 0);

  // tiempo medio por estado (estancias cerradas del historial)
  const estancias = {};
  obras.forEach((o) => {
    const h = o.historial || [];
    for (let i = 0; i < h.length - 1; i++) {
      const dias = (new Date(h[i + 1].fecha) - new Date(h[i].fecha)) / 86400000;
      if (dias >= 0) (estancias[h[i].estado] = estancias[h[i].estado] || []).push(dias);
    }
  });
  const tiempos = ESTADOS_TABLERO.filter((e) => e.id !== "finalizada").map((e) => {
    const arr = estancias[e.id] || [];
    return { e, media: arr.length ? Math.round(arr.reduce((s, x) => s + x, 0) / arr.length) : null, n: arr.length };
  }).filter((x) => x.media !== null);
  const maxTiempo = Math.max(1, ...tiempos.map((x) => x.media));

  // motivos de pérdida
  const motivos = MOTIVOS.map((m) => ({ m, n: obras.filter((o) => o.estado === "perdida" && o.motivoPerdida === m).length })).filter((x) => x.n > 0).sort((a, b) => b.n - a.n);
  const maxMotivo = Math.max(1, ...motivos.map((x) => x.n));

  // actividad semanal (8 semanas)
  const semanas = Array.from({ length: 8 }, (_, i) => ({ sem: i === 7 ? "Esta" : `-${7 - i}`, n: 0 }));
  obras.forEach((o) => o.apuntes.forEach((a) => {
    const w = Math.floor(daysSince(a.fecha) / 7);
    if (w <= 7) semanas[7 - w].n += 1;
  }));

  // embudo comercial (histórico completo, por el recorrido de estados)
  const enviadasHist = obras.filter((o) => primeraFechaEstado(o, "presupuesto"));
  const vEnv = enviadasHist.reduce((s, o) => s + o.importe, 0);
  const vCon = contratadas.reduce((s, x) => s + x.o.importe, 0);
  const convEnvio = obras.length ? enviadasHist.length / obras.length : 0;
  const convCierre = enviadasHist.length ? contratadas.length / enviadasHist.length : 0;

  // antigüedad de los presupuestos vivos: dónde está atascado el dinero
  const presVivas = obras.filter((o) => !o.archivada && o.estado === "presupuesto");
  const tramosEdad = [
    { label: "0-30 días", min: 0, max: 30, fill: "#B9B4AE" },
    { label: "31-60 días", min: 31, max: 60, fill: C.azul },
    { label: "61-90 días", min: 61, max: 90, fill: C.warn },
    { label: "Más de 90", min: 91, max: 100000, fill: C.red },
  ].map((t) => {
    const col = presVivas.filter((o) => { const d = daysSince(o.estadoDesde); return d >= t.min && d <= t.max; });
    return { ...t, n: col.length, v: col.reduce((s, o) => s + o.importe, 0) };
  });
  const maxEdad = Math.max(1, ...tramosEdad.map((x) => x.v));

  // cartera viva por municipio
  const muniMap = {};
  vivas.forEach((o) => {
    const m = ((o.municipio || "").trim() || "Sin municipio").toUpperCase();
    if (!muniMap[m]) muniMap[m] = { n: 0, v: 0 };
    muniMap[m].n++; muniMap[m].v += o.importe;
  });
  const munis = Object.keys(muniMap).map((m) => ({ m, n: muniMap[m].n, v: muniMap[m].v })).sort((a, b) => b.v - a.v).slice(0, 8);
  const maxMuni = Math.max(1, ...munis.map((x) => x.v));

  // por comercial: enviado y firmado
  const porComercial = data.equipo.map((m) => {
    const suyas = obras.filter((o) => o.responsable === m);
    const env = suyas.filter((o) => primeraFechaEstado(o, "presupuesto"));
    const con = suyas.filter((o) => primeraFechaEstado(o, "contratada"));
    return { m, env: env.length, vEnvC: env.reduce((s, o) => s + o.importe, 0),
      con: con.length, vConC: con.reduce((s, o) => s + o.importe, 0),
      enCurso: suyas.filter((o) => esActiva(o)).length };
  }).filter((x) => x.env > 0 || x.con > 0 || x.enCurso > 0);
  const maxCom = Math.max(1, ...porComercial.map((x) => x.vEnvC));

  // visitas agendadas por delante
  const hoyStr = hoyYMD();
  const visitasProx = vivas.reduce((s, o) => s + puntosPend(o).filter((p) => /visita/i.test(p.texto) && p.fecha && p.fecha >= hoyStr).length, 0);

  return (
    <div className="space-y-5">
      <div className="grid grid-cols-2 lg:grid-cols-5 gap-3">
        <KPI label={`Contratado en ${anio}`} value={fmtEUR(contratadoAnio)} accent={C.red} Icon={Hammer} />
        <KPI label="Tasa de éxito" value={pct(exito)} sub={`${contratadas.length} contratadas · ${perdidasN} perdidas`} Icon={Target} />
        <KPI label="Días hasta contratar" value={diasContratar ?? "—"} sub="media desde el alta" Icon={Clock} />
        <KPI label="Visitas agendadas" value={visitasProx} sub="con fecha por delante" Icon={MapPin} />
        <KPI label={`Finalizadas en ${anio}`} value={finalizadasAnio} Icon={CircleCheck} />
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <Card>
          <SectionTitle>Embudo comercial · histórico</SectionTitle>
          <div className="space-y-2">
            <HBar label="Obras estudiadas" value={obras.length} max={obras.length} right={`${obras.length}`} fill={EST.estudio.color} />
            <HBar label="Presupuestos enviados" value={enviadasHist.length} max={obras.length} right={`${enviadasHist.length} · ${fmtEUR(vEnv)}`} fill={EST.presupuesto.color} />
            <HBar label="Contratadas" value={contratadas.length} max={obras.length} right={`${contratadas.length} · ${fmtEUR(vCon)}`} fill={EST.contratada.color} />
          </div>
          <p className="text-xs mt-3" style={{ color: C.mut }}>
            Del estudio al envío: {pct(convEnvio)} · Del envío a la firma: {pct(convCierre)}{vEnv ? ` (en dinero: ${pct(vCon / vEnv)})` : ""}
          </p>
        </Card>
        <Card>
          <SectionTitle>Presupuestos esperando, por antigüedad</SectionTitle>
          {presVivas.length === 0 ? (
            <p className="text-sm" style={{ color: C.mut }}>No hay presupuestos esperando respuesta ahora mismo.</p>
          ) : (
            <div className="space-y-2">
              {tramosEdad.map((t) => <HBar key={t.label} label={t.label} value={t.v} max={maxEdad} right={`${fmtEUR(t.v)} · ${t.n}`} fill={t.fill} />)}
            </div>
          )}
          <p className="text-xs mt-3" style={{ color: C.mut }}>Aquí se ve dónde está parado el dinero: pasados 60 días sin respuesta toca apretar con la llamada.</p>
        </Card>
      </div>

      <Card>
        <SectionTitle>Contratado por mes · últimos 12 meses</SectionTitle>
        <GraficaMeses datos={meses} nombre="Contratado" />
      </Card>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <Card>
          <SectionTitle>Cartera viva por tipo de obra</SectionTitle>
          {porTipo.length === 0 ? <p className="text-sm" style={{ color: C.mut }}>Sin obras vivas.</p> : (
            <div className="space-y-2">
              {porTipo.map((x) => <HBar key={x.t} label={x.t} value={x.v} max={maxTipo} right={`${fmtEUR(x.v)} · ${x.n}`} fill={C.red} />)}
            </div>
          )}
        </Card>
        <Card>
          <SectionTitle>Recorrido de las subvenciones</SectionTitle>
          {!haySub ? (
            <p className="text-sm" style={{ color: C.mut }}>Ninguna obra viva tiene subvención registrada. Se apunta en la ficha de cada obra (importe y estado del expediente).</p>
          ) : (
            <div className="space-y-2">
              {subPasos.map((x) => <HBar key={x.s.id} label={x.s.label} value={x.v} max={maxSub} right={`${fmtEUR(x.v)} · ${x.n}`} fill={x.s.color} />)}
            </div>
          )}
          <p className="text-xs mt-3" style={{ color: C.mut }}>El tono se oscurece según avanza el expediente hacia el cobro.</p>
        </Card>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <Card>
          <SectionTitle>Cartera viva por municipio</SectionTitle>
          {munis.length === 0 ? (
            <p className="text-sm" style={{ color: C.mut }}>Pon el municipio en la ficha de cada obra para ver dónde se concentra el trabajo.</p>
          ) : (
            <div className="space-y-2">
              {munis.map((x) => <HBar key={x.m} label={x.m} value={x.v} max={maxMuni} right={`${fmtEUR(x.v)} · ${x.n}`} fill={C.azul} />)}
            </div>
          )}
        </Card>
        <Card>
          <SectionTitle>Por comercial · enviado y firmado</SectionTitle>
          {porComercial.length === 0 ? (
            <p className="text-sm" style={{ color: C.mut }}>Asigna un responsable a cada obra para comparar el trabajo de cada comercial.</p>
          ) : (
            <div className="space-y-4">
              {porComercial.map((x) => (
                <div key={x.m}>
                  <div className="flex items-center gap-2 mb-1.5">
                    <Avatar nombre={x.m} />
                    <span className="text-sm font-bold flex-1 truncate" style={{ color: C.ink }}>{x.m}</span>
                    <span className="text-xs flex-shrink-0" style={{ color: C.mut }}>
                      {x.enCurso} en curso · firma el {x.env ? pct(x.con / x.env) : "—"}
                    </span>
                  </div>
                  <div className="space-y-1">
                    <HBar label={`Enviado (${x.env})`} value={x.vEnvC} max={maxCom} right={fmtEUR(x.vEnvC)} fill={EST.presupuesto.color} />
                    <HBar label={`Firmado (${x.con})`} value={x.vConC} max={maxCom} right={fmtEUR(x.vConC)} fill={EST.contratada.color} />
                  </div>
                </div>
              ))}
            </div>
          )}
        </Card>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <Card>
          <SectionTitle>Ritmo de apuntes por semana</SectionTitle>
          <div style={{ height: 190 }}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={semanas} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
                <CartesianGrid strokeDasharray="3 3" stroke={C.grid} vertical={false} />
                <XAxis dataKey="sem" tick={axisTick} axisLine={false} tickLine={false} />

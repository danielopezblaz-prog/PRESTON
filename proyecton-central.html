      {data.obras.some((o) => o.ejemplo) && (
        <div className="max-w-7xl mx-auto px-3 sm:px-4 pt-4">
          <div className="rounded-xl border px-4 py-2.5 flex flex-wrap items-center gap-2" style={{ background: C.warnTint, borderColor: "#E8D9B4" }}>
            <AlertTriangle size={15} style={{ color: C.warn }} className="flex-shrink-0" />
            <p className="text-sm flex-1" style={{ color: "#6B4A12", minWidth: "14rem" }}>
              <b>Estás viendo obras de ejemplo</b> para explorar la Central. Si editas una, pasa a ser real; cuando quieras, bórralas todas de un clic.
            </p>
            <BtnGhost onClick={borrarEjemplos}><Trash2 size={14} /> Borrar ejemplos</BtnGhost>
          </div>
        </div>
      )}

      <main className="max-w-7xl mx-auto px-3 sm:px-4 py-5">
        {tab === "panel" && (
          <PanelView data={data} avisos={avisos} onOpen={abrirObra} onNueva={() => setObraModal({})}
            onOpenAjustes={() => setAjustesOpen(true)} onIrAgenda={() => setTab("agenda")} addApunte={addApunte} toast={toast}
            quien={persona} admin={admin} onCambiarQuien={() => elegirQuien("")} />
        )}
        {tab === "tablero" && (
          <TableroView data={data} onOpen={abrirObra} onNueva={() => setObraModal({})}
            setEstado={setEstado} onPerdida={(id) => { setPerdidaId(id); setPerdidaMotivo(MOTIVOS[0]); }} />
        )}
        {tab === "obras" && <ObrasView data={data} onOpen={abrirObra} onNueva={() => setObraModal({})} onExport={exportCSV} onImport={() => setLoteOpen(true)} />}
        {tab === "agenda" && <AgendaView data={data} onOpen={abrirObra} togglePendiente={togglePendiente} quien={persona}
          addPunto={addPunto} setFechaItem={setFechaItem} crearObraVisita={crearObraVisita} />}
        {tab === "analisis" && <AnalisisView data={data} />}
      </main>

      <footer className="max-w-7xl mx-auto px-4 pb-6">
        <p className="text-xs text-center" style={{ color: C.mut }}>
          Revestimientos Proyecton · 91 693 15 40 · info@proyecton.es · www.proyecton.es · Los datos se guardan en este navegador; haz copias desde Ajustes.
        </p>
      </footer>

      {/* modales */}
      {obraModal !== null && (
        <Modal title={obraModal.id ? "Editar obra" : "Nueva obra"} onClose={() => setObraModal(null)} wide>
          <ObraForm initial={obraModal.id ? obraModal : null} equipo={data.equipo} onSave={saveObra} onCancel={() => setObraModal(null)} />
        </Modal>
      )}

      {detailObra && obraModal === null && (
        <FichaObra obra={detailObra} data={data} avisos={avisos}
          onClose={() => setDetailId(null)}
          onEdit={() => setObraModal(detailObra)}
          setEstado={setEstado}
          onPerdida={(id) => { setPerdidaId(id); setPerdidaMotivo(MOTIVOS[0]); }}
          onReabrir={reabrirObra}
          onArchivar={(id) => { updateObra(id, { archivada: true }); setDetailId(null); toast("Obra archivada. La tienes en Obras → Archivadas."); }}
          onDelete={() => setConfirmCfg({
            msg: `¿Eliminar “${detailObra.nombre}” con todo su diario e historial? Esta acción no se puede deshacer.`,
            onOk: () => { deleteObra(detailObra.id); setDetailId(null); },
          })}
          addPunto={addPunto} togglePunto={togglePunto} delPunto={delPunto}
          addReq={addReq} toggleReq={toggleReq} delReq={delReq}
          addApunte={addApunte} delApunte={delApunte} updateObra={updateObra} />
      )}

      {perdidaId && (
        <Modal title="Marcar como perdida" onClose={() => setPerdidaId(null)}>
          <p className="text-sm mb-3" style={{ color: C.txt }}>
            Registrar el motivo ayuda a detectar patrones: precio, competencia, seguimiento…
          </p>
          <Field label="Motivo">
            <select className={inputCls} style={inputStyle} value={perdidaMotivo} onChange={(e) => setPerdidaMotivo(e.target.value)}>
              {MOTIVOS.map((m) => <option key={m}>{m}</option>)}
            </select>
          </Field>
          <div className="flex justify-end gap-2 mt-4">
            <BtnGhost onClick={() => setPerdidaId(null)}>Cancelar</BtnGhost>
            <BtnPrimary onClick={() => { setEstado(perdidaId, "perdida", perdidaMotivo); setPerdidaId(null); }}><Check size={15} /> Confirmar</BtnPrimary>
          </div>
        </Modal>
      )}

      {avisosOpen && (
        <Modal title="Centro de avisos" onClose={() => setAvisosOpen(false)} wide>
          <ListaAvisos avisos={avisos} onOpen={abrirObra} quien={persona} />
        </Modal>
      )}

      {buscaOpen && (
        <Modal title="Buscar obra" onClose={() => { setBuscaOpen(false); setBusca(""); }}>
          <div className="relative">
            <Search size={16} className="absolute left-3 top-2.5" style={{ color: C.mut }} />
            <input autoFocus className={inputCls + " pl-9"} style={inputStyle}
              placeholder="Comunidad, dirección, contacto, código…"
              value={busca} onChange={(e) => setBusca(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && resultadosBusca.length > 0) abrirObra(resultadosBusca[0].id); }} />
          </div>
          <div className="mt-2 space-y-0.5">
            {resultadosBusca.map((o) => (
              <button key={o.id} onClick={() => abrirObra(o.id)}
                className="w-full flex items-center gap-2.5 px-2 py-2.5 rounded-lg hover:bg-neutral-50 text-left border-b" style={{ borderColor: C.line }}>
                <PuntoSalud obra={o} />
                <div className="min-w-0 flex-1">
                  <p className="text-sm font-bold truncate" style={{ color: C.ink }}>{o.nombre}</p>
                  <p className="text-xs truncate" style={{ color: C.mut }}>{[(EST[o.estado] || {}).label, o.municipio, o.importe ? fmtEUR(o.importe) : ""].filter(Boolean).join(" · ")}</p>
                </div>
                <ChevronRight size={15} style={{ color: C.mut }} />
              </button>
            ))}
            {busca.trim().length >= 2 && resultadosBusca.length === 0 && (
              <p className="text-sm py-3 text-center" style={{ color: C.mut }}>Nada con "{busca}". Prueba con parte del nombre o el código.</p>
            )}
          </div>
        </Modal>
      )}

      {data.equipo.length > 0 && !quien && (
        <Modal title="¿Quién eres?" onClose={() => elegirQuien("todos")}>
          <p className="text-sm" style={{ color: C.txt }}>
            Para avisarte solo de lo tuyo (tus obras, tus puntos, tus vencimientos), dime quién usa este ordenador.
            Se queda guardado y se cambia cuando quieras arriba a la derecha.
          </p>
          <div className="grid grid-cols-2 gap-2 mt-4">
            {data.equipo.map((m) => (
              <button key={m} onClick={() => elegirQuien(m)}
                className="flex items-center gap-2.5 px-3 py-3 rounded-xl border hover:bg-neutral-50 transition-colors" style={{ borderColor: C.line }}>
                <Avatar nombre={m} size={9} />
                <span className="font-bold" style={{ color: C.ink }}>{m}</span>
              </button>
            ))}
          </div>
          <button onClick={() => elegirQuien("(admin)")}
            className="w-full mt-3 px-3 py-2.5 rounded-xl font-bold text-white flex items-center justify-center gap-2"
            style={{ background: C.ink }}>
            <Bell size={15} /> Administrador · que me salte todo
          </button>
          <button onClick={() => elegirQuien("todos")} className="text-xs mt-3 hover:underline" style={{ color: C.mut }}>

      {claveCfg && <ClaveModal cfg={claveCfg} onClose={() => setClaveCfg(null)} />}

      {ajustesOpen && (
        <Modal title="Ajustes" onClose={() => setAjustesOpen(false)}>
          <div className="space-y-4">
            <Field label="Objetivo mensual de contratación (€)">
              <div className="flex gap-2">
                <input type="number" min="0" className={inputCls} style={inputStyle}
                  value={objetivoInput} onChange={(e) => setObjetivoInput(e.target.value)} placeholder="p. ej. 150000" />
                <BtnPrimary onClick={saveObjetivo}><Check size={15} /> Guardar</BtnPrimary>
              </div>
            </Field>

                <input className={inputCls} style={inputStyle} placeholder="Nombre y apellido"
                  value={nuevoMiembro} onChange={(e) => setNuevoMiembro(e.target.value)}

            </div>

            <div className="pt-3 border-t space-y-2" style={{ borderColor: C.line }}>
              <BtnGhost onClick={() => { setAjustesOpen(false); setLoteOpen(true); }} className="w-full justify-center"><Upload size={15} /> Importar obras en lote (carpetas, CSV o lista)</BtnGhost>
              <BtnGhost onClick={descargarHTMLConDatos} className="w-full justify-center"><Download size={15} /> Guardar datos dentro del HTML (para GitHub)</BtnGhost>
              <BtnGhost onClick={cargarDatosPublicados} className="w-full justify-center"><RotateCcw size={15} /> Cargar los datos publicados en este archivo</BtnGhost>
              <BtnGhost onClick={activarNotificaciones} className="w-full justify-center"><Bell size={15} /> Activar notificaciones del navegador</BtnGhost>
              <BtnGhost onClick={exportCSV} className="w-full justify-center"><Download size={15} /> Exportar obras a CSV (Excel)</BtnGhost>
              <BtnGhost onClick={exportBackup} className="w-full justify-center"><Download size={15} /> Copia de seguridad completa (JSON)</BtnGhost>
              <label className="w-full inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-sm font-semibold border hover:bg-neutral-50 cursor-pointer"
                style={{ borderColor: C.line, color: C.ink }}>
                <RotateCcw size={15} /> Restaurar copia de seguridad
                <input type="file" accept=".json,application/json" className="hidden"
                  onChange={(e) => {
                    if (e.target.files && e.target.files[0]) { importBackup(e.target.files[0]); e.target.value = ""; setAjustesOpen(false); }
                  }} />
              </label>
              <p className="text-xs" style={{ color: C.mut }}>
                También acepta las copias del CRM comercial anterior: las convierte a obras automáticamente. Los datos viven en este navegador — haz una copia de vez en cuando.
              </p>

              <div className="pt-3 border-t" style={{ borderColor: C.line }}>
                <p className="text-xs font-semibold uppercase tracking-wider mb-2" style={{ color: C.mut }}>Copias de seguridad automáticas (este navegador)</p>
                {(() => {
                  let copias = [];
                  try { copias = JSON.parse(localStorage.getItem(KEY_COPIAS) || "[]"); } catch (e) {}
                  if (!copias.length) return <p className="text-sm" style={{ color: C.mut }}>Todavía no hay. Se guarda una al día sola, y otra antes de cada operación delicada (restaurar, vaciar, cargar publicados).</p>;
                  return (
                    <div className="space-y-1">
                      {copias.map((c) => (
                        <div key={c.fecha} className="flex items-center gap-2 px-1">
                          <span className="text-sm flex-1 min-w-0 truncate" style={{ color: C.ink }}>
                            {fmtFecha(c.fecha)} · <b>{c.n} obras</b> <span style={{ color: C.mut }}>· {c.motivo}</span>
                          </span>
                          <BtnGhost className="!px-2 !py-1 text-xs" onClick={() => setConfirmCfg({
                            msg: `Se recupera la copia del ${fmtFecha(c.fecha)} (${c.n} obras) y sustituye lo que hay ahora en este navegador. Lo actual se guarda antes en otra copia. ¿Continuar?`,
                            onOk: () => {
                              try {
                                guardarCopia("antes de recuperar otra copia", dataRef.current, true);
                                const d = normalizarData(JSON.parse(c.datos));
                                setData(d); setObjetivoInput(d.config.objetivoMensual || "");
                                toast("Copia del " + fmtFecha(c.fecha) + " recuperada.");
                              } catch (e) { toast("Esa copia no se pudo leer."); }
                            },
                          })}>Recuperar</BtnGhost>
                        </div>
                      ))}
                    </div>
                  );
                })()}
              </div>

              <button onClick={() => { setAjustesOpen(false); resetAll(); }}
                className="w-full inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-sm font-semibold hover:bg-red-50"
                style={{ color: C.redDark }}>
                <RotateCcw size={15} /> Vaciar toda la Central
              </button>
            </div>
          </div>
        </Modal>
      )}

      {vaciarTxt !== null && (
        <Modal title="Vaciar toda la Central" onClose={() => setVaciarTxt(null)}>
          <p className="text-sm" style={{ color: C.txt }}>
            Esto borra TODAS las obras, el diario, el equipo y el objetivo de este navegador.
            Antes se guarda una copia automática (Ajustes → Copias de seguridad), pero aun así:
            para confirmar, escribe <b>BORRAR</b> en mayúsculas.
          </p>
          <input className={inputCls + " mt-3"} style={inputStyle} placeholder="Escribe BORRAR"
            value={vaciarTxt} onChange={(e) => setVaciarTxt(e.target.value)} autoFocus />
          <div className="flex justify-end gap-2 mt-4">
            <BtnGhost onClick={() => setVaciarTxt(null)}>Cancelar</BtnGhost>
            <BtnPrimary disabled={vaciarTxt.trim() !== "BORRAR"}
              onClick={() => {
                if (vaciarTxt.trim() !== "BORRAR") return;
                guardarCopia("antes de vaciar la Central", dataRef.current, true);
                setData(emptyData()); setObjetivoInput(""); setVaciarTxt(null);
                toast("Central vaciada. La copia previa queda en Ajustes por si te arrepientes.");
              }}>
              <Trash2 size={15} /> Vaciar del todo
            </BtnPrimary>
          </div>
        </Modal>
      )}

      {confirmCfg && (
        <Modal title="Confirmar" onClose={() => setConfirmCfg(null)}>
          <p className="text-sm" style={{ color: C.txt }}>{confirmCfg.msg}</p>
          <div className="flex justify-end gap-2 mt-4">
            <BtnGhost onClick={() => setConfirmCfg(null)}>Cancelar</BtnGhost>
            <BtnPrimary onClick={() => { confirmCfg.onOk(); setConfirmCfg(null); }}>Sí, continuar</BtnPrimary>
          </div>
        </Modal>
      )}

      {/* toast */}
      {toastMsg && (
        <div className="fixed bottom-4 right-4 z-50 aparecer">
          <div className="px-4 py-2.5 rounded-xl text-sm font-semibold text-white shadow-lg flex items-center gap-2" style={{ background: C.ink }}>
            <CircleCheck size={15} style={{ color: "#7BE0C8" }} /> {toastMsg}
          </div>
        </div>
      )}
    </div>
  );
}

// Blindaje: si algo casca al pintar, se enseña una pantalla de rescate en vez de quedarse en blanco.
// Los datos no se tocan: siguen en el navegador y en las copias de Ajustes.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { try { console.error("Error de la Central:", error, info); } catch (e) {} }
  render() {
    if (this.state.error) {
      return (
        <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#F4F3F0", padding: 24, fontFamily: "'Segoe UI', system-ui, sans-serif" }}>
          <div style={{ maxWidth: 460, background: "#fff", border: "1px solid #E6E4E1", borderRadius: 16, padding: 24, textAlign: "center" }}>
            <p style={{ fontWeight: 800, color: "#17181A", fontSize: 18 }}>La Central ha tropezado con un error</p>
            <p style={{ color: "#4B4B50", fontSize: 14, marginTop: 8 }}>
              Tranquilidad: tus datos están a salvo en este navegador y en las copias automáticas de Ajustes.
              Recarga la página para seguir trabajando.
            </p>
            <button onClick={() => window.location.reload()}
              style={{ marginTop: 16, background: "#A32C24", color: "#fff", border: 0, borderRadius: 10, padding: "10px 18px", fontWeight: 700, cursor: "pointer" }}>
              Recargar la página
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);

</script>
</body>
</html>
